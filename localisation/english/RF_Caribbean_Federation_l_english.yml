 cyn.1.title:0 "제헌회의"
 cyn.1.desc:0 "오늘, 카리브 연방 전역에서 모인 대표단들이 제헌회의를 위해 모였습니다. 임시정부 수립 2년 후에 개최하기로 한 모임이었죠. 대규모의 백인 난민이 따스하고 환대적인 프랑스의 품을 찾아 카리브로 오게 되면서, 우리는 우리가 간신히 지탱할 수 있는 수준의 사람들을 억지로 떠안게 됐습니다. 이제 선거를 즉시 치를 것인지, 아니면 비상사태가 끝날 때까지 임시정부를 유지할지 결정해야 합니다."
 cyn.1.a:0 "임시정부를 유지하며 또한 식민당국 역시 유지하라. 우린 아직 민주정을 위한 준비가 되지 않았다."
 cyn.1.b:0 "즉시 선거를 개최한다. 폭군이 돼선 안 된다!"
 cyn.2.title:0 "1936년 선거"
 cyn.2.desc:0 "급하게 마련된 투표용지들이 전국에 배부되고 각지에서 벌어진 선거운동들 역시 끝마쳤으니, 이제 당선자가 그 꼭대기에서 모습을 드러냈습니다. 바로..."
 cyn.2.a:0 "앙드레 타르디외와 자유당이 백인 망명자들의 도움으로 선거에서 승리하다!"
 cyn.2.b:0 "사회당과 레지티뮈가 서민을 위해 권좌를 차지하다!"
 cyn.3.title:0 "André Aliker boycotts the Provisional Government"
 cyn.3.desc:0 "André Aliker and his band of Spartakists have begun rallying against our regime, claiming we are \"nothing but the children of imperialists\"! He has been organizing strikes all over Cayenne, and has been causing trouble for the white emigrés, too."
 cyn.3.a:0 "이 스파르타쿠스단들을 단번에 쓸어버리자!"
 cyn.4.title:0 "인민의 승리"
 cyn.4.desc:0 "André Alikerr and his band of revolutionaries, after weeks in hiding, have managed to assault local military positions in Cayenne despite our attempts to crack down on leftist forces. After an extremely intense battle at the Montjoly, the revolutionaries have seized the local government buildings and proclaimed the Caribbean Popular Republic. Local liberals and those loyal to our Government have been arrested, and now all that is left is the fires of revolutionary passion."
 cyn.4.a:0 "이 땅은 여러분의 것이오."
