 IDE_Ayaz:0 "아야즈 이샤키"
 IDE_spirit:0 "볼가-불가리아의 정신"
 IDE_spirit_desc:0 "역사의 심연 속에서, 타타르인, 튀르크인, 아틸라의 후예, 우그로-핀 등 수많은 민족들이 야만적인 부족이 아니라 통일된 문화 건설자로서 다시 책장에 모습을 드러내고 있습니다. 피우수트스키 원수의 가까운 친구이자 프로메테우스 운동의 영감이 된 아야즈 이샤키께서 마침내 자신의 가장 위대한 프로젝트 이델 우랄의 지휘봉을 잡으셨습니다. 이는 이슬람과 구 불가리아 제국의 두로 가문의 신화를 토대로 한 인연 위에 세워진, 세속적이고 민주적이며 계몽된 국가입니다.\n\n그러나 모든 아름다운 이념이 그러하듯, 이 또한 잔혹한 현실과 부딪힐 수밖에 없습니다. 많은 이맘들은 이샤키의 보증을 믿지 않으며 그가 경건하다고 하더라도 그의 수피 신앙을 이단적이라고 여깁니다. 보수적인 무슬림들에게는 여성의 권리 언급, 혹은 더 나아가 소위 “터키식 자힐리야(이슬람 이전시대)”의 미화가 그들의 역린을 찌르고 있습니다. 다수는 프리메이슨과 이교도의 공화국보다는 북캅카스 이맘국과 같은 형태로 샤리아 법이 도입되기를 선호하며, 교사들은 군중을 선동하여 무기를 들고 공화국의 뼈를 부수도록 독려합니다.\n\n튀르크인 연합, 독일인들, 그리고 코미족 등은 다문화 볼가 연합의 불안정한 땅에 발을 들여놓고 있습니다. 피우수트스키 최애의 애완동물 같은 아야즈 이샤키의 지위는 그가 강력한 국가와 견고한 국경을 구축하는 데 도움이 되지 않을 것입니다. 오직 역사가 말해줄 것입니다. 타타르 사회혁명당의 위대한 꿈이 지속될지, 아니면 아틸라의 무리들이 남긴 먼지 구름처럼 사라질지 말입니다."