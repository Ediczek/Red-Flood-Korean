 vilniuscrisis.13.t:0 "협상의 시작"
 vilniuscrisis.13.desc:0 "[POL.GetLeader]는 빌뉴스 위기에 대한 세 번째 보고서를 받았다. 이는 유제프 베크가 직접 작성한 것이었다. 그는 이를 대충 훑어보았지만, 굳이 자세히 읽을 필요는 없었다. 이미 좋은 소식을 알고 있었기 때문이다. 양측은 무장 충돌을 중단하고 평화적인 해결을 위한 협상을 시작하기로 합의했다. 베크가 연설을 했을 때, 모인 사람들의 경쟁심이 사라지는 순간을 보고 [POL.GetLeader]는 이를 실감할 수 있었다. 이제 남은 것은 베크가 장기적인 합의를 도출하는 것이었다.\n\n그 합의란 무엇이 될 것인가? 출발 전, 그는 베크와 여러 가지 가능성을 논의했다. 가장 유력한 방안은 폴란드인들에게 법적으로 몇 가지 보장을 제공하는 것이었다. 빌뉴스 지역의 인구 구성을 현실적으로 인정해야 했으며, 리투아니아가 이 문제를 질질 끌수록 국제 사회의 공감을 얻기 어려울 것이었다. 지금이야말로 외교적인 방식으로 문제를 해결할 기회였다.\n\n그 외에도 베크는 몇 가지 대담한 아이디어를 제안했다. 하나는 아예 리투아니아와 폴란드를 옛 폴란드-리투아니아 연방 시대로 되돌리는 것이었다. 두 개의 동등한 국가가 하나의 연방 아래 결속되며 모든 권리를 보장받는 체제였다. 뜻밖의 해결책이 될 수도 있었다. 그러나 폴란드가 훨씬 큰 나라였기에, 빌뉴스에서는 이를 사실상의 합병으로 받아들일 가능성이 컸다. 또 다른 방안으로는, 뜻밖에도 벨라루스와의 연합이 있었다. 베크는 흐라마다 정부의 주요 세력 일부가 빌뉴스의 인사들에게 동등한 연합 구상을 제안하며 분위기를 조성하려 한다는 점을 언급했다. 이 체제에서는 지역적 정체성이 특별히 존중받을 것이었다.\n\n리투아니아인들은 이를 어떻게 받아들일 것인가? 이는 결국 소수 민족을 위해 자국에 요구되는 양보로 보일 것이며, 이는 필연적으로 자국 내 민족주의자들의 반발을 불러올 것이다. 반대로, 바르샤바가 지나치게 소극적인 태도를 보이면 폴란드의 애국주의자들이 불만을 드러낼 것이 뻔했다. 어떤 결과가 나오든, [POL.GetLeader]는 요제프 베크가 최선의 선택을 내릴 것임을 믿어 의심치 않았다."
 vilniuscrisis.13.a:0 "계획을 믿자."
 vilniuscrisis.13.b:0 "계획을 믿자."
 POL_return_castle:0 "루블린 성으로의 귀환"
 POL_return_castle_desc:0 "마치 1569년이 다시 찾아온 듯합니다. 폴란드와 리투아니아는 두 번의 자유를 얻은 후, 이제 공동선을 위해 두 번째로 다시 결합했습니다. 우리 국가들이 단일한 나라로 합쳐지면서 루블린 연맹이 다시금 사람들의 입에 오르내리고 있습니다. 비록 옛 시절처럼 선출된 군주가 존재하는 것은 아니지만, 이제 양국 국민은 진정으로 형제처럼 함께 걸어갈 수 있게 되었습니다.\n\n통합 과정은 결코 만만치 않을 것입니다. 수 세기의 점령기를 거친 뒤 각각 전혀 다른 방식으로 독립을 이룬 이력이 있으며, 16세기의 귀족들은 우리가 겪고 있는 민족주의 문제를 결코 예상하지 못했습니다. 피우수트스키 원수가 만들어 낸 체제는 살아남겠지만, 우리의 결합된 자원을 온전히 활용하려면 시간이 필요합니다. 부디 그 시간을 우리에게 허락해주기를 바랄 뿐입니다."
 POL_heavenly_jerusalem:0 "우리의 천상의 예루살렘"
 POL_heavenly_jerusalem_desc:0 "그들의 빌뉴스, 우리의 빌노, 발트 지역의 로마이자 아테네이며, 나폴레옹조차 ‘북쪽의 예루살렘’이라 칭했던 도시가 있습니다. 이제 이곳은 우리나라의 두 지역을 잇는 관문이 되었습니다. 이만큼 제격인 도시가 또 있을까요? 게르만이든 러시아인이든 누가 점령했든 간에 이 도시는 언제나 다양한 민족과 그들의 업적이 공존하는 세상 그 자체였습니다.\n\n폴란드와 리투아니아가 재통합함에 따라 빌뉴스는 우리의 결속을 공식화하는 데 적합한 핵심 지역이 될 것입니다. 국경이 사라진 지금, 이곳은 실제이자 상징적인 ‘바다 사이의 연합’의 중심지가 될 수 있습니다. 그리고 그 첫걸음은 당연히 빌뉴스와 바르샤바를 서로 연결하는 대규모 사업이 될 것입니다."
 POL_unmaking_devil:0 "악마의 소행을 바로잡기"
 POL_unmaking_devil_desc:0 "우리 새 국가가 리투아니아를 통합하는 과정에서 직면할 어려움을 보여주는 한 예가 있습니다. 바로 새 영토에 거주하는 폴란드계 주민들의 성향 문제입니다. 피우수트스키 원수가 바르샤바에서 새로운 유형의 폴란드인을 만들어내고 있던 동안, 국경 밖에 살던 폴란드인들은 우리의 현대화 바람에서 벗어나 있었습니다. 안타깝게도 러시아 제국과 로만 드모프스키의 시절을 오히려 그리워하는 폴란드계 리투아니아인들이 적지 않으며, 1920년대에 우리 이웃으로 숨어든 반체제 인사들로 인해 그 기조가 더 강화되었습니다.결국, 우리가 통합해야 할 소수 집단 중에는 ‘폴란드인’도 포함됩니다. 그들에게 지금 눈앞에 펼쳐진 더 큰 미래의 일부가 되도록 설득해야 합니다. 과거의 영광을 다시 재현하려면, 이제야말로 한마음이 되어야 할 때입니다."
 POL_separate_unequal:0 "분리되지도, 불평등하지도 않게"
 POL_separate_unequal_desc:0 "부활한 폴란드-리투아니아가 주는 이점이 분명 많지만, 최근 몇 년간의 인테르마리움만 살펴봐도 공동선이 내부 분쟁을 방지해주지는 않는다는 사실을 알 수 있습니다. 빌뉴스 위기로 이미 고조된 갈등은 누가 빌뉴스를 소유하느냐에 대한 결론으로도 사그라지지 않았으며, 다른 소수 민족 문제는 말할 것도 없이 여전히 의심과 경계가 남아 있습니다.\n\n안타깝지만, 해답은 다시금 옛 연방의 역사 속에서 찾아야 합니다. 이번에도 공식적인 법적 평등을 기반으로 해야 하지만, 이번에는 쇼뱅주의자, 쇼뱅주의를 똑같이 억누를 수 있는 강력한 군대가 이를 뒷받침해야 합니다. 미흐노브스키주의자, 드모프스키주의자, 스메토나주의자 그 누구도 이 연합을 자신들의 야심을 펼치는 그릇으로 삼아서는 안 됩니다. 모든 민족이 안으로 협력하고 밖으로는 함께 맞설 수 있는 방법을 배워야 합니다. 그 반대가 되어서는 안 됩니다!"
 POL_sanation_lithuania:0 "리투아니아의 사나치아"
 POL_sanation_lithuania_desc:0 "깃발을 걸고 관청 이름만 바꾼다고 해서 완벽한 정부 체제가 다져지지는 않습니다. 리투아니아를 피우수트스키 원수가 세운 체제 안으로 완전히 편입시키려면, 폴란드 사회의 아래에서 위까지 전면적으로 이뤄낸 ‘사나치아’와 같은 과정이 그대로 필요합니다. 하루에도 바르샤바 관청을 오가는 수많은 서류와, 섬세한 경제기획 기구들의 관리, 사나치아 체제 내에 편입된 세력과 바깥으로 밀려난 세력까지도 모두 고려해야 합니다. 뿌리부터 꼭대기까지 리투아니아 사회 전체를 완전히 통합하고, 흡수하고, 재편하며, 불필요한 것은 과감히 버려야 합니다."
 POL_first_step:0 "첫걸음을 내딛으며"
 POL_first_step_desc:0 "리투아니아의 변덕스러운 결정 덕분에, 저희 계획은 수년이나 앞당겨지게 되었습니다. 여러 국가를 묶은 인테르마리움 블록과 같은 구상도 중요하지만, 우리가 주도하는 연방화라는 꿈도 이제 더는 막막하지만은 않게 되었습니다. 우리의 오랜 동반자인 리투아니아는 이러한 과정을 시험해볼 가장 중요한 사례가 될 것이며, 동시에 우리의 우방과 미래 연방 구성원들에게 좋은 본보기가 될 것입니다. 실질적으로는, 리투아니아 영토에 대한 개발 계획을 마련해야 한다는 뜻입니다. 이는 행정 인력의 확충, 지역 사무소 설치, 그리고 새로운 주에 대한 조사 작업을 수반할 것입니다. 필요한 요소가 갖춰진 뒤에는, 통합된 인테르마리움이 얼마나 놀라운 기적을 가져올 수 있는지를 리투아니아에 보여줄 것이며, 다른 나라들에게도 동일한 비전을 제시할 것입니다."
 POL_nothing_new:0 "달라진 것 없어도, 더 세련되게"
 POL_nothing_new_desc:0 "피우수트스키 장군은 비할 데 없이 위대한 거인이었습니다. 그러나 그가 구상했던 인테르마리움 개념의 실행 면에서는 분명 시야가 부족했음을 인정해야 합니다. 옛 폴란드-리투아니아 지도 한 장을 꺼내어 지금의 동맹에 그려진 국경 위에 겹쳐보면 어떤 사실이 분명히 드러납니다. 우리가 되찾아야 할 제국이 눈앞에 있다는 것입니다. 우리는 동쪽을 향해 굴복하는 하급 종주국도, 서쪽 독일에 굴종하는 종속국도 되어서는 안 되며, 리투아니아 역시 어리숙한 잔재 공화국 역할에 머물러서는 안 됩니다. 우리 모두 이미 알고 있고, 리투아니아도 알게 될 것입니다. 우리는 역사적인 사명을 공유하며, 동방을 재차 주도할 새로운 엘리트입니다. 리투아니아도 우리 국민이 가진 열정을 똑같이 받아들인다면, 우리는 다시 한 몸이 되어 전진할 것입니다."
 POL_sarmatia_kitsch:0 "키치함 없는 사르마티아"
 POL_sarmatia_kitsch_desc:0 "황금자유, 반역권, 사르마티즘. 한때 폴란드와 리투아니아의 ‘슐라흐타’는 이러한 이념에 공감하며 살아왔습니다. 그러나 그 이념은 대부분 평범함에 그치는 표식에 불과했습니다.\n\n동방의 사르마티아 부족에서 우리 엘리트가 공통적으로 기원했다는 믿음 자체가 문제인 것은 아닙니다. 이 믿음에서 비롯된 근시안적 발상들, 예컨대 리베룸 베토나 시대를 앞선 군중정치로인한 세임의 난맥 같은 폐단만 없앤다면 말입니다. 그 시절에 우리가 누렸던 세련된 취향, 동방 특유의 원시적 색채, 대담한 멋과 향락이야말로 본질적으로 괜찮은 것이었습니다. 이는 앞으로 인터마리움 전체에 앞서, 리투아니아와 우리를 하나로 묶는 토대가 될 것입니다. 새로운 연방의 새 엘리트가 되어, 대담하고 원초적인 감성을 간직하되, 옷차림과 생활 양식에 있어서는 격조 있는 모습을 보여야 합니다!"
 POL_federation_all:0 "모두를 위한 연방"
 POL_federation_all_desc:0 "리투아니아가 우리 품으로 달려들면서, 우리는 그만큼 더 강해졌습니다. 이제 우리 파트너 국가의 문화·경제·지식 자원이 우리의 자원과 결합되었고, 우리 재정이 투입됨에 따라 그들의 대학과 출판사가 한층 더 성장할 수 있게 되었습니다.\n\n그러나 카우나스와 빌뉴스를 단순히 바르샤바의 지휘 아래 두어서야 곤란합니다. 과거 우리의 연방이 오랫동안 굳건히 유지될 수 있었던 이유는 바로 각 지역의 특권을 제도적으로 보장해준 ‘황금의 자유’에 있었습니다. 이번에도 새 제치포스폴리타는 폴란드와 리투아니아의 두 축이 각각 연방적인, 즉 분권화된 모델로 함께할 것입니다. 지역 정치의 자율성과 폭넓은 지적·문화적 자유를 확립함으로써, 양측 공동체가 서로에게 품고 있는 영토적·방어적 불안을 사그라뜨리려는 것입니다."
 POL_legacy_confederation:0 "바르샤바 연맹의 유산"
 POL_legacy_confederation_desc:0 "한때 폴란드는 전제군주정이 횡행하던 유럽에서 자유의 등대 역할을 했습니다. 이제 우리는 다시금 문명의 표본이 되어야 합니다. 사방에서 우리는 전제주의와 과거 지향적 민족 혐오의 위협에 직면해 있습니다. 이 문제는 인테르마리움 내부에서도 마찬가지로, 실현되지 못한 민족적 운명에 대한 공포가 동맹 자체를 파괴할 위험을 안고 있습니다.\n\n‘다수 민족’에 대한 지나치게 편협한 모델은, 광활한 동유럽에서 결국 피로써만 유지될 수 있습니다. 그래서 우리는 새로운 ‘바르샤바 연맹’ 조약을 문서로 명시하고, 다시금 소수 민족의 권리를 법적으로 보장하고자 합니다. 리투아니아 내 폴란드인, 유대인, 정교 신자들 모두 언어와 관습을 자유롭게 지킬 수 있는 관용의 보호막 아래 있음을 확인하는 것입니다. 근시안적인 행동으로 말미암아 우리의 잠재적 동지들이 등을 돌리게 내버려둬서는 안 됩니다."
 POL_brothers_faith:0 "믿음의 형제들"
 POL_brothers_faith_desc:0 "리투아니아인과 폴란드인은 같은 신들을 섬기고, 같은 언어, 같은 도덕관을 공유합니다. 비록 우리보다 소박한 ‘어리숙한’ 형제들이 이 사실을 자각하지 못한다 해도, '사실' 우리는 단일한 가족에 속해 있습니다. 그들이 결국엔 이를 인정하게 되겠지만, 우리가 먼저 촉진시켜야 합니다. 로만 드모프스키의 십자가를 우리의 우상으로 단순 대체한다고 해서 무엇이 달라지겠습니까? 언젠가 리투아니아도 자신들의 슬라브적 정체성을 받아들일 테지만, 그것은 서서히, 점진적으로 이뤄질 것입니다. 우리도 인내심을 가지고 지켜봐야 합니다."
 POL_one_tree:0 "한 그루 나무, 많은 가지"
 POL_one_tree_desc:0 "이 세계는 인류 모두에게 생명의 물을 공급하는 거대한 나무와도 같습니다. 물론 인류가 하나로 통합되어 있지는 않죠. 실제 나무의 가지가 갈라져 나가듯, 인류 또한 여러 갈래로 분기합니다. 어떤 가지들은 썩어 제거해야 할 수도 있지만, 이교라는 같은 뿌리를 가진 가지들은 서로 다르지 않습니다. 우리 모두는 기독교라는 침입종에 맞서 싸우기를 원하고, 우리 각자의 민족에게 위대한 부흥을 가져오길 바랍니다. 또한 우리는 모두 활력주의 윤리를 신봉하며, 비록 일부는 이를 자각하지 못하더라도 ‘자드루가’라는 꿈을 믿고 있습니다. 마치 프랑스의 육욕주의처럼, 우리는 이 꿈을 슬라브 민족 사이에 퍼뜨릴 것입니다. 먼저 리투아니아, 그리고 슬라브 세계 전체를 향해 나아갑시다!"
 POL_vilnius_red:0 "빌뉴스는 붉다"
 POL_vilnius_red_desc:0 "“리투아니아, 나의 조국이여!” 몇 세기 전, 위대한 예언자 믹키에비치가 이렇게 외쳤습니다. 그리고 오늘날, 그 말만큼 진실에 가까운 것도 없을 것입니다! 폴란드-리투아니아는 이제 부르주아 군주정이 아닌, 노동자 계급의 독재 국가로 우뚝 섰습니다. 이는 폴란드 리투아니아왕국 사회민주당과 코시치우슈코 등 사회주의 개척자들이 그렸던 비전이기도 합니다. 우리의 볼셰비즘은 승리에 도취된, 가차 없는 모습입니다. 44라는 숫자는 곧 우리의 눈앞에 실체로 다가올 것입니다."
 POL_love_all_forever:0 "(모두를 위한 사랑)^영원히"
 POL_love_all_forever_desc:0 "폴란드는 인테르마리움의 심장이며, 다른 모든 지역은 그 주변을 맴돕니다. 먼저 리투아니아의 사나치아화가 있고, 그다음은 우크라이나, 벨라루스, 러시아… 그리고 결국 전 세계가 사나치아와 공산주의의 진리를 알게 될 것입니다. 우리는 모두를 사랑합니다. 우리는 모두를 환영합니다. 우리의 혁명은 초국적이지만, 부정할 수 없이 폴란드적이기도 합니다."
 POL_brothers_more:0 "다시 형제가 되다"
 POL_brothers_more_desc:0 "수 세기 동안 이어져 온 바르샤바와 모스크바의 갈등이 마침내 종지부를 찍었습니다. 우리 외교관들은 상호 이권을 인정하고 러시아와 우리 동맹 간의 불가침 조약을 체결했습니다."
 POL_polski_russkiy:0 "폴스키 포쿠, 루스키 미르"
 POL_polski_russkiy_desc:0 "수 세기 동안 민족적 오만이 폴란드인과 러시아인을 서로 적대시하게 만들었지만, 사실 우리 모두는 같은 목표를 바라지 않나요? 예전 황제 체제가 무너지고, 동정심 있는 정부가 들어섰다면 무의미한 파괴 전쟁은 무슨 소용이겠습니까? 민족주의자들은 “젬스타 나 브로가!(적에게 복수하라!)”라고 외치지만… 과연 누가 진정한 살인자인가요? 수 세기 동안 폴란드를 지배했던 옛 주인들을 타도한, 뜻이 맞는 러시아인들은 결코 살인자가 아닙니다. 오직 산업가들과 전쟁만 외치는 자들만이 진짜 살인자입니다!"
 POL_panic_kyiv:0 "크이우의 혼란"
 POL_panic_kyiv_desc:0 "우크라이나의 친구들은 커다란 혼란에 빠져 있습니다. 러시아와 전쟁이 없으면, 드니에프르 강 동쪽을 되찾는 일도 요원해지기 때문입니다. 우리에게는 선택이 분명했지만, 그들에게는 그렇지 않았죠. 우리가 해줄 수 있는 것도 한계가 있습니다. 스스로 결정해야 합니다. 살 것인가, 죽을 것인가, 택해야 합니다."
 POL_hands_feed:0 "우리를 먹여 살리는 손"
 POL_hands_feed_desc:0 "아쉽게도, 옛 우크라이나 정부는 우리가 기대했던 것보다 훨씬 더 비합리적이었습니다. 다행히도, 그래서 지금은 “옛 우크라이나 정부”라 불리는 거겠지요. 볼보찬 장군은 친폴란드 성향을 지닌 신뢰할 만한 인물로서, 새 애국적 우크라이나를 세우기 위해 열정적으로 나섰습니다. 그에게 힘찬 응원을 보냅시다!"
 POL_break_pigheads:0 "돼지 대가리 부수기"
 POL_break_pigheads_desc:0 "불행하게도, 우크라이나 정부는 새로운 지정학적 현실을 받아들이길 거부했고, 우리의 요구에도 응하지 않았습니다. 러시아와 폴란드 양국 군대는 크이우에 있는 적대적 정부를 진압하고, 우리 옆구리에 생길 적대적 분쟁을 막기 위한 특별 군사 작전을 개시하기로 합의했습니다."
 POL_revive_upyr:0 "범슬라브적 우피르의 부활"
 POL_revive_upyr_desc:0 "범슬라브주의는 다시금 모든 이의 입에 오르내리고 있습니다. 폴란드와 러시아의 우애가 완전해지려면, 남부 슬라브 국가들 역시 우리와 함께해야 합니다."
 POL_blue_high:0 "파랑, 빨강, 흰색, 높이 휘날리다"
 POL_blue_high_desc:0 "동유럽에 새로운 강대국이 떠올랐습니다. 슬라브 거인은 깨어났고, 전 세계가 그 앞에서 전율하고 있습니다. 우리는 이 새로운 세계에서 친구를 찾아야 합니다. 우선 주변국과의 관계를 재정비하는 일부터 시작합시다."
 POL_grinning_teeth:0 "이를 악물고, 총검을 번쩍이며"
 POL_grinning_teeth_desc:0 "얼마 전까지 러시아와 폴란드는 최후의 충돌을 대비해 군비를 늘려왔습니다. 그러나 이제 우리는 마침내 형제가 되었습니다. 그러니 우리 군대는 다른 목표를 위해 재편해야 합니다. 서유럽은 불길에 휩싸이는 중이며, 우리는 이에 맞설 준비를 해야 합니다."
 POL_only_remedy:0 "그들의 광기에 대한 유일한 처방"
 POL_only_remedy_desc:0 "프랑스와 독일은 제정신이 아닙니다. 동쪽은 사랑과 평화를 찾았지만, 서쪽은 전쟁과 파국에 빠졌습니다. 우리가 평화롭고 번영하는 대륙으로 돌아가고자 한다면, 불을 불로 다스릴 수밖에 없습니다."
 POL_elba_rubicon:0 "엘바, 우리의 루비콘"
 POL_elba_rubicon_desc:0 "슬라브 군대가 서쪽을 향해 국경을 넘을 준비를 마쳤습니다. 동쪽에서 밝아온 빛이 세상을 뒤덮은 혼돈과 광기를 거둬낼 것입니다."
 POL_agape_borders:0 "아가페는 국경을 모른다"
 POL_agape_borders_desc:0 "사랑이 전 세계를 제패하고 있습니다! 제정 러시아의 파멸은 사회주의가 승리로 나아가는 필연적 행진 속에서 일어난 또 하나의 과정일 뿐입니다. 유럽 곳곳에서는 각국의 혁명이 봄처럼 타오르고 새로운 세계가 비상을 시작하고 있습니다. 그러나 이것이 끝이 아니라 새 시작입니다. 아직 해결해야 할 일이 많습니다. 동방의 영토들을 통합하고 개혁해야 하며, 혁명 세력 간의 이견이 공산주의 강대국끼리의 파멸적 전쟁으로 치달을 위험도 있습니다. 폴란드는 새로운 세계 질서의 수호자 역할을 맡아야만 합니다. 우리가 건네는 부드럽고도 자애로운 손길이 영광스러운 승리를 예고할 것이며 전 세계 사회주의 공화국을 향해 함께 노동할 거대한 장을 열어갈 것입니다."
 POL_human_national:0 "전인류적이면서 동시에 전국적인"
 POL_human_national_desc:0 "폴란드의 시인 아담 미츠키에비치가 말했듯, 사회주의는 ‘전 인류적’이 되기 전에 먼저 ‘국가적’이어야 합니다. 폴란드 사회주의가 맡은 국가적 과제는 이제 결실을 맺으려 합니다. 러시아의 독수리는 쓰러졌고, 그가 감금해왔던 모든 민족은 이제 해방되었습니다. 이제 민족을 초월하는 융합적 운동을 시작할 때입니다. 해방된 폴란드는 전 세계에 모범이 되어야 하며, 그 사회주의적 종합은 인류 모두를 위한 본보기가 되어야 합니다.\n\n우리는 전 세계의 자유로운 국가들끼리 협력을 도모해야 합니다. 각 나라가 특색 있게 발전시켜 온 사회주의 간의 상호 이해를 다져, 결국 인류가 한데 모여 ‘세계 노동 공화국’을 이룰 수 있어야 합니다."
 POL_hydra_heads:0 "여러 머리의 히드라"
 POL_hydra_heads_desc:0 "1936년의 유럽 지도를 바라보십시오. 그리고 지금 우리의 인테르마리움 동맹이 확장되어온 모습을 보면서, 우리가 맞닥뜨린 과제를 분명히 확인해보시기 바랍니다. 폴란드 내부의 질서 역시 하루아침에 자리 잡은 것이 아니었습니다. 피우수트스키와 지에르진스키를 거쳐 내려온 여러 정부의 노력 속에서, 수많은 반동과 퇴행적 사고를 하나하나 철저히 제압하며 다져낸 결과입니다. 이제 1936년의 러시아라는 ‘부시쌈지’을 떠올려 보십시오. 끝이 보이지 않는 시간대가 펼쳐진 그 땅에서 우리가 무엇과 마주해야 하는지 확실해집니다.\n\n‘철의 펠릭스’ 지에르진스키가 새하늘 군세의 선봉에 섰습니다. 새로운 영토에서 평화를 유지하고 반혁명 활동을 억압하기 위해, 비상위원회가 구성될 예정입니다. 재정비된 비밀경찰과 ‘죽음 후사르’ 부대가 뒷받침해줄 것입니다. 우리는 천 개의 손으로 반동 히드라의 머리를 잘라내고, 그 뿌리를 태워 더는 봉기가 싹트지 못하도록 막을 것입니다."
 POL_ithas_coal:0 "절대적 석탄의 이타스"
 POL_ithas_coal_desc:0 "러시아라는 인공적 구성을 해체해야 했던 것은 사실이지만, 북부 아시아 전체를 고립과 홉스적 만인의 만인에 대한 전쟁으로 몰아넣는 것이 반드시 우리의 이익이라고 말할 수는 없습니다. 프로메테우스주의는 결코 적을 무력화하려는 술수만을 가리키는 것이 아닙니다. 프로메테우스가 불을 훔친 이유도 신들에게 복수하기 위해서가 아니었고, 자신만을 위해서도 아니었지 않습니까? 그가 흙으로 사람을 빚었듯이, 우리는 러시아 제국에 억압당하던 민족들로 새로운 국가들을 만들어냅니다. 새로 탄생한 이 국가들을 우리가 책임감 있게 지원하고 기반 시설을 확충해줄 필요가 있습니다. 그들이 스스로 자립할 수 있을 때까지 말입니다. 바르샤바의 대장간들은 캄차카가 안전해지는 날까지 불길을 멈추지 않을 것입니다!\n\n…물론, 태평양을 우리 동맹의 경계로 확보한다면, 그것이야말로 폴란드 무력의 빼어난 업적이 될 것입니다."
 POL_friendship_wins:0 "우정은 항상 이긴다"
 POL_friendship_wins_desc:0 "모스크바를 물리친 우리의 승리에는 달콤씁쓸한 감정이 함께합니다. 오랜 세월 우리는 외세 지배와 황금의 자유를 짓밟았던 차르의 억압에 맞서 왔지만, 러시아인들 또한 후진성과 압제의 희생자가 아니었겠습니까? 동방 감옥에 갇힌 민족들을 해방시키겠다는 프로메테우스주의의 열정 속에서, 우리는 민족을 하나를 잊은 것은 아닐까요?\n\n우리는 러시아를 속국으로 두려는 제국을 원하는 것이 아니라, 진정한 의미의 ‘연방’을 이루고자 합니다. 유라시아적 포부 앞에 놓인 걸림돌을 제거한 것이긴 합니다만, 러시아의 심장부를 재건하는 과정에서 그들이 오랜 세월 염원해온 자유 또한 우리의 바다 사이(인테르 마리움) 동맹 안에서 실현될 것입니다. 단순한 군사적 전초기지나 점령지가 아니라, 우리의 든든한 파트너가 될 것입니다."
 POL_piece_revolution:0 "우리의 혁명의 몫"
 POL_piece_revolution_desc:0 "안타깝게도 동유럽에서 벌어진 우리가 주연인 드라마만이 이 시대의 전부는 아니었습니다. 비엔나에서 흘러나온 유혈 사태로 베얼린의 정치적 합의가 깨졌고, 르 솔레유에서 벌어진 총격 사건이 프랑스에 편집증적 군국주의를 불러일으켰으며, 노르웨이에서의 전쟁은 얼어붙은 평화를 산산조각냈습니다. 이탈리아에서는 ‘피우메 구상’이 마지막 단계를 맞이했습니다. 한편, 우리는 러시아와의 최종 결전을 치르느라 분주했고, 비록 승리했지만, 이제 서쪽을 바라보니 이미 다른 거대한 변화가 진행되고 있습니다.\n\n이런 상황에서 피우메 형제애와 우리 바르샤바 조약의 의미를 재고해야 합니다. 완벽한 세상이라면 형제가 되는 길이 좋겠지만, 필요하다면 유럽을 다시 한 번 혁명의 횃불로 밝히는 수밖에 없습니다."
 POL_berlin_warsaw:0 "베얼린과 바르샤바 그 너머로"
 POL_berlin_warsaw_desc:0 "폴란드가 짊어진 민족적 사명은 국제 프롤레타리아트와 맞닿아 있습니다. 유럽 내 사회주의의 물결은 독일이든 프랑스든 이미 막을 수 없는 수준으로 번져가고 있지만, 지구 구석구석의 노동자들은 여전히 자본주의의 구둣발에 짓밟히고 있습니다. 신흥 강국으로 떠오른 폴란드는 우리의 프로메테우스적 박애를 미국 깡패-부르주아에게 탄압받는 노동자들에게, 제국주의적 탐욕에 시달리는 아프리카·아시아 민족들에게도 확장해야 합니다.\n\n러시아를 해방시키면서 얻은 교훈들을 전 세계에 적용해야 합니다. 타타르나 시베리아 민족 운동을 지원했던 것처럼, 식민 지배에 놓인 이들의 독립도 후원해야 합니다. 러시아 제국을 해체했듯이, 미국 제국도 무릎 꿇게 만들어야 합니다. 그리하여 온 인류가 사랑의 포옹 속에 하나로 뭉칠 수 있도록 해야 합니다."
 POL_triumph_lovers:0 "위대한 사랑의 승리"
 POL_triumph_lovers_desc:0 "사랑 - 사랑 - 사랑\n\n이번 승리는 진정한 공산주의의 승리이자, 유라시아 전역에 걸친 혁명사를 하나의 대행진으로 완성시키는 장엄한 봉인입니다. 우리의 긴 팔은 브르타뉴에서부터 블라디보스토크를 넘어 더 먼 곳까지 뻗어 나갑니다. 모든 인류가 단 하나의 따뜻하고 보살피는 품 안에서 진정한 유토피아를 보장받게 될 것입니다.\n\n이는 폴란드와 인테르마리움의 승리에 그치지 않습니다. 절대적 사랑을 사회주의를 통해 구현하고, 모든 생명 형태를 존중하며 숭배하는 ‘새로운 시대의 0년’을 선포하는 날입니다. 위력과 겸손이 조화를 이룬 참된 화합이 실현되는 순간입니다. 오늘, 예수와 마르크스, 피우수트스키, 니체, 그리고 인류의 모든 위대한 성인들은 자신들의 유산이 영원히 남으리라 확신할 것입니다.\n\n사랑 - 사랑 - 사랑"
 POL_vistula_scatmander:0 "비스와강은 스카만드로스처럼 빛나고"
 POL_vistula_scatmander_desc:0 "행정의 썩은 지역들은 뿌리째 뽑혀나갔습니다. 낡은 관료주의 감옥들은 불타버렸고, 새로운 행정부가 들어섰습니다! 브루노 야셴스키가 당 의장으로 임명되면서 폴란드 정부는 새로운 방향으로 날개를 펼쳤습니다. 마치 우리가 평생 콘크리트 수렁 속에 갇혀 숨도 제대로 쉬지 못했던 것처럼 느껴지다가, 이제야 비로소 자유로워진 기분입니다. 우리는 트로이인이 되어, 햇빛 아래에서 반짝이는 스카만드로스 강물을 바라보는 듯합니다.\n\n우리야말로 전 세계 미래주의 혁명의 최전선을 지켜야 합니다. 자본주의 해충과 베얼린의 관료주의에서 해방되어, 캅카스에서 르 솔레유, 그리고 바르샤바에 이르기까지! 새로운 바람이 불고, 우리는 그 바람을 타고 나아갈 것입니다!"
 POL_name_milion:0 "우리의 이름은 “백만\"이나니"
 POL_name_milion_desc:0 "온 인류가 겪는 고통이 한 민족의 영혼에 짓누르고 있습니다. 신문 지면은 페트로그라드 빈민가와 런던 하층주택의 새로운 공포를 쏟아내고, 그 속에서 식민지로 억압받는 아프리카의 비극과 동방에서 미신과 무지 속에 고통받는 형제들의 문제가 드러납니다. 우리는 원칙적으로, 그리고 실천적으로 억압에 맞서 싸웁니다. 우리는 믹키에비치와 마르크스가 약속하고, 피우수트스키와 그리스도가 건설한 세계를 위해 투쟁합니다!\n\n우리가 지향하는 바는 해방입니다! 동방은 해방을 갈망하고 있으나, 러시아는 자기 하수인들의 의식을 억누르기 위해 애써 왔고, 무지는 곳곳에서 제지 없이 만연해 있습니다. 우리의 심장은 전 세계 인민에게 공감하며, 아틀라스처럼 폴란드 노동자가 그들의 고통을 짊어지고 그것에서 벗어나도록 돕고자 합니다. 우리는 폴란드 정신을 일깨워야 합니다. 그저 자신만의 존재 의식이 아니라, 우리를 자유롭게 해준 선조들의 애국 정신처럼, 자유를 갈망하는 다른 나라들의 고통까지도 함께 자각해야 합니다."
 POL_naczelnik_forever:0 "나첼니크, 그때도, 지금도, 영원토록!"
 POL_naczelnik_forever_desc:0 "우리 혁명의 주된 과업은 피우수트스키가 시작한 것을 완수하고 완전하게 만드는 것입니다. 어떤 좌파 일탈주의자들은 “더 진정한 공산주의 혹은 민주적 형태”를 위해 푸른 사회주의 구조를 폐지해야 한다고 주장하지만, 우리는 그렇지 않습니다. 이미 수직적·위계적인 형태는 사회주의 발전에 적합하며, 이는 하향 평준화가 아니라 인류를 고양시키는 운동이기 때문입니다. 피우수트스키는 마르크스와 나란히, 사회주의의 기초를 다진 천재로 인정받아야 합니다. 왜냐하면 그는 자신의 사상을 현실로 구현해낼 수 있었기 때문입니다. 서방 이웃 국가들은 노동자 동지를 구제할 능력이 없어 붕괴하고, 갈등을 촉발하는 교조주의와 마비 상태의 평화주의 사이에서 허우적거리고 있습니다. 이를 지켜보면, 푸른 사회주의야말로 공산주의로 가는 가장 효율적인 길을 보여주는 모델임을 알 수 있습니다. 민주적 형태로 돌아가는 일은 없습니다. 폴란드는 언제까지나 신과 역사 앞에만 책임지는 총독을 모실 것입니다."
 POL_alpha_omega:0 "피우수트스키, 볼셰비즘의 알파와 오메가"
 POL_alpha_omega_desc:0 "사나치아는 그 시작부터 공산주의와 복잡한 관계를 맺어왔습니다. 지에르진스키가 집권하기 전까지 폴란드 공산당은 공식적으로 여당에 속하지 않았지만, 사실상 허용된 유일한 ‘바깥’ 정당이었습니다. 피우수트스키 체제의 고위 관료 대부분은 사민주의적 성향을 띠었고, 연합회복권의 프롤레타리아적 성격은 지주 귀족 세력과 맺은 흔히 ‘반동적-사회주의적 동맹’이라 불린 협약으로 인해 자주 약화되었습니다.\n\n그러나 우리의 시각에서는 이 고르디우스의 매듭이 놀랍도록 간단합니다. 피우수트스키의 가슴속에서도 진보의 등불이 빛나고 있었습니다. 그것은 마야콥스키와 스탈린이 캅카스에서 새로운 공화국을 선포할 때 내세웠던 바로 그 빛, 진보의 빛이었습니다. 우리의 볼셰비즘과 공산주의는 사나차로부터 단절이 아니라, 오히려 그 완성이며 귀결입니다. 우리는 ‘정통’이라 자처하는 이 체제의 중도 세력에게 손을 내밉니다. 발레리 스와베크 같은 인물들은 아직도 젊은 시절의 급진 정신을 기억해낼 수도 있을 것입니다. 이들의 능력과 사상은 스파르타키스트나 전진주의자들 교조에 무작정 대체되어서는 안 됩니다. 경제의 기술관료적 체제는 그대로 지속될 것입니다. 국가는 전체주의적 사명을 이어가겠지만, 그 정신과 목적은 새롭게 태어납니다. 사실 이는 애초부터 내재해 있던 것이며, ‘유년기의 안개’에 가려졌을 뿐입니다. 마침내 통합혁명사나치아당은 피우수트스키가 참으로 바라던 진정한 공산당으로 첫걸음을 떼게 될 것입니다."
 POL_omniscience:0 "전지, 전능, 전애"
 POL_omniscience_desc:0 "현명한 동방 동지들이 설명하듯, 공산주의 운동은 신적 속성이라 여겨지던 에너지를 인간의 손에 부여하는 것입니다. 사나치아 국가의 본질에 이 격언이 잘 담겨 있습니다. 우리 국가는 부르주아적 계급 지배의 도구가 아니라 유기적으로 결합된 인류 공동체이자 ‘교회’입니다. 이는 정신의 총합으로 새롭게 떠오르는 전체입니다. 이런 맥락에서, 우리는 국가가 ‘전체적’이라고 주장하며, 그 전체성을 통해 중세 신학이 정의하던 신의 속성을 갖추게 된다고 말할 수 있습니다. 그리하여 폴란드에서 등장한 새로운 형태의 권력, 우리가 국가적 대실험에서 발견해나가는 권력은 거룩합니다. 국가는 전지할 권리를 지니며, 어떤 시민도 국가에 비밀을 숨길 수 없습니다. 국가에는 전능할 권리가 있으며, 나첼니크의 명령에는 법적 한계가 없습니다. 또한 국가는 무한히 인자합니다. 사랑과 진보로부터 탄생했기 때문입니다.\n\n우리가 수고하고 싸우는 이 대의는 신성하며, 우리는 그에 걸맞은 종교적 광신으로 임할 것입니다. 우리는 무한한 사랑의 지평선을 바라보며, 그곳에 이르기 위해 피의 바다를 건너는 것도 두려워하지 않을 것입니다!"
 POL_heathens_gasoline:0 "성 가솔린의 이교"
 POL_heathens_gasoline_desc:0 "그리스도는 인류를 구원하기 위해 피를 흘렸고, 피우수트스키는 가솔린을 뿌렸습니다. 우리의 국가는 교회이며, 공장은 그 성전이고, 연소는 우리의 성례입니다. 도시를 채운 연금술 공장의 매캐한 연기조차도 우리에게는 신성한 향입니다. 우리의 손이 만들어낸 창조물과 예술, 노동의 산물은 우리에게 바빌론의 우상과도 같고, 그것이 지닌 새로운 생명에 우리는 기꺼이 피를 바칠 수 있습니다. 휴머니즘은 이미 어제의 유물입니다! 나무 오두막과 소달구지가 전부였던 세계에서 조작된 부르주아적 거짓말이었을 뿐입니다. 오늘과 내일의 교리는 새로운 범신론이며, 세계 안에 잠든 힘을 깨우는 것입니다. 전기라는 신성한 불과 석유·석탄이라는 번제의 불길로 모든 것을 완전히 탈바꿈시키는 것, 이것이 미래의 신이자 모든 것을 초월하는 \"사랑\"입니다!"
 POL_hyperturbonecro_romantics:0 "하이퍼-터보-네크로 로맨틱스"
 POL_hyperturbonecro_romantics_desc:0 "정복을 향한 갈망과 사랑을 향한 갈망은 본질적으로 같습니다. 이 사실을 깨달은 우리는 주변 세계의 유동적 변화에 몸을 맡겨 새로이 빚어질 것입니다. 우리는 도덕의 낡은 틀에 죽음을 선포하고, 격정적 욕망의 흐름을 깨워냅니다. 우리를 둘러싼 기계 문명은 에로틱하게 다가오고, 군인들의 상처에는 장미와 백합이 피어나며, 죽음의 냄새 속에서도 향수를 맡습니다. 우리의 신조는 이렇게 울려 퍼집니다: LOVE² = 절대적 순수와 미덕 = 세계의 총체성 = 썩어가는 시체 = 무한한 힘! 이는 단순한 대중적 본능으로는 담아낼 수 없는 신비이며, 오직 위대한 예술을 통해서만 표현될 수 있는 신비입니다. 우리의 체제가 문화나 감성을 죽이는 것으로 착각하지 마십시오. 우리는 고급 문화를 최고로 끌어올려, 국가가 채찍처럼 휘둘러 인간 전체를 벌하고 보상할 수 있도록 만드는 정점에 서 있습니다. “야쿱 셸라를 부활시켜 무지렁이 대중을 이끌어 문화를 파괴하자!”라고 외치는 몇몇 미래주의자들의 외침 따위는 초고온 터빈 소리에 묻혀 버릴 것입니다. 국가는 사디스틱·마조히스틱한 벌로 쓴 약 같은 문화를 강제로 주입할 것입니다. 그것은 산업 발전의 남근이 썩어가는 자연의 몸을 끊임없이 사랑하며, 남성성과 여성성의 시체애적 결합을 이루는 것과 마찬가지의 원리입니다."
 POL_avantgarde_army:0 "아방가르드는 군대다"
 POL_avantgarde_army_desc:0 "“아방가르드”라는 용어는 원래 군사 용어 전위대에서 왔습니다. 우리는 예술적·정치적 전위의 임무가 전쟁임을 결코 잊어서는 안 됩니다. 반동에 맞서는 이 투쟁에서 우리는 규율, 서열, 목적의식을 잃어서는 안 됩니다. 사나치아의 기술관료적 중심부에서 제시한 구상들은 질서 정연한 국가 구조를 이룩했으며, 이제 그것을 공산주의에 봉사하도록 재조정하기만 하면 됩니다. 일부 극좌파들이 무엇을 주장하든, 시민 장교단이 지휘하는 공동 사회 조직이야말로 미래를 정복하기에 가장 알맞은 형태입니다. 질서와 서열은 국가의 신성한 사명을 확립하기 위해 필수적이며, 대중의 변덕스러운 열정 속에서 그 사명이 길을 잃어서는 안 됩니다. 강철 같은 구조로 무장한 폴란드는 세계를 정복하는 기계, 세상을 집어삼키고 재창조하도록 설계된 전능한 엔진이 될 것입니다."
 POL_kerosene_fire:0 "등유여! 우리를 타게하소서!"
 POL_kerosene_fire_desc:0 "혁명은 공장에서만 일어나는 것이 아닙니다. 혁명은 몸과 마음, 정신을 모두 뒤흔드는 대혁명입니다. 이는 가장 긍정적인 의미에서의 낭만적 열망이며, 절대적 광신을 요구합니다.\n\n가을 나무가 붉게 물드는 광경은 누군가 보기엔 ‘공산주의 색’이라고 할 수도 있습니다. 그 나무는 \"힘\"이자 \"사랑\"을 위해 스스로를 희생하고 있습니다. 우리는 나무가 아니지만, 태양에서 뻗어 나온 동일한 열매를 맛보았고, 지구 깊은 곳에 묻힌 보물은 인간과 결합되어 정제·승화되어 영원히 불타오르도록 우리를 부추깁니다. 사나치아의 임무는 문명을 낭만적 열정의 불꽃으로 발전시키는 것이지, 소심한 공리주의나 평범한 민주주의의 함정에 빠지는 것이 아닙니다. 가장 넘쳐흐르는 활력과 번영을 이룰 자들만이 미래로 살아남을 것입니다."
 POL_legion_legions:0 "군단의 군단의 군단…"
 POL_legion_legions_desc:0 "피우수트스키의 폴란드 군단들은 대전쟁 시기에 지상에서 가장 혁명적인 군사 조직이었습니다. 그들은 대의에 대한 헌신과 명예에 대한 믿음을 결합시켜, 산업화된 전쟁터에서도 마치 중세 기사 같은 모습을 보였습니다. 이러한 이상이 곧 전 폴란드군의 이상이 되어야 합니다. 병사는 역사를 움직이는 자로서 자신의 위치를 자각해야 하며, 돈을 받는 용병이 아니라 문명과 기사도의 사명을 지닌 전사여야 합니다. 장교와 정치장교에게는 가장 엄격한 기준을 적용해야 합니다. 그들은 새로운 근대의 성자로서, 폴란드와 혁명에 대한 충성에 의심의 여지 없이 헌신적이어야 하며, 피우수트스키의 품격처럼 고결하고 관대한 인격을 지녀야 합니다. 이들은 미덕의 무결한 표상이 되어야 합니다. 우리의 군대는 피우수트스키의 위대한 정신과 지에르진스키의 인자함을 함께 구현할 것이며, 현대적 기사도와 고도 발전된 신공산인간을 육성하는 산실이 될 것입니다."
 POL_he_city:0 "그분은 도시가 되리다"
 POL_he_city_desc:0 "인류는 이제 그 껍질을 깨뜨리고 나아가려 합니다. 한때 인류를 노예처럼 부리던 군주정과 전제정은 하나둘씩 몰락하고 있습니다. 그 속에서 폴란드는 가장 먼저 태양 아래로 걸어나간 국가로서 명예로운 자리를 차지합니다. 그러나 지에르진스키가 없다면 어디에 이를 수 있었겠습니까? 강철 같은 규율과 인류에 대한 의심할 여지 없는 사랑을 지닌 인물이 없었다면 말입니다. 그는 너무나 강렬한 사랑을 품어 민족의 영혼이 일으키는 모든 진동을 느끼며, 마치 믹키에비치의 콘라드처럼 ‘수백만을 사랑’합니다. 바로 그의 존재가 ‘새 인간’, 가장 건장하고 섬세하며 비천함에서 해방된 인간이 세상에 첫 예시로 나서는 계기가 됩니다. 지에르진스키는 근대적 삶의 미덕을 체현하며, 폴란드 산업 국가라는 거대 우주의 축소판, 즉 도시와 같은 인물입니다. 그의 모범과 의지를 따라 인류가 움직일 것입니다. 새 시대의 여명이 밝아올 때, 인류는 자기 구원자의 이름을 길이 기억할 것입니다. 지에르진스키, 새로운 이스라엘의 아들로서, 과거의 구세주를 해체해 자신이 처형인이 되었고, 본래의 구세주가 죄수였듯 스스로가 그러한 고통을 초월한 인물입니다."
 POL_nuz_dlon:0 "누시 프 카주동 드원(이제 모든 손에)"
 POL_nuz_dlon_desc:0 "우리 혁명과 새로운 국가의 아름다움은 대중에 있습니다. 광기 서린 군중은 흙 묻은 손을 땅속에 파묻어 신과 황금을 길러낼 것입니다! 미친 듯 보이는 군중, 대중들의 영혼 안에는 시인과 귀족, 전사의 혼이 깃들어 있습니다. 그들은 혁명과 폴란드 국가의 가장 작은 원자이자 세포입니다. 그들에게 이 사실을 분명히 인식시켜야 하며, 폴란드 구석구석에서 혁명을 일으키도록 독려해야 합니다!"
 POL_toppling_panopticon:0 "판옵티콘을 무너뜨리며"
 POL_toppling_panopticon_desc:0 "수많은 폴란드인들이 ‘문화’라는 판옵티콘 안에서 썩어가며 세월을 보냈습니다. 그것이 외세의 강압이든 우리가 만든 감옥이든 마찬가지였습니다. 행동과 취향에 대한 멸시의 벽은 우리 몸과 마음을 채찍질했고, 우리는 천한 생각의 망령들에게 눈이 멀어 종속되어 있었습니다. 그러나 이제는 그렇지 않습니다! 문화의 판옵티콘이 붕괴함과 동시에, 금기는 무너졌습니다. 이제 우리에게 중요한 것은 ‘멋’과 ‘우아함’의 판단뿐입니다.\n\n수치심과 의구심에서 해방된 우리의 정신은 스스로 안으로 날아들어 새로운 세계를 열 것입니다. 이전에 본 적 없는 예술 운동들이 등장할 것입니다! 유리 벽으로 도시를 짓는 건축가들은 모든 사람이 서로를 투명하게 바라볼 수 있게 할 것입니다. 보편적 혁명에 걸맞은 보편 예술이 탄생할 것입니다!"
 POL_holy_nudism:0 "불경한 낙원에서의 신성한 나체주의"
 POL_holy_nudism_desc:0 "반동 세력은 피부를 두려워합니다. 그들은 이를 혐오하고 감추려 하며, 낡은 사회 규범을 지속시키기 위해 가면을 씌웁니다. 신부, 경찰, 고용주—이들 모두가 나서서 “허용되는 사랑”이 무엇인지 정해놓고 싶어 합니다. 자본은 섹스를 하지 않습니다. 자본은 자위를 할 뿐이며, 끝내 스스로를 해방하지 않는, 절름발이 독신남처럼 굴지요. 그는 몸에서 의미 없는 담즙만 토해내며, 기쁨 없는 훔쳐보기와 번식만을 위한 섹스, 그리고 복종을 위한 쾌락에 자신의 삶을 내맡겨, 그 둘을 결코 결합하지 않습니다. “기도하라(Ora) 그리고 일하라(Labora).” 그것이 그들이 원하는 당신의 모습입니다. 즉 신이든 현실 권력이든, 어떤 존재에게 절하고 죽을 때에야 비로소 약간의 쾌락을 허락받는 기계일 뿐입니다. 진정한 성적 환희를 평생 누리지 못한 채 말입니다.\n\n우리는 이 모든 것을 초월합니다.\n\n섹스에 “예”라고 외쳐봅시다. 마치 야생 토끼처럼 번식해보십시오. 매춘부가 되건 젊은 신사가 되건, 서로 사랑하고 뒤엉키십시오. 매춘부 둘이어도, 신사 둘이어도, 다른 조합이어도 상관없습니다. 번식을 사랑하는 사람은 사유를 사랑하고, 사고는 곧 진보를 부릅니다. 그 진보는 낡은 것과 닳아빠진 것을 무너뜨리는 적입니다. 사랑하는 폴란드인, 형제들이여, 배우자들이여, 노동자 여러분, 성경을 불태우고 교회를 버리십시오. 여러분을 구원할 이는 예수가 아니라 드 사드 후작 입니다. 그리고 그 매음굴이 곧 그분의 성전이 될 것입니다! Ora et fruere! 기도하고, 즐기십시오!"
 POL_everyone_noone:0 "모두이나 누구도 아닌 나첼니크"
 POL_everyone_noone_desc:0 "우리는 미래주의를 자본주의처럼 ‘세계의 파괴와 노예화를 상징하는 단일한 괴물’로 생각할 수 없습니다. 옛 프랑스 혁명에서도 그랬듯, “우리에겐 동지이면서도 적인 자들”이 늘 존재해 왔습니다. 다만 옛 ‘평등동맹’이나 자코뱅 ‘산악파’처럼 결코 마주서지 못했던 자들이, 우리 시대에는 함께 마주하고 있다는 점이 다릅니다. 스카만데르와 미래주의자들은 서로 한 몸처럼, 왼손과 오른손이 되었습니다. 무엇이 오든, 좋든 나쁘든 함께 갈 것입니다. 한편 구경꾼이나 다름없는 통합혁명사나치아당은 1905년 알렉산드르 보그다노프가 제시한 옛 볼셰비즘 노선을 여전히 지키고 있습니다. 우리가 북을 치며 일제히 행진하지 않는다고 해서, 이 무궁무진한 색채의 축제가 덜 매력적으로 보이는 것은 아니지 않습니까? 대중은 붉은색의 미세한 차이를 구분하지 않고, 오직 영광과 미래, 그리고 오랫동안 박탈당했던 자유를 향해 행진합니다. 그들은 그림을 그리고, 사랑을 나누고, 먹고 마시며, 더는 ‘도덕’이나 ‘상식’에 제약받지 않습니다. 그렇게 내버려두십시오. 그들 중 뛰어난 이들을 가려내어, 우리의 위대한 미래주의 정당에 자리를 마련해 줍시다. 그들이 진정 시적 영혼임을 증명해낸다면, 금빛 감시탑에서 무지갯빛 광채를 뿜어내며 영원히 빛날 것입니다. 그들 주위에서는 어떠한 배도 길을 잃지 않을 것입니다. 왜냐하면 그들은 영원히 사라지지 않는 존재이니까요."
 POL_ochlos_production:0 "군중이 만드는 학살 기계"
 POL_ochlos_production_desc:0 "“국가 밖에 아무것도 없으며, 국가를 거스르는 것도 없고, 모든 것은 국가 안에 있다.” 이 원리는 얼마나 간단합니까! 그러나 얼마나 자주 잘못 해석되었던가요… 사실 우리 동지들 중 일부조차 이 말을 헛되이 반복해 왔습니다. 우리는 그저 시민에게 절대적 복종만 강요하는 반동주의자가 아닙니다. 병사에게도 복종을 요구하며, 동시에 장엄한 열정을 요구합니다! 전쟁은 위대합니다! 전쟁은 해방의 힘입니다! 저는 \"전쟁을 사랑합니다!\" \"전쟁을 진심으로 사랑합니다!\" \"전쟁을 사랑하여 갈구합니다!\" \"전쟁을 사랑하다 미쳐 버렸습니다!!!\" 라고 목이 터져라 외쳐보십시오.\n\n그리고 전쟁보다 더 사랑하는 것이 있다면, 바로 키치함입니다. 공장의 무정형적 평등, 그 혁명적 동질성은 우리를 귀족 취향으로 분류하고자 하는 부르주아적 폭정에 대한 가장 명확한 반격입니다. 작업장이나 가족 경영 가게에 무슨 영광이 있습니까? 허무맹랑일 뿐입니다. 당신과 나, 그리고 우리 모두는 조립 라인을 사랑하게 될 것입니다. 우리는 금속과 끈기를 사랑하게 될 것입니다. 더 많은 탱크, 더 많은 총, 더 많은 포를 위해, 더 많은 \"강철\"을 위해 몸이 무너질 때까지 일할 것입니다! \"강철이 곧 삶이며\", \"강철이 곧 예술입니다\". \"저 미련한 바이런 썅것들이 예술에 대해 뭘 알았습니까?\" \"아무것도 모릅니다!\" \"아무것도!\" \"없느니만 못합니다!\" \"예술이란 폭발이고\" \"전쟁이 곧 예술이며\" \"전쟁이 곧 예술입니다!\""
 POL_sarmatian_domina:0 "지옥에서 나온 사르마티아의 여제"
 POL_sarmatian_domina_desc:0 "아름다운 성은 혁명적 세상이든 아니든, 국가와 세계와 관계 맺는 방식이 제법 흥미롭습니다. 어쩌면 불안정함 탓이었을까요? 여성은 수 세기 동안 권력에 오르지 못하도록 철저히 감시되고 구속당해 왔습니다. 마치 본인이 만들어 낸 사회 기제가 자신을 해치려는 듯, 그 소중한 ‘작은 꽃’을 끊임없이 짓밟아 온 셈이지요. 보수주의자들은 수세기 동안 여성을 연약하고 귀족처럼 감싸야 하며, 남성을 다스릴 재능이 없다고 거짓말을 퍼뜨려 왔습니다. 웃기는 일입니다! 제가 말씀드리건대, 사슬에서 풀려난 여성은 그야말로 맹수와도 같습니다. 전설의 토미리스를 기억하지 않으십니까? 사르마티아의 초인들을 통치하며, 한때 위대했던 페르시아 제국을 무너뜨렸던 그 여왕을 말입니다. “버림받은 여인의 분노보다 더 무서운 지옥은 없다”는 말이 있지 않습니까? 전쟁터든 침상이든 두말할 나위 없이 사실입니다. 세상은 여성에게 “부엌에나 있어라”라고 말하지요. 하지만 우리는 “남성의 자리는 여성의 발밑”이라 주장합니다. 사용된 시가의 재떨이가 되어 주고, 구두 밑창을 닦아 주며, 강력한 차리차에게 봉사하는 존재가 되라는 말입니다. 그게 어쨌느냐고요? 딸이나 어머니에게도 아들이나 아버지와 같은 기회를 준다고 해서, 그들이 여성 특유의 아름다움과 웅장함으로 남성을 넘어서면 어쩔까 하는 걱정 말고, 대체 우리가 잃을 것이 무엇이겠습니까? 저는 말합니다. 기꺼이 그 ‘악마들’을 풀어 놓으시지요. 저 지옥은 우리에게 큰 빚이 있습니다. 대지에 그 어떤 지옥보다 혹독한 고통을 선사하는, 곧 ‘여인의 지옥’을 우리가 만들어 냈으니까요."
 POL_dancing_streets:0 "온통 넌센스 투성이의 춤추는 거리"
 POL_dancing_streets_desc:0 "인생은 누군가가 바라는 것처럼 통제될 수 있는 것이 아닙니다. 삶은 순간적이고 변덕스럽고, 본질적으로 파괴적인 것입니다. “법치”를 마치 사람이 정당화한 것 이상의 절대적인 개념처럼 떠받드는 어리석고 가치 없는 자들이 있지요. 그들은 모든 것에는 “정해진 시간”과 “정해진 장소”가 있다고 우기며, 자신들의 편협한 법칙에 따라 모든 걸 구획하려 듭니다. 코네치니 같은 멍청한 이들은 썩어 문드러진 자유주의 반동의 합법주의에 사로잡혀, 입을 모아 외치지요. “나에게 복종하라! 나처럼 되어라! 내가 시키는 대로 해!” 하지만 프롤레타리아이자 인간인 개인은 거친 생명력으로 가득 차, 제멋대로 움직이는 존재입니다. 그에게 시간과 장소 따위는 중요하지 않습니다. 그가 시간을 만들고, 그가 장소를 정하는 것이지요. 자기 자신에 대한 “자각”이라는 어리석은 환상이 깨지기만 하면, 오케스트라가 기차를 요동치게 만드는 것도 어렵지 않습니다.\n\n부르주아와 멍청이의 법률 따위는 박살 내야 합니다. 인류의 예술적 잠재력을 억누르기 위해 만들어진 말장난 클럽은 모조리 타도되어야 합니다. 그들의 ‘미적 감각’도 모조리 짓밟읍시다. “총력전!”, 법치의 규범과 그 자체에 \"총력전\"을 선포합시다. 국회를 폭파하고, 세임도 날려 버리십시오. 이미 낡아 빠진 건물들이 우리에게 무슨 소용이 있겠습니까? “평범한 보통 사람”이라는 이들도 분노하여 스스로 눈을 찢으며 울부짖겠지요. 예술가를 후원하고, 투자자를 후원하며, 건축가를 후원합시다. 그들의 앞길을 막았던 모든 것을 부수고, 완전히 하얀 캔버스를 내어 주어 마음껏 그리게 해야 합니다. 몽상가들에게 자유를 주세요. 그들이 만들어 낼 것들은 태양조차 능가할지 모릅니다."
 POL_mummies_never:0 "다시는 미라 따위는 없으리!"
 POL_mummies_never_desc:0 "시는 오직 한 번, 바로 쓰이고 완성되는 그 순간에만 생생하게 느껴지는 것입니다. “죽은 시인”들이란, 전 세계의 지식인들의 코를 괴롭히는 악취 나는 시체와 다를 바 없습니다. 셰익스피어나 와일드, 가르친스키가 이미 존재하지도 않는 세상에 대해 남긴 말들이 무슨 소용이 있겠습니까? 그 “죽은 시인들”이 과연 우리에게 어떤 유의미한 것을 주었나요? “민족의 그리스도”나 자유주의 민주주의 같은 것이라면, 누가 신경이나 쓴답니까! 프랑스의 파트롱께서는 이미 “모든 글은 돼지 배설물”이라 말씀하셨지요. 거기에 한마디 보태자면, 수 세기를 묵은 돼지 배설물은 비료로 쓰일 수 있다는 점 정도일 것입니다.\n\n저희는 바벨 성당 지하에 묻힌 모든 미라를 파내버릴 것입니다. 오직 피우수트스키만이 그곳에 묻힐 영예를 누릴 자격이 있습니다. 그의 혁명은 양자적 불멸같은 완벽한 상태에 도달했기 때문입니다. 나머지는 전부 썩어 가는 시체일 뿐이지요. 불태워 버리십시오. 큰 장작더미 위에서 태우고, 재는 비스와 강에 내다 버립시다. 유럽의 어느 강보다도 이 강은 시체를 갈망합니다. 시체들은 새로운 시대의 공기를 정화하고, 그 혐오스럽고 비위생적인 악취를 말끔히 씻어낼 것입니다. 우리야말로 다가올 존재, 그리고 새벽의 문을 여는 자입니다."
 POL_godless_inquisitor:0 "신성한 대의의 무신론적 종교재판관"
 POL_godless_inquisitor_desc:0 "“신과 혁명은 떼려야 뗄 수 없는 관계이며, 하나를 믿으면 필연적으로 다른 하나도 믿는다.” 가톨릭 애국자들은 이렇게 말하며 사나치아의 대열에 몰려듭니다. 물론 우리의 나첼니크, 펠릭스 지에르진스키께서는 이 점에 의구심을 가지시지만, 세속적 투쟁에서 ‘살아 있는 신앙’이 주는 실용적 가치 또한 잘 아십니다. 반면 로마는 그런 지혜가 전혀 없습니다. 레오 시는 예수의 혁명적 가르침을 반동적 거즈 아래 숨겨 놓고, 우리의 체제를 비난하며, 다수 신도들에게 적어도 무관심, 최악의 경우 적대감을 유발해 왔습니다.\n\n신을 해방시켜야 합니다. 신은 초라한 농가와 공장 바닥, 다시 말해 평신도 사이에서 만나야 합니다. 그것이 진정한 신의 양떼이니까요. 그리스도는 하늘과 땅을 하나로 만들라고 외쳤고, 그게 바로 우리의 과업입니다. 우리는 폴란드를 하늘나라로 만들 것입니다. 허울뿐인 ‘왕’들을 전부 끌어내리고, 오직 위에 계신 어린양께 경의를 표하며, 진정한 복음을 실현하는 공화국 말입니다. 교회는 자주 부르주아와 봉건 영주들의 충실한 사냥개 노릇을 해왔고, 그 결과 얼마나 부패했습니까. 우리의 목표는 그러한 교회를 뒤엎고, 본래 예수가 말했던 진정한 복음을 되살리는 것입니다."
 POL_servants_of_gaotu:0 "우.위.건의 종복 '우리'"
 POL_servants_of_gaotu_desc:0 "미국의 어리석은 신문들은 우리 정권을 ‘공산주의 비적떼’라고 표현하고, 부르주아 망명자들은 교회가 불탔느니 수녀원에서 성폭행이 일어났느니 하는 유령 이야기를 퍼뜨립니다. 런던의 귀부인들은 차 마시며 폴란드 “성직자”라 자칭하는 불쌍한 자들을 구제한다고 기부금을 걷습니다. 최악인 것은, 로마가 우리에게서 얼굴을 돌리고, 고위급인사인 사나치아 대원들에게 성체성사를 거부한다는 사실입니다. 그들은 우리를 신 없이 사는 무신론자 혹은 적그리스도로 규정하고, 그 어떤 정치 세력에도 뒤집어씌워지는 오점인 “부도덕”이라는 죄목까지 들이댑니다.\n\n우리는 가톨릭에만 귀속된 존재가 결코 아닙니다. 그렇다고 무신론자도 아닙니다. 우리의 혁명은 어떤 면에서 보아도 행운과 신의 가호 아래 진행되었습니다. 그리스도의 복음이 말하듯 사람들을 번영하도록 돕고, 언젠가 그 영혼이 진정한 양식을 얻을 수 있게 했습니다. 모스크바 전제군주정의 미신적 그물망 속에서도, 혁명은 황금빛 광채처럼 반짝였습니다. 사나차는 깨우침의 수호자 역할을 계속할 것이며, 그것은 단지 지식만을 파고드는 거친 물질주의가 아닙니다. 오히려 폴란드 국민에게 더 깊은 영적 각성을 불어넣는 일입니다. 이러한 비전은, 영적 계몽을 지지해 온 신비적 단체, 예컨대 일루미나티나 프리메이슨, 기타 다양한 형제단 등에서 현실화되었습니다. 그들의 외연적 진보야말로 우리가 말하는 내면의 계몽을 이룬 것입니다. 이제 혁명은, 이 \"우.주의 위.대한 건.축가\"의 뜻과 인도로, 인간의 정신과 삶의 환경을 동시에 새롭게 재편해야 할 때입니다."
 POL_o_lithuania:0 "아, 리투아니아여, 나의 조국이여…"
 POL_o_lithuania_desc:0 "엔데크(민족민주당원)들처럼 나라를 러시아에 팔아넘긴 스톨리핀의 독배를 민들이 받들었을 때, 그들이 설계한 ‘조국의 미래’도 함께 무너졌습니다. 1792년 전쟁이나 코시치우슈코의 용맹한 봉기 때처럼, 진정한 폴란드가 승리했고, 드모프스키 추종 반동파들은 반역의 낙인을 피할 수 없었습니다. 여기서 우리는 교훈을 얻었습니다. 적이 말하던 ‘단일 신앙, 단일 혈통’의 폴란드가 아니라면, 우리가 본받을 과거의 모델은 옛 폴란드-리투아니아 연방 말고 무엇이 있겠습니까?\n\n폴란드-리투아니아 제치포스폴리타는 어두운 대륙 속에서 활활 타오르는 횃불이었습니다. 30년 전쟁 이전, 그 연방은 종교적 관용을 보였고, 봉건적 야만이 둘러싼 상황에서도 계몽의 빛을 선사하며 유럽 최초의 성문 헌법과 폭넓은 계층의 참정권을 실현했습니다. 얼마나 혁명적이었던지, 무려 세 거대 제국과 원한 가득한 귀족들의 음모가 동시에 달려들어야만 그 불꽃을 꺼뜨릴 수 있었습니다. 그들이 만들어 낸 진보의 궤적이 우리에게도 이어지는 것이 아닐까요? 1792년과 1794년에 쓰러진 이들의 희생은 19세기를 거쳐 새로운 순교자들을 끊임없이 고무하지 않았습니까? 그렇습니다. 우리가 건설해야 할 폴란드는 그 연방의 유산을 법과 의식, 그리고 사고방식에서 다시 붙잡아야 합니다."
 POL_luxemburgs_memorabilia:0 "룩셈부르크가 남긴 기념물"
 POL_luxemburgs_memorabilia_desc:0 "동맹과 세력권이 뒤엉키며, 인터내셔널리즘의 약속은 점점 복잡해졌습니다. 하지만 옛 폴란드-리투아니아 왕국 내 사회민주당(SDKPiL) 시절에는 이념 분파 간 갈등이 있어도 상황이 훨씬 단순했습니다. 잠깐이지만 정말 아름다웠던 순간이 있었습니다. 바로 SDKPiL이 폴란드 사회당 좌익과 이웃 국가의 사회주의자들과 함께 나란히 행진하던 때 말입니다. 지에르진스키가 창당에 참여했던 그 조직의 반짝이는 별 중 한 명이 바로 독일의 로자 룩셈부르크였지요.\n\n세월이 흐르고 정치의 격변을 거치는 동안, 우리는 어느새 자연스러운 동지들을 잊었습니다. 폴란드와 독일은 모두 혁명 공화국으로, 서로 등을 맞대고 반동에 둘러싸여 있습니다. 우리는 엘베강에서 서로를 마주 보며 포옹해야 하지요. 게다가 야보로프스키의 이념적 자극 때문이든 지에르진스키의 사적인 감상 때문이든 간에, 우리의 푸른 사회주의는 독일식 사회주의와 불필요하게 차별화될 이유가 없습니다. 폴란드 내에서 독립 노조가 설 자리가 있을까요? 평의회나 다당제 민주주의는 어떨까요? 새로운 연방을 건설하려면, 이 모델이 어떻게 적용될 수 있는지 고민해야 합니다. 홀로는 불가능합니다."
 POL_commundards_raclawice:0 "라츠와비체의 코뮈나드"
 POL_commundards_raclawice_desc:0 "솔직히, 우리 운동이 폴란드 농민들과 역사를 통틀어 긴밀한 관계를 맺지 못했다는 데에는 여러 이유가 있습니다. 정치 교육의 부족, 전통적 사회 질서를 고수하려는 성향 등등 끝도 없지요. 하지만 이 간극이 영원히 넘지 못할 심연이라는 법은 없습니다. 코시치우슈코가 라츠와비체에서 ‘자유’와 ‘조국’을 외치며 낫을 든 농민들과 함께 돌진했을 때, 그들은 과연 전부 반동의 화신이었을까요? 아니면, 어쩌면 우리의 대의가 표방하는 바로 그 대중의 일부였을까요?\n\n그래서 우리는 폴란드 인민당 쪽으로 눈을 돌려 봅니다. 예전에 엔데크(민족 민주당원)이였고, 사제직을 박탈당했던 에우게니우시 오콘은 여러모로 다채로운 이력을 지녔지만, 그는 최소한 우리가 그렇듯 귀족 계층을 증오해 왔습니다. 그를 ‘농민의 대변자’로 삼기 위해 우리가 제시해야 할 대가는 그리 크지 않을지도 모릅니다. 철저한 토지 개혁, 농촌 투자와 전기 보급, 그리고 약간의 관료직 정도를 보장해 준다면, 우리는 우리의 새로운 낫의 부대 코시니에지를 얻게 될 것입니다."
 POL_comrades_czestochowa:0 "쳉스토호바 여성 동지들"
 POL_comrades_czestochowa_desc:0 "보통 사람들과 나란히 나첼니크께서는 검소한 차림을 하고, 시골에서 도시로 이어지는 길을 걸어 쳉스토호바로 가셔야 합니다. 그곳 야스나 구라 수도원 안, 성모 마리아의 성화 아래에서 기도를 올릴 것입니다. 이 모든 연출은 카노사에서의 굴욕 혹은 만사 무사의 성지 순례처럼 완벽히 기획되고 조정되어야 합니다. 특히 교황청을 겨냥해야 하니, 이 사건 이전에 교회를 공격하는 모든 전단, 신문 기사, 책들은 전부 회수하십시오. 모든 반성직 운동도 잠시 멈춰야 합니다.\n\n독일은 혁명 후 로마와 협정을 맺을 수 있었고, 사민당은 사나차 만큼 반성직적이었던 적이 없었음에도, 그 “붉은 협약”는 교황청의 반동 세력에게 오늘날 우리가 겪고 있는 것 못지않게 비난받았습니다. 이런 상황을 개선하기 위해, 다양한 프롤레타리아 신부들과 접촉해 이들에게 국가의 교회 정책을 보조하도록 유도해야 합니다. 물론 우리의 공화국은 종교에 휘둘리지 않을 것입니다(이 간극은 절대로 넘어서도 안 됩니다). 다만 그들이 우리 정책에 도덕적 세계관을 제공하게끔 보조 역할을 맡길 뿐이지요. 레오 시는 이러한 정직한 태도와 공손한 대외 행보를 아마 높이 평가해 줄 것입니다."
 POL_dembowski_vampire:0 "흡혈귀 뎀보프스키"
 POL_dembowski_vampire_desc:0 "망치를 들고 사색하는 철학자도 있지만, 폴란드를 혁명적으로 뒤바꾸려면 세심한 손길이 필요합니다. 신생 사나차는 1918년 그다지 달갑지 않은 동맹을 맺었고, 우리는 그 잔재들과 함께 살아가야 합니다. 바로 슐라흐타, 폴란드의 귀족 계층이지요. 그들은 아직도 국가와 경제 곳곳에 뿌리를 두고 있습니다.\n\n아, 물론 우리 모두 '집산적'으로 소총의 방아쇠를 당기고픈 마음이 꿈틀대는 건 사실입니다. 하지만 다시금 과거 독립투사들의 발자취가 떠오르는군요. 에드바르트 뎀보프스키는 귀족 출신이었지만, 크라쿠프에서 계급 없는 사회를 세우겠다는 열정이 누구보다 뜨거웠습니다. 모든 슐라흐타가 사회주의에 진심으로 귀의할 리는 없겠지만, 그중에는 충성스러운 자들이 존재할 수도 있습니다.\n\n그러니 그들에게 칭호를 그대로 두도록 합시다. 그들이 고전주의로 우리의 사회주의 예술을 물들일 수 있게끔 허락합시다. 샴페인과 초콜릿이 넘치는 공장에서 노동하게 하십시오. 붉은 풍요가 보장된다면, 그들도 결국 특정 특권을 잃더라도 우리에게 도움이 되는 후원자가 되어 줄 것입니다."
 POL_pankracy_vindicated:0 "판크라치의 오명 벗기기"
 POL_pankracy_vindicated_desc:0 "우리 나라 위에는 종교의 빛이 부드럽게 비치고, 폴란드 아이들은 기독교 교리를 미츠키에비치의 시와 마르크스의 경제학을 함께 암송합니다. 혁명 사나차는 국가를 점점 더 극적인 변신으로 이끌고 있습니다. 그런데도, 우리의 지에르진스키께서는 속으로는 세속주의에 대한 확고한 신념과 동시에 방탕함에 정진하시면서 교회의 자선을 칭송하고, 부하들은 신부들과 함께 공개 석상에 서기를 주저하지 않습니다. 강철과 콘크리트로 건설되는 새로운 미학의 흔적이 남아 있지만, 한편으로는 ‘폴란드적 정체성’을 추억하는 물결에 잠기고 있기도 하지요.\n\n민족에 대한 사랑은 가장 위대한 사랑이며, 그 열정이 사람을 참호로 내몰고 화폭으로 이끌며, 종교적 황홀감은 그 열정에 형식과 도덕, 깊이를 부여합니다. 새롭게 태어나는 폴란드는 예언자들을 이끌어 온 영적 충동을 버리지 않습니다. 오히려 그것을 입증하고자 합니다. 바르샤바는 새 예루살렘이며, 우리의 공화국은 어린양의 통치가 실현되는 시대, 프로메테우스주의 동맹이 가장 낮았던 이를 가장 먼저 높이는 실현체가 될 것입니다. 비록 우리 총독께서 개인적으로 어떤 분이든, 그분은 이제 철저히 새로운 형태의 공화주의, 기독교, 계몽적 사랑의 의인화가 되어, 폴란드인들에게 다가올 세대까지 힘과 번영을 선물하게 될 것입니다."
 POL_we_love_and_you:0 "우리는 사랑합니다. 그대는요?"
 POL_we_love_and_you_desc:0 "피우수트스키께서 차르의 군대에 맞서 군단을 이끌었을 때, 무엇이 그의 길을 인도했습니까? 왜 그분은 새로 탄생한 공화국에서 독재적 권력을 쥐셨을까요? 사랑, 지에르진스키께서는 말씀하십니다. 조국에 대한 무한한 사랑, 살아 숨 쉬는 인류에 대한 사랑, 그리고 그 사회주의적 미래에 대한 사랑이 없었다면, 그가 그토록 위대한 높이에 이를 수 있었겠습니까? 하지만 피우수트스키께서 지나치게 관대하셨던 탓인지, 연합회복권의 많은 이들이 사나치아를 탄생시킨 그 ‘숭고한 대의’를 잊어버렸습니다. 대령, 기술관료, 관료, 정치인 할 것 없이, 폴란드가 기초를 둔 것은 ‘혁명의 뜨거운 열정’이라는 사실을 모두 망각했습니다. 물론 이러한 망각이 아직은 용서받을 수 있으나, 피우수트스키의 길 잃은 아들들이 과연 그 옛 지도자 못지않게 혁명을 사랑하고 있음을 증명해 보인다면 말입니다.\n\n우리가 가진 사랑은, 그것을 공유하지 않으려는 자들에 대해 냉혹한 증오로 바뀔 것입니다. ‘진정한 사나치아’의 의미를 배신하려는 자들에게, 부르주아 민주주의로 돌아가고자 하거나, 자본의 세력에 폴란드를 다시 팔아넘기려 하거나, 국제 혁명의 선봉이 아닌 동방적 전제적인 패권만을 꿈꾸는 자들에게 경고합니다. 우리 사랑이 머지않아 여러분을 찾아갈 것입니다!"
 POL_sorelian_beast:0 "소렐리안 야수들을 처단하기 위해"
 POL_sorelian_beast_desc:0 "노조는 우리에게 가장 위험한 적입니다. 그들은 노동계급을 대변한다고 주장하면서도, 스스로를 거대한 쇠똥구리처럼 위선의 분뇨 더미 위에 앉아 있습니다. “우리는 노조를 파괴하고 ‘캅카스화’로 폴란드를 만들 것이다!”라고 고래고래 소리치지만, 실상 그들의 부패한 선동은 폴란드 프롤레타리아의 연대와 선의를 훼손하므로 결코 좌시할 수 없습니다.\n\n그들의 이념은 시대착오적입니다. 생디칼리즘과 어설픈 “푸른 사회주의” 개념이 뒤섞인 모습을 보이지만, 실제로 노동자를 고양하는 데 기여한 바가 매우 적으며, 그들에게 진정한 계급 의식이나 생산적 잠재력을 일깨워 준 적도 없습니다. 우리는 교육을 통해 그들을 무너뜨려야 합니다. 이미 그들 내부에는 역사의 부름에 응해 동료 노동자들에게 우리 메시지를 전하는 진정성 있는 혁명가들이 있습니다. 이들 덕분에 여러 방해 공작이 무산되었고, 우리의 상대가 준비하는 대규모 시위나 집회 역시 충분한 인원이 우리 편에 선다면 비슷하게 저지할 수 있을 것입니다."
 POL_velvet_rope:0 "벨벳 로프에 목메여"
 POL_velvet_rope_desc:0 "피우수트스키 집권기에는 적절한 폭력이 혁명을 지탱했습니다. 비밀경찰은 반혁명 세력이나 음모가 활개 치기 전에 미리 저지했고, 이는 1926년 같은 사건에서도 볼 수 있듯 성공적으로 기능했습니다. 하지만 이제 우리의 적은 국가 내부로 들어왔으며, 교회나 민족주의 깡패가 아니라 장군이나 사나치아 지도층과 연계되어 있어 훨씬 더 교묘하고 뿌리 뽑기 어렵습니다. 이런 “동지”를 자처하는 자들에게는 옛날식 직설적 방식이 통하지 않을 것입니다. 그렇기에 우리는 재교육, 재배치, 제거에 이르는 철저한 방안을 마련해, 우리의 이상에 맞춰 국가를 조각해야 합니다.\n\n또한 외부 위협에도 대응하기 위해 적극성을 유지해야 합니다. 현재 살롱에서는 그저 이론적 담론만이 난무하지만, 우리는 고매한 지식 언어로 위장을 한 반역자들에게 그 속뜻을 꿰뚫고 있음을 분명히 해야 합니다. 해외에 있거나 잠잠해 보이는 반동주의자라 해도, 폴란드 국가는 혁명을 지키기 위해 어떠한 희생도 마다하지 않을 것이며, 그들의 생각이 아무리 애국심을 둘러싼 가면을 쓰고 있어도 용납되지 않을 것이라는 사실을 깨닫도록 해야 합니다. 우리는 무차별 처형이나 실종을 일으키고자 함이 아니라, 교육하고 고양하며, 필요하다면 최소화·격리하는 쪽을 지향합니다."
 POL_psalms_war:0 "전쟁과 파괴의 시편"
 POL_psalms_war_desc:0 "유럽의 헌병이라 불리던 러시아, 메테르니히의 지휘봉이자 저속한 코자치 무리의 소굴이던 그들은 이제 흔들리고 있습니다. 대전쟁과 그 이후의 혁명 물결로 한때 거의 무너질 뻔했던 차르의 제국은 꾸역꾸역 생존했지만, 동란 시기 이후로 가장 취약한 상태입니다. 바르샤바는 모스크바를 대체해야 하지만, 이 운명을 그저 폴란드 국가의 안전 보장이나 ‘무스크비의 자리를 꿰차는 것’ 정도로만 해석하는 시각은 너무나 근시안적입니다.\n\n진정한 의미에서 폴란드는 프로메테우스처럼, 모스크바 지배하에 짓눌리고 무지에 빠진 이들에게 사회주의의 빛을 전해야 합니다. 우리는 단순히 우리 영토를 넓히거나 국민 국가만을 확대하는 데 그칠 것이 아니라, 프롤레타리아 혁명을 전파하고 프롤레타리아 문화를 활성화해야 합니다. 폴란드 노동자는 동쪽 형제들이 지닌 독특한 사슬을 끊어내야 할 독특한 책임을 지니고 있습니다."
 POL_machine_flame:0 "기계, 군중, 그리고 거대한 불길"
 POL_machine_flame_desc:0 "우리 폴란드 경제는 혁명의 실패한 약속들 때문에 여러 병폐를 겪고 있습니다. 자본가들은 여전히 존재하며, 형식적으로는 당원이라는 이름을 달고 있지만 프롤레타리아를 무자비하게 착취하고 있습니다. 국가 소유 기업들 또한 상상력 없는 기술관료들이 장악하여, 노동자를 그저 숫자와 산출물로만 취급합니다. 농촌에서는 토지 개혁 이후 협동 조합적 경제 체제를 적극 장려하지 않아 심각한 비효율이 남아 있습니다. 정부를 더는 진정한 진보의 수단이 아니라 ‘가끔씩 먹을꺼를 나눠주는 이들’ 정도로 여기는 대중의 사기는 저하되었습니다.\n\n따라서 우리는 경제를 재구성해야 합니다. 농업을 완전 기계화하고, 농민 토지를 국가 보조금과 간부 조직을 통해 집단화하도록 유도해야 합니다. 기계화가 완료된 뒤에는 노동집약적인 농촌 지역에서 인구가 도시로 대거 이동할 것이며, 이는 새로운 문제도 야기하겠지만, 동시에 프롤레타리아화가 빠르게 확산될 것입니다. 산업은 대규모 확장을 앞두고 있고, 그만큼 노동력이 필요합니다. 이러한 과정이 자연스럽게 이뤄지기만을 기다려서는 안 됩니다. 정부가 의도적으로 지원 및 촉진해야 합니다. 도시화 정책은 국가의 방침이 되어야 합니다. 도시화가 진전될수록 인민은 더 집중되고 공통된 사회주의 문화를 접하게 되며, 프롤레타리아로서 더 강한 연대와 힘을 발휘하게 될 것입니다. 그들의 요구가 경제에 더욱 직접적으로 반영될 테니 말입니다. 불길처럼 프롤레타리아가 번지고, 공산화를 방해하는 모든 것을 불태울 것입니다."
 POL_economy_mercy:0 "무자비한 자비의 경제"
 POL_economy_mercy_desc:0 "폴란드 노동자들은 이념적으로 부적합한 노동조합 체제에서 오랫동안 고통받아 왔습니다. 지금까지 일터에서 외치던 “사회주의”는 작업장 내에서 노동자들이 생산 수단을 진정으로 통제할 수 있으리라는 희망 없이, 그저 자본가를 위해 일하도록 유혹하는 사이렌 소리에 불과했습니다. 이것은 후퇴적 부르주아 체제를 사회주의 외피로 포장한 것일 뿐이었고, 생산력을 충분히 해방시키지도 못했습니다. 수많은 무능과 비효율이 새로운 시설, 노동자, 노조 사무실이 생길 때마다 더욱 커져 갔습니다.\n\n이제 이 썩은 체제를 기필코 끝내야 합니다. 우선, 푸른 사회주의 계열 노조를 모두 표준 공장 경영 구조로 통합해야 합니다. 역량 있고 충성스러운 인물만이 이를 관리하도록 해야 합니다. 부르주아식 경영주의를 거짓이라며 비판한다고 해서, 유능한 관리나 지혜로운 지도력까지 폐기할 수는 없습니다. 새 노조는 이 둘을 함양하도록 만들어야 합니다."
 POL_hot_steel:0 "뜨거운 강철, 뜨거운 정신, 뜨거운 가슴"
 POL_hot_steel_desc:0 "밀 농사가 시들어 버리는 척박한 땅, 모스크바 자본가들이 눈길조차 주지 않았던 지역, 사나치아의 타락시기로 호색한 관료들이 전혀 상상도 못 했던 곳, 그런 곳에 바로 엄청난 부가 잠재해 있습니다. 우리가 아직 다 활용하지 못했을 뿐, 폴란드는 강철과 석탄, 가스 산업에서 자급자족이 가능할 만큼 막대한 잠재력을 지니고 있습니다. 미국이 야생 시추꾼들의 광기에 의존했다면, 우리는 체계적이고 과학적인 방식으로 우리의 땅을 뒤져 검은 황금을 찾아낼 것입니다. 다 캔 줄 알았던 광맥을 다시 뚫어 석탄을 찾고, 철광 역시 대폭 확장해, 신기술을 통해 더 많은 양을 채굴할 수 있도록 해야 합니다.\n\n이러한 확장을 통해, 늘어나는 프롤레타리아에게 안정적이고 생산적인 고용 기회를 줄 수 있을 것입니다. 단순한 명목상 일자리가 아니라 실질적인 직업을 전 국민이 누릴 수 있게 될 것입니다. 폴란드가 반동으로 뒤덮인 바다 위에서 진보의 등대가 되려면, 생산력 면에서도 자급자족을 이뤄야 합니다."
 POL_give_them:0 "그들에게 빵과 케이크를!"
 POL_give_them_desc:0 "산업은 인간 창조물의 정점입니다. 그러나 그 창조물이 인간을 노예로 만드는 매개가 된다면, 그것은 인류의 수치가 아닐 수 없습니다. 노예 상태는 그런대로 그렇다 쳐도, 만약 노동이 노동자에게 전혀 이익이 되지 않는다면 어떻겠습니까? 의지의 소외는 곧 노동으로부터의 소외와 맞물립니다. 그렇다면 혁명이란 결국 노동자를 거대 국가사업에 동원하는 것에 그치고, 그들의 실제 생활에는 별 영향을 미치지 못한다면, 그게 무슨 소용이겠습니까?\n\n폴란드는 콘크리트와 철강 시설뿐 아니라, 삶의 향신료가 될 수 있는 다양한 생산물도 풍부히 만들어낼 역량이 있습니다. 공장에서 주스나 과자 등을 생산하면서 동시에 기계나 자동차 부품도 생산할 수 있어야 합니다. 폴란드는 유럽의 장난감, 포장 과자, 아기자기한 소품·기념품을 만들어 내는 근원이 될 수 있습니다. 즉, 세계 시장에서 폴란드라는 국가는, 현재 외국의 최고 부르주아나 사치스러운 귀족들만 누리는 작은 사치와 기쁨을 상품으로 제공하는 나라가 될 수 있다는 것입니다. 이러한 사치품 생산을 통해 우리는 필요한 외화를 벌어들여 우리의 대규모 계획과 사업에 재투자할 수 있게 됩니다. 프랑스나 영국 부르주아들의 주머니에서 뽑아낸 자금으로, 폴란드 노동자들은 유토피아를 건설할 수 있을 것입니다."
 POL_tektologics_soul:0 "영혼의 테크톨로지"
 POL_tektologics_soul_desc:0 "컴퓨터 기술을 두고 많은 이들은 아직 너무 복잡하고 비싸며, 불안정성이 커서 우리가 손대기 어렵다고 말합니다. 그러나 우리는 그런 걱정을 무시하고 영국·프랑스의 가장 야심 찬 과학자들보다도 더 멀리 나아가야 합니다. 전문가들은 컴퓨터가 가져올 행정적 편의를 보고 흥분을 감추지 못하고 있으며, 조금만 살펴봐도 정보 공유의 막대한 잠재력을 알 수 있습니다.\n\n더 나아가, 컴퓨터는 대규모 인원을 관찰하고 관리할 수 있게 해 줍니다. 과거라면 수백 명의 연구자가 완벽하게 호흡을 맞춰야 가능했을 일이, 이제는 한 방 가득 놓인 기계만으로도 충분해집니다. 우리는 마침내 평범한 노동자의 정신 깊숙이 들어가, 무엇이 그를 움직이는지, 어떤 심리적 자극이 그를 노동으로 이끄는지, 작업 환경을 어떻게 설계해야 능률을 높일 수 있는지를 알 수 있게 될 것입니다."
 POL_militarise_city:0 "도시의 군사화, 군대의 산업화"
 POL_militarise_city_desc:0 "우리는 기계의 시대에 살고 있습니다. 만약 우리가 기병이나 구식 무기, 고장 잘 나는 비행기에 의존한다면, 현대의 강철 괴물들에게 가로막혀 뒤로 나가떨어지게 될 것입니다. 적응하기 위해서는 도시가 곧 강철 요새가 되어야 합니다. 불길로 만들어진 사냥개와 송골매를, 즉 우리의 새 군대를 길러낼 수 있어야 합니다. 이들은 반동과 제국주의를 어디서든 뿌리 뽑을 수 있는 위력을 지닐 것입니다!"
 POL_make_creativity_kill:0 "창의적으로 죽여라"
 POL_make_creativity_kill_desc:0 "눈길을 끌지 않는 대학 깊은 곳에서는, 볼품없는 연구자들이 불투명한 물질이 든 바이알을 교환합니다. 이는 모스크바인들에게 주는 또 다른 ‘선물’입니다. 과학은 오래전부터 사람을 죽여 왔습니다. 실험 과정에서 위험 물질을 다루다 발생한 우발적 사고로, 그리고 최근 전쟁을 통해서도 그렇지요. 우리는 이보다 더 앞서 가야 합니다. 머지않아 벌어질 마지막 인류 대결전에서, 거대한 신형 차량·탄환·총기, 그리고 가스와 독극물 등, 현대전이 공포스러운 모든 요소를 꼭 활용해야 합니다. 현대 과학이 열어 준 가능성은 이전 대전에서 상상도 못 했던 수준입니다. 도시를 거대한 무덤으로, 정원을 사막으로 만들고, 한 국가 전체에 죽음의 그림자를 드리울 수도 있습니다.\n\n폴란드는 과학 연구의 중심지이기도 합니다. 사나차 정권의 잘못된 점이 많았어도, 지식의 꽃이 피어날 수 있는 지적 문화를 조성했으며, 자유로운 지원이든 엄격한 제한이든 간에 그 문화는 우리 공화국에 대체로 충성해 왔습니다. 윤리적 문제를 제기하는 과학자도 있겠지만, 더 많은 이들은 공화국과 혁명을 위해서라면 무엇이든 불사하겠다는 태도를 보일 것입니다."
 POL_cash_degeneracy:0 "퇴폐의 상품화"
 POL_cash_degeneracy_desc:0 "감각을 추구하는 것, 이보다 더 숭고한 원정이 있을까요? 여유와 권력을 가진 사람이 ‘자신보다 낮은 계층의 삶을 체험해 보고 싶어 한다’는 발상은, 어떤 의미로 귀족적 사회주의 와 맥이 닿아 있습니다. 그런데 왜 이런 쾌락을 런던 상속자나 파리의 딜레탕트들에게만 허용해야 하겠습니까? 노동자에게는 왜 안 됩니까? 그들이 돈이나 교육이 부족해 누리지 못한다면, 그것을 제공해 주면 될 문제입니다. 인테르마리움 노동자들이 마음껏 도박하고, 쾌락을 누리고, 이전에 전혀 경험해 보지 못한 방식으로 진정한 삶을 만끽할 수 있도록 해 줍시다.\n\n크라쿠프에는 카지노를, 루블린에는 포르노 극장을, 르부프에는 아편 소굴을 지어서 고대 바빌론의 사원보다 더 찬란한 죄악의 신전을 세워 봅시다. 결국 ‘죄’라는 것도 환상에 불과합니다. ‘나쁜 결과’만 나오지 않으면 되는 것이고, 우리는 그런 부정적 결과를 이 공간 안에서 최소화할 방안을 마련해 두면 그만입니다. 의사들을 대기시키고, 각종 질병과 광기가 발생하면 바로바로 치료하게 하면 됩니다. 그리고 파리, 마드리드, 부다페스트, 베얼린, 런던 곳곳에 전단을 뿌려 “바르샤바에서 당신이 누릴 수 있는 환락은 상상이상”이라는 점을 알리십시오. “퇴폐의 수도”라 불릴 것입니다. 하지만 실상은 새로운 감각의 개척지로, 그 크고 작은 모든 가능성이 열리는 곳이 될 것입니다."
 POL_climaxes_nation:0 "국가를 위한 절정"
 POL_climaxes_nation_desc:0 "과거에 통용된 억압적 성 윤리는 봉건제, 그리고 그 이후의 자본주의 사회를 떠받치는 역할을 했습니다. 남녀의 긴밀한 경제적 결합은 농가를 경영하거나, 혹은 노동자 가정을 유지하는 수단이었을 뿐입니다. 저희가 도덕주의자도, 이상주의자도 아니므로 그 기반에 놓인 노골적 폭력성을 모른 체하지는 않습니다만, 이것이 사회주의 사회에서도 반드시 유지되어야 할 필연은 아닙니다.\n\n사회주의자는 곧 과학자이며, 과학자는 실험과 관찰을 중시합니다. 그렇다면 왜 전 사회 차원에서 성 혁명을 일으키고, 완전히 새로운 성 현실을 실험해 보지 못하겠습니까? 이 실험을 위해서는 유전적 통제도 고려해 봐야 합니다. 새로운 사회주의 인간은 강인하고, 지적이며, 아름다워야 합니다. 추함과 탐욕, 위선적 순결, 기타 낡은 감정은 배제해야 합니다! 노동자가 자기 몸을 두려워하도록 만들었던 과거의 규율은 박살 내고, 새로운 건강 기준을 세워야 합니다. 물론 욕망은 자칫 인간을 타락시킬 수도 있음을 알려 주어, 그것에 예속되지 않도록 주의시키는 것도 필요합니다."
 POL_factory_bedrooms:0 "침실마다 들어서는 공장 도시"
 POL_factory_bedrooms_desc:0 "마르크스는 “아침엔 사냥, 오후엔 낚시, 저녁엔 가축을 키우고, 식사 뒤에는 비평을 하되, 결코 사냥꾼이나 어부, 목동, 비평가가 되지 않는다.”라고 말했습니다. 참으로 통찰력 있으며, 감동적이지 않습니까? 그리운 서류와 명령, 지시문에 파묻혀 살던 옛 관료, 기술자, 행정가들은 이 단순한 진리를 잊어버렸던 것입니다. 그들은 오직 “일해라! 죽을 때까지! 소시지를 위해서, 오래 일하라!”만 외쳤습니다. 지루하고 반복적인 노동에 묶여 있었기에, 그게 유일한 길인 줄로 알았지만, 이제 우리는 새로운 길을 압니다.\n\n노동은 필수적이며, 인간의 목적은 결국 노동하는 것입니다. 그러나 노동이 지긋지긋할 필요는 없습니다. 노동자에게 여러 가지 과제를 부여하고, 이를 효율적으로 기획·배분하며, 노동자가 자신의 노력에 대한 보상을 크게 얻고, 그 결실이 가족과 공동체에게도 도움이 되는 것을 눈으로 확인할 수 있다면, 그는 비로소 자유를 느낄 것입니다. 노동자가 노동자이되, 한 가지 일에만 매달리지 않을 수 있고, 여가도 충분히 주어진다면 그는 참된 자유인입니다. 이것이 바로 우리가 추구해야 할 목표이며, 그 목표가 미래를 향해 가는 동력입니다."
 POL_4_15_inf:0 "4 × 15 × 무한대"
 POL_4_15_inf_desc:0 "             혁명은 이제 단순한 투자만으로 이룰 수 있는 단계를 지나섰습니다."
 POL_electric_eye:0 "모든 정신 속의 전기 눈"
 POL_electric_eye_desc:0 "방송을 통해 한 국가와 계급의 집단의식이 형상화됩니다. 변덕스럽고 답답하며 제약이 많은 “문자”는 버리고, \"말\"로 가야 합니다. 말은 인류가 동굴을 벗어나 농경과 문명을 시작할 때 힘과 지혜를 얻게 해 준 바로 그 수단입니다. 머릿속 이미지도 뛰어넘어, 모든 사람이 공유할 수 있는 화면으로 나아가야 합니다!\n\n라디오, 그리고 아직은 생소한 “텔레비전”이야말로 미래 미디어의 핵심이며, 전 세계 프롤레타리아 문화에 목소리와 선명함을 부여할 수 있는 수단입니다. 대중은 스포츠 경기 중계, 새로운 미래주의 시 낭독, 드라마 청취, 사나치아의 최신 프로젝트 소식을 동시에 즐길 수 있게 됩니다. 우리는 모든 노동자 가정에 라디오를 보급하고, 공공장소에 텔레비전을 설치해야 합니다. 물론 이를 위해서는 막대한 산업력과 전문 지식이 필요하고, 많은 프롤레타리아가 자신들의 교육과 오락을 위한 도구를 직접 만들어 내는 역할을 맡게 될 것입니다."
 POL_flying_trams:0 "하늘을 나는 전차, 열차 그리고 자동차"
 POL_flying_trams_desc:0 "마치 침략군단을 실어 나르는 전차처럼, 교통수단의 맹렬한 발전은 새로운 시대를 예고합니다. 새로운 소비재, 기계, 식료품, 기타 생활물자를 한가득 실어나르는 거대한 철도 차고에서든, 아직은 부유층만이 애인과 함께 드라이브를 즐길 수 있는 자동차 주차장에서든, 우리는 멈추지 않는 속도를 느낄 수 있습니다.\n\n도로와 철도가 연결해 줄 곳은 결국 대도시일 것입니다. 미래 인류는 화려한 도시 요새, 풍요로운 혁신의 요새가 아닌 어딜 가고 싶어 하겠습니까? 이제 “공화국의 목가적인 농촌”을 찬양하는 시는 그만 포기합시다. 농촌을 대대적으로 개조해, 현대성에 편입해야 합니다! 철도는 혈관처럼, 도로는 모세혈관처럼 나라를 구석구석 누비도록 만들어야 합니다. 우리의 모든 도시는 하나로 연결되어야 하고, 국경 너머까지도 이어져야 합니다. 크이우에서의 낮 외출이 당일치기로 가능하고, 민스크에서의 하룻밤 여행이 사소한 일이 되게 만들자는 것입니다! 이 거대한 과업에 청년 노동자들을 투입해, 그들이 자신들 후손의 즐거움을 위한 기반을 건설하게 해야 합니다. 바르샤바는 디트로이트나 파리, 코번트리보다도 더 많은 자동차를 생산하게 될 것입니다! 우리의 도로와 철도가 전 세계인의 부러움이 되게 만들어야 합니다!"
 POL_noble_spirit:0 "혈통이 아닌 정신의 귀족"
 POL_noble_spirit_desc:0 "인류 발전에 헌신하고 미래를 내다보는 비전을 갖춘 자만이 진정한 귀족이 되어야 합니다. 구 연방 시절 귀족 궁정에 매달려 있던 자들은 바르샤바가 한참 동안이나 부패의 늪에 빠진 뒤에도, 심지어 우리 조국의 핵심부가 타국의 기를 달고 있을 때조차 남아 있었습니다. 그중 다수는 폴란드 해방과 진보적 개혁을 위해 헌신했으나, 더 많은 이들은 기생충처럼 살아가며 진보를 방해하고, 모스크바 전제주의에 고개를 숙였습니다.\n\n문제를 해결하려면 무조건 죽여야 한다고 생각하는 것은 야만인과 러시아인의 사고방식입니다. 귀족이 오만한 장애물이 되는 가장 큰 원인은 그들이 지닌 토지입니다. 국가의 이름으로 그들의 영지를 몰수하여 협동조합으로 전환하는 편이 최선일 것입니다. 이들 귀족에게는 여느 폴란드인보다 더 강력하게 ‘도시로 이주하라’는 권고를 해야 합니다. 탁월한 역량과 학식을 가진 귀족은 보상받되, 부정적 습관은 강도 높은 재교육과 충성심 검증을 통해 제거해야 합니다. 젊고 활기찬 사나치아주의자들이 그들의 새 거처에 함께 살 수도 있을 것입니다. 혹은 그들의 자녀들을 여름 캠프에 보내 마르크스와 피우수트스키를 배우도록 할 수도 있지요. 가능한 방법은 무궁무진하며, 어차피 그들에게는 시간이 많습니다."
 POL_central_planning:0 "영원까지 내다보는 중앙계획"
 POL_central_planning_desc:0 "한밤중, 서명 하나로 폴란드 역사 속 자본주의 단계가 끝나게 될 것입니다. 이미 정부와 결합된 대기업들과 후미진 지역의 자잘한 업체들이 마침내 국유화 수순을 밟게 됩니다. 아침이 밝으면 농민과 노동자들은 행정기관에 배치된 사나차 담당자들을 마주하게 될 것이며, 이들은 협동조합에 대한 국가 감독이 원활히 이행되도록 도울 것입니다. 대학들은 교육 과정을 단축하고, 각 부처는 신속하게 인력을 충원할 계획을 발표하겠지요.\n\n물론 공산주의는 어느날 아침 한 번에 완성되는 것이 아닙니다. 로마가 하루아침에 건설되지 않았듯이, 이것은 경제적 총체주의의 배아 단계에 불과합니다. 이런 토대 위에서 우리는 더욱 정련하고, 절제하며, 더 높은 곳으로 계속 쌓아 올릴 것입니다. 필요하다면 무엇이든 실행할 겁니다. 행정은 불필요한 경쟁에 발목을 잡히지 않을 것이며, 사리사욕을 챙기는 관료의 지시에 묶이지도 않을 것입니다. 바르샤바에서 생산 속도를 결정하면, 교향곡처럼 모든 부문이 함께 맞춰 갈 것입니다.\n\n우리는 공산주의를 조각하되, 그 형태와 생명력을 동시에 아름답게 살려 내야 합니다."
 POL_pan_revolution:0 "범 인테르마리움 혁명"
 POL_pan_revolution_desc:0 "작년 크이우에서 악몽 같은 일이 일어날 뻔했습니다. 미흐노브스키와 같은 국수주의자들은 어리석은 자들이었고, 이들은 우크라이나를 외톨이로 몰아넣어 결국 러시아 곰이 예전의 훈족처럼 그 황금 평야를 덮칠 때 속수무책이 되게 했을 것입니다. 그는 분명 마지막 숨을 거두는 순간에도 폴란드가 고집을 부렸다고 욕했겠지만, 정작 자기 목은 성 볼로디미르 성문에 걸렸겠지요. 오늘날에도 이런 편협한 민족주의자가 인테르마리움 곳곳을 돌아다니며 “폴란드 압제”라고 운운하는 음침한 말을 퍼뜨립니다. 그렇다면 차라리 그들의 공포를 현실로 만들어 주는 편이 낫지 않을까요? 어차피 우리 동맹이 굳건해져야 프로메테이우스주의의 꿈이 실현되며, 그런 식으로 정치적 유대를 강화하는 것 말고는 방법이 없으니까요.\n\n수단은 간단합니다. 인테르마리움 전역에 철도를 연결해 깔고, 폴란드 대학교를 연구와 학문의 중심지로 삼아, 다른 지역 대학들은 이에 종속되도록 해야 합니다. 폴란드 전문 인력을 동맹국으로 적극 파견하도록 유도하고, 최소한 도시 인구 중 5%는 폴란드인이 되게 하며, 전문직 중 10%는 폴란드인이 맡도록 해야 합니다. 동시에 우리는 폴란드 민족주의적 팽창을 추구해서는 안 됩니다. 오히려 벨라루스인, 우크라이나인, 리투아니아인, 유대인을 그들 모국보다 더 우대하고 존중해야 합니다."
 POL_love_regime:0 "사랑의 정권의 도래"
 POL_love_regime_desc:0 "폴란드에는 사회주의 정신이 깃들었습니다. 생산적 요소들은 결집되었고, 산업은 생존 수준을 넘어 성장했으며, 프롤레타리아는 최대·최강 계급이 되었고, 당은 러시아를 몰아내던 시절 이후로 가장 높은 정치 의식을 갖게 되었습니다. 이제야 비로소 우리 당은 스스로를 진보적 세력이라 당당히 선포할 수 있게 되었습니다.\n\n연합회복권은 과거처럼 모든 진보 계층을 포괄하던 느슨한 조직에서, 오직 순수한 프롤레타리아 정당으로 거듭나야 합니다. 사상뿐 아니라 형태에서도 혁명적이어야 하며, 단순히 근대화에 이르는 발전이 아니라 그것을 넘어서는 ‘진보’를 지향해야 합니다. 무엇보다 우리는 사랑을 지키고 실천해야 합니다. 인류에 대한 사랑, 무지와 궁핍에서 해방시켜 줄 혁명에 대한 사랑 말입니다. 무한한 자비를 몸소 보이셨던 작고하신 원수 피우수트스키의 본보기에 따르며, 그 역시 마르크스의 끝없이 인도적인 사상에 영감을 받아 과감히 행동했고, 우리 또한 이 시대의 기회를 잡아 현 체제를 뒤엎어야 할 것입니다."
 POL_ball_damned:0 "저주받은 자들의 축구"
 POL_ball_damned_desc:0 "한때 유럽의 면전에 날리던 대담한 일갈이었던 것도, 어느새 어제의 뉴스로 전락할 위험이 있습니다. 공화국을 세울 때 맺어진 타협이 폴란드 정치 발전의 최종 결과물이라고 가정한다면, 이는 크나큰 착각입니다. 이제 사나차는 더 이상 부드러운 손길로 모양을 바꿀 수 있는 찰흙이 아닙니다. 이미 굳어 버린 점토 덩어리 같은 국가 체제를 부수고, 새 형태로 재결합해야 합니다. 먼저는 경험 많은 폭탄 투척수들이 필요하겠지요.\n\n이를 위해 우리는 사나치아 연합에 속하지 않았던 이들, 즉 피우수트스키의 ‘혁명적 투철성 부족’을 두고 비판했던 이들에게 주목해야 합니다. 멀리 갈 것도 없습니다. 미래주의자, 기성 질서에 물든 가톨릭 문화에 비판적인 이들, 스카만드리치라는 독특한 좌파 사회주의자들 등이 새 폴란드를 위한 신문화 프로그램을 주도할 준비를 갖추고 있습니다. 왜 이 나라 아방가르드는 피우메나 캅카스, 프랑스만 바라보며 첨단을 유지해야 할까요? 우리가 조금만 인내심을 갖고, 시인과 생명력 넘치는 예술가, 이른바 문화적 세속화의 “보이셰비키”라 불리는 집단에게 손을 내민다면, 혁명의 정화된 불길이 다시 내부에서 타오를 수 있을 것입니다."
 POL_undivine_comedy:0 "비신곡"
 POL_undivine_comedy_desc:0 "사나치아를 진정한 좌파 방향으로 이끌려면 단순히 책임자를 갈아치우는 것만으로는 부족합니다. 새로운 정치 틀이 필요합니다. 튼튼한 정당 연합과 대중 기반을 갖춘 체제 말입니다. 핵심 폴란드 공산주의 노동자당 구성원들은 대부분 옛 사민주의 투쟁의 베테랑이지만, 피우수트스키의 감시 아래에서는 제대로 역량을 키울 기회를 얻지 못했습니다. 우리가 국정의 고삐를 쥐고 있어도, 우리 파벌이 대중에게 미치는 영향은 대부분 이론적 수준에 머물고 있습니다.\n\n하지만 우리는 고립되어 있지 않습니다. 사나차 내부 모든 계파가 바람의 방향을 감지했습니다. 정부 여당으로서 이것저것 섞인 동맹 때문에 누그러진 폴란드 사회당 내부에서도 좌파 흐름이 우리에게 접근해 오고 있습니다. 그 리더인 라이문트 야보로프스키는 지금이 기회임을 직감해 우리에게 교섭을 제안했고, 여기에 폴란드의 “역사적 사명”을 다시 살리겠다는 여러 메시아주의 교단까지 동참 의사를 밝혔습니다. 우리의 무신론적 인터내셔널리즘과 그들의 애국·농민주의 성향이 어우러진다면 묘한 동맹이 되겠지만, 한 번도 제대로 시도되지 못했던 연합을 되살릴 수도 있겠습니다."
 POL_rhapsode_soldier:0 "낭송가와 군인"
 POL_rhapsode_soldier_desc:0 "푸른 사회주의의 정수는 피우수트스키의 군단에서 비롯합니다. 이들은 100년간의 노예 상태에서 폴란드를 끄집어내며 최전선에서 싸웠고, 그 희생을 통해 나라가 태어났으며, 그들의 결의가 폴란드를 부르주아 민주주의로부터 분리해 냈습니다. 비록 우리의 새 총독은 공산 혁명가들 틈에서 전쟁을 보냈지만, 그 또한 군인이고, 비에니아바-드우고쇼프스키 장군 같은 군단 출신 친구들을 지닌 사람입니다. 그는 피우수트스키가 폴란드에 약속했던 것을 저버리지 않을 것이며, 사나치아 혁명의 원래 정신을 계승할 것입니다.\n\n그 정신은 낭만주의지만, 낡은 형식 그대로가 아닌 현대화된 낭만주의입니다. 촌스러운 ‘농민 숭배’를 하는 자들이나 쳉스토호바의 성모를 숭배하는 자들의 경건한 탄식이 아닌, 도시와 군대, 기계를 아우르는 현대 삶의 낭만주의를 의미합니다. 우리는 낡은 도덕보다 일탈을, 나태보다 규율을, 굴복보다 정복을, 단순함보다 복잡함을 높이 평가합니다. 그래야만 세상을 진정 사랑할 수 있습니다. 과거의 기억만을 사랑하는 것이 아니기 때문입니다. 우리 혁명은 늘 지금 이 순간에 살아 있는 혁명입니다."
 POL_policy_antipolonism:0 "민족적 반 폴란드 정책"
 POL_policy_antipolonism_desc:0 "옛 폴란드 문인들은 대중을 사랑한다며, 그들을 위해 시를 바치며, 그들을 뮤즈로 삼았습니다. 문제는, 과거와 현재 모두에서 그 이른바 ‘대중’이라는 것이 몹시 어리석고 냉소적이며 무지하다는 점입니다. 지나치게 향수 어린 그 애틋함은 드모프스키주의와 반동의 핵심 정서와 다를 바 없습니다. 산업을 깎아내리고 농경 풍경을 찬양하는 이들은 결국 농민이 전부인 사람들이며, 농민에게서 무언가를 일깨우려 하면 십중팔구 십자가형에 처해지고, 그들의 대변인을 자처하는 이들은 형편없는 산물을 내놓았습니다.\n\n이 답답한 멍에를 벗어던지려면, 소 달구지와 농가, 농민을 찬양하던 그 진부한 예찬은 버리고 자동차, 도시, 노동자를 기리는 시를 써야 합니다. 우리의 예술은 그저 무의미한 인간들을 숭배하는 데 쓰이는 것이 아니라, 영혼을 깨우고, 행동을 촉구하며, 영감을 주는 기능을 해야 합니다. 새로운 소설가는 진보의 거대한 투쟁 속에서 부단히 바뀌어 가는 현대 세계를 자신의 화폭 삼고 재료 삼아야 합니다. 이제 폴란드는 수평선 너머를 바라볼 줄 알아야 하며, 필요한 경우에는 단단한 손길로 턱을 들어 주어 시야를 넓혀야 할 것입니다. 우리의 국가는 근대성의 지배가 실현되는 곳이자, 새로운 인간이 피어오를 비옥한 토양이어야 합니다."
 POL_commonwealth_nations:0 "44개국 제치포스폴리타"
 POL_commonwealth_nations_desc:0 "폴란드는 동방의 대리자로, 억압받는 이들에게 손을 내밀고 압제자에게 주먹을 날리는 존재입니다. 인테르마리움은 형제애를 도모하고, 방어와 약탈이 아니라 평화와 발전을 이야기하는 유럽 최초의 동맹입니다. 우리의 역사적 사명은 발트해부터 흑해에 이르기까지 이 체제를 확장해, 모스크바 주변부에 짓밟혔던 문화를 부흥시키고, 무엇보다 노동계급을 러시아 기생충들로부터 해방해 자유로운 남녀의 땅을 만드는 것입니다. 그들 스스로 번영과 계몽을 향해 나아갈 수 있는 공간을 열어 주는, 참으로 신성한 과업이지요.\n\n이 목표는 비록 폴란드 사회당이나 공산노동자당의 원로들이 서로 다른 말로 표현하더라도, 사실 모든 이가 공통적으로 지향하는 바입니다. 우리는 이 공통점을 파고들어, 우리의 수사학 핵심으로 삼아야 합니다. 인테르마리움을 구성하는 온갖 조직을 이 이념 아래 묶어 내어, 서로 사회·경제적 발전을 함께 도모하도록 해야 합니다. 당장은 노골적 이념을 내걸지 않더라도, 그 자체가 미래로 이어질 거대한 정치적 가능성을 품고 있습니다."
 POL_das_kapital_trilogya:0 "자본론과 3부작"
 POL_das_kapital_trilogya_desc:0 "우리의 전 나첼니크의 애독서는 마르크스의 자본론과 헨리크 시엔키에비치의 사르마티아 대서사 3부작이었습니다. 이 둘을 결합해 보는 것이야말로 사나치아 정신의 영적 본질을 보여 줍니다.니체가 말하기를, “슐라흐타는 지상에 존재한 가장 장엄한 계급이었다”고 했습니다. 그리고 자유 폴란드의 두 위대한 지도자의 혈관 속에도 그 피가 흐르고있습니다. 이를 두고, ‘귀족적 공산주의’라 부를 수도 있을 것입니다.\n\n이런 결합은 오직 우리만의 독특한 것이며, 다른 나라들도 장대한 정신적 각성을 시작했지만, 어느 곳도 아직 폴란드만큼 눈부시진 못합니다. 우리는 프랑스, 러시아, 독일, 이탈리아 등에서 쏟아지는 유행 사상에 쫓길 필요가 없습니다. 오히려 세계 혁명의 방향을 우리가 설정해야 합니다. 피우수트스키가 말했듯, 우리는 세계를 불태울 것입니다!"
 POL_fiume_eros:0 "피우메, 에로스의 도시"
 POL_fiume_eros_desc:0 "혁명가라면 누구든 카르나로 회의 시절을 그리워하지 않을 수 없습니다. 폴란드인, 이탈리아인, 프랑스인, 러시아인, 독일인 등 여러 유럽 민족이 모여 당시 막걸음마를 떼던 자유주의 세계 질서를 펜 한 번으로 요람에서 목 졸라 멈추게 한 위대한 집회였으니까요. 피우메 혁명은, 어쩌면 우리 혁명보다도 더 대담하게 새로운 사회 형태의 길을 열어 보였습니다. 인간의 본능과 욕망을 해방시키고, 창조적이면서도 삶을 보전하는 그 충동에 완전한 자유를 부여하는 체제 말입니다. 단눈지오주의는 이미 유럽의 그림자 너머에서 오랫동안 맴돌았던 어떤 정신, 곧 프롤레타리아 폭동만으로는 설명되지 않는 깊고 본질적인 열망에 형태를 부여했습니다.\n\n물론 오늘날의 피우메는 20여년 전 처음 탄생했던 그 사회와는 사뭇 다르다고들 합니다. 그렇다 해도, 피우메를 위대하게 만들었던 이념들은 여전히 유효하며, 본질적으로 반동적인 이탈리아보다 훨씬 진보적인 국가에서 얼마든지 새롭게 구현될 수 있습니다. 우리는 방탕자이자 자유로운 영혼이 될 것입니다. 위선적인 순결 따위를 거부하며, 온갖 죄악에 아낌없이 발을 담글 수 있는 자들 말입니다. 동시에 우리는 시인이자 영혼을 격려하는 자, 그리고 영혼을 빚어 내는 조각가여야 합니다. 무엇보다 중요한 것은, 평범한 군중 속에서 태어났으나 동시에 그들을 뛰어넘는 혁명 귀족, 곧 진솔함과 미덕, 일상적 태도와 인물에 대한 어느 정도의 멸시를 갖춘 사람들로 이루어진 신분층을 형성해야 한다는 점입니다."
 POL_bomb_of_philia:0 "트빌리시, 우애의 폭탄"
 POL_bomb_of_philia_desc:0 "미래주의자들과 공산주의자들이 캅카스 혁명을 자신들의 이념적 성과라 치켜세우지만, 그 혁명의 진면목을 제대로 공부한 이는 드뭅니다. 다행히 폴란드에는, 우리 나첼니크께서 해방 이후 직접 티플리스로 가셔서 오랜 기간 대표로 활동해 오셨습니다. 그분께서는 실무적으로나 사상적으로 캅카스회의 속내를 정밀하게 파악하셨고, 그 본질이 특정 이념이나 노선이 아닌, 우정을 최고의 가치를 두는 태도에서 비롯됨을 간파하셨습니다.\n\n지에르진스키께서는 폴란드 또한 이 고결한 길을 따라야 한다고 결정하셨습니다. 그분은 가장 신뢰하는 동지들을 모으고, 나아가 폴란드 전역을 향해 미래를 향한 자신의 비전을 선포하셨습니다. 곧 비스와 강가에서도 캅카스회 못지않게 숭고하고 뛰어나며 우애 어린 새로운 사회가 탄생하게 될 것입니다."
 POL_prometheidion_statecraft:0 "치국의 프로메테우스적 존재"
 POL_prometheidion_statecraft_desc:0 "오늘날의 사나차는 마치 야누스의 두 얼굴을 지닌 듯합니다. 대중 앞에서는 과거 폴란드 혁명의 표상이자, 젊은 세대에게는 미래의 혁명을 상징합니다. 내부적으로는 여전히 마르크스주의적 면모를 간직하고 있으면서도, 당장 ‘민족’이라는 기치를 들 수밖에 없는 상황에 직면해 있지요. 이는 수 세기 동안 러시아와 대치했던, 가톨릭적이면서도 진보적이고, 폴란드적이면서도 프롤레타리아적이며, 차르의 전제정뿐 아니라 자본의 전제성에도 맞서 온 이 땅의 역사성과 연결됩니다. 그러나 모든 세대와 다양한 부류의 폴란드 사회주의자들을 담아 낸 혁명 사나차가 시간이 흐르며 불투명해지고, 본질이 희미해지는 것은 자연스러운 일입니다.\n\n그런 분열 상태로 인한 조직적 곤경을 피하려면, 사나치아도 동맹 정당인 공산노동당이 구현한 독일 공산당식 체제를 본받아야 합니다. 전위대가 분명히 존재해, 하부 기구와는 별개의 목표를 가지고 이끌어 가되, 표면적으로 하부와 엇갈리는 듯 보여도 실은 지도해야 한다는 것입니다. 이는 레닌을 ‘사소한 분파주의자’라며 격노하며 비판했던 우리 나첼니크의 심기를 건드릴지도 모릅니다. 공공연히 표방해 온 사회-애국적 노선을 진심으로 믿는 자들에게도 마찬가지이겠지요. 야누스의 두 얼굴은 미소 지으면서도 동시에 욕설을 내뱉는 격입니다."
 POL_3xm:0 "3 X M"
 POL_3xm_desc:0 "크라쿠프 아방가르드의 시는 사나치아 정신을 가장 완벽하게 묘사합니다. 미래주의자들은 혁명의 폭발적 에너지를 아름답게 그려 낼 수 있고, 형식주의나 스카만드르파들은 우리의 낭만적 정서를 잘 표현해 내지만, 폴란드 구성주의자들의 작업은 혁명에 있어 가장 필수적인 요소, 곧 이성적 창조자의 모습을 체화하고 있습니다. 그들은 종합적이면서도 분석적인 미학으로 피우수트스키 시대의 대중 계몽을 이끌었고, 앞으로도 계속 그 역할을 수행해야 합니다. 그들의 핵심 원리인 ‘3×M’, 즉 수도(Metropole), 대중(Mass), 기계(Machine)는 수학적이고 기술적인 정밀성을 통해 국가 선전의 언어가 될 것입니다.\n\n이 언어는 새로운 사회주의 국가를 건설하는 데 필요한 규율과 충성을 담고 있습니다. 기술 세계의 질서를 반영하는 위계와 체계를 내재하며, 어떤 선전물보다도 국가 이념의 진실을 더 잘 표현해 줍니다. 그리고 무엇보다 이 언어는 현재의 순간을 찬미합니다. 구체적인 가능성과 산업 발전에서 생겨난 새로운 형태를 기뻐하며, 거기서 나오는 힘과 자유를 찬양하는 태도는 우리 국가의 본성에 정확히 들어맞습니다.\n\n구성주의 수학적 비유로 이를 표현하자면, 다음과 같습니다\n\"강철\" + \"두뇌\" + \"불\" = \"국가\""
 POL_began_with_word:0 "모든 것은 내 한 마디에서 시작되었소"
 POL_began_with_word_desc:0 "10년 전, 군부의 하급 지휘관들인 로즈바도프스키와 야누샤티스 두 머저리새끼들이 나와 사나치아 정부 전체를 전복하려 모반을 꿈꾸었지. 그놈들이 내세운 명분은 “폴란드 생활에서 가톨릭의 중심적 지위를 흔들었다”(내가 보기에는 신이 직접 원해도 폴란드에서 가톨릭을 없애긴 어려울 텐데 말야)거나, “폴란드를 외국 자본에 팔아넘겼다”는 등의 반동적 헛소리였어. 누구에게 팔아넘겼다는 건지 말도 못 하던데, 아마도 러시아와 내통해 그 미스터리를 풀어 보려 했겠지.\n\n결국 그 새끼들은 실패했고, 어리석은 반란 덕분에 오히려 황금기가 열렸어. 반역 편에 서던 당원 뱃지를 단 쥐새끼들을 세임에서 몰아낼 수 있었고, 난 그들의 성급한 배신 덕분에 모든 계획을 하나둘 실현할 발판을 마련하게 됐다네. 물론 내가 총알 세례를 받을 뻔한 적도 있지만, 그건 처음이자 마지막도 아니었지. 어쨌든 10년이 지난 지금, 우린 사나치아 독자 집권 10주년을 기념하며, 내가 꿈꾸던 구상이 거의 전부 실현되었음네 기뻐하고 있다고. 옛 폴란드-리투아니아 연방의 영토는 이제 우리의 동맹 안에 있고, 우리는 곧 모스크바를 향해 진격해 러시아의 위협을 영원히 종결할 준비가 되어 있지. 인민은 그 어느 때보다도 정신적으로 단결해 있고."
 POL_perfecting_perfected:0 "이미 완벽한 것을 더 완벽히 만들기"
 POL_perfecting_perfected_desc:0 "모스크바 정권을 동유럽에서 몰아내려면 모든 것이 완벽해야 한다네. 사단, 대대, 병사 한 명 한 명이 완전한 보급을 받고 하나의 몸처럼 훈련되어야 하지. 독일 친구들에게서 마우저 소총, 기관총, 전차를 구해 왔고, 우리의 공장들은 그 밖의 모든 무기도 열심히 생산해 내고 있어. 이 시스템은 잘 기름칠된 하나의 기계와도 같아. 당은 가장 헌신적인 이들에게 군복무를 권장하고, 은화 한 닢이라도 가치 있는 임명을 받고 싶다면 군 경력이 있어야 하고. 사나치아는 모든 면에서 병영 체제와 다름없으며, 소녀단원들조차 제복과 훈련을 갖추었지.\n\n우리 지도부 대다수, 그리고 저를 비롯한 상당수가 독립전쟁을 몸소 치른 베테랑들이다. 곧 닥칠 전쟁은 새로운 세대에게 불가피한 시련이 될 것이며, 나와 같은 기질을 지닌 신세대 지도자들이 거기서 태어나리라 믿어 의심치 않네. 도륙당한 러시아 제국의 폐허 위에서, 자유롭고 독립적인 국가들의 형제 연합이 탄생해 서로의 공동 위협에 맞서게 될 것이지. 폴란드는 이 연합을 새 시대의 평화와 번영으로 인도하고, 외세의 침투로부터 철저히 지켜 낼 꺼야."
 POL_proclamation_to_nations:0 "전 세계에 보내는 포고"
 POL_proclamation_to_nations_desc:0 "난 빌뉴스에 가는 것을 즐긴다네. 그곳에 있으면 무릎을 꿇거나, 누군가 내게 무릎 꿇는 것이 꽤 익숙해지거든. 빌뉴스 시에서는 미츠키에비치의 새로운 동상을 건립하는데, 나에게 축성 행사에서 연설해 달라고 부탁했지. 이는 비공식적인 인테르마리움의 집회와도 같을 터라, 요즘같이 중책이 산적한 시기에 살짝 부담스럽지만. 우크라이나 쪽은 한껏 들썩이고, 독일의 느슨한 태도는 불을 보듯 뻔하니 말을 잘 골라 해야 할 꺼다. 그래도 강력한 메시지를 보내야 해. 우리 동맹은 단결되어 있고, 어떠한 이탈도 필요한 모든 수단을 써서 바로잡겠다는 뜻을.\n\n물론 그간의 성과도 자랑스레 말할 꺼다. 우리가 모스크바의 멍에를 벗겨 낸 뒤로 동유럽이 얼마나 발전해 왔는지! 가장 교조적인 사회주의자라도, 내가 이룩한 토지 개혁과 노동자 권리 신장을 보고는 마지못해라도 인정할 수밖에 없을 테니까. “러시아 사회주의자들을 배신했다”는 식으로 투덜댈 수야 있겠지만, 그건 한낱 지랄염병에 가깝고 말고."
 POL_swallowing_concern_mont_blanc:0 "몽블랑 아래서 염려를 삼키며"
 POL_swallowing_concern_mont_blanc_desc:0 "젊음, 아니 건강조차 사라져 가지만, 내 나라가 아름다움을 잃지는 않을 테다. 내가 막을 수 있다면. 귀족과 서기, 농노들이 지배하는 퇴폐 국가를 간신히 굴려 나가는 것은 콜차크 같은 이들이나 하는 일이다고. 내가 하고 있는 일은 훨씬 더 어려워. 온 폴란드의 목소리를 대변해야 하며, 한 점으로 모아내야 하지. 나는 대체 불가능하진 않지만, 너무나도 독보적인 위치에 있어 다른 사람이 대신하기가 쉽지 않다.\n\n최근에 내가 넘어져서 다친 일은 조금 난처했다. 다리뼈가 부러졌을 가능성보다, 이 늙은 몸으로 직무에서 물러날 때 영광이 아니라 망신만 남지 않을까 하는 우려가 더 컸었어. 그래도 기침으로 고생하는 다른 노인들과는 달리, 나는 한 번 크게 내쉬고 털어버리는 편이라 다행이다. 내 생전에는 유산을 확실히 다져 놓을 거니. 아직 나 죽지 않았다!"
 POL_what_after_me:0 "그 뒤, 나는 어떻게 되나?"
 POL_what_after_me_desc:0 "아 그래, 내 안에는 아직 생명이 남아 있는데 다만 초라하고 공허한 인생이 그 앞에 펼쳐져 있을 뿐이지. 죽음이 문 앞에 서서 불쌍하다는 듯 제 내장을 비틀지만, 그는 내가 해야 할 일이 남아 있음을 알고 떠나 가지 않는다. 내 평생의 어떤 전투나 숙청보다 어렵고 힘든 일을 해야 하거든. 나를 주인이라 부르는 그 야수, 사나치아가 이미 온몸으로 퍼져 나가 괴물이 되어 버린 현실을 통제해야 해. 사나치아는 국민의 숨통을 죄고, 이 나라의 필수 생명력을 쥐어짜며 살아간다. 한 마리 용 같다고 할까. 나는 그 용을 쓰러뜨릴 성 게오르기우스를 찾는 임무를 맡았다. 하지만 칼을 들 자가 과연 누구일까?\n\n스와베크, 다신스키, 시미그위를 불러야겠다. 그들의 지지자들에게 서로 친화적으로 지내는 법을 가르쳐야 할 것이다. 내가 더 이상 그것을 직접 중재할 수 없는 시간이 서서히 다가오고 있으니 말이다."
 POL_i_as_pankracy:0 "나는 판크라치"
 POL_i_as_pankracy_desc:0 "비트카치, 젊으면서도 당대 최고의 폴란드 예술가라고 할 만한 그가, 자신의 화실로 나를 초대해 초상화를 그리겠다고 했다. 강렬한 색감과 심리적 통찰을 조합하는 그의 독창적 기법이 내 시선을 사로잡았는데, 비록 내가 기력이 쇠해 가더라도 전무후무한 예술품 하나를 남길 수 있으리라 믿는다네. 그가 편지에서 말하기를, 아르토와 연관된 몇몇 프랑스 예술가도 내게 인사를 전하고 싶어 한다니, 사실 그 대목에서 살짝 멈찟하긴했어. 나는 아르토가 거느린, 그 뭐냐 좀 애매한 청년들과 어울릴 마음도 없고, 뜬금없이 열렬한 지지를 표한다는 수상쩍은 인간 타입도 별로 달갑지 않아. 이상한 사람들이 바르샤바에 나타나 내 시선을 자꾸 흔들어 대거든. 어떤 영국인은 내 토지 개혁과 이집트 신들과 관련해 “부적을 써야 한다”느니하고 떠들고, 또 어떤 미국인은 ‘뉴욕 정치인에게 당신의 이념 연구 개혁을 편지로 보내 주십시요’라고 요구했어. 생각만 해도 피곤하네.\n\n그런데 비트카치가 덧붙이길, 이들 중 상당수는 달리 볼 만한, 보다 기개 있고 존경할 만한 타입이며, 아르토와 그 방탕하고 나약한 성향과는 대립적인 입장이라고 한다네. 괜찮다면 가능한 한 빨리 그 예술가의 집으로 가 볼까 해. 그곳에서는 한 번쯤 다른 이의 지배에 기꺼이 몸을 내맡기면서도, 그 억압을 싫어하지 않을 수 있을 것 같으니요."
 POL_my_blood_body:0 "내 피가… 내 몸이… 내…"
 POL_my_blood_body_desc:0 "내 몸이 점점 쇠약해지니, 나라 역시 시름시름 앓고 있군. 한때 내게 고개 숙이고 비위를 맞추던 파벌주의자들이 이젠 제가 눈치채지 못할 거라고 믿는 듯, 거리낌 없이 제멋대로 권력을 휘두르려 하고있어. 사실 내 건강이 약해진 걸 다 아는 형국이라, 그들도 겁날 게 없다고 생각하는 듯하기도하고. 늙은 쥐처럼 동료들에게 들판에 내버려져, 발톱에 심장이 찔려 즉사하기 직전의 고요를 마주하는 느낌이랄까. 그나마 그런 죽음을 맞이할 수 있다면 좋겠습니다만, 내겐 병원에서 “친구”라는 이들의 냉담한 시선을 받으며, 제가 쌓은 모든 것을 무너뜨리려 드는 자들과 함께 숨을 거둘 미래가 더 현실적으로 다가온다네.\n\n그럼에도 니는 아직 살아 있습니다. 온갖 장애에도 불구하고, 내 얼굴은 아직 ‘살아 있는 자’의 표정을 하고 있지. 반역자들이 그걸 빼앗아 갈 순 없고, 내 목소리가 갈라진다 해도 그 뜻까지 흐릴 순 없을 꺼다. 내 나라는 관료들의 망상에 얻어맞고 멍들었을지언정, 나는 그것이 망하지 않도록 지켜야 한다. 반드시 그렇게 할 것이니."
 POL_this_how_i_lived:0 "내가 살아온 방식이 이래"
 POL_this_how_i_lived_desc:0 "어제 제 남편이 세상을 떠났습니다. 목에 괴는 담즙이 마지막 말을 가로막아 버렸지요. 의사들은 최선을 다했겠지만, 막상 그의 숨이 끊어지자 큰 짐을 내려놓은 얼굴로 서로를 쳐다보더군요. 저도 애도하며 앉아 있었지만, 이상하게도 해방감을 느꼈습니다. 그는 이미 한참 전부터 떠나 있던 셈이고, 잠시라도 남은 동지나 아는 이를 만나 마지막 말을 전하려 했을 뿐이었죠. 하나님께서 그를, 그리고 그 모두를 돌보아 주시길 빕니다. 사람들은 저를 “민족의 어머니”라고 부르지만, 저는 그저 제 딸들의 엄마일 뿐이고, 그들의 슬픔만이 제게는 중요합니다. 그런데도 그 애들과 함께 있으면 어딘가 이질감을 느낍니다. 그 아이들이 우는 소릴 들으면, 제 과거를 뒤돌아보는 기분에 휩싸이거든요. 저는 그저 시간이 모든 것을 치유하리라 얘기할 수밖에 없고, 제 딸들은 제 말에 분노 어린 반응을 보이곤 합니다만, 그 마음도 곧 누그러지리라 믿습니다.\n\n남편 없는 나라가 어떠할지 걱정이 큽니다. 유제프가 사라지면, 음험하거나 사리사욕만 챙기는 이들이 득세하겠지요. 그리고 저에게도 역시 아첨하며 굽실거릴 것입니다. 부디 그들이 제가 살아 있었다는 사실조차 빨리 잊어 주기를 바랄 뿐입니다."
 POL_colossus_has_fallen:0 "거인이 쓰러지다"
 POL_colossus_has_fallen_desc:0 "바르샤바, 루블린, 르부프, 크라쿠프. 모든 도시가 조용하고 어두웠으며, 오직 기차역에만 사람들이 모여 이야기를 나누었습니다. 하지만 그 대화의 내용은 애도, 후회, 슬픔뿐이었습니다. 원수께서 돌아가셨고, 폴란드인들은 아직도 자신들의 벗이자 해방자, 그들이 사랑했던 피우수트스키 원수의 죽음을 받아들이지 못하고 있습니다. 연합회복권과 그 지방·중앙 조직들은 모두 마비 상태에 빠졌다고 할 수 있으며, 어떤 이들은 당이 목이 잘린 상태라고 표현하기도 합니다. 그러나 이 모습은 마치 히드라 같습니다. 예전에는 머리가 하나뿐이었지만, 이제 여러 개의 머리가 생겨 서로 그 자리를 차지하려 하고 있습니다. 당장은 모두가 검은 옷을 입고 울겠지만, 각각의 계승자에게 충성을 맹세한 자들은 이미 비수를 갈고 있습니다.\n\n어떤 시장들은 자기 도시가 행사의 중심이 아니었다며 울분을 토하고, 애도객들은 과도하게 열성적인 호위병들에게 얻어맞고, 중요한 인물들은 전국 단위 추도식에 모습을 드러내지 않을 것이라는 소문이 무성합니다. 국가는 슬픔으로 끓어오르고 있습니다. 사나치아는 지도자 하나를 잃은 것이 아니라 정당화 근거 자체를 잃었습니다. 하찮은 인물들은 결코 피우수트스키 원수의 자리를 대체할 수 없으며, 국민들 역시 잘 알고 있습니다. 그가 얼마나 흉내를 내든, 가짜를 참아 줄 사람은 없습니다."
 POL_no_princeps_augustus:0 "프린켑스는 없고 아우구스투스만이 있을 뿐!"
 POL_no_princeps_augustus_desc:0 "우리의 카이사르가 이제 주검이 되었고, 그의 공화국은 흔들리고 있습니다. 너무 오랫동안, 원수의 말을 왜곡하고 의지를 숨기는 자들이 그분을 대신해 권세를 누리면서, 그의 명령을 비틀고 이상을 짓밟았습니다. 1926년의 정변이 실패한 결과, 혁명적 독재 대신 관료와 당 간부들이 모여 느릿하고 퇴행적인 정권을 만들어 버렸습니다. 피우수트스키 원수께서 23번 칼을 맞지는 않으셨지만, 배신당하신 것은 마찬가지였습니다. 시미그위를 헐뜯는 자들이야말로 과거 원수의 등을 보며 비웃던 그 무리였으며, 이번에는 그들이 숨어서 획책하는 것을 당사자도 알고 있습니다. 남들은 오직 영광과 권력만을 노릴지 모르지만, 에드바르트 시미그위는 원수의 진정한 사상을 지키기 위해 일어섰습니다. 누군가는 그가 특색 없고 모호하기에 쉽게 조종당할 거라 말하지만, 아마 그 기대는 무너질 것입니다.\n\n지금 이 순간부터, 연합회복권과 그 산하 조직들을 전면 해산하며, 과거 그 조직에서 활동하던 이들의 모든 활동을 금지합니다. 과거 연합회복권 이름으로 운영·소유되었던 모든 재산은 정부의 소유로 간주됩니다. 파괴 공작이나 방해 활동이 일어날 가능성을 원천 차단하기 위해, 군이 직접 도시와 정부 부처들을 장악하여 감시할 것입니다. 충성스러운 시민 여러분은 안심하십시오. 시미그위 원수님께서 만연했던 당 간부들의 부패를 폭로해 주셨고, 그 대신 젊은 원수님을 보좌할 구국군사위원회 산하의 진보적 엘리트 정권이 구성되었습니다. 이는 고인이 되신 피우수트스키의 정신을 되살리기 위한, 크고도 꼭 필요한 걸음입니다."
 POL_resurrection_godly_son:0 "신성한 자손의 부활"
 POL_resurrection_godly_son_desc:0 "“발레리 스와베크는 누구인가요?” 그는 극초기부터 원수 곁에 있었지만, 자신의 목소리를 낼 줄 몰랐습니다. 그 입에서 나오는 모든 말은 피우수트스키의 것이었고, 그 독특한 음색과 어조는 원수의 강한 발언을 완화해 주어 나이든 이들이나 여성들이 듣기에 편하게 만들어 주었습니다. 연합회복권 내부의 대부분은 스와베크를 농담거리 취급했으며, 그를 비웃음으로써 자신들은 피우수트스키와 그 대의를 지지하되 ‘그 사람처럼 맹목적인 추종은 아니다’라는 식으로 합리화하곤 했습니다.\n\n단순하게 설명하자면, 스와베크는 사실상 ‘피우수트스키의 사람’이었습니다. 하지만 원수가 서거하자, 그가 불을 밝힌 횃불을 이어받게 되었습니다. 꼭두각시가 아닌 스와베크는 그간 체제에 퍼진 부정부패를 보며 참아 왔고, 지금 이 적절한 순간을 기다려 온 것입니다. 원수의 죽음으로 인해 폴란드 정계에는 거대한 공백이 생겼고, 한때 원수의 목을 원하던 옛 반대파들마저 오늘날에는 모두가 애통해합니다. 그들의 회개에는 스와베크가 너그러운 자비를 베풀겠지만, 눈물을 너무 빨리 거두고 비수를 숨기는 자들에게는 사나치아의 분노가 곧 닥칠 것입니다."
 POL_cincinnatus_returns:0 "밭에서 돌아온 킨키나투스"
 POL_cincinnatus_returns_desc:0 "1926년 정변이 실패한 직후, 망가진 모습으로 술에 취한 피우수트스키가 이그나치 다신스키의 집 문을 두드린 일이 있었습니다. 그때 원수는 비몽사몽 상태로 “잃어버린 운명”이니 “배신자들의 목을 조르겠다”느니 떠들었고, “바르샤바 시민 절반을 총살하고 가톨릭 교회·사회주의자·우파를 모조리 처단하겠다”고까지 언급했습니다. 다신스키는 묵묵히 듣다가, 언젠가 찾아오는 원수 특유의 섬뜩한 침묵이 흐르자 그제야 차분히 그를 달랬습니다. “지금 원수님 뜻대로 하시면 사나치아가 이루려던 모든 목표가 적들과 함께 사라질 것”이라고 말이죠.\n\n그렇게 원수를 달래 주었던 인물이 이제 세상을 떠난 친구의 자리를 대신합니다. 그러자 그 길고 피로 가득 찼던 밤에 잃어버렸던 폴란드, 즉 정부 안에 유령처럼 스며들고, 국민 사이에는 폴터가이스트처럼 떠도는 옛 폴란드가 돌아온 겁니다. 마치 현대라는 시대착오 속에서 벨레스처럼 우뚝 선 다신스키는 이를 이끌고 있습니다. 이 거대하고도 불가사의한 정치적 소용돌이가야말로 폴란드 혁명이 싸웠던 것, 사나치아가 촉진하려 한 결과물입니다. 당의 노예와 관료적 농노, 어리석은 반계몽 세력의 하수인들로 가득 찬 지금 같은 공화국은 결코 그 본모습이 아닙니다. 원수를 계승해 대통령직을 맡은 다신스키는 민주주의와 진보를 믿는 사람이지, 권력 그 자체를 위해 존재하는 인물이 아닙니다"
 POL_ravaged_mind:0 "카틸리나 등 뒤의 황폐한 정신"
 POL_ravaged_mind_desc:0 "‘철의 펠릭스’는 누구일까요? 그리고 어째서 구 귀족 가문 출신의 마르크스주의자, 경찰·공안 담당 장관인 그가 원수의 후계자로 선택되었을까요? 사나치아 내 대부분은 그를 얕보다 화를 자초했습니다. 그들이 간과한 점은, 그가 빌뉴스 시절 피우수트스키와 학우 관계였다는 사실, 드모프스키와 스톨리핀의 ‘평화 조약’으로 인해 서로 증오하는 혁명가들이 한 감옥에서 다시금 만나야 했다는 사실입니다. 무엇보다도, 그는 ‘강철 같은 규율’로 빈켈리에트 전쟁과 캅카스에서의 나날들, 그리고 흔들리는 폴란드 사나치아에서조차 나라의 등뼈를 세워 주었다는 것을 잊었습니다.\n\n이 ‘철의 펠릭스’는 현실적이고 실용적인 인물로서, 원수의 유지를 실천해 낼 유일한 후계자로 꼽혔습니다. 어떤 감옥에도 꺾이지 않았던 그가, 아마도 본인도 예상치 못했을 이 막중한 역할에 오르게 된 것이지요. 그러나 그는 수십 년간 그래 왔듯, 이번에도 권력 기계를 구동해 한층 더 강력한 폴란드를 만들어 낼 것입니다. 혁명 영웅들의 진정한 구상을 훼방 놓았던 자들은 떨쳐야 합니다. 우리는 반드시 그들을 묻어 버리고, 폴란드와 그 인테르마리움이 세워진 원대한 포부를 실현할 것입니다."
 POL_in_the_giants_footsteps:0 "거인의 발자취를 따라"
 POL_in_the_giants_footsteps_desc:0 "피우수트스키께서는 서거하셨지만, 그분의 비전은 영원합니다! 임종 직전, 나첼니크께서는 발레리 스와베크를 후계자로 지명하셨고, 그 영예로운 책무를 감당할 만한 인물임을 곧 증명해 보일 것입니다. 사나치아와 그 새로운 조타수에게는 웅대한 꿈과 야심이 있으며, 이를 실현하려면 엄청난 노력이 뒤따라야 합니다. 폴란드를 노리는 외세, 국내 반체제 세력도 문제지만, 가장 큰 위협은 결국 내부의 단결 부족입니다. 하루하루 사나치아 내부에 부패와 분파주의가 만연한다면, 그 어떤 적과 맞서도 승리를 기대하기 어렵습니다. 이제 화려한 축하 의식을 벌일 때가 아니라, 당 내부의 병폐를 척결하기 위한 행동에 나서야 할 때입니다!"
 POL_reconcilliation_seymocrats:0 "세임주의자들과 화해하고..."
 POL_reconcilliation_seymocrats_desc:0 "명백한 잘못을 인정할 줄 아는 자세가 필요합니다. 때로는 반대파를 너무 가혹하게 대했으며, 이는 그들의 의지를 더 굳히는 결과만 낳았습니다. 우리의 결정을 비판하는 것은 범죄가 아니며, 앞으로도 그렇게 다루지 않을 것입니다. 모든 ‘폴란드의 아들들’이 서로를 헐뜯는 대신 건설적인 토론에 참여하도록 해야 합니다. 그렇지 않으면 지금껏 쌓아 올린 우리의 노력은 허사가 되고 말 것입니다. 폴란드 근대의 개척자, 피우수트스키의 유산을 물려받은 우리로서는, 의견이 다른 이들을 박해하기보다 이해의 길로 인도하고, 궁극적으로는 우리의 방법을 수용하게끔 하는 것이 의무입니다."
 POL_dismantle_rotten_structure:0 "부패한 구조를 해체하며...."
 POL_dismantle_rotten_structure_desc:0 "피우수트스키 원수의 건강이 악화하기 시작했을 때부터 사나치아는 혼돈에 휩싸였고, 그분이 서거하신 뒤에는 더욱 심각해졌습니다. 강력한 통솔력이 있었기에, 편협한 야심을 가진 소인배들이 ‘국가 정당’을 이용해 사리사욕을 채우려는 시도를 억눌러 왔다는 사실이 이제야 분명해졌습니다. 다행히도, 우리는 이 싸움에서 홀로가 아닙니다. 한때 폴란드의 선봉이었던 조직들 안에도 진정한 애국자들이 남아 있기 때문입니다. 자드루가주의자든 생디칼리스트든, 진심으로 대의를 섬기는 이들은 반드시 우리 편으로 끌어들여야 합니다. 하지만 아군을 확보하는 것만으로 ‘늪’이 다시 가득 차는 사태를 막을 수는 없습니다. 1924년에 발생한 사건으로 사나치아가 무너질 뻔했던 상황이 재발해서는 안 됩니다. 이를 위해 스와베크는 혁신적인 해법을 제시했는데, 바로 전 사회적 기구를 발족하여 당 기강과 체계를 강화하고, 내부에서 나올 수 있는 모든 위협을 차단하자는 방안입니다."
 POL_present_ambitions:0 "…우리의 새로운 야망을 제시하라!"
 POL_present_ambitions_desc:0 "가장 시급했던 정치적 문제가 해결되고 국내 상황도 안정되었습니다. 한동안 정체되어 있던 ‘폴란드의 발전’이 다시 움직이기 시작했습니다. 하지만 이 지연으로 인해 유럽 열강들 사이에서 우리의 지위가 약해진 것도 사실입니다. 러시아 제국을 보면, 수많은 군벌 가운데 승자가 결국 ‘잃어버린 지방’을 노릴 것이 분명해 보입니다. 서쪽에서는 프랑스가 독일에 맞서 또 한 번의 군사적 대립을 준비하고 있습니다. 폴란드에게는 머뭇거릴 시간이 없습니다. 사나치아는 피우수트스키의 꿈을 실현하기 위해 배가의 노력을 기울여야 합니다. 명령이 떨어졌습니다. 더 많은 도시화, 더 강력한 군국화, 더 빠른 속도! 더 크게, 더 강하게, 더 빨리!"
 POL_no_limits_to_plan:0 "4개년 계획에 한계란 없다!"
 POL_no_limits_to_plan_desc:0 "폴란드는 사나치아가 국가의 통치권을 잡은 이후 긴 여정을 걸어왔지만, 아직 목표에 도달하지 못했습니다! 우리의 대담한 꿈은 이제 산업과 생산의 세계에서 실현되어야 합니다. 발레리 스와베크는 폴란드를 영국, 독일, 미국에 맞설 수 있는 산업 강국으로 탈바꿈시키겠다는 대담한 계획을 발표했습니다. 이미 폴란드가 처음으로 진정한 경제 계획을 맛볼 수 있도록 기반이 마련되었으며, 카토비체와 프로메테이스크는 앞으로 수십 년, 아니 수세기 동안 폴란드 산업의 원천이 될 것입니다."
 POL_hoover_dvor_pilsudski:0 "후버! 드보르니코비치! 피우수트스키!"
 POL_hoover_dvor_pilsudski_desc:0 "타데우시 지에두시츠키는 마치 미래에서 온 사람 같습니다. 그의 구상은 독일이 아니라 미국을 향해야 한다고 말합니다. 새 시기는 분명 신대륙에서 온 사상을 요구합니다. 유럽식 사회주의는 어제의 세계를 기반으로 한 이념일 뿐, 이 역동적 시대에 더 이상 미래가 없다는 것입니다. 오히려 지에두시츠키가 말하는 미국 자본주의 특유의 영웅적 ‘집단주의’ 정신이야말로 모든 다른 체제와 구별되는 강점이라는 주장입니다.이런 발언은 대담하지만, 미국식 방법론을 수용한 첫 사회주의 세력이 우리가 될 리는 없습니다. 캅카스의 ‘철의 인간’ 이오시프 스탈린도 같은 이야기를 하고 있지 않습니까? 그 러시아 형제도 그렇게 과감한 발걸음을 뗐다면, 우리가 주저할 이유가 어디 있겠습니까?"
 POL_iron_grip_managerialism:0 "관리주의의 철권"
 POL_iron_grip_managerialism_desc:0 "전 세계가 지식 기반의 ‘신 봉건 시대’로 접어들고 있습니다. 제임스 번햄과 헨리 포드가 예견한 대로, 미래는 거대한 ‘관리국가’들의 시대가 될 것입니다. 마침내 계급 갈등의 모든 병폐를 근본적으로 해결할 방법이 찾아졌습니다. 포드와 후버가 이끄는 미국에서는 이미 노동자·관리자·소유주가 함께 의사결정에 참여하는 참된 생디칼리즘 형태를 갖춰 왔고, 캅카스의 스탈린은 노동자 중심주의의 이기주의를 ‘국가적 자기 보존’ 정책으로 제압했습니다. 각 계급, 직업, 민족의 지식인들이 연합해야 합니다! 통합된 국민 지성의 독재가 만세를 부를 것입니다!"
 POL_homo_faber:0 "호모 파베르! 호모 칼로카가토스!"
 POL_homo_faber_desc:0 "신 폴란드인이라면, 말하고 보고 듣고 숨 쉬는 모든 차원에서 연대의 이상을 체현해야 합니다. 이를 위해서는 철저한 교육 개혁이 필수적입니다! 모든 이는 국가 기구의 일원으로 기능하되, 무의미한 톱니바퀴로 전락해서는 안 됩니다. 새 시대의 인간상은 고결함과 창의성을 겸비하고, 엄청난 활력과 의지를 가진 사람이어야 합니다. 우리의 경제를 되살린 것과 같은 방법이 이제 학교와 대학교에 새로운 생명을 불어넣을 것입니다."
 POL_exceptionalism_abroad:0 "세계로의 폴란드 예외주의"
 POL_exceptionalism_abroad_desc:0 "폴란드는 이제 전 우주를 향해 영웅처럼 우뚝 서 있습니다! 폴란드 상품은 미국부터 중국에 이르기까지 전 세계에서 사랑받고 있으며, 우르수스와 오토산 브랜드는 하루에도 수십 개 언어로 칭송받습니다. 모든 폴란드인은 우리 경제적 영향력의 중요성을 알고 지지해야 합니다. 폴란드 상품을 사고, 폴란드 음식을 먹고, 폴란드 제품을 팔자! 우리 제국은 영토적 확장뿐 아니라, 문화·경제적으로도 전 세계에 뻗어 나갑니다! 몇 해 뒤에는 아이들이 학교에서 폴란드어를 배우고, 전 세계에서 가장 우수한 두뇌들이 폴란드의 교육기관으로 몰려들어 학문을 익히게 될 것입니다."
 POL_polish_master_race:0 "폴란드 우월 인종론"
 POL_polish_master_race_desc:0 "우리의 궁극적 성공 비결은 무엇일까요? 그것은 바로 ‘인종’입니다. 폴란드는 우주에서 가장 영광스럽고 강력한 인종의 일부가 아니었다면 오늘날의 모습을 갖출 수 없었을 것입니다. 너무나 단순한 진리입니다. 새 시대에 폴란드는 아시아인이나 흑인에 맞서 백인 종족의 선봉이 될 것입니다. 드니에프르강 너머에는 폴란드 인종의 숙적이라 할 수 있는 야만적 모스크바 타타르족이 있으며, 아프리카에서 우리가 진행 중인 마다가스카르·앙골라 식민사업은 전적으로 이익만을 남기게 해야 합니다. 열등 인종에 대한 지나친 관용의 시대는 끝났습니다, 동지 폴란드인이여! 이제부터 우리는 자부심을 품고 전진할 것입니다."
 POL_full_speed_ahead:0 "전속력 으로 12년 계획을 향해!"
 POL_full_speed_ahead_desc:0 "위대한 성과입니다! 첫 번째 계획 을 성공적으로 마치고도 기대치를 초과 달성했습니다. 동부 폴란드 지역 개발과 관련된 몇몇 사업만 남았을 뿐입니다. 그다음은 무엇일까요? 바로 전 인테르마리움을 대상으로 한 15개년 계획입니다! 빌뉴스와 민스크, 키이우도 도움이 필요하며, 우리가 그 지원을 담당할 것입니다. 잊지 말아야 합니다. 그들은 러시아의 공격이 온다면 맨 앞에 서야 할 ‘형제’이지, 우리가 지배하는 대상이 아닙니다. 과거 진창 속에서 폴란드가 일어섰듯, 우크라이나·벨라루스·리투아니아도 그 길을 따라 일어설 것입니다!"
 POL_americanization_hellenization:0 "미국화와 헬레니즘화"
 POL_americanization_hellenization_desc:0 "폴란드는 과거의 민족적 유산과 미래지향적 세계관 사이에서 타협점을 찾은 첫 번째 국가입니다. 이제 바르샤바, 크라쿠프, 루블린 곳곳에 기둥과 아치가 들어섰지만, 그 아래를 질주하는 것은 전차가 아니라 전에 없던 속도의 자동차들입니다. 비스와 강변에는 고고미래주의가 떠오르고 있습니다. 우리는 유대-기독교 문명과 작별하고, 이 문명을 세워 낸 영광스러운 고대의 이상들을 다시 환영합니다. 개인주의와 집단주의는 폴란드식 연대주의의 보살핌 아래 조화를 이루며, 자동화된 생산 방식과 헬레니즘적 이념이 우리 대제국의 깃발 아래 마침내 하나가 되었습니다!"
 POL_total_control:0 "완전 통제의 맛"
 POL_total_control_desc:0 "폴란드의 경제는 사나치아의 상징색을 따 \"푸른 사회주의\"라 불려 왔습니다. 그런데 이 \"푸른 사회주의\"의 특징은 무엇일까요? 여러 소유 형태가 뒤섞인 채, 혼란스러운 계획 경제가 굴러가는 한편, 모든 것을 전면 통제하려는 경향을 보인다는 점입니다. 그러나 지금 상태로는 더 버티기 어렵습니다. \"푸른 사회주의\"는 논리적 귀결대로, 더 나은 형태로 통합되어야 합니다."
 POL_kwiatkowski_submission:0 "크비아트코프스키를 굴복시켜라"
 POL_kwiatkowski_submission_desc:0 "에우게니우시 크비아트코프스키는 우리 뒤를 찌르는 가시 같은 존재입니다. 한때 폴란드의 부흥을 이끌었던 그가, 최근 각료 개편 이후로는 사사건건 시비를 거는 잔소리꾼이 되고 말았습니다. 개인적인 악감정에서 비롯된 반대가 온 나라를 향한 그의 봉사 경력을 결코 정당화해 주지는 못합니다. 그에게 이제는 충성심이 무엇인지 가르쳐 줄 때가 되었습니다. 이것이 그에게 마지막 구원의 기회가 될 터입니다. 그가 순순히 개혁되든 아니든, 우리에겐 상관없습니다. 어차피 그의 사상은 그보다 더 유능한 이들의 머릿속에서 계속 살아갈 테니까요."
 POL_factories_devouring_towns:0 "공장들이 마을과 마을을 집어삼키다"
 POL_factories_devouring_towns_desc:0 "프로메테우스의 불길이 폴란드를 온통 휩싸고 있습니다. 아무도 막을 수 없습니다! 공장과 용광로, 강철과 석유라는 기적이 눈에 보이는 곳마다 가득합니다. 스모그, 곧 발전의 성스러운 향이 사람들조차 숨 쉬기 어렵게 만들 정도입니다. 이런 일을 거의 무리 없이 추진해, 폴란드의 시골을 산업의 심장으로 탈바꿈시킨 이는 스와베크말고 누가 있겠습니까? 무엇보다도 인테르마리움의 보석인 프로메테이스크라는 도시가 탄생하여, 폴란드인·우크라이나인·리투아니아인·벨라루스인이 어깨를 나란히 하며 광물로 기적을 빚어 내고 있습니다. 실로 사나치아는 기적을 구현하는 정권입니다."
 POL_majesty_grandeur_splendor:0 "위엄, 웅대함, 그리고 찬란함"
 POL_majesty_grandeur_splendor_desc:0 "새로운 경제 노선에는 두 가지 면이 있습니다.\n\n하나는 우리나라에서 새롭게 태동하고 있는 관광 산업입니다. 우리의 자연 경관은 결코 홀대하거나 없애 버릴 게 아니라, 소중히 보살피고 지켜야 합니다. 조국의 푸른 허파인 숲과 산은 오염과 파괴로부터 보호되어야 합니다. 전 세계인이 우리의 경이로움을 보러 올 수 있도록! 수많은 방문객들이 폴란드의 미를 찾아오는 현대판 성지순례를 편히 할 수 있도록 고속도로를 건설합시다.\n\n그러나 여기서 멈출 수는 없습니다. 우리 국민도 업무든 휴양이든, 자유로이 움직이고 숨 쉴 필요가 있습니다. 더 많은 고층 건물, 더 많은 주택, 더 많은 지하철이 필요합니다! 바르샤바와 크라쿠프를 세계의 네 번째 로마로 만들어야 합니다! 이것이 곧 다른 한 면입니다. 현대주의와 낭만주의를 융합하여 민족의 영혼을 아우르는 새로운 건축 양식이 바로 그것입니다."
 POL_make_an_example:0 "귀족 해충을 본보기로 처단하라"
 POL_make_an_example_desc:0 "이제 새로운 폴란드는 더 이상 숨길 필요가 없습니다. 한때 피우수트스키 원수께서 폴란드 귀족들과 타협한 적이 있지만, 그분의 유고로 우리에게는 이 “해충”을 국민의 몸통에서 떼어낼 기회가 왔습니다. 토지 개혁 문제에서 국가가 진정한 폴란드 민족의 편에 서야 할 때입니다. 에우게니우시 오콘의 정당이 오랫동안 올바른 방향을 주장해 왔으나, 우리가 ‘불운한 동맹’ 때문에 발이 묶여 있었습니다. 이제 더는 그렇지 않습니다! 그와 그의 농민당을 협상 테이블로 불러, 농민들의 고통을 진정으로 해결할 방법을 논의합시다."
 POL_socialism_in_mil_boots:0 "군화 신은 사회주의"
 POL_socialism_in_mil_boots_desc:0 "대전쟁 시절, 산업화된 경제가 진정 무엇을 할 수 있는지 온 세상이 목도했습니다. 하지만 종전 뒤로 모두가 그 사실을 잊어버렸지요. 오늘, 폴란드는 그 틀을 깨고 전쟁 경제의 부활을 선언합니다. 전쟁 사회주의는 우리 정권처럼 역동적입니다. 퇴폐, 반동, 나약함과 맞서려면 정비된 경제 체제가 필수이며, 이는 오직 사회주의만이 이뤄낼 수 있습니다. 사나치아는 마침내 근본으로 돌아갑니다. 피우수트스키 원수가 원래부터 품었던 사상 말입니다!"
 POL_hyperviolent_technocracy:0 "초 폭력적 기술관료정"
 POL_hyperviolent_technocracy_desc:0 "군사적 수단이란 곧 폭력입니다! 구식 화폐 제도와 그 지지자들에게 완전한 죽음을! 전쟁 경제는 돈 따위가 필요 없습니다. 물리적 계획 경제의 완성을 향해 가는 이 체제에 어떠한 독성 물질도 섞여서는 안 됩니다! 어떠한 타협이나 공포, 의심도 현재 우리가 수행해야 할 과업 앞에서는 용납되지 않습니다."
 POL_tektology_synergy:0 "테크톨로지와 시너지"
 POL_tektology_synergy_desc:0 "폴란드의 과학자 마리안 마주르는 알렉산드르 보그다노프의 테크톨로지 개념을 계산 기계의 시대에 맞게 성공적으로 확장했습니다. 아직 이 기술이 전면적으로 어떤 효과를 낼지는 단언하기 이르지만, 그렇다고 해서 우리가 이 새로운 과학 분야에 대한 주도권 확보를 주저할 이유는 없습니다. 이미 우리 전문가들은 새로운 방식의 계획 경제 가능성을 논의하고 있습니다. 이를 발판 삼아 도약하기 위해, 모든 연구 노력을 하나로 합칩니다. 그 이름은 곧 텍트신(Tekt-Syn)이 될 것입니다."
 POL_clean_syndicates:0 "노조에 스며든 불순물을 소탕하라"
 POL_clean_syndicates_desc:0 "우리의 사회주의가 아직 완벽한 것은 아닙니다. 노조총연합에서 제시하는 생산 계획에 반대하는 이들이 있습니다. 이들은 아나키스트든 미래주의자든, 공산주의자든 결국 온갖 색깔을 한데 뒤섞은 파괴주의자들입니다. “노동자들에게 아무런 발언권이 주어지지 않았다”고 호언장담하지만, 실제 현실은 이들의 말과 정반대라는 것을 다른 누구보다도 잘 알고 있습니다. 이제껏 기회를 줬는데도 아직도 정신을 차리지 못한다면, 그들끼리 자신들의 쇠퇴의 길로 갈 수밖에 없겠지요. 우리는 영광과 번영을 향해 나아가고, 그들은 무의미로 가라앉을 뿐입니다."
 POL_bottom_up_aristocracy:0 "아래서부터의 귀족주의"
 POL_bottom_up_aristocracy_desc:0 "인간은 혈통에 의거한 귀족정과 누구나 평등한 능력주의 사이를 영영 조율하지 못했었지만, 이제 그 시절은 지났습니다. 회의론자들이 뭐라 떠들든, 새로운 폴란드는 스스로의 한계를 뛰어넘어 유기적 엘리트가 이끄는 국가가 되었습니다. 곧, 고된 완성의 길을 기꺼이 걸어갈 의지가 있는 자들로부터 탄생한 엘리트 계급이라는 뜻입니다. 과거처럼 죽은 자들의 시체 위에 세워지는 세계가 아닙니다. 보그다노프, 스와베크, 피우수트스키의 빛나는 가르침 아래, 생명의 최대 잠재력이 펼쳐집니다!"
 POL_redder_than_germany:0 "독일보다 더 붉은"
 POL_redder_than_germany_desc:0 "오늘날의 사회주의는 두 가지 얼굴을 지녔습니다. 서쪽에서는 독일이 개혁주의와 시장 사회주의의 연옥에 빠져 있습니다. 그들의 전면적 경제 체제 구축 노력은 파울 레비에 의해 브레이크가 걸렸고, 뒤이어 그를 이은 후계자도 혁명을 앞으로 밀고 갈 동력을 충분히 발휘하지 못하는 듯합니다. 반면 동쪽에는, 관료주의와 타협 없이 가장 순수한 사회주의를 구현한 캅카스가 있습니다. 우리는 독일을 그들의 방식으로 능가하며, 새 시대에 카프카스 사회와 함께하길 바랍니다. 베얼린의 벗들이여, 섭섭해 마십시오. 바쿠에서 보는 풍경이 그저 더 좋을 뿐입니다!"
 POL_all_seeing_marshal:0 "원수님의 천리안"
 POL_all_seeing_marshal_desc:0 "피우수트스키께서는 비록 우리 곁을 떠나셨지만, 그의 ‘아버지 같은 가르침’은 앞으로도 폴란드가 나아갈 길잡이가 될 것입니다. 피우수트스키는 제국 몰락의 위기에서 폴란드를 구원한 구세주이자, 모든 시민의 귀감이었습니다. 진정한 폴란드인이라면, 그분이 보여 주신 위대한 길을 따르고 그 유산을 지켜야 할 책무가 있습니다. 이제 피우수트스키는 폴란드 역사의 영원한 영예의 자리를 얻게 되었으며, 국가는 이를 공식적으로 인정할 것입니다. 그분의 이름을 모독하거나 헛되이 말하지 못하게 할 것입니다. 조국을 위해 헌신한 그의 이타적 태도는 모든 시민이 본받아야 할 본보기입니다. 과거의 위대한 국왕이나 황제들처럼, 원수가 바르샤바를 굽어보는 장엄한 기념비도 세워질 것입니다. 그리고 그 시선은 빌뉴스를 향해도 있을겁니다."
 POL_his_voice_every_home:0 "그의 목소리를 모든 집에"
 POL_his_voice_every_home_desc:0 "우리는 폴란드를 현대적인 국가로 만들고자 하며, 현대 국가에는 현대적인 가정 기기가 필요합니다! 라디오와 텔레비전, 자동차와 오토바이—미래가 폴란드와 그 국민에게 다가오고 있습니다.폴란드는 아직 젊은 나라입니다. 이제 막 다시 태어났으며, 잠재력은 아직 완전히 실현되지 않았습니다. 예술과 애국심은 이러한 새로운 매체를 통해 사회 전반에 장려되어야 하며, 이를 가장 효과적으로 이루는 방법은 서구 현대 문화를 폴란드에 맞게 받아들이는 것입니다.비판자들은 이를 저급한 대중문화라고 조롱할지도 모릅니다. 그러나 명백한 사실은, 폴란드는 아직 배우고 성장해야 하며, 현대 세계의 문화 강국들 대열에 합류하기 위해 발전해야 한다는 것입니다."
 POL_century_messiahs:0 "20세기의 메시아"
 POL_century_messiahs_desc:0 "새로운 폴란드는 현대의 기사, 폴란드군을 바라볼 수 있습니다. 그러나 우리의 성자이자, 이상적 인간의 전범은 누구입니까? 민족의 계몽에는 강인한 정신이 필요하며, 그것은 곧 미래를 위한 강철 같은 영혼을 단련할 것입니다. 우리는 아방가르드의 시대를 살아가고 있으며, 그렇기에 이 역할을 수행하기에 가장 적합한 존재는 다름 아닌 우리의 민족 개척자들입니다! 과거의 성 니콜라스와 성 안드레아의 시대는 지나갔습니다. 이제 우리는 마리아 스크워도프스카와 이그나치 모시치츠키를 우리의 사도로 세웁니다! 폴란드의 힘을 선포하는 새로운 성자들! 르부프, 크라쿠프, 바르샤바는 이제 새로운 지식의 등대가 될 것이며, 우리의 새로운 민족적 메시아들의 정신에서 태어난 계몽의 빛이 온 세상을 밝힐 것입니다!"
 POL_his_might_every_street:0 "그의 권능을 모든 거리에"
 POL_his_might_every_street_desc:0 "1918년, 피우수트스키 원수께서는 비스와 강 건너까지 손을 뻗어 폴란드를 사슬에서 해방하셨습니다. 그리고 20년이 지난 지금, 폴란드인들은 원수께서 하셨듯 손을 뻗어 이 나라를 서방의 거대 강국들과 대등한 위치로 끌어올리고 있습니다. 수십 년간의 치욕과 예속 끝에, 미국·영국·프랑스가 마침내 우리 동유럽의 형제를 받아들일 것입니다. 모든 시민은 이를 가슴으로 느끼며, 바르샤바 곳곳에 솟아오르는 마천루를 통해 실제로 확인합니다. 이 마천루는 철과 콘크리트로 지어진 현대의 성곽으로서, 부활한 폴란드 민족을 후세에 길이 증언할 것입니다. 골목에서부터 대로에 이르기까지, 사람들은 자기들의 구원자인 피우수트스키 원수를 칭송합니다. 그분은 포스터와 동상, 그리고 황금 시대로 이끈 고난과 희생의 기념비 속에서 영원히 살고 계십니다."
 POL_knighthood_of_soldiers:0 "폴란드 병사의 기사도"
 POL_knighthood_of_soldiers_desc:0 "폴란드 병사는 단순한 무장된 졸병이 아닙니다. 그는 조국과 영광스러운 과거를 잇는 연결 고리이며, 또한 그 영웅적인 미래를 지켜낼 수호자입니다.과거 폴란드 왕국이 몰락하며 쓰러진 기사들이 떨어뜨린 검을, 용맹한 군단병들이 대전쟁에서 다시 들어 올렸습니다. 조국이 명예와 의무의 기사들을 부를 때, 그들은 망설임 없이 응답했습니다. 이제, 그들은 칼이 아닌 소총과 전차를 손에 쥐고, 폴란드의 모든 적을 상대로 굳건히 섭니다. 그들이 누구든, 어디에 있든 말입니다. 귀찮은 도적떼든, 드니에프르 강 너머에서 몰려오는 짐승 같은 적이든, 우리의 현대적 후사르의 위용 앞에서 그들은 바람처럼 사라질 것입니다."
 POL_his_work_not_finished:0 "그의 유업 아직 끝나지 않았다"
 POL_his_work_not_finished_desc:0 "피우수트스키의 죽음과 함께 대담한 개혁의 시대가 끝났다고 믿는 자들은 얼마나 잘못된 생각을 하고 있는가요! 결코 끝난 적이 없으며, 사실 우리는 이제 막 시작했을 뿐입니다! 피우수트스키는 다가올 폴란드 황금시대의 기적을 위한 씨앗을 뿌린 인물이며, 그것을 꽃피우고 결실을 맺게 할 사람들은 슬라베크와 사나치아입니다. 계급이 없는 연대적 폴란드 사회가 탄생할 것이며, 그 사회는 자기희생적인 헌신을 바탕으로 할 것입니다. 폴란드에서 국가의 역할은 단순한 권위주의적 강압자가 되는 것이 아닙니다. 새로운 관료제는 국가를 온전히 포용하며, 최하층의 사람들도 오직 능력과 노력만으로 최고위층까지 올라갈 수 있도록 할 것입니다. 이를 통해 부르주아들의 다툼과 반동적 논쟁이 권력의 회랑에서 종식될 것입니다."
 POL_legion_of_value_merit:0 "가치와 공로의 군단"
 POL_legion_of_value_merit_desc:0 "새로운 폴란드는 타락한 민주주의자나 귀족들의 길을 걷지 않을 것입니다. 오직 ‘공로’에 기반한 길을 택할 것입니다! 기생충과 낭비를 제거할 방법은 분명합니다. 정치적 발언권은 ‘국가에 공헌한 자’들에게만 주어져야 한다는 것입니다. 나라는 집단이며, 이 집단을 운영하려면 헌신적 인재가 필요합니다. 따라서 폴란드에서 가장 우수한 자들만이 중요한 문제에 대해 목소리를 낼 수 있어야 하는 것이 당연합니다. 한 걸음 더 나아가, 새 귀족 계급이 누가 이 계층에 합류할 만한 자격이 있는지를 스스로 결정하도록 하겠습니다. 강한 자들은 더 이상 약하고 무능한 노동자 계층의 아우성에 방해받지 않을 것입니다."
 POL_immortal_science_bonapartism:0 "보나파르트주의의 불멸 과학"
 POL_immortal_science_bonapartism_desc:0 "나폴레옹 보나파르트는 단순한 해방자가 아니라, 정치적 방법론을 가르친 스승이었습니다. 오늘날, 우리는 국가 체제 전반에 걸쳐 그의 유산을 계승하고 있습니다. 나폴레옹 법전은 우리의 법률에 큰 영감을 주었고, 그의 진보 모델은 우리 지도 원칙의 기초입니다. 사나치아는 사소한 정쟁을 초월하며, 스와베크는 예산이나 의석 배분을 둘러싼 사소한 분쟁을 뛰어넘습니다. 우리의 유일한 관심사는 오직 국민의 이익뿐입니다. 사나치아가 지켜보는 한, 우리의 발전에는 한계가 없을 것입니다. 국가적 가치야말로 본래 선이며, 국가에 반대하는 모든 것은 파괴되어야 할 악일 뿐이기 때문입니다."
 POL_visions_of_total_state:0 "폴란드 ‘전체국’의 비전"
 POL_visions_of_total_state_desc:0 "일부 비평가들은 폴란드를 콜차크의 러시아나 동화 속 동방 전제주의국가 같은 곳에 비유하지만, 그들은 우리와 그들 간 ‘결정적 차이’를 보지 못합니다. 사나치아는 훈련된 집단이며, 단순히 무력으로 사회를 지배하는 패거리와는 다릅니다. 우리의 행동은 계산되고, 계획은 신중하게 집행됩니다. 폴란드를 재편하는 과정에서 검열이나 ‘베레자 카르투스카’가 누군가의 문을 두드리는 일들이 때때로 있을 수 있지만, 그것이 잔혹한 쾌락을 위한 남용은 결코 아닙니다. 이는 국민에게 해악을 끼치려는 다수의 적들에 맞서는 ‘도움의 손길’일 뿐입니다."
 POL_apotheosis_naczelnik:0 "나첼니크의 신격화"
 POL_apotheosis_naczelnik_desc:0 "원수께서 다시 사셨도다!\n\n스와베크의 거대한 노력 덕분에, 피우수트스키는 사상과 정신 속에서 다시 살아났습니다. 사나치아는 마침내 정점에 도달한 것입니다. 10여 년 전 시작된 대업은 이제 영광스러운 결말을 맞이했고, 폴란드와 사나치아가 사상과 행동에서 완전히 하나로 결합되었습니다.\n\n관리자로서 임시로 정권을 유지하던 시대는 이제 끝났습니다. 피우수트스키와 스와베크는 자신들의 정치적 프로젝트가 어떠한 위협에도 끄떡없음을 확인하고 안심할 수 있게 되었습니다. 그들이 만들어 낸 정치 기계는 이제 외부의 지침 없이도 스스로 굴러갑니다. ‘새 오토마톤’은 비인간적인 속도로 시대를 가로지르며, 이전에 본 적 없던 자부심과 영광으로 적들을 압도하고 있습니다!"
 POL_monopoly_on_morality:0 "도덕성 국가 독점 "
 POL_monopoly_on_morality_desc:0 "도덕성은 국가적이어야 합니다. 그리고 이를 결정지을 존재는 폴란드 민족 중에서도 가장 완벽한 구성요소인 사나치아 외에 누가 있겠습니까? 우리 남성들이 조국의 목소리 대신 교황주의자들의 헛소리를 듣는다면, 거대한 야망은 결코 실현되지 못할 것입니다. 국가는 유통되는 모든 사상의 흐름을 완전히 통제해야 하며, 적절히 교정하고 세련되게 다듬어야 합니다. 가톨릭은 사적인 공간에 가두고, 대담하고 신비로우며 강력한 ‘새 폴란드 시대’의 미덕을 널리 퍼뜨립시다!"
 POL_faces_polish_taylorism:0 "폴란드 테일러주의의 얼굴들"
 POL_faces_polish_taylorism_desc:0 "사나치아의 과업은 ‘현대적 노동’에 의해 완수되어야 합니다! 아메리카 대륙에서 가장 발전된 산업조직 기법이 전해졌으니, 이제 그것을 우리가 받아들일 차례입니다. 테일러주의와 포디즘은, 이번 세기에 있어 우리 관료조직에게 있어서는 일종의 ‘기독교’와 다름없습니다. 이제 우리 협동 조합 네트워크를 통해 이들 기법을 도입하자고 제안하고 있습니다. 테크노크라트적 접근은 최신 생산 기술을 도입함으로써 큰 이점을 얻을 것입니다. 전진합시다, 호모 파베르!"
 POL_nothing_about_us:0 "우리를 없이는 아무것도 없다!"
 POL_nothing_about_us_desc:0 "폴란드의 일이면 언제나 폴란드가 참여해야 합니다! 주변 세계가 불타고 있는데, 우리가 아무 일도 없다는 듯 앉아 있을 이유가 있겠습니까?\n\n미흐노브스키는 우크라이나를 뒤흔들어, 그곳 민족주의 세력을 결집시켰습니다. 만약 그들이 집권한다면, 우리 동맹의 측면이 노출될 것입니다. 국경을 반드시 지켜야 합니다! 차르주의자들은 서로를 죽일 듯이 싸우고 있습니다. 발트해와 유라시아 초원 지대에 있는 동맹국들에게 연락하십시오. 사빈코프에게도 그 때가 왔음을 알려 주십시오! 빈 위기는 우리 독일 동맹국을 새로운 외교적 대치로 몰아넣었습니다. 우리가 그들을 지지하는 것은 당연하나, 진행되는 분쟁에서 일정 거리를 유지할 것입니다.\n\n현대 폴란드는 18세기의 썩어가던 연방이 결코 아닙니다. 우리는 이제 언제든 어디에서든 누구와도 함께할 수 있는 존재입니다. 우리의 국제적 입지를 반드시 강화해야 합니다!"
 POL_balance_as_long:0 "\"가능한 한 균형을 유지하라...\""
 POL_balance_as_long_desc:0 "폴란드의 여러 우방들이 이제 서로 등을 돌리고 있지만, 부디 우리에게까지 등을 돌리지 않길 바랍니다. 신뢰받는 베크 장관이 모든 동맹국을 방문해 지난 18년간 쌓아 온 관계를 다시금 되살릴 것입니다. 프랑스, 독일, 영국도 지금 우리를 버릴 이유가 없으며, 어쩌면 우리는 세계를 휩쓸고 있는 갈등의 흐름을 되돌릴 수도 있을지 모릅니다. 그뿐만이 아닙니다. 폴란드는 전 세계적으로 더 많은 친구를 만들 수 있습니다. 우리가 인테르마리움에서 통합을 이뤄낸 것처럼, 세계 각지에서도 같은 일을 해볼 것입니다!"
 POL_london_style_tea:0 "차, 런던식으로"
 POL_london_style_tea_desc:0 "베크 장관은 유럽을 뒤덮는 혁명적 물결에 대한 영국의 두려움을 덜어 주기 위해 런던으로 갈 예정입니다. 영국이 품는 우려에는 일리가 있겠지만, 적어도 우리 폴란드에 대해서는 의심할 이유가 전혀 없습니다! 모든 일이 순조롭게 진행된다면, 영국의 광대한 산업이 우리에게 개방될 것입니다. 총과 전차, 함정을 구매할 수 있는 길이 열리는 것이지요. 운이 아주 좋다면, 아프리카 식민지 무역 계약도 체결할 수 있을지 모릅니다."
 POL_art_exhibition_soleil:0 "전시회, 르 솔레유에서"
 POL_art_exhibition_soleil_desc:0 "새로운 프랑스, 즉 ‘새 혁명 태양’은 우리의 자연스러운 관심을 끌고 있습니다. 폴란드 연방 내부에도 프랑스 혁명 세력에 매료된 이들이 있어, 이들과 함께 공동 전시회를 열 기회를 무척 반길 것입니다. 외교적으로도, 프랑스와의 동맹 관계를 되살릴 절호의 순간이 될 것입니다. 물론 일부 인사들은 우리의 독일 동맹국을 자극할까 우려하지만, 그럴 필요는 없습니다. 우리는 르 솔레유와 어떠한 군사 동맹도 맺으려 하지 않을테니 말이니까요."
 POL_handshake_in_berlin:0 "악수, 베얼린과 함께"
 POL_handshake_in_berlin_desc:0 "유럽의 혁명은 사방에서 우리를 말살하려는 반동 세력에게 포위되고 위협받고 있습니다. 우리는 혁명 유럽의 동부 전선에 불과하며, 전체 혁명의 안전을 전부 보장할 수는 없습니다. 그렇기에 서부 전선 역시 스스로를 단단히 지켜야 합니다. 혹독한 적이 우리를 노릴 때를 대비해야 합니다.\n\n우리 독일 형제들도 같은 투쟁을 겪고 있습니다. 사방에서 몰아치는 반동의 폭풍을 함께 버텨온 것은 우리 두 나라입니다. 둘 사이에 쌓인 공동 역사도 지워질 수 없습니다. 우리는 여러 전선에서 협력해야 하며, 그것이 성공적이면서도 번영하는 혁명을 이루는 길입니다. 우리는 이미 서방의 사상과 동방의 힘을 갖추었고, 적절한 협력이 없다면 아무것도 이룰 수 없습니다. 오직 협력으로만 모든 침략자를 억누를 수 있습니다.\n\n유럽에서 이 성스러운 형제애는 결코 깨지지 않을 것입니다. 북방의 왕도, 프랑스의 야만도, 오스트리아의 광신도, 러시아 곰의 무리도 우리를 갈라놓을 수 없습니다. 언젠가 반동 세력이 번영하는 혁명을 공격하여 혼란에 빠뜨리려 할 것입니다. 바로 그날, 적색 전선과 인테르마리움 양측 연합군이 모스크바, 빈, 그리고 르 솔레유를 행진할 것입니다. 혁명은 언젠가 라인과 드니에프르의 감옥을 뚫고 나와, 전 세계 대중에게 찬란한 혁명 사상을 전파할 것입니다. 만세, 영원한 국제 형제애여!"
 POL_when_you_cant:0 "“…그러지 못한다면...”"
 POL_when_you_cant_desc:0 "동지들이여, 지평선에 먹구름이 몰려들고 있습니다! 지난날의 균형은 이미 사라졌습니다. 프랑스와 독일은 노골적인 충돌 직전에 놓였고, 러시아도 곧 복수를 위해 돌아올 것입니다! 무기를 들고 일어납시다! 폴란드와 우리의 신성한 자유를 지키기 위해!"
 POL_slowackis_footsteps:0 "스워바츠키의 발자취를 따라"
 POL_slowackis_footsteps_desc:0 "우크라이나를 발전시킬 포괄적 계획을 마련할 것입니다. 이미 우리는 기틀을 마련했습니다. 독일의 투자가 크이우로 쏟아지고 있습니다. 이제 군사 역량을 제대로 발전시켜 마무리할 차례입니다. 그들의 군대를 뒷받침할 산업 단지와, 드니에프르 강의 요새가 다가올 러시아의 침공으로부터 우리의 측면을 지켜줄 것입니다."
 POL_correct_zygmunts_mistakes:0 "지그문트의 실수를 바로잡기"
 POL_correct_zygmunts_mistakes_desc:0 "독일 제국도 결코 우리를 가만두지 않았습니다. 이미 반쯤 무덤으로 들어간 그들이 쾨니히스베르크를 중심으로 목숨을 연명하고 있으며, 스웨덴과 러시아가 무기·물자 지원을 아끼지 않고 있습니다. 이들은 마치 우리의 옆구리에 박힌 가시처럼, 우리가 가장 취약해질 때 러시아 신호에 따라 바르샤바로 돌진해 올 것입니다. 국경에 요새를 세워야 합니다. 그단스크에서는 그들의 첩자를 몰아내고, 군대도 보강해야 합니다."
 POL_set_world_fire:0 "“…세계를 불태워라!”"
 POL_set_world_fire_desc:0 "인테르마리움의 군대들이여, 일어나십시오! 유라시아의 미래를 결정지을 마지막이자 가장 신성한 전쟁이, 바로 우리와 이 ‘모스크바 군중’ 사이에서 벌어질 것입니다. 러시아는 가진 모든 것을 동원해 우리를 공격하려 들 것이므로, 그들이 만반의 준비를 갖추도록 가만둘 수는 없습니다. 우리의 요원들을 그들 영토에 침투시켜 파괴 공작과 정찰 임무에 투입해야 합니다. 우리 사단들은 국경에 집결할 것입니다. 우리는 단결했고, 강력하며 이미 준비되었습니다!"
 POL_behind_the_lead_jagiello:0 "야기에우워를 뒤따라"
 POL_behind_the_lead_jagiello_desc:0 "발트 지역은 방어가 쉽지 않습니다. 따라서 우리는 다른 전략을 채택해야 합니다. 우리의 수장은 러시아와의 전쟁 시점을 가정해, 공세적 자세로 이 지역을 확보하겠다는 결정을 내렸습니다. 이러한 번개와도 같은 전쟁을 수행하려면 대규모 병참 준비가 필수적이므로, 리투아니아와 긴밀히 협력해야 합니다.\n\n이를 위해서는 빌뉴스와의 합의가 필수입니다. 우리 민족주의자들은 러시아 차르와 맺었던 자치 협정에 대해, “독립했으니 이제야말로 페트로그라드가 우리에게 준 역사적 영토를 되찾아야 한다”면서 수년간 리투아니아 합병을 선동해 왔습니다. 하지만 지금 독립한 우리가 예전에 받았던 그 땅을 포기할 수 있느냐는 문제입니다. 과거식 배타적 쇼뱅주의에 굴복한다면 결국 리투아니아를 잃고 말 것입니다. 우리는 공식적으로 해당 지역에 대한 잠재적 영유권 주장을 철회할 것입니다. 그럼으로써 리투아니아의 신뢰를 회복하고 내부 안정을 지키려 합니다. 설령 우리 급진 민족주의자들이 불만을 가져도 어쩔 수 없습니다."
 POL_memory_of_kosciuszko:0 "코시치우슈코를 기리며"
 POL_memory_of_kosciuszko_desc:0 "러시아가 벨라루스 국경을 침범한다면, 우리는 벨라루스를 방어하기 위해 달려갈 것입니다. 하지만 이 땅 한 치를 사수하느라 시간을 허비할 생각은 없습니다. 곧 닥쳐올 전쟁에 대비할 수 있도록 지원을 보내긴 하겠지만, 벨라루스는 우리가 목숨 걸고 지킬 만큼 중요한 곳은 아닙니다. 만약 러시아가 지나치게 많이 밀고 들어오면, 우리는 이 지역의 댐을 폭파해 그곳을 엉망진창으로 만들 비밀 계획을 마련할 것입니다. 그렇게까지 원하는 늪이 있다면 마음껏 가져가도록 두는 것이지요."
 POL_confrontation_with_ivan:0 "이반 뇌제와의 대치"
 POL_confrontation_with_ivan_desc:0 "러시아가 움직이기 시작했습니다. 우리와 우리의 모든 동맹국은 독립을 얻은 순간부터 이 상황에 대비해 왔습니다. 발트해 주변 상황을 정확히 파악하고, 정보망을 개선해야 합니다. 지금 당장 전쟁이 발발하지 않더라도, 우리는 여전히 적대 관계입니다. 그들이 우리보다 먼저 유리한 고지를 차지하기 전에, 우리가 선제적으로 전략적 우위를 확보해야 합니다."
 POL_war_of_civilizations:0 "문명의 전쟁을 촉발하라!"
 POL_war_of_civilizations_desc:0 "제2차 빈켈리에트 전쟁이 우리 눈앞에 다가왔습니다! 우리의 군대는 러시아라는 야수를 향해 공격을 개시할 것입니다. 수백만이 살기 위해 죽어갈 것이지만, 우리는 반드시 ‘완전한 승리’를 이룩해야 합니다. 우리의 깃발을 하르키우, 모스크바, 페트로그라드 위에 휘날리게 합시다! 우리의 가장 치명적인 적에게 결코 자비를 베풀지 마십시오!"
 POL_rally_balts:0 "발트국을 집결하라"
 POL_rally_balts_desc:0 "라트비아와 에스토니아는 수 세기 동안 자유를 갈망해 왔습니다. 러시아는 이들의 땅을 군사기지로 만들어 버렸습니다. 프스코브에 있는 그들의 요새에서 방어 작전이 아무 방해도 받지 않고 이루어지고 있습니다. 발트 게릴라들이 후방에서 전투에 가담하면, 우리가 적보다 우위를 점할 수 있을 것입니다. 그들의 애국자 의용병들을 불러모으고 그 민족들에게 봉기를 호소하십시오. 마침내 해방의 날이 찾아왔습니다."
 POL_smolensk_crusade:0 "스몰렌스크 십자군"
 POL_smolensk_crusade_desc:0 "우리군은 러시아 전선을 꿰뚫기 위한 ‘진정한 예술 작품’을 준비해 왔습니다. ‘작전 호트키에비치'로 명명된 이 계획은 스몰렌스크를 전격 타격해 러시아 전선을 분단하고, 모스크바로 향하는 길을 열기 위한 것입니다. 다만, 이처럼 복잡한 작전에 막대한 자원을 쏟아부었으니, 만약 실패한다면 이 규모의 기회를 다시 잡기 어려울 것입니다. 각별히 주의해야만 합니다."
 POL_recruit_oppressed:0 "억압받는 자들을 모아라 "
 POL_recruit_oppressed_desc:0 "러시아라는 거대한 괴수를 피해 우리 국경 안으로 피신해 온 망명자들이 많습니다. 이제 그들은 과거 자신들을 억눌렀던 자들에게 복수를 할 기회를 얻었습니다. 타타르, 코사크, 카자흐, 아제리족, 그리고 자국의 제국주의에 염증을 느낀 러시아인까지, 모두가 ‘국제 여단’에 참여해 이 ‘모스크바 제국’과 맞서 싸우고 있습니다. 이들만 있는 것도 아닙니다. 여러 무슬림 반군도 우리 십자군을 긍정적으로 바라보는 편입니다. 그러나 어떤 이들은 급진 세력을 끌어들이면 우리의 노력이 왜곡될 수 있으며, 그들이 훗날 세울 정권에 힘을 싣게 될 것이라고 우려합니다. 참모총장이 이들과의 협력 범위를 어떻게 조정할지 결정해야 할 것입니다."
 POL_promethean_fire_eurasia:0 "전 유라시아에 ‘프로메테우스의 불꽃’을!"
 POL_promethean_fire_eurasia_desc:0 "우리의 전선은 이미 모스크바, 페트로그라드, 볼가 강을 넘어섰습니다. 러시아는 사실상 패배했습니다. 그들이 잃어버린 대의를 위해 여전히 싸운다고 해도, 항복은 시간문제일 뿐입니다. 우리는 이들이 한때 러시아라 불리던 시체의 잔해에서 해방된 대중에게 미리 승리를 선언할 수 있습니다. 이제 이 나라는 과거 한때를 떠올리는 어두운 기억일 뿐이며, 찬란한 미래 앞에서 사라져 갈 것입니다. 승리는 우리 것입니다!"
 POL_millennium_polish_imperium:0 "폴란드 천년기"
 POL_millennium_polish_imperium_desc:0 "페트로그라드, 모스크바, 노보니콜라옙스크, 하르빈, 블라디보스토크… 이 모든 도시 위에 폴란드 깃발이 거침없이 펄럭이고 있습니다. 세계사적 사명을 우리는 완수했습니다. 축하하십시오, 폴란드인이여! 축하하십시오, 인테르마리움 동지들이여! 가장 비참했던 패권의 시대가 드디어 끝났습니다. ‘팍스 폴로니카’의 시대가 우리를 부릅니다! 모스크바의 채찍은 바르샤바의 부드러운 손길로 대체되었습니다. 시베리아, 투르케스탄, 캅카스, 심지어 모스크바와 카잔의 사람들까지 환호하십시오! 여러분은 이제 자유입니다. 폴란드가 여러분의 땅을 지키는 한, 그 자유는 빼앗기지 않을 것입니다."
 POL_scratching_the_sky:0 "하늘에 손을 뻗다"
 POL_scratching_the_sky_desc:0 "러시아는 오랫동안 엄청난 자원을 발밑에 두고도, 그 축복을 온전히 활용하지 못했습니다. 이제야 그 부당한 현실이 바로잡혔습니다. 진정한 국가인 폴란드가 마침내 이 자원을 제대로 쓸 수 있게 되었기 때문입니다. 우랄과 도네츠 분지, 그 너머의 풍부한 광물을 연료로 삼아, 마천루부터 철도·고속도로·자동차·총기·전차·비행기에 이르기까지 무수한 생산물이 공장의 화로에서 태어나게 될 것입니다!\n\n바르샤바는 마침내 뉴욕과 르 솔레유의 도시들에 비견될 수 있게 되었습니다. 새로운 고딕 양식의 탑이 폴란드와 그 새 영토 전역에서 솟아올라, 한때 모스칼 지배 아래 놓였던 과거를 완전히 지워 버릴 것입니다."
 POL_no_time_laurels:0 "영예에 취할 시간은 없다"
 POL_no_time_laurels_desc:0 "축하 행사는 끝났습니다. 이제 다음 과업이 우리를 기다립니다. 새 제국을 안정시키는 일은 그 정복만큼이나 고된 과정이 될 것입니다. 우리는 온갖 무장 세력, 예컨대 체첸 이슬람주의자·튀르크계 분리주의자·이름조차 발음이 어려운 지역의 민족주의자들에게 무기를 쥐여 주었습니다. 그들이 멍청한 짓을 하는 것이 과연 우리의 탓이겠습니까? 하지만 현실은, 이들이 우리가 힘겹게 탈출시킨 ‘암흑 시대’로 다시금 우리 영토를 끌고 가려 한다는 사실입니다. 우리의 육군은 유라시아 전역에서 존재감을 확보해야 합니다. 병사와 무기는 아무런 방해 없이 태평양에 다다를 수 있어야 합니다. 그리고 우리는 반드시 그렇게 만들 것입니다."
 POL_pilsudski_avenue_construction:0 "피우수트스키 대로 건설"
 POL_pilsudski_avenue_construction_desc:0 "폴란드는 이제 시대의 기념비가 될 ‘피우수트스키 대로’를 마침내 자랑스레 바라볼 수 있게 되었습니다. 원수의 기마 동상과, 르 솔레유에 있는 것조차 무색하게 할 웅장한 개선문이 대로의 시작을 장식하고 있습니다. 폴란드인들은 그곳을 거닐며 또 다른 위대한 조형물을 감상합니다. 바로 새롭게 세워진 폴란드 라디오 하우스, 화려한 호텔들, 국가 부처를 상징하는 신전 같은 건물들, 탁 트인 공원들, 그리고 대로의 끝자락에 서 있는 폴란드의 새 국립 대성당 ‘신성 섭리의 성전’입니다.\n\n이로써 바르샤바는 고대 로마를 연상시키는 대도시로 변모했습니다. 빈민가는 사라졌고, 온 도시에는 전기가 공급 되고있습니다. 트램과 자동차가 벌집 속 일꾼들처럼 도로를 누비며, 시민들은 마침내 가장 현대적인 편의를 누리고 있습니다. 이것은 끝이 아니라 시작입니다. 곧 폴란드의 모든 도시가 수도의 본보기를 따르게 될 것입니다."
 POL_realization_of_wildest_dreams:0 "우리가 꿈꿔 온 가장 대담한 꿈의 실현"
 POL_realization_of_wildest_dreams_desc:0 "러시아라는 괴물을 두려워하던 시대는 끝났습니다. 우리가 스스로를 완전히 방치해 썩어갈 수는 없겠지만, 이제 어느 정도는 휴식을 허락해야 합니다. 사나치아가 맡은 과업은 완수되었으니, 다음은 무엇을 할 것입니까?\n\n지금이 아니라도 언젠가는 우리가 정복한 유라시아에 적합한 형태를 부여해야 할 것입니다. 이미 여러 목소리가 서로 충돌하며 앞으로의 방향을 놓고 다투고 있습니다. 어떤 이들은 우리가 구해 준 ‘하위 민족’들 위에 ‘진정한 폴란드의 지배’를 세워야 한다고 주장합니다. 그들은 우리에게 감사해야 마땅하다는 것입니다. 러시아의 멍에 아래서 여전히 고통받았을 텐데 우리 덕분에 해방되었다고요. 반면, 어떤 사람들은 우리와 ‘모스칼놈들’을 엄격히 구분하지 않으면, 우리가 그들과 똑같이 잔혹해질 거라며 우려합니다. 뭐가 되었든, 지금 당장 우리의 큰 관심사는 아닙니다. 그들은 실컷 떠들게 두십시오. 폴란드는 자기 할 일을 마쳤고, 이제 영광과 부를 마음껏 누리면 그만입니다."
 POL_entering_new_age:0 "멋스럽게 새 시대를 맞이하기"
 POL_entering_new_age_desc:0 "그렇다면 나머지 세계는 어떻겠습니까? 우리가 유라시아라는 상아탑에 틀어박혀 있을 필요는 없습니다! 누구와 손잡을 수 있고, 누구와 동맹 맺어야 하며, 또 누구와 싸우게 될까요? 국제 정세를 좀 더 가까이 살펴봅시다."
 POL_full_development_all:0 "1950년까지 전국 완전 개발!"
 POL_full_development_all_desc:0 "빈켈리에트 전쟁은 유라시아 북부 전역을 황폐화시켰습니다. 이제 ‘팍스 폴로니카’가 미치는 모든 땅에 대해 진지한 재건 작업을 시작해야 합니다. 우리는 해방시켜 준 각 민족에게 약속했던 바를 지켜야 하는 것이 마땅합니다. ‘프로메테우스 계획’은 서부 러시아였던 지역부터 시작해 태평양까지 확대될 것입니다. 폴란드만이 아니라 발트 지역, 모스크바 주변, 시비리, 튀르케스탄, 그리고 황루스 등 모든 곳을 현대적인 국가로 바꾸어 낼 것입니다. 물론 그 중심에는 백-적 깃발이 휘날릴 것입니다!"
 POL_polonia_triumphans:0 "\"승리의 폴로니아\""
 POL_polonia_triumphans_desc:0 "새 시대, 새 세계, 새 질서.\n\n폴란드는 권력과 영광을 향한 여정에서 끝없는 경지에 도달했습니다. 앞으로 수 세기가 지나도, 우리의 후손들은 발레리 스와베크, 사나치아, 드니에프로·돈·비스와 강을 가로지른 치열한 전투에 대해 이야기할 것입니다. 유라시아의 민중은 우리가 선사한 자유를 기억할 것입니다.\n\n하지만 이를 확고히 하려면 우리의 노력을 계속해야 합니다. ‘폴란드의 세계’는 유라시아 곳곳에서 새로 태어날 무분별한 반란을 막기 위해 항상 대처할 태세를 갖춰야 합니다. 우리의 완벽한 정치·경제 체제도 올바른 사람들이 조타를 잡고 있어야 미래의 오류를 교정할 수 있습니다. 우리는 이카루스처럼 해에 너무 가까이 날아 사그라지지 않을 것입니다. 폴란드의 미래는 우리가 계속 지키는 한 영속할 것입니다."
 POL_boleslaw_rise_from_dead:0 "볼레스와프여, 죽음에서 일어나라!"
 POL_boleslaw_rise_from_dead_desc:0 "폴란드 역사 속에는, 폴란드를 바티칸 손아귀에서 구하길 시도했던 지도자가 있었습니다. 주교 스타니스와프는 폴란드를 배신한 자였음이 명백하지만, 900년이 지난 지금까지도 가톨릭의 거짓이 반복됩니다. ‘관대공 볼레스와프 2세’에 대한 중상모략은 이제 끝나야 합니다. 그는 폴란드를 구하려고 했을 뿐, 외국 사제들은 그를 쫓아내고 대신 그의 동생을 앉힌 것입니다. 우리는 그의 이름과 초상을 기수에 새기고, 그가 밟았던 길을 뒤따르겠습니다. 성직자들의 지배 체제를 전복하고, 966년에 범했던 폴란드의 최대 실책을 바로잡을 임무에 착수해 볼레스와프의 정신을 되살릴 것입니다. ‘검은 인터내셔널’은 몰락하고, 폴란드는 다시 일어설 것입니다."
 POL_black_days_chernobog:0 "체르노보그의 암흑기"
 POL_black_days_chernobog_desc:0 "우리가 일으킨 돌발적 에너지는 아직도 사람들 기억에서 사라지지 않았습니다. 폴란드군 내부에는 우리를 타도하고 권력을 빼앗을 준비를 하는 여러 파벌이 있습니다.\n\n다시 한번 돌발적 기세로, 우리의 권력에 반대하는 자들을 박멸해야 합니다. 우익을 굴복시키고, 인터내셔널 좌파를 복종시켜야 합니다. 행동은 즉흥적이면서도 조직적으로 이루어져, 논란이 우리에게 쏠리지 않도록 해야 합니다.\n\n분노한 학생들이 벌이는 린치나 공격은, 연합회복권 내부에서 반대파가 연설을 시도할 때 효과적일 것입니다. 귀족 저택을 공격하는 깡패와 우리가 파견한 사람들이 구별되지 않도록 해야 합니다. 다만, 우리 칼잡이들의 움직임을 주의 깊게 지켜봐야 합니다. 우리는 소수민족의 친구는 아니지만, 갈리치아에서 우크라이나 민족단 테러리스트들이 활개치도록 두어서는 안 됩니다.\n\n거리에는 피가 넘쳐흐르고, 수많은 이들의 머리가 포장도로 위에서 깨지게 될 것입니다. 동포의 피를 흘리는 것을 영광으로 여기지는 않지만, 이는 반드시 필요한 일입니다."
 POL_sinful_souls_dazhbog:0 "다즈보그의 죄 많은 영혼들"
 POL_sinful_souls_dazhbog_desc:0 "깨끗하고 용감하며, 과거 세기의 썩어 문드러진 냉소에 물들지 않은 그들은 학생, 젊은 민족주의자, 활동가들입니다. 옛 피우수트스키의 유혹과 썩어버린 엔데치아의 시체에 억눌려 있습니다. 이 젊은이들이 분노를 표출할 대상이 필요합니다! 파괴하고픈 욕망이 가득한 그들에게 어떤 활동을 제공해야 합니다. 대학과 단체에서 얀 스타흐니우크의 철학을 꿀술 들이키며 토론하게 한 뒤, 신의 영광 대신 국가의 영광을 칭송해야 한다고 주장하며 가톨릭 사제와 부제를 조롱하는 시를 읊도록 해보십시오. 이는 교회 문제에 대한 우리의 최종 견해가 아니므로, 은밀히 진행해야 합니다. 그들이 스스로를 억누르는 과거 유령들을 떨쳐 낼 수 있도록 하는 것입니다! 순수한 영혼, 즉 백지같은 그들의 정신을 올바르게 채우는 것은 우리의 임무입니다! 폴란드 민족의 동질성을 흡수하기 위한 싸움에서, 먼 구석에 숨은 드모프스키놈의 잔재들을 타격해야 합니다. 피우수트스키는 반대자를 유혹하는 데 열심이었지만, 우리야말로 최종 작업을 완수해 이 “새 자드루가의 폴란드”를 대적하는 괴물을 죽여야 합니다."
 POL_we_slayers_stanislaw:0 "우리, ‘스타니스와프를 죽인 자들’"
 POL_we_slayers_stanislaw_desc:0 "우리는 권력을 장악하는 데 성공했지만, 지금은 시작의 시작일 뿐입니다. 앞으로 어느 방향으로 갈지를 결정해야 합니다. 스타니스와프 수칼스키는 젊은 민족주의자들과 사나치아의 지지를 받아 카리스마 있는 지도자가 되었고, 이 운동을 통제할 만한 위치에 있습니다. 하지만 문제는 그가 과연 적합한 인물인가 하는 것입니다. 그의 사상은 빛나면서도 괴이한 면이 있기 때문입니다.\n\n얀 스타흐니우크와 얀 헴펠은 이를 위험하다고 보고, 자드루가 혁명이 ‘폭력의 향연’으로 끝나거나 이 운동이 원시화될 수 있다고 경고합니다. 그들은 슈칼스키가 물러나야 하며, 자드루가 정신에 더 충실한 강경 정책과 해법을 요구합니다.\n\n한편, ‘이단적 가톨릭신자’로서 신이교주의자들 사이에 존재하는 볼레스와프 피아세츠키는 정반대 견해를 지닙니다. 그는 슈칼스키의 기괴함이 사실상 실용적 측면을 갖췄다고 보고, 이를 지지합니다. 다만 그가 실제로는 자드루가 운동을 변질시킬 의도가 있다는 의심도 많습니다.\n\n결론이 무엇이든, 누가 옳은지 결정해야만 합니다."
 POL_smoke_fogies:0 "‘꼰대들’을 날려 버리자"
 POL_smoke_fogies_desc:0 "젊은 민족주의자들은 단결해야 합니다. 피우수트스키는 영리하게도 민족 진영을 여러 갈래로 쪼개 서로 잡아먹게 만들었습니다. 하지만 이제 피우수트스키는 없고, 우리가 있는 폴란드는 젊고 활력 있는 요소가 필요합니다. 이 땅 즉 ‘이 지구’를 새롭게 만들기 위해서입니다.\n\n‘청년군단’, ‘엔데치아의 잔당’, ‘우리 학생들’, ‘아나키스트’, ‘기에드리오치의 중세주의자들’ 등은 진정한 폴란드 민족주의를 상징하는 우리의 깃발 아래 뭉쳐야 합니다.\n\n억눌린 에너지를 분출할 기회로, 우리는 적들과 그 우상들에게 창조적 파괴를 가하도록 유도할 것입니다. 교회, 기념물, 신문사, 미술관 등이 우리 목표가 됩니다. “국가의 이름으로 하는 반달리즘”이라는 구호 아래, 젊은이들에게는 ‘즐거운 파괴’를 경험하게 해주고, 동시에 그들 머릿속에서 성직자적·자유주의적 국제주의 영향을 걷어 낼 수 있을 것입니다."
 POL_futurism_we_are_worse:0 "미래주의? 우리는 더 심하지!"
 POL_futurism_we_are_worse_desc:0 "브루노 야시엔스키의 비전은 혐오스러울 정도로 유토피아적입니다. 그는 스테판 제롬스키의 화백들에게서 직접 꺼내 온 듯한 유리집의 복음을 전하면서도, 스스로를 마르크스주의 예언자처럼 내세우고 있습니다. 미래주의자, 스카만드라이트, 크라쿠프 아방가르드, 청년 폴란드의 구 작가들, 속물, 지주들, 형체주의자들(Formizm), 비트카치 추종자, 현실주의 작가들, 가톨릭 신자, 보수주의자, 반 근대주의자 등 이들은 모두 ‘위대한 폴란드 사상’에 맞서는 적입니다. 우리가 추구하는 폴란드는 대장장이, 위선적인 성직자, 숭배되는 노동자 계급이 아니라, ‘위대한 인물’, ‘위대한 과학자’, ‘위대한 전사’로 구성된 민족이 되어야 합니다. 그런 세상을 이해하지 못하면서도 스스로 민족의 양심이 되고 싶어 하는 저 우매한 무리들에 맞서, 폴란드인은 하나의 거대한 운동으로 결집해야 합니다! 20세기의 진정한 대 프로젝트는 오직 우리가 만들어 낼 수 있으며, ‘자드루가 정신’이야말로 유일하게 정당한 전진 방향입니다. 많은 이들이 마야콥스키를 두려워하고, 또 어떤 이들은 마리네티를 경계하지만, 진실은 그보다 큽니다. 결국, 그들이 정말로 두려워해야 할 존재는 바로 우리입니다."
 POL_men_like_gods:0 "신과 같은 인간, 인간 같은 신"
 POL_men_like_gods_desc:0 "현대인은 본질적으로 노예 근성을 지닌 존재, 옛 영웅들과 견줄 수도 없는 겁쟁이라 말하는 이들이 많습니다. 어느 정도 인정합니다. 그러나 새로운 것을 창조할 능력 없이 그를 영원히 파멸에 맡기는 반동 세력과 달리, 우리는 그를 어떻게 변혁시킬 것인가를 고민합니다. 그리고 그 해법은 아주 간단합니다. 현대는 영웅을 필요로 합니다. 광인을 필요로 하며, 돈키호테와 네차예프 같은 존재들도 요구합니다. 행위는 바로 의지가 될 것이고, 사르마티아인이자 ‘해방된 초인’인 우리는 세계를 마음대로 길들일 것입니다. 더 이상 ‘평범한 폴란드인’이라는 것은 없을 것이며, 대신 ‘사슬 풀린 금발의 짐승’인 사르마티안만 존재할 것입니다. 아퀴나스가 언급했던 ‘언덕 위의 도시’가 곧 실현되고, 우리 자드루가의 후예들이 그곳의 왕이 될 것입니다. 아니, 왕을 넘어 신이 될 것입니다!"
 POL_bring_hussars_fold:0 "후사르 복속 "
 POL_bring_hussars_fold_desc:0 "‘죽음 후사르’는 부랑자, 무슬림, 폴란드 군단의 베테랑, 극단주의자, 테러리스트, 그리고 범죄적 증언자들로 이뤄진 집단입니다. 이들의 임무 범위가 방대해서 효율성이 떨어지는 면도 있는데, 이는 우리에게 유리하기도 하고 불리하기도 합니다.\n\n우리는 지들이 뭐라도 된것마냥 행동하는 군사·경제 구조를 부패시키는 이들 갱단 행위를 분명히 척결해야 하며, 동시에 개별적 약점을 공략할 수도 있습니다. 하지만 한편으로는 이 부대를 굴복시킨 뒤에 어떻게 처리할 것인가 하는 심각한 문제가 생깁니다.\n\n스와베크, 시미그위, 다신스키가 다투던 동안, 후사르 부대는 특별한 행동을 취하지 않고 조용히 있었을 뿐입니다. 그들이 우리 조직에 해가 되는 행동을 벌이기 전에, 먼저 우리는 그들의 신뢰를 얻어야 합니다. 구조에 대한 더 큰 통제력을 얻는 대가로 약간의 양보를 해주는 것이 상호 이익일 것입니다."
 POL_messengers_of_krak:0 "크라크왕의 전령들"
 POL_messengers_of_krak_desc:0 "이제 수칼스키의 권력을 폴란드에서 확고히 할 때가 되었습니다. 자드루가, 그리고 특히 볼레스와프 피아세츠키의 이단적 가톨릭 세력 덕택에 젊은 활력주의적 민족주의가 마땅히 누릴 왕좌를 차지하게 되었습니다. 사나치아는 잠재된 에너지를 효율적인 전체주의 국가 모델을 통해 분출시키는, 순수한 신 낭만주의 기구로 탈바꿈할 것입니다.\n\n우리는 피우수트스키가 이뤄 낸 것을 파괴하지 않을 것입니다. 오히려 그의 업적은 우리가 미래 폴란드를 건설할 때 원동력이자 토대가 될 것입니다. 스타흐니우크나 헴펠같은 이들이 그저 공허한 철학적 구호 뒤에 숨어 있길 바라겠지만, 우리는 그러지 않을 것입니다. 우리의 정부는 ‘정신의 정부’이자 ‘행동의 정부’가 되어야 하며, 어느 하나가 없으면 다른 하나도 있을 수 없습니다.\n\n우리는 무기력하게 서서 사태가 저절로 풀리길 기다릴 수 없습니다. 폴란드는 새 천년의 문턱에 서 있고, 국제주의 영향과 자유주의자들이 우리의 타고난 권리를 빼앗아 가지 못하도록 하는 것이 바로 우리의 과업입니다."
 POL_pilsudski_magnus_custos:0 "피우수트스키, 위대한 수호자"
 POL_pilsudski_magnus_custos_desc:0 "우리 땅에는 새로운 신앙이 태어날 것입니다. 옛 사나치아의 신앙과, 유제프 피우수트스키라는 인물에게 품었던 희망이 결합되어 생길 것입니다. 우리는 피우수트스키가 인간을 초월한 존재였다고 말합니다. ‘폴란드의 헤라클레스’라 할 만한 진정한 반신반인으로서, 예외적인 인물이었습니다.\n\n더 나아가, 피우수트스키는 위대한 신 ‘보고제우’의 화신이었습니다. 과거와 미래에 걸쳐 연방을 수많은 위험에서 지켜 준 네 개의 얼굴을 지닌 영이었지요. 우리는 조상들의 신앙으로 돌아가, 진정한 폴란드 신에게 합당한 경의를 표해야 할 때입니다. 고대에는 그 신을 ‘스비아토비트’라 불렀습니다.\n\n최고 지도자이자 대사제가 된 수장 수칼스키는 이 신앙을 사회에 퍼뜨리기 시작할 것입니다. 우리는 피우수트스키와 보고제우를 기리는 새 성전과 기념물을 건립하겠습니다."
 POL_arise_mlodzarmia:0 "일어나라, 무차르미아여!"
 POL_arise_mlodzarmia_desc:0 "드모프스키 밑에서 청년들은 무기력하고 어떤 행동에도 부정적이었습니다. 심지어 숭고한 기억 속 인물인 원수조차 청년 군대가 지닌 잠재력을 완전히 이끌어 내지 못했습니다. 우리는 연합회복권과 군대 안에서 숙청을 지속해야 합니다. 형식적 절차를 밟는 것은 당연하되, 연줄로 지위를 누려 온 옛 장군들도 제거해야 합니다.\n\n군대는 싸우고 싶어 안달이 나 있으며, 용감한 젊은이들로 구성된 집단이 되어야 합니다. 에스카드롱처럼, 우리는 ‘동성애적 전우애’의 불길을 다시 지펴, 젊은이들이 ‘전쟁’이라는 최고의 학교에서 단련될 수 있도록 하겠습니다.\n\n물론 이런 조치로 인해 대학 인적 자원이 줄어들겠지만, 우리에겐 시험대가 기다리고 있습니다. 유럽은 전쟁을 준비하며 붉게 물들어 가고 있습니다. 콜차크가 시골 농민들을 모아 폴란드와 우리 동맹국을 위협하려 할 때, 우리가 가만히 있을 수는 없습니다. 젊은이들이 아름답게 죽도록 하여, 미래 세대가 아름답게 살 수 있도록 하겠습니다."
 POL_dyologos_love_fight:0 "디오로고스, 사랑과 투쟁"
 POL_dyologos_love_fight_desc:0 "당신들에게는 단 두 가지 계율만 있을 것입니다! 삶을 사랑하라, 그리고 그 삶을 위해 싸우라! 열정과 욕망으로 가득 차십시오. 우리의 문화는 퇴폐적이되 무기력하지 않아야 합니다. 춤과 창조성으로 가득 차야 하고, 돌발적 에너지를 분출해야 합니다.\n\n여기에는 스타흐니우크가 내세우는 복잡한 ‘문화주의 철학’ 같은 것이 없습니다. 어느 정치 운동도 그런 복잡한 철학을 필요로 하지 않습니다! 자드루가란 것은 명확한 계율이 아닌, 막연한 감정의 집합일 뿐입니다.\n\n우리는 폴란드의 신앙과 윤리가 기독교처럼 무기력하고 차갑고 현실에서 동떨어지도록 내버려 두는 실수를 범하지 않을 것입니다. 우리가 아름답고 젊기에, 세상이 ‘아름다움’에 의해 멸망해도 좋습니다."
 POL_praise_arian_brethren:0 "‘아리안 형제’ 찬양"
 POL_praise_arian_brethren_desc:0 "가톨릭 교회는 국제적이고 코스모폴리턴적인 기구로서 폴란드 민족에 적대적입니다. 하지만 좋은 그리스도인들도 있습니다. 볼레스와프 피아세츠키는, 공동체의 어두운 면만 부각하기보다 ‘국가 교회’ 혹은 ‘폴란드에 우호적 애국 사제들’을 활용해야 한다고 제안합니다.\n\n완전히 폴란드적인 종교 공동체를 세우려는 긍정적인 시도도 많습니다. 새로운 폴란드 형제단을 이끄는 카롤 그리치-시미워프스키는 우리가 활용해야 할 중요한 인물입니다. 하나의 신앙, 즉 ‘폴란드성’을 통해 종교 평등을 이뤘던 조상들의 본보기 역시 따를 만합니다.\n\n수장 수칼스키은 신이교 프로젝트를 계속 진행할 수 있을 것이며, 동시에 기독교와 보고제우의 사원이 서로 평화와 이해 속에 공존하도록 만들 것입니다."
 POL_copernican_revolution:0 "정신의 코페르니쿠스 혁명"
 POL_copernican_revolution_desc:0 "수칼스키는 피아세츠키와 의견이 다릅니다. 교회를 부드럽게 대할 수 없다는 것입니다. 우리의 해법은 절대적이어야 합니다. 교회는 국가에 충성하는 사제 네트워크로 내부에서 썩게 해야 하고, 동시에 안팎에서 공격을 가해야 합니다. 스타니스와프 수칼스키의 종교 프로젝트는 폴란드의 전 과거와 전 미래를 화해시키는 것입니다.\n\n우리는 스비아토비트를 숭배할 것입니다. 네 개의 얼굴과 네 개의 아바타를 지닌 신이며, ‘독수리 신’이라 불립니다. 그 예언자는 카지미에시 대왕, 니콜라우스 코페르니쿠스, 아담 미츠키에비치, 유제프 피우수트스키 등입니다.\n\n이는 국가를 위한 새로운 영적 형성이자, 선기독교 신앙과 미래지향적 전체주의 사상을 결합한 새로운 종교가 되어 폴란드의 새 얼굴이 될 것입니다. 교회에 맞선 투쟁은 자유롭게 이뤄져야 효과적입니다. 헴펠이 바라는 것처럼 과도한 적대감을 드러내선 안 됩니다. 그것은 ‘포위 심리’를 초래할 테니까요. 독수리 신 질서에 대한 새 신앙은 기독교의 비탄적 계율을 넘어서는 ‘즐거운’ 믿음이어야 합니다."
 POL_one_nation_one_will:0 "한 성스러운 의지 아래 단일 민족!"
 POL_one_nation_one_will_desc:0 "민주 국가라는 것은 과거의 산물이며, 민족의 미래에 걸맞지 않습니다. 피우수트스키는 민족민주주의로 나아가는 데 큰 발걸음을 뗐지만, 그것만으로는 충분치 않았습니다. 아무리 거대한 기여를 했어도, 결국 그는 민족의 ‘지도자’가 아니라 ‘봉사자’였을 뿐입니다.\n\n이제 수칼스키가 새로 공식적인 나첼니크가 되어 이 상황을 바꿀 것입니다. 연합회복권은 ‘민족 정치 기구(OPN)’로 개칭되고, 볼레스와프 피아세츠키가 그 수장에 오를 것입니다. 이러한 정치적 ‘이원 지도체제’는 사나치아의 병폐를 피하면서도, 전체주의적이고 효율적인 국가 모델을 유지할 수 있게 합니다.\n\n현실을 직시합시다! 자드루가식 자발적 열정만으로는 강력하고 현대적인 국가를 만들 수 없습니다. 헴펠과 스타흐니우크는 권력을 유지하되, 그 역할은 관료적으로 축소될 것입니다. 폴란드를 부활시키는 유일한 길은, 급진적이면서도 활력주의적 권위주의 정권을 통해 국가 전체를 조화시키는 것뿐입니다."
 POL_commandments_stoigniew:0 "스토이그니에프의 계율"
 POL_commandments_stoigniew_desc:0 "우리는 수칼스키나 피아세츠키에게 개인적 반감은 없지만, 분명한 사실은 폴란드가 기사와 ‘착한 가톨릭’, 혹은 ‘피우수트스키가 화신인 독수리 신’ 같은 동화에 기대 살 수는 없다는 것입니다. 무정부주의자 얀 헴펠과 ‘창조적 전체주의’를 옹호하는 얀 스타흐니우크가 손잡은 것은 예상 밖이지만, 동시에 아주 놀라운 일도 아닙니다. 힌두교에 관심이 많고 무신론자인 헴펠은, 스타흐니우크처럼 ‘자유분방한 위계'를 통해 폴란드가 구원될 수 있다고 봅니다. 피아세츠키는 수많은 경제학자 중 하나로 전락할 것이며, 슈칼스키는 궁정 예술가라는 안전하고 한가한 위치로 밀려날 것입니다. 자드루가가 몇몇 인물만 믿고 존재하는 작은 프로젝트가 아니며, 폴란드 전체가 거대한 문화혁명을 만드는 ‘건설 현장’이자 ‘건축가’임은 자명합니다."
 POL_ideomatrix_our_hands:0 "우리 손안의 관념적환경"
 POL_ideomatrix_our_hands_desc:0 "종교, 교육, 예술 이는 어떤 민족이 살아남을지, 아니면 개처럼 흐느끼며 죽어갈지를 결정짓는 ‘관념적환경’의 일부일 뿐입니다. 가톨릭은 정복자와 위대한 인물을 증오하는 반문명적 종교이며, 이들이 생각하는 이상적 가톨릭인은 자기 모든 성과를 교회에 바치고 신 앞에 무릎 꿇는 자입니다. 인간은 그저 ‘순수 생물학’과 상위 존재에 대한 공포나 먹고사는 문제인 원시적 충동에 전 생을 소모하는 유인원이 아닙니다. 우리는 슬라브족을 ‘영웅주의와 집단주의’를 특징으로 하는 초민족으로 재정의할 새로운 문명에 관한 '관념적환경'을 창조해야 합니다. 슬라브는 개별 국가나 개인을 뜻하는 것이 아니라 ‘세대를 이어 가는 연속체’입니다. 그러므로 우리는 선조와 후대를 모두 실망시켜서는 안 됩니다. ‘새로운 영웅적 폴란드’가 무릎에서 일어설 것입니다."
 POL_past_without_past:0 "과거 없는 과거"
 POL_past_without_past_desc:0 "우리는 그저 곧 토기나 나무로 된 마을 정도의 유산밖에 없는‘기독교 이전의 슬라브’을 기반으로 문화를 만들 만큼 어리석지 않습니다. 폴란드는 수 세기 동안 중요하지 않은 국가였고, 유럽의 변방이었으며, 가톨릭 교회와 군주-메시아주의에 휘둘려 대국이 될 기회를 잃었습니다. 이런 ‘문화적 공허’ 앞에서 우리가 취할 자세는 ‘반역’ 말고 없습니다. 그것도 ‘창조적 반역’으로서, 천 년 혹은 이천 년 동안 이어져 세계의 본보기로 자리 잡을 ‘새로운 폴란드 문화’를 만드는 것입니다. 이는 ‘과거의 사슬’에서 해방되어 더 나은 내일을 모색하기 위한 투쟁입니다. 우리가 해야 할 일은 선조들이 경험하지 못했던 새로운 역사를 만들어 내는 것이며, 이를 위해서는 전 폴란드적인 헌신과, 폴란드 역사 전반에 대한 감정·생물학적 태도의 변화를 요구합니다."
 POL_stumps_of_wspakultura:0 "프스파쿨투라의 그루터기"
 POL_stumps_of_wspakultura_desc:0 "우리는 자유주의자나 자유 사상가와 동맹이 아닙니다. 허무주의를 조장하고, 과학이라는 ‘새 황금송아지’를 숭배하게 하는 ‘비영적 무신론’에도 우호적이지 않습니다. 유일신은 ‘인간의 의지’뿐입니다. 모두를 같은 ‘뼈 없는 점액질’로 만드는 평등주의 사상 역시 우정의 대상이 아닙니다. 계몽주의적 인도주의와 기독교는 똑같은 개인주의·전능사상으로 정의되며, 동전의 양면일 뿐입니다. 둘 다 문화를 갉아먹는 그루터기이며, 용맹하고 영웅적인 것에 대해 영원한 울분을 품게 만드는 반문화인 '프스파쿨투라'입니다. 모든 것을 ‘좋고 편한 것’에 종속시키는 것은 인간을 폄훼하는 일입니다. 인간이야말로 우주 진화의 최전선이자, 그 최고의 산물이기 때문입니다."
 POL_void_be_our_god:0 "공허시여, 거룩한 신이 되소서!"
 POL_void_be_our_god_desc:0 "온화함, 부드러움, 이해심 이것은 훌륭한 기독교인의 덕목입니다. 하지만 우리는 기독교인이 아니며, 기독교적 자선을 대변하지도 않습니다. 우리는 ‘슬라브의 늑대’입니다. 우리의 행동에 있어 무관심이나 불확실함을 허용할 수 없습니다. 교회를 대하는 정책 역시 가능한 한 급진적이고 폭력적이어야 합니다. 선하신 아버지 하나님과 죄를 위해 십자가에 못 박힌 그의 아들에 관한 망상을 모두 지워야 합니다. 신은 없습니다! 신이 죽었습니다! 초자연적 힘이 있다 해도 그것은 인격적 존재가 아닙니다! 무지한 자든 지혜로운 자든 이를 받아들이지 않으면 마지막 불타는 예배당 속에서 그리스도와 함께 사라질 것입니다.\n\n“공허를 우리의 신으로 삼읍시다.”"
 POL_welcome_moon_and_star:0 "달과 별을 영접하라"
 POL_welcome_moon_and_star_desc:0 "대중이 이해하기 어려운 철학적 개념을 직접적으로 들이밀어서는 현명하지 못합니다. 무신론이나 범신론, 그리고 다른 형태의 ‘신’을 많은 사람이 이해하지 못하므로, 그들은 숭배할 우상이 필요합니다. 운 좋게도, 얀 헴펠이 우리에게 좋은 복음을 가져다주었습니다. 매일 아침 지평선에 떠오르는 새로운 신, 즉 ‘조랴’ 여신이 있습니다. 이는 기독교의 남성적 세력이 원시 민족들의 ‘영웅적 야생 윤리’를 탄압하기 전에, 스바비아 지역 슬라브가 숭배하던 신이었습니다. 미에슈코가 세례를 받았을 때, 그는 고대 레히트의 황야를 정복했을 뿐 아니라 레히트인들 자신까지 굴복시켰습니다. 헴펠은 조랴를 진심으로 믿지는 않지만, 열광적으로 숭배합니다. 이는 ‘영적 요소 없는 종교성’으로, 대중들이 우리 범신론적 혹은 이교적 무신론 철학에 익숙해지도록 돕습니다. 그렇게 해야 우리가 폴란드와 그 \"관념적환경\"을 더 손쉽게 전환할 수 있습니다."
 POL_creativity_bound_nation:0 "민족에만 묶인 창조성"
 POL_creativity_bound_nation_desc:0 "“스타흐니우크 만세!”\n\n우리가 수칼스키를 국가 최고지도자에서 교체하고, 사나치아 내부의 가장 거센 반동파 문제까지 해결했다면, 이제 우리는 ‘위대한 변혁’을 완수할 준비가 된 것입니다.\n\n연합회복권은 ‘민족 창조 공동체(NWT)’로 개칭되어, 예전처럼 폴란드인을 대표하는 초정치적 기구가 될 것입니다. 다만 구 사나치아와 달리, 자드루가는 사회주의적 집단주의 틀 안에서 더 큰 창조적 자유를 허용하고, 동시에 어느 정도 자유화를 도입할 것입니다.\n\n물론 그렇다고 정치적 반대자들을 완전히 풀어줄 수는 없습니다. 그러나 협동조합에 더 많은 권한을 부여해 경제 규제를 완화함으로써 선의를 보여줄 수 있습니다. 이 협동조합들은 여전히 노조총연합이나 국가 직속 통제 아래 있을 것입니다.\n\n경찰도 마찬가지로 체포 건수를 줄이고, 정부 비판을 어느 정도 허용할 것입니다. ‘개량된 형태’의 이러한 ‘자유지상적 전체주의’는 폴란드에 이로울 것입니다."
 POL_towards_collective_ubermensch:0 "집산적 초인을 향하여"
 POL_towards_collective_ubermensch_desc:0 "니체가 모든 면에서 옳았으나, 그의 ‘자기중심적 이기주의’만큼은 예외입니다. 개인은 아무것도 아니며, 집단이 전부입니다. 아니, 철학자의 말대로 ‘강한 사회는 개개인으로 형성되지만, 강한 개인은 국가 없이는 존재할 수 없다’고 할 수 있습니다. ‘위대한 슬라브 혁명’은 시민 문화와 영적 측면만 다루는 것이 아니라, 경제 문제도 다루어야 합니다. 우리는 ‘집산적 초인’을 지향하고 있습니다. 이를 위해 집단의 과업을 조율하는 중앙 지휘 기구가 필요하지만, 동시에 지방 단위들을 강화하고 이 기구에 종속시키는 작업도 중요합니다. 헴펠은 지역 경제를 조직할 ‘부분적 자유’를 부여받았지만, 스타흐니우크가 이 중앙 기구를 장악할 것입니다."
 POL_unleash_buried_enthusiasm:0 "파묻힌 열정을 해방하기 위해"
 POL_unleash_buried_enthusiasm_desc:0 "수천 년 동안 수많은 정권이 사람들에게 획일적 규범을 강요하여, 그들은 창조적 욕구와 혁신 의지를 포기하고 국가에 순응만 하려 했습니다. 자드루가는 ‘국가가 모든 이 위에 군림한다’는 개념이 아니라, ‘모든 사람이 국가 집단에 참여하는 것이 자기 이익에 부합한다는 사실을 깨닫도록 하는 것’에 가깝습니다. 지방내의 발전 기회를 위해 예산을 늘리고, 국가 집산체의 긍정적 측면을 보여줄 필요가 있습니다. 바닥에서부터 솟아오르는 열정은 국가를 유기적으로 강화해 주며, 소수의 탁월한 인물만 힘쓰는 것이 아닙니다. 협동조합, 대학, 기업, 노동조합, 다른 지역 조직 등을 지원해 주고, 그 대가로 그들의 확고한 충성을 얻어낼 것입니다."
 POL_freeing_godly_slaves:0 "신성한 노예들의 해방"
 POL_freeing_godly_slaves_desc:0 "단지 민간 신앙이나 도시 기독교와만 싸우는 것은 어리석습니다. 그리스도는 죽었고, 그의 시체는 십자가 위에서 썩고 있습니다. 기독교 세계가 사라져 가고 있지만, 바로 그 시체에서 자본주의라는 더 큰 암이 자라났습니다. 압도적인 ‘돈’이 영혼을 욱압하는 모습은 YHWH의 그것보다 더 잔혹합니다. 범용함이 지배하고, 천국은 나태로 가득 찼습니다. 경제가 진정한 집단주의로 나아가는 중이라 해도, 여전히 빈부 간 격차가 심각합니다. 사나치아는 ‘볼셰비즘의 폴란드’로서 이 격차를 메운다고 약속했지만, 실제로는 ‘노랑색 자본가’를 ‘빨강색 자본가’로 바꾸었을 뿐입니다. 마치 자본을 통제하는 무정한 관료나 다름없으며, 지난 세기 위대한 산업 자본가들과 별반 다르지 않습니다. 진정한 국민 집단주의를 이루려면 부자와 가난한 자의 구분을 없애야 합니다! 우리는 외칩니다. 부르주아도, 프롤레타리아도 없는 하나의 ‘폴란드 민족’이어야 합니다."
 POL_new_elite_new_race:0 "새 인종의 새 엘리트"
 POL_new_elite_new_race_desc:0 "피우수트스키는 ‘새로운 슬라브 인종’과 ‘새로운 슬라브 국가’를 만들고자 했습니다. 기술관료와 경영 계층에게 힘을 실어, 강력한 관료적 분자를 형성시키려 했습니다. 분명히, 국가 구조를 막아 서는 속물과 둔재들을 숙청할 필요가 있었습니다. 예를 들어, 유제프 베크, 피우수트스키, 프리스토르 등이 유망 예술가를 칭찬했지만 관료들은 얼마나 많이 이들을 국가 엘리트로 성장하지 못하도록 막았습니까? 우리는 패배자와 약자, 그리고 노예적 사고에 기반한 인종을 만들어 버렸습니다. 이에 맞서려면 활력주의 정신과 젊음을 토대로 한 새로운 영적 형성이 필요합니다. 다른 길은 없습니다. 죽은 지식주의나 과학 실험관에 인종을 가두는 짓은 어리석으며, 우월한 자와 열등한 자의 존재를 부정하는 것도 불가능합니다. 가장 강력한 개인이 지배할 수 있는 사회 현실을 만들어 내야만 합니다."
 POL_obedient_termites:0 "순종하는 흰개미, 끈질긴 개미"
 POL_obedient_termites_desc:0 "포드, 테일러, 그리고 스와베크는 가장 효과적인 경영 형태가 ‘기계적이고 단순한 것’이라 보았습니다. 개인과 노동자는 생각을 포기하지 않고도 자신의 임무를 제대로 수행할 줄 알아야 합니다. 이를 두고, 일부는 특정 임무와 업무에 개인을 헌신시키면, 경영층이 공장 노동자 위에 군림하는 ‘신봉건제’가 탄생할 것이라 우려했을 것입니다.\n\n그러나 그런 결과는 일어나지 않을 것입니다. 우리는 ‘흰개미나 개미’의 집단처럼 움직이는 사회로 향할 계획입니다. 각 개인이 맡은 임무를 기계적이고 단순하게 수행하므로, 동료를 적대하는 ‘계급 정체성’을 스스로 만들어 낼 수 없게 될 것입니다."
 POL_avantgarde_will:0 "의지의 전위대"
 POL_avantgarde_will_desc:0 "시인-예언자라는 낭만적 환상은 전 세계를 휩쓸어 왔습니다. 아르토, 단눈치오, 아폴리네르는 ‘엘리트 중의 엘리트’, ‘민중을 새로운 고지로 이끄는 영웅’처럼 떠받들어집니다. 어리석습니다! 한 개인의 이기주의에 사회를 종속시키는 것은 우매한 일입니다. 지도자는 민족을 이끌어야 하지만, 개인적 망상 대신 ‘의지와 권력’을 내세워야 합니다! 속물적 규범과 귀족적 교양을 탓하던 시인들이, 이제 자신들의 비전을 국민에게 일방적으로 강요하는 건 또 다른 위선입니다. 이제 그만합시다! 폴란드는 수많은 작은 우상의 ‘하나의 연극’로 전락할 것이 아니라, 가장 창조적이고 생기 넘치는 ‘의지의 귀족’ 에 의해 지배되어야 합니다. 계급도, 사회적 지위도 없는 이들이 말입니다. 계층 구조는 존재할 수 있으나, 느슨하거나 심지어 계약 형태일 수도 있습니다. 그리하여 민족을 위해 삶과 생각, 존재 전부를 바치려는 개인들의 창조적 잠재력을 어떠한 것에도 제약받지 않도록 해야 합니다."
 POL_chained_one_goal:0 "하나의 목표에 모두 묶여"
 POL_chained_one_goal_desc:0 "경제의 ‘완전 중앙집권화’가 필요합니다. 국가와 집단적 의지 바깥에 놓일 수 있는 것은 아무것도 없습니다. 자본주의 경제와 노사정 코퍼퍼티즘의 비효율성은, 오직 ‘전면적인 국유화’만이 민족을 위대함으로 인도할 수 있음을 보여줍니다. 그러므로 민족 전체의 에너지는 ‘집단적 의지력’을 높이는 단 하나의 목표에 집중되어야 합니다. 개인의 모든 창조적 에너지와 바이탈리즘은, ‘인간 군집체’를 위대함으로 이끌 선봉대가 지휘할 때 가장 효과적으로 발현될 것입니다. 따라서 사유화나 자기 이익만 추구하는 소지주와 싸우는 것에 그치지 않고, 노조와 기업도 굴복시켜야 합니다. 그럼에도 ‘흰개미 왕국’의 구조는 ‘아래에서 위로’여야 합니다. 가장 창조적이고 탁월한 이들은 성공의 사다리를 올라, 집단의 선두에 서서 영광을 향해 이끌 수 있어야 합니다."
 POL_give_hempel_fiefdom:0 "헴펠에게 봉토를 사하기"
 POL_give_hempel_fiefdom_desc:0 "얀 헴펠과 그의 무정부주의자들은 우리에게 소중한 동맹이지만, 동시에 우리 내부에 잠재된 위험이기도 합니다. 그가 이끄는 노조총연합은 모라체프스키와 작셰프스키가 지역직으로 좌천된 뒤 새로운 기회를 부여받았습니다. 협동조합 조직과 풀뿌리 경제에 정통한 헴펠은, 부패와 족벌주의로 굴러가던 ‘사나치아 경제’라는 관료적 지옥을 어느 정도 활성화·개선해 냈습니다. 그래도 우리는 그의 행보를 주시해야 합니다. 새로 주어진 권력이 그의 사적 목적에 악용되지 않을지 모릅니다. 중앙 경제를 장악하고 있는 한, 우리가 그보다 우위에 있긴 하지만, ‘혁명복수단' 출신 베테랑이나 다른 무정부주의자들이 언제든 우리를 배신할 수도 있습니다. 우리는 그를 신뢰함과 동시에 감시도 해야 합니다. 그렇지 않으면 이 ‘폴란드식 라마야나’가 자드루가를 권좌에서 몰아낼 새로운 세력이 될 수 있습니다."
 POL_towards_national_breakthrough:0 "민족적 대도약을 향하여"
 POL_towards_national_breakthrough_desc:0 "이단 중의 이단으로 여겨지는 볼레스와프 피아세츠키는 그 논란이 있는 인물임에도, 그의 구상으로 수칼스키를 매료시켰습니다. 폴란드 민족 속에 잠들어 있던 활력적 에너지를 해방하기 위한 ‘위대한 민족적 대도약’의 문화 부문은 이미 성공했습니다. 이제 이 에너지를 가장 효율적으로 활용하기 위해 경제를 조정하기만 하면 됩니다. 얀 스타흐니우크와 얀 헴펠은 경제를 전면 통제하려는 열망과 달리, 지나치게 ‘풀뿌리 기반 결단’을 숭상하는 좋지 않은 습관이 있습니다. 경제를 ‘아래로부터의 충격’에 의존하게 만들면, 결국 국가 정부가 이를 통제하지 못하게 될 뿐입니다. 민족정치기구의 전문 부서들에서 개인의 경제 활동을 보조·통제·평가할 것입니다. 농민이 자기 구역 농민의 노동을 평가한다는 것이지, 그 반대가 아닙니다. 폴란드는 한 박자로 움직이며, ‘민족적 대도약’이라는 단 하나의 위대한 목표를 향해 나아갈 것입니다."
 POL_to_make_work_worth:0 "일할 가치가 있는 삶을 위하여"
 POL_to_make_work_worth_desc:0 "피아세츠키와 수칼스키 체제에서 교회는 이론적으로 독립을 유지하되, 실제로는 국가가 사회 생활의 속도를 결정하는 ‘도덕적 기관’ 역할을 맡고 동시에 가톨릭 교회의 비공식 세속 기관이 될 것입니다. ‘작업 안내인’ 제도를 도입하고, 임금을 노동량에 직접 연동함으로써, 국가·민족·사회를 위해 일하는 것이 가장 도덕적인 행동이 되도록 유도하려 합니다.공장이 ‘새로운 교회’가 되고, 사제들이 민족정치기구의 활동가·관리자들과 함께 일하는 신종 ‘종교’를 창조할 것이며, 이는 완전히 새로운 형태의 민족적·공동체적 신앙을 구축할 것입니다. 곧 ‘노동과 인간의 의지’를 신앙으로 삼는 것입니다. 사실, 신이라는 것은 가장 강력한 의지를 지닌 존재가 아니었습니까? 이러한 종교적 방식을 공장 생활에 도입하면, 공장 생산성을 높이기 위한 최신 기술·조직적 해법을 더 쉽게 홍보하고 적용할 수도 있을 것입니다."
 POL_bust_earth_bowels:0 "대지의 장막을 뚫어라"
 POL_bust_earth_bowels_desc:0 "폴란드 천연자원은 국가 경제의 근간이 되어야 합니다. 자급자족은 이기적이며 후진적인 자본주의 시스템이 아닌, 건전하고 유기적인 경제를 운영하기 위해 필수적입니다. 과거는 상대주의의 시대였지만, 이제 우리는 ‘절대성의 시대’로 나아가고 있습니다. 따라서 우리의 경제도 스스로 살아남을 수 있는 ‘자급자족 원칙’에 기반해야 합니다.\n\n카르파티아 산맥의 석유 자원을 개발하고, 갈탄·무연탄을 채굴하며, 대체 에너지에 투자하는 것이 현대 세계에서의 현대 국가에 요구되는 과업입니다. 자본주의가 쇠퇴하고 있음은 명백하며, 이 붕괴를 살아남기 위해 폴란드는 국제 무역에 대한 의존을 끊어야 합니다."
 POL_modern_agoge:0 "현대 세기의 현대 아고게"
 POL_modern_agoge_desc:0 "국민 교육은 오직 민족 정치 기구에 의해 실시될 수 있습니다. 민족 정치 기구 내에서의 부모의 참여는 가톨릭 사회 교리와 수칼스키의 비전을 볼레스와프 피아세츠키의 계획과 조정하기 위해 마련된 것이지만, 실제로는 부모의 참여를 최소한으로 줄일 것입니다. 민족 정치 기구 구조와 교육 조직에 대한 참여는 성인이 될 때까지 의무화됩니다. 이를 통해 국가는 청년의 올바른 교육과 발전을 보장하고, 젊은 세대가 지닌 잠재력을 극대화할 수 있습니다. 그렇지 않으면, 현재 우리 사회에 존재하는 ‘저지능 나태 계층’을 계속 양산할 위험이 있습니다.학교는 ‘현대판 스파르타식 아고게’가 되어, 지적·육체적으로 모두 힘든 노동을 준비시키는 기관이 될 것입니다. 이는 이기적이고 비집단주의적인 타 민족에 비해 우리가 우위를 확보하는 방안이기도 합니다."
 POL_behold_lumpenrevolution:0 "보라! 룸펜혁명을!"
 POL_behold_lumpenrevolution_desc:0 "폴란드 민족이여, 일어나라! 민족정치기구를 비판하는 이들은 우리가 ‘부랑자와 젊은이들의 광신도’라고 합니다만, 그럼 어때도 상관없습니다. 우리는 과거에 대한 맹목적 한탄에서 아무것도 배울 수 없습니다. 폴란드는 젊은이들의 나라이고, 소박한 이들의 나라입니다. 이 ‘민족적 대도약’을 위해 이 대중을 동원해야 하며, 부유 계층의 전기화와 교육을 위한 대규모 사업을 시작해야 합니다. 그럼으로써 우리 민족 안에 잠재된 힘을 해방시키고, 효율과 생산성을 획기적으로 끌어올릴 수 있을 것입니다.\n\n또한 청년들을 동원해 국가를 위해 적극적으로 일하도록 하는 것도 필요합니다. 이는 빈곤의 재발 가능성을 낮춰줄 뿐 아니라, 군대나 공공 봉사 프로그램 확장에도 기여할 것입니다. 일자리 확충 사업의 일환으로 건설 현장에 투입된 젊은이들은 자기 자신에게도, 사회에도 유익한 존재가 됩니다!"
 POL_death_life_for_nation:0 "민족을 위한 삶과 죽음"
 POL_death_life_for_nation_desc:0 "노약자·불구·환자를 제외하고, 일하지 않는다면 먹을 자격도 없습니다. 우리의 프로그램은 절대적이어야 합니다. 만약 단 한 사람이라도 노동할 수 없다면, 누구도 기초 생존을 넘어서는 소득을 얻어서는 안 됩니다. 이 해법은 가혹해 보이나 필수적입니다. 현대화된 국가는 삶의 모든 측면을 국가에 종속해야 합니다. 그 중 하나가 바로 ‘노동’입니다. “민족을 위한 삶과 죽음”이라는 구호는 우리의 프로그램 전부를 함축합니다.이 과정을 기계화·자동화하는 것도 요구 사항 중 하나입니다. 스타흐니우크가 제안하는 수준으로 극단적으로 갈 필요는 없겠지만, 실제 변화를 이끌어 내는 데에는 ‘고도로 중앙집권화된 국가 기구’만이 효과적이라는 사실은 분명합니다."
 POL_all_under_asphalt:0 "모두 아스팔트 도로 아래"
 POL_all_under_asphalt_desc:0 "피우수트스키가 남긴 흔적을 수리하고, 토지 개혁을 실행해야 함은 분명합니다. 그러나 동시에 폴란드를 강국으로 만들어야 하며, 그 힘은 급진적인 도시화로만 달성할 수 있습니다. 농장은 최대 5~10헥타르 정도로 제한하고, 나머지 농민들에게는 보조금과 지원을 제공해 도시로 이주, 유대인이나 국제 자본이 떠난 뒤 생긴 공석을 메우게 합니다. 대규모 농장은 꼭 필요한 경우에만 인정되어야 합니다. 모든 사람이 자동차를 소유할 수 있어야 하고, 모든 폴란드인이 안전하게 공공 도로를 이용할 수 있어야 합니다. 기차 같은 대중교통도 누구나 이용 가능해야 합니다. 폴란드인들의 삶을 더 편리하게 만드는 인프라 혁명을 이뤄내는 것이 우리의 의무입니다."
 POL_poletarian_renaissance:0 "‘폴레타리안’ 르네상스"
 POL_poletarian_renaissance_desc:0 "완전한 자급자족에만 매달리는 것은 실책입니다. 우리의 목표는 무역을 중단하는 것이 아니라, ‘국유화’하고 ‘수출’을 늘리는 것입니다. 국가는 ‘이윤’을 목적으로 움직이되, 물질적 이익만 아니라 영적·윤리적 이익도 추구합니다. 그 이윤이 어떻게 창출·분배되느냐가 핵심입니다. 폴란드는 단순히 식민지가 아니라, 무역 세계에서의 위치도 필요합니다. 그를 통해 폴란드 문화와 이성을 전 세계에 전파할 수 있기 때문입니다. 그것이야말로 우리 도덕적·물질적 유산을 실현하는 길입니다. 이를 위해, 생산자가 소비자나 국가와 직접 연결되지 못하는 ‘도매·간접 무역’을 완전히 제거해야 합니다. 모든 시장 투기는 경제에 해로우며, 폴란드인들이 지닌 도덕적 책무에도 반합니다."
 POL_antichrists_hammer:0 "적그리스도의 망치"
 POL_antichrists_hammer_desc:0 "과거에 ‘훌륭한 폴란드인·애국자’는 곧 ‘가톨릭 신자’라 여겨졌지만, 이는 잘못입니다! ‘폴란드성의 진정한 성전’은 공장입니다. 폴란드성이 곧 ‘노동’이기 때문입니다. 진정한 슬라브 폴란드인의 피로부터 뺏어 간 교회 영지가 그대로 존재함으로써 폴란드 민족이 억압받고 있습니다. 이 땅들을 국유화해 민족의 의지에 종속시키는 것이 필요하지 않겠습니까?뚱뚱한 본당 신부가 부지런한 민중을 내려다보던 광활한 초원 위에, ‘폴란드성’의 새 성전을 지을 것입니다. 그리고 여기서 생산될 것은 비행기, 전차, 소총, 냉장고, 라디오, 트램, 버스, 자동차, 스패너, 기어 등—‘생산의 자식들’이라 불릴 거대한 공산품입니다. 이것들이 바로 ‘새 계약의 수확물’이자 ‘새 폴란드 에덴’입니다. 우리 성서는 ‘그리스도의 죽은 말씀’이 아니라, 살아 있고 현실을 굴절시키는 말씀이 되어야 합니다. 십자가에 못 박힌 신은 결코 부활하지 않으니, 그리스도 교리는 죽은 채로 남을 뿐입니다."
 POL_wisdom_of_yesterday:0 "내일을 단련하는 어제의 지혜 "
 POL_wisdom_of_yesterday_desc:0 "단지 신념만으로 무장해 공산주의자나 자본주의자들과 경쟁할 수는 없습니다. 새 시대는 사회·경제·군사적 문제를 막론하고 새로운 방식의 대응을 요구합니다. 가능한 한 빨리 신기술 연구에 자금을 투입해야 합니다. 물질의 비밀을 밝혀내는 데에는 신성의 불꽃이 깃들어 있으며, 그 물질을 우리의 의지에 따르도록 만드는 데에도 똑같이 신성의 불꽃이 있습니다."
 POL_make_do_mend_sanationomics:0 "임시변통 사나치아 경제학"
 POL_make_do_mend_sanationomics_desc:0 "사나치아는 수많은 희망과 동시에 수많은 실망의 피난처입니다. 피우수트스키는 우리에게 ‘새로운 폴란드 민족’으로 가는 길을 보여 주었지만, 그의 비전은 심지어 그 ‘친구들’이라는 이들에게조차 자주 타락했습니다. 원수가 몰랐던 사실은, 귀족들과 구 군인들이 그의 선의를 자기 이익을 위해 이용했다는 것입니다. 연합회복권 내부에서 단순한 균형 잡기 정도로 끝낼 일이었지만, 그 결과 토지 개혁이 심각하게 지연되었습니다. 피우수트스키는 한 마귀, 즉 폴란드 사회당과 그 어리석은 민주 개혁은 물리쳤으나, 또 다른 마귀와 거래를 맺은 셈입니다. 그래서 두 마귀 모두를 처단해야 합니다. ‘노조, 협동조합, 농업 개혁, 경제의 정치화 문제, 무기 산업 비효율성’ 등 수많은 난제가 기다리고 있습니다. 우리는 4개년 계획을 완수하거나, ‘프로메테우스’ 같은 도시 프로젝트를 마무리해야 합니다. 동시에 관료 조직을 빠르게 개선하고, 근본적 변화를 꾀해 군대를 기계화하며 문맹을 퇴치하고 지방의 전력화와 도로 건설을 가속해야 합니다."
 POL_beauty_primitive_genius:0 "원시적 천재성의 아름다움"
 POL_beauty_primitive_genius_desc:0 "진정한 천재성은 실천력에 기반합니다. 추상적 상황에 대한 우유부단이나 이론화에서 나오는 건 아무것도 없습니다. 폴란드인은 시골 바보도, 학문 바보도 되어서는 안 됩니다. 폴란드인은 이 두 극단을 초월해야 합니다. 무신론적 계몽정신이나 농촌의 노예적 독실함에서 얻을 이점은 없습니다.\n\n가톨릭 반동을 속에 감춘 채 숨어 있는 지식인이나, 자드루가의 정당하면서도 급진적인 행동을 비난하는 노골적 인문주의자들도 지식인 계층에서 숙청해야 합니다. 실크 장갑과 점잖은 말로는 진보를 이룰 수 없습니다. 행동이 필요하며, 국민의 뇌를 정화하려면 과감한 조치가 필요하다면 무슨 수단이든 쓸 각오가 돼 있습니다."
 POL_against_faded_ethiopians:0 "빛바랜 ‘에티오피아인’에 맞서"
 POL_against_faded_ethiopians_desc:0 "유대인, ‘빛바랜 에티오피아인’이라 불리는 소위 ‘선택받은 민족’ 우리에게는 창의력이 바래고, 원망으로 가득하며, 기독교인보다 더 믿음에 사로잡힌 이방 요소일 뿐입니다. 검은 백인대처럼 유대인을 전 세계를 지배하는 전지전능한 존재로 보는 대신, 오히려 약하고 제한된 민족이라 평가합니다.얀 스타흐니우크와 얀 헴펠은 단 한 가지 해법, 즉 ‘가장 슬라브화하기 쉬운 유대인’은 빠르게 동화시키고, 나머지는 팔레스타인 유대 공동체에 합류시키는 방안을 제시합니다. 아브라함 슈테른이 피우수트스키나 요나탄 라토쉬에게 영감을 준 사례는, 유대인이 더 큰 가치를 위해 싸우고 자기 인종적 노예 상태를 초월할 수 있음을 보여줍니다. 하지만 그 고생은 우리나라로부터 멀리서 이루어져야 합니다. 헴펠과 스타흐니우크에게 ‘인종’이란 주로 심리적 개념이지만, 수칼스키와 피아세츠키는 ‘포그롬’으로 문명화된 폴란드 민족이 그만큼 진보할 수 있다고 해도, 유대인을 동화시키는 건 폴란드에 해롭고 폴란드의 인종적 잠재력을 낮춘다고 봅니다. 따라서 그들이 내린 유일한 결론은 ‘유대인을 게토에 격리하고, 그들을 이스라엘로 대규모 이주시키는 것’입니다.어떤 파벌이 권력을 잡더라도, 자드루가 내부 유대인 문제는 결국 해결되어야 할 과제입니다."
 POL_shape_slavic_civilization:0 "슬라브 문명을 형성하기 위해"
 POL_shape_slavic_civilization_desc:0 "폴란드는 위대하지만, 슬라보니아는 더더욱 위대합니다. 인테르마리움 바다는 우리에게 슬라브 민족을 통합할 수단이 될 것입니다. 강한 슬라브 민족은 곧 강한 폴란드를 의미하지 않겠습니까? 우크라이나와 벨라루스를 강화하고, 그들에게 투자해 ‘차르주의자’에 맞선 최전선을 형성하게 해야 합니다. 이를 통해 이들 국가 안에 초국가적 정체성을 강화할 수 있습니다. 이것은 리투아니아가 로만 드모프스키 같은 옛 바보의 죄를 잊도록 회유하기 위해 필수적입니다. 벨라루스인·우크라이나인처럼 리투아니아인도 우리의 연합 속 위치를 찾고, 폴란드처럼 리투아니아도 변혁될 것입니다. 약하고 분열된 소국들 대신, 인류의 힘을 키우고 슬라브 민족을 창조적으로 발전시키는 ‘노동하는 거대 민족’이 서게 될 것입니다. 이는 강력한 산업화가 이뤄진 국가에서만 실현 가능합니다. 그래서 인테르마리움을 하나의 민족으로 묶기 위해 각국에 도로를 확충하고, 공장·무기 산업을 건설하는 일이 매우 필요합니다."
 POL_beyond_class_proletariat:0 "계급 너머, 프롤레타리아 너머로"
 POL_beyond_class_proletariat_desc:0 "사회주의가 곧 노동자주의는 아닙니다. 20세기 사회주의 운동이 범한 가장 큰 죄악은 ‘프롤레타리아’를 숭배했다는 점입니다. 연설·언어·종교·공통 가치로도 결속되지 않은 모호한 ‘노동자 정체성’의 이름으로, 민족을 거부하는 것이 과연 가능했겠습니까? 경건한 애국자와 민족주의자가 자기 조국의 영광을 포기하도록 만들어 놓고, 한 나라의 사회주의 운동이 어떻게 성공하겠습니까? 룩셈부르크가 루덴도르프를 상대로 ‘대혁명’을 이긴 유일한 이유는 사회혁명민족당과 독일 사회공화당의 베테랑들 덕택이지, 그렇지 않았다면 강바닥에 잠겨 있었을 겁니다. 그렇다면 우리 정부도 같은 길을 가야 하지 않겠습니까? 우리의 주장은 이렇습니다. “귀족도, 노동자도, 지식인도 없고, 하나의 다시 태어난 폴란드 민족만 있으며, 공공 번영을 위해 일해야 한다.” 우리는 사나치아도, 마르크스도 이루지 못한 일을 완수하겠습니다. “노동”이라는 단 하나의 깃발 아래 폴란드인을 통합하고, 계급 분할이 없는 국가를 만들 것입니다."
 POL_shadow_horned_eagle:0 "뿔 달린 독수리의 그림자"
 POL_shadow_horned_eagle_desc:0 "우리는 신을 창조하고 새 세계를 빚어 내는 자들입니다. 우리는 세계 질서와 평화를 조성하는 자들입니다. ‘뿔 달린 독수리’의 그림자가 유라시아에 드리워졌으며, 우리는 그 광대한 땅의 주인입니다. 이제 ‘집단적 초인)’이 지배합니다. 환호하십시오! 과거의 신들은 우리 발아래 있을 뿐, 우리 위에 있지 않습니다! 현자 헴펠은 이것이 일어나기 전까지 그 누구도 진정한 자유인이라 부를 수 없다고 말했습니다. 모든 것은 니체적 제국의 새 수도 바르샤바에 답하게 됩니다.\n\n이 거대한 산악지대를 우리의 의지 아래 두기까지 가야 할 길이 멉니다. 하지만 고난을 통해 우리의 의지는 더욱 강해집니다. 집단은 하나가 되고, 더 위대한 인류의 영광을 위해 사회의 리듬을 조율합니다.\n\n승리 만세! 우리에게 만세를! 새 인류 만세!"
 POL_concrete_steel_wounds:0 "상처를 덮을 콘크리트와 강철"
 POL_concrete_steel_wounds_desc:0 "“폴란드는 죽었다!” 우리는 구시대적 민족주의, 드모프스키의 과거, 그리고 민족 봉기의 전통을 거부합니다. “만국의 형제애 만세!” “위대한 민족이여, 일어서라!”\n\n우리는 어머니 러시아를 해치고 그 살점을 먹어 치웠지만, 그 시체에서 더 위대한 창조물이 솟아오를 것입니다. 당신들의 도시와 정유 시설을 재건하겠습니다. 미움받던 이름 “자드루가”가 이제 번영의 동의어가 될 것입니다. 도로가 당신들의 땅 위를 뒤덮고, 영웅들의 동상이 폐허 위에 우뚝 서게 될 것입니다.\n\n“러시아여, 죽어라!” 폴란드에서 그렇듯 정교와 기독교적 퇴행 정신은 새로운 힘에 자리를 내줄 것입니다. 러시아인들은 폴란드인들이 그랬던 것처럼, 차르와 옛 영광을 모두 잊어야 합니다. 우리가 온건하게 굴면서, 윤리와 번영을 영구히 재단할 새 이데오매트릭스를 세우는 것은 불가능합니다.\n\n러시아는 폴란드가 아니라 ‘더 위대한 아이디어’의 의지에 복종할 것입니다. 샴쌍둥이처럼, 우리 민족은 하나로 결합할 것입니다."
 POL_agony_of_lechia:0 "레히아의 고통, ‘나드나루트’의 향연 "
 POL_agony_of_lechia_desc:0 "러시아인, 폴란드인, 유고슬라브인 간 큰 차이는 없습니다. 우리는 모두 수 세기 동안 로마와 콘스탄티노플의 외국 사제들을 위해 서로를 학살해 온 슬라브 민족입니다. 하지만 이제 이를 끝냈습니다. 폴란드든 러시아든 다시는 성직자를 섬기며 신의 노예가 되지 않을 것입니다. 우리는 땅 위로 솟아올라 바르샤바와 모스크바를 뒤덮는 ‘바벨탑’을 건설했습니다. 이 위대한 ‘슬라브의 바벨’ 속에서 우리는 하나가 되었고, 더 이상 아무것도 우리를 갈라놓을 수 없습니다. 폴란드인·러시아인·유고슬라브인은 부족적 민족을 위해 싸우지 않고, 초민족이라는 더 큰 사상을 위해 싸울 것입니다. 물론 모든 슬라브가 갑자기 이 계획에 참여하도록 강요할 수는 없습니다. 그랬다간 형제 간 사소한 갈등만 커질 테니까요. 군사력으로 슬라브를 통합하려 했던 ‘차르’들과 달리, 우리는 ‘의지의 힘’을 시범 보이면서 경제·정치적으로 협력해 모든 불신자와 무지한 자가 “폴란드란 없고, 오직 슬라브만 있다”는 사실을 인정하도록 만들 것입니다."
 POL_whole_world_our_due:0 "전 세계가 우리 몫이다"
 POL_whole_world_our_due_desc:0 "싸우지 않는 자는 죽습니다. 무관심은 곧 죽음이며, 삶이란 끊임없는 적응과 성장을 요구하는 창조적 노력의 연속입니다. 우리가 국민에게 요구하는 이 바이탈리즘은 우리의 정치에도 똑같이 투영되어야 합니다. 풀뿌리 자드루가 열정은 우리가 내리는 결정에 반영되어야 합니다. 만일 우리가 과거의 업적에 취해 아무것도 하지 않는다면, 그저 위선자와 자기 사상 배신자에 불과할 것입니다. 그리고 역사는 우리가 남긴 폐허와 먼지를 두고, 후손들이 20세기의 최고 악당이라 부르겠지요.\n\n새로운 문명을 발전시키는 것은 우리의 의무입니다. 폴란드에 도입된 이 ‘관념적-환경’를 슬라비아 전역, 그리고 전 세계로 확산해야 합니다. 이 과정에서 더 적극적인 외교 정책 없이는 불가능합니다. 과거에는 불가능했겠지만, 이제 우리는 충분한 자원으로 무언가 위대한 일을 해낼 준비가 되어 있습니다."
 POL_temple_of_polishness:0 "폴란드성의 성전"
 POL_temple_of_polishness_desc:0 "이탈리아 미래주의자들과 달리, 과거의 박물관을 철거하기를 두려워하는 폴란드 미래주의자들은 웃음거리에 지나지 않습니다. 우리가 이미 말했듯, 다시금 말합니다. “우리는 미래주의자보다 더 심하다.” 바벨 성탑은 크라쿠프 전역 위에 서게 될 것이며, ‘바벨’을 떠받치는 웅장한 마천루가 세워질 것입니다. \n\n그리고 바벨이 서 있는 바로 아래, ‘바벨 드래곤’이 잠든 그 자리에는 ‘폴란드의 신’ 유제프 피우수트스키에게 헌정된 대성당이 지어질 것입니다.\n\n도시 전체는 더더욱 용맹한 지도자의 형상으로 에워싸일 것입니다. 수 세기 동안 그 용감한 행적 탓에 잊히고 미움받던 인물, 곧 교회가 조장한 독일계 음모에 맞서 자신의 명예를 희생한 볼레스와프 시미아위가 부활해 거대한 거인으로 서게 될 것입니다. 주교 미트라를 짓밟는 거대한 동상은 슬라브주의가 가진 과거와 미래의 힘을 증명해 줄 것입니다."
 POL_our_interest_columbian_land:0 "콜롬비아 땅에 대한 우리의 관심 "
 POL_our_interest_columbian_land_desc:0 "‘양키식 진보 정신’은 한 번 지켜볼 가치가 있습니다. 북남미의 신생 포스트-콜럼비아 국가들은 프랑스, 독일, 이탈리아, 영국 제국 등 구 열강에 맞서 불공정한 전쟁을 벌이고 있습니다. 포즈난에서 블라디보스토크에 이르는 레히트 민족은 ‘구 세계의 타락한 국가들’의 폭정에 맞선 이 정당한 투쟁에 공감합니다.\n\n우리는 새로운 위상을 활용해 미주 지역 국가들과 접촉을 시작해야 합니다. 그들의 잠재력은 아직 개척되지 않았으며, 이는 인테르마리움이 여전히 불안정하긴 해도 ‘강국’으로 자리매김하는 데 도움이 될 수 있습니다. 워싱턴과 바르샤바 간 세계적 동맹은 아무도 막을 수 없는 힘이 될 것입니다."
 POL_business_across_elbe:0 "엘베 너머 우리의 과업"
 POL_business_across_elbe_desc:0 "우리가 동방에서 싸우는 동안, 서쪽에서는 ‘신들의 황혼(Götterdämmerung)’이 시작되었습니다. 프랑스의 순진한 낭만주의자들은 마르크스주의와 구 자본주의 체제에 맞서 전투를 벌였고, 동유럽을 잊은 채 우리와 러시아가 서로 망가뜨리길 바랐습니다. 그러나 힘은 동방에서 자라났습니다. 모스칼과 레히트가 분열해서가 아니라, 슬라브가 하나로 뭉쳤기 때문입니다. 이제 우리의 영향력과 군대를 동쪽에 투사해, ‘자드루가 정신’의 힘을 증명해야 할 때입니다. 기독교라는 ‘우매 문명’과 무신론적 ‘점액질’을 먹는 자들은, 부활한 고대 신과 신앙이 얼마나 무서운지를 알게 될 것입니다. 더 나은 인류를 위해, 다시 한 번 불공정한 싸움을 펼치려 일어서는 것이지요."
 POL_birth_of_neuropa:0 "신 유럽의 탄생"
 POL_birth_of_neuropa_desc:0 "피우수트스키의 인테르마리움 계획은 ‘동유럽 전체에서 민족주의자들을 하나의 깃발 아래 통합해, 그들에게 경제·도덕적 복지를 개선’해 주고자 한 계몽적 구상이었습니다. 하지만 그의 구상은 러시아와 싸우는 것에 국한된, 협소하고 미래를 고려하지 않은 것이었습니다. 우리는 ‘연도 0’의 문턱에 서 있고, 러시아는 이미 우리 손에 굴복해 있습니다.\n\n폴란드, 혹은 레히아는 그 제한된 ‘프로메테이즘’ 개념을 버려야 합니다. 낭만주의적 ‘콘라드의 외투’를 벗고, 현대 자동차가 상징하는 ‘속도와 힘’을 취해야 합니다. 인테르마리움은 통합된 반제국적 국가들의 아이디어인 ‘새로운 유럽’를 위한 피난처가 될 것입니다."
 POL_sow_what_reaped:0 "거둔 것을 다시 뿌리기"
 POL_sow_what_reaped_desc:0 "유제프 피우수트스키는 그 시기의 영웅이자 폴란드 민족의 영웅이었습니다. 모든 위대한 인물들이 그렇듯, 그는 성인은 아니었습니다. 그는 ‘26년의 배신 음모가 일어났을 때 해야 할 일을 했고, 유해한 극단 민족주의 세력을 정계에서 배제하고 교회를 단속했습니다. 그러나 그 고된 결정에는 큰 대가가 따랐습니다. 바로 ‘표현과 조직의 자유가 완전히 파괴된 것’이었습니다. 그의 눈앞에서, 그가 민족 안보를 맡긴 이들은 권력을 자의적으로 휘둘러, 대다수의 성실한 이들을 사나치아로부터 소외시키는 결과를 불러왔습니다.\n\n우리 뒤로 펼쳐진 현실은 숙청, 추방, 국가 주도 음모로 점철된 어둠입니다. 오늘날 폴란드는 한밤중 급습과 저녁 학살의 상흔을 지니고 있습니다. 감옥은 왜 체포되었는지조차 모르는 정치범들로 가득합니다. 폴란드 사회당은 사나치아 내부에서 숙청에 맞서고, 비밀경찰의 표적이 된 ‘억울한 이들’을 어느 정도 보호해 준 유일한 날개였지요. 이제 지난 10년간의 눈물을 씻고 앞으로 나아가며, ‘국가와 그 건국 아버지’를 구원할 수 있는 도덕적으로 타당한 힘은 우리뿐입니다."
 POL_sins_of_father:0 "아버지의 죄"
 POL_sins_of_father_desc:0 "지금까지 사나치아는 ‘혁명 이후 폴란드에 뿌리내린 기득권’을 지키기 위한 조직 이상도 이하도 아니었습니다. 피우수트스키가 ‘가장 뛰어나고, 가장 밝고, 가장 위대한 인물들’로 단체를 만들려 했지만, 결과는 나라에서 가장 하등한 쓰레기들의 집합체가 되었을 뿐입니다. 폭력 조폭과 연결된 정부의 스캔들을 몰랐던 폴란드는 없고, 행정가들이 어떻게 공적 자금을 착복했는지는 모든 주부가 소상히 떠들 수 있을 정도입니다. 지주와 농민, 노동자와 상인이 한데 모인 ‘정당’은 이미 그 자체로 분열된 집이며, 그런 일시적 구성이 오래갈 리 없습니다.\n\n과두정을 치유하는 방법은 ‘건강한 민주주의’입니다. 미국·러시아·독일, 그리고 역사상 무수한 국가들에서 전제정이 횡행했을 때, 결국 그 해악적인 반동 세력과 제도적 하수인을 몰아낸 것은 민주주의적 충동이었습니다. 설령 그런 이들이 스스로를 “진보적”이라 칭하며, 과거 혁명가가 서 있던 자리에 앉아 있어도, 그들을 융커)나 카자크처럼 쓸어버려야 합니다. 그들의 목을 벨 칼날은 바로 ‘국민 손에 쥐어진 투표용지’가 될 것입니다."
 POL_apathy_of_son:0 "아들의 무심함"
 POL_apathy_of_son_desc:0 "다신스키는 부처 복도를 어정거리며 다닙니다. 악수는 강하지도 약하지도 않고, 연설할 때마다 메모를 뒤적거리거나, 웅얼거리거나, 군중에게 애원하듯 시선을 던지며 적절한 단어를 찾는 데 시간을 허비합니다. 즉석 연설이나 유세 연설은 전혀 시도하지 않습니다. 연설 내용도 문제적입니다. 새로운 사나치아 세대와 비교하면, 다신스키는 기껏해야 노쇠한 관료로서, 시대에 뒤떨어진 해결책을 옛 문제에 제시하고, 새 세대를 향해 유치하고 어리석은 기쁨으로 악담을 퍼붓습니다.\n\n나이와 무관하게, 다신스키는 근본적으로 이념가가 아닙니다. 혁신적 방향으로 사나치아를 밀어붙이려는 모든 시도를 거부하며, 연설에서 과감하거나 규정하는 표현을 일일이 지웁니다. 후계 싸움에서 그를 지지한 젊은 활동가들 중 어느 누구도, 감사 인사는커녕 방대한 그의 행정부에서 자리 한 번 얻어 보지 못했습니다.\n\n만약 폴란드에 변화가 있어야 한다면, 다신스키가 ‘폴란드 사회주의 프로젝트’의 정점이 되어서는 안 됩니다. 그의 행정부는 사상과 인사 측면에서 모두 새로운 시대를 열어야만 합니다."
 POL_legacy_of_pilsudski:0 "피우수트스키의 유산과 그로부터 지켜낸 것"
 POL_legacy_of_pilsudski_desc:0 "어느 길에서나 지나가는 행인을 붙잡고 “피우수트스키는 무엇을 위해 싸웠나요?”라고 물어본다면, 그들은 잠시 망설여 주변의 당 간부나 사나치아 감시자를 의식한 뒤 솔직하게 대답할 것입니다. “그 훌륭한 장군은 민주주의와 사회주의를 위해 싸웠소.” 그리고는 자신의 길을 갈 것입니다. 이런 것이 우리 동포들의 중얼거림이 가르쳐 주는 점입니다.\n\n피우수트스키는 아마도 역사상 가장 민주적인 세계 지도자였을 것입니다. 그의 혁명은 진보적 사회계층을 모두 포용했고, 폭력이나 위협이 아니라 애국심과 형제애라는 공통 분모로 이들을 결속시켰습니다. 사나치아가 시작되었을 때, 그것은 다른 곳의 반동적·부르주아 정권과는 확연히 달랐습니다. 노동조합이 당의 핵심 기둥이 되었고, 농지 개혁이 농촌 문제의 중심 정책이었죠. 교회나 그들의 터무늬 없는 미신과 해악적인 반동 세력에 당당히 맞섰습니다.\n\n피우수트스키가 죽었어도, 그의 이상은 살아 있습니다! 그것은 노동자의 가슴 속에, 젊은이의 꿈 속에, 폴란드가 여러 번 쇠사슬을 부술 때마다 이끄아준 그 이상 안에 깃들어 있습니다. 발명가, 과학자, 예술가들이 창작물을 세상에 선보여 현실과 마음을 뒤바꾸도록 하는 힘이기도 합니다. ‘자유로운 폴란드’라는 피우수트스키의 이상은 옛 연방 시절보다 오히려 더욱 생생합니다!"
 POL_dreams_of_founders:0 "우리 건국의 아버지들의 꿈"
 POL_dreams_of_founders_desc:0 "사나치아의 목적은 과거 폴란드의 유산, 즉 형제애와 자유의 유산을 실현하는 것이었다는 사실은 명백합니다. 사나치아는 억압적이거나 극단적 민족주의 세력이 되어서는 안 되며, 지구 상 그 어디에도 없는 평등의 빛을 내는 우리의 정부가 반 민주 세력들을 어떻게 격퇴해 왔는지 보면 알 수 있습니다.\n\n위에 있는 순교자들은 모두 우리에게 미소 짓고 있습니다. 코시치우슈코, 칼리노프스키, 1918년의 영웅들과 옛 연방의 위대한 지도자들, 예를 들어 얀 3세 소비에스키마저도 우리와 함께합니다! 우리는 연방의 모든 민족 이야기를 완성할 것입니다! 우리는 그 ‘연방’의 세번째 차례가 올 것입니다!\n\n이제 이를 공식적으로 선언하는 것이 합당합니다. 국가는 이제부터 ‘제 3 연방’이라고 불릴 것입니다. 외교사절은 우리를 그렇게 부를 것이고, 모든 관청 출입문에도 그렇게 적힐 것이며, 모든 정부 문서 맨 위에도 쓰일 것입니다. 이 연방은 영원히 불멸하고 눈부십니다."
 POL_voice_of_populace:0 "대중의 목소리"
 POL_voice_of_populace_desc:0 "사나치아가 곧 ‘민족’인 것은 결코 아닙니다. 사나치아는 중앙 기구의 모든 행태가 마치 거울처럼 국민 의지를 완벽히 반영한다고 자기최면에 빠져 있었습니다. 사실 이 거울 비유가 지나칠 정도로 적확합니다. 사나치아는 ‘민중의 의지’를 가져다가, 마치 유원지의 거울방처럼 각 당 관료가 원하는 대로 왜곡시킨 뒤, 온갖 위기와 혼란을 방패 삼아 투표함을 치워버렸습니다. 이렇게 그들의 범죄는 처벌받지 않았고, 점점 대담해졌습니다.\n\n우리가 과연 무슨 자격으로 ‘국민이 원하는 것’을 규정하고, 그들의 의지를 왜곡합니까? 바르샤바가 과연 루블린이나 크라쿠프, 르부프보다 더 잘 아는 게 무엇입니까? 사나치아는 “민족 전위대”니 “발전 조직”이니 하는 달콤한 말로 이 문제를 뭉갰지만, 이제 그런 호언장담은 하지 못합니다. 사실, 사나치아는 말을 멈추고 들어야 합니다. 전몰 군인 유가족, 소농, 촌 사제, 공장노동자, 그리고 거대한 당구조에서 혹사당하는 관리의 목소리를 들어야 합니다. 그 후에야 비로소 사나치아는 온 민족의 목소리를 대변할 수 있을 것입니다. 거기엔 슬픔도, 기쁨도, 승리와 패배도 함께 담겨 있지요.\n\n오랫동안 자취를 감춘 투표함이 다시 폴란드인의 생활 속으로 당당히 복귀할 것입니다. 어디서든 국민이 조직된다면, 사나치아가 더 이상 명령을 하달하거나 ‘위협’을 운운하며 곤봉을 휘두르지 않을 것이고, 대신 그들의 표현을 ‘촉진’할 것입니다. 노동자와 농민이 자신들의 권리를 지키기 위해 모일 때, 당은 더 이상 영주권을 주장하지 않고, 서로에게 선의를 요구하는 데에 그칠 것입니다."
 POL_as_profane_as_ever:0 "늘 그렇듯 세속적인"
 POL_as_profane_as_ever_desc:0 "오늘 밤, 다신스키는 언론, 예술, 정치적 도덕주의에 대한 10여년간의 검열을 끝내는 명령에 서명할 예정입니다. 너무나 긴 시간 동안, 사나치아는 로즈바도프스키를 지지하는 사회적 기관들을 억압하고, 그렇다고 이 기관들을 너무 거칠게 몰아붙여 전면 폭동이 일어나지 않게도 하느라 미세한 줄타기를 해야 했습니다. 교회, 민족주의 세력, 지주 모두 ‘최소화하고 달래야’ 했습니다. 동시에 당이 사치와 탈도덕화로 분해되지 않도록, 엄격한 ‘원수 영감의 교의’가 쓸데없이 쾌락적인 것뿐 아니라 당 정강에서 벗어나는 모든 사상을 짓눌렀습니다. 이 교의는 국민에게도 번져, 당의 자발적 요소인 ‘의지주의적 세력’이 모든 생각과 행동에서 엄격한 도덕 기준을 요구했지요.\n\n결과적으로, 사회의 반동 세력과 끝나지 않는 충돌, 그리고 당 내부 위선자와 거짓말쟁이가 내세우는 ‘도덕주의’는 젊은 세대를 정권에서 멀어지게 만들고, 온갖 가짜와 생을 혐오하는 이들을 우리 내부에 끌어들였습니다. 이 모든 것을 철폐해야 합니다. 우리는 우익 정당들과의 ‘전쟁’을 끝낼 것이고, 교회와의 갈등도 줄일 것입니다. 이제 당 내부의 위선과 도덕주의적 어리석음을 제거해야 합니다. 국민이 ‘도덕 경찰’에게 쫓기는 일은 없을 것이며, 예술가들이 검열관의 트집에 발이 묶이는 일도 없을 것입니다. 이런 조치의 상징이었던 정권의 얼굴 또한 다시는 등장하지 않을 것입니다."
 POL_revolution_in_name_only:0 "이름뿐인 혁명"
 POL_revolution_in_name_only_desc:0 "과거에는 폭력이 필요했고, 이는 재건 할수있게하는 힘이었으며, 모스칼놈들의 사슬을 끊어버리는 강타였습니다. ‘폴란드 혁명’은 이 세기에서 폭정에 맞선 가장 훌륭한 타격이었으며, 그나마 대등한 예는 독일 혁명과 영국령 인도의 붕괴 정도였습니다. 그러나 이러한 정의로운 전쟁조차도 땅에 과부와 고아를 남기고, 불타버린 가옥과 텅 빈 마을로 혁명의 쓰라린 결말을 남겼습니다. 일부 열정적이고 선의 넘치는 젊은이는, 그때를 본인들이 직접 겪지 못하고 전해 들은 이야기와 희미한 기억만으로, 그 시대를 동경하며 과도하게 흥분합니다.\n\n하지만 다신스키는 그 군대가 행진하고, 싸우고, 죽어가는 모습을 직접 지켜봤습니다. 그 광경은 평생 그의 꿈을 괴롭혀 왔습니다. 전쟁은 끔찍하며, 특히 자국 안에서 벌어지는 전쟁은 어떤 대가를 치르더라도 피해야 합니다. 차르를 쫓아낸 가치는 의심할 여지 없이 컸지만, 그 대가는 피와 슬픔으로 치러져야 했습니다."
 POL_six_arrows_towards_future:0 "미래를 향한 여섯 화살"
 POL_six_arrows_towards_future_desc:0 "오랫동안 사나치아는 젊은 에너지를 쫓아내고, 딱딱한 도덕주의와 관료적 ‘사회주의’에 의존했습니다. 폴란드인은 ‘활기 있고 응답하는 정부’를 외쳤지만, 묵살당했습니다. 우리가 정권을 잡은 지금, 그 실패한 체제와 결별하지만, 그 방향은 대체 무엇이겠습니까? 예전 장관들을 쫓아내고 그 자리에 신임 인사를 임명해 봤자, 이전 임무를 실패하게 만든 바로 그 불활성 분위기가 새 인사들을 또 옥죄는 것이라면 무슨 의미가 있을까요?\n\n그래서 우리 정부는 옛 사나치아와 근본적으로 다르되, 오래전 부패한 정책 탓에 오염된 용어들을 다시 깨끗이 되살려 쓸 것입니다. 교회와 부질없는 전쟁을 벌이기보다, 일상생활 속에서 그들의 도덕적 지배를 줄이는 데 힘쓸 것입니다. 노동자들이 사나치아 충성파 사장 밑에서 계속되는 착취를 자각했을 때, 우리는 단지 ‘빨간 깃발’을 펼쳐 보이는 데 그치지 않고, 그들을 적극적으로 편들어 죽은 부르주아 잔재와 싸우겠습니다. 위대한 시인이자 작가인 유제프 워보도프스키가 말했듯, 우리는 확고히 공화주의적이고, 사상과 행동 양면에서 사회주의적이며, 언제 어디서든 힘차게 전진해야 합니다."
 POL_dulling_knives_axes:0 "무뎌지는 칼과 도끼"
 POL_dulling_knives_axes_desc:0 "옛 사나치아의 무기력함 속에서는 기묘한 교리나 사이비 종교가 자라났습니다. 프랑스 아방가르드 민족전선 정권이든, 혹은 태고의 조상들 종교든 간에 영감을 받은 이들은 당 기득권, 즉 우리까지도 공격했습니다. 그들은 우리를 ‘민주주의자 행세를 하는 사기꾼’ 집단이라고 부르며, 우리 행보에 불신과 독설을 퍼부었습니다. 시위는 규모가 작지만 무시할 수 없고, 우리가 사나치아를 완전히 통제하지 못함을 보여줍니다.\n\n지에르진스키 추종자와 자드루가의 맹견들은 이만 처리해야 합니다. 이들은 여전히 당 보조금을 빨아들이고 있고, 그 줄을 끊을 때가 왔습니다. 그들이 과거 민족주의 깡패나 가톨릭 행렬 같은 적과 함께 연대하던 것은 더 이상 필요치 않습니다. 그들의 불타는 에너지는 지나치게 급진적 언사로 뒤덮여 있어, 새 폴란드를 건설하는 데 전혀 쓸모가 없습니다."
 POL_reason_of_state:0 "국가 이성"
 POL_reason_of_state_desc:0 "물론, 우리는 폴란드가 자유롭게 자기 길을 정하길 바라지만, ‘잘못된 길’에 대한 우려도 없지 않습니다. 증오와 분열이 우리 나라를 뒤흔들며, 폴로니아를 오염시키고 갓 태어난 민주주의를 교살할 위험이 있다면 어떡합니까?\n\n폴란드는 민주주의에 대비해야 하고, 더 나은 미래로 가는 금빛 길을 보여줘야 합니다. 우리는 부드러운 손길과 낮은 음성으로 말하겠지만, 결코 사과하지는 않을 것입니다. 폴란드는 교육받고, 올바른 길을 갈 지식과 능력을 갖춰야만 합니다. 이를 위해, 우리가 미안해할 이유는 없습니다."
 POL_patriots_of_love:0 "증오의 사육자들과 맞선 사랑의 애국자들"
 POL_patriots_of_love_desc:0 "폴란드인은 러시아인이나 오스트리아인, 영국인과 달리 다른 민족을 지배하는 제국을 원하지 않고 오직 형제애를 추구합니다. 우리는 정당한 영토를 가지고 있고, 폴란드어는 국경 너머까지 확산되기도 했습니다. 또 이 나라 안에서도, 다른 출신이나 신념을 가진 이들에게 자리를 허락해 왔습니다. 사나치아는 우크라이나 갈리치아의 문화를 꽃피우고, 서쪽 독일계 공동체의 고유 생활을 보존했습니다. 유대인에게도 사나치아보다 더 좋은 친구는 없습니다. 그들도 보통 폴란드인 못지않게 충성스럽습니다.\n\n모든 폴란드인이 이렇게 훌륭하다고 장담할 수는 없습니다. 점점 세력을 키우는 ‘민족주의자들’은 이 다원주의를 폐기해야 한다고 외치며, ‘순수 폴란드 혈통’ 아닌 이들을 전부 파괴 요소로 몰아붙입니다. 과거 “외국” 출신이었던 수많은 독립투사의 사례는 차치하더라도, 그들의 애국심은 과연 얼마나 타당할까요? 이들은 우리 대도시 유대인 회당을 공격해 모스크바의 흑백단 언론을 기쁘게 했으며, 독일 농장을 불태워 베를린의 우호세력에게 충격을 안겼습니다. 우크라이나 민족단의 테러에 대한 보복이라며 수백 명의 우크라이나인을 공격해, 그 아이들을 고아로 만들었고, 그 결과 우크라이나 민족단에 대한 사람들의 지지도만 늘려주었습니다. 이것이야말로 소위 ‘폴란드 민족과 국민에 대한 사랑’인가요?\n\n사나치아는 혈통이 어디이든, 이 땅의 시민으로 사는 이 모두를 대변합니다. 우리의 유일한 국내 적은 ‘동포를 공격하는 테러리스트’뿐입니다. 이들이야말로 자칭 ‘민족주의자’일망정, 궁극적이고 완전한 정치적 위선자입니다."
 POL_no_room_bigotry:0 "편협함에 설 자리는 없다"
 POL_no_room_bigotry_desc:0 "가톨릭교회는 폴란드에 치명적 상처를 입혔으며, 왕이나 대통령에게 자주 엉뚱한 ‘가르침’을 내려 우리나라가 후회할 길을 걷게 한 적이 많습니다. 우리는 검소하게 사는 마을 사제를 적대하지는 않지만, 호화로운 비단과 보석으로 치장한 대주교와 부제들이 “무신론적 사회주의는 악!”을 외치면서도 주식 투자를 즐기는 이들에게는 맞설 것입니다. 피우수트스키와 사나치아의 열성파들이 때로 교회와의 전쟁에서 너무 과격했을 수 있으나, 가톨릭교회가 우리나라에 미친 ‘해악적인 영향’에 대한 그들의 판단만큼은 옳았습니다.\n\n하지만 로마 주교권에 맞서 싸운다는 명분 아래, “비합리적 영성주의”를 밀고 나가며 말할 수 없는 도덕적 추문과 집단적 타락을 꾸미는 자들도 그에 못지않게 어리석습니다. 이런 자들은 교황주의 타파 전쟁 중에 불가결한 동맹이라 여겨져 우리 당에 들어왔지만, 사실상 저들은 영혼을 그릇된 영성주의 망상으로 어지럽히는 ‘반 과학적·신비주의적’ 동전의 이면일 따름입니다. 우리는 그들을 사나치아에서 가차 없이 몰아내야 합니다."
 POL_new_shiny_res_publica:0 "새롭고 광채 나는 공화국"
 POL_new_shiny_res_publica_desc:0 "1926년 그 어둡고 차가운 어느 날, 근시안적 잔당들과 반동 세력이 폴란드 민주주의를 무너뜨려, 한동안 ‘폴란드 혁명’의 불씨를 쓸데없는 탄압과 관료적 무기력으로 꺼뜨린 독재가 시작되었습니다. 그러나 이제 그 채무가 모두 청산되었습니다. ‘정당’이 아니라 ‘정권’에 머물렀고, 스스로를 민주주의라 자칭했으나 장기 독재였던 사나치아는 드디어 ‘피우수트스키가 본래 의도했던’ 모습, 다시 말해 ‘모든 국민을 아우르는 정당’으로 거듭났습니다.\n\n몇몇 강경파는 우리의 ‘퇴행’을 탄식하겠지만, 오히려 그들이야말로 고인이 된 원수를 부패와 무능으로 모독해 왔습니다. 그러나 그것도 이제 끝입니다. 서명 한 번이면 그들은 조용한 은퇴로 물러갈 것입니다. 수천 명에 이르는 이들을 열정적이고 진정한 혁명의 가치를 믿는 젊은이들로 대체하면 됩니다. 혁명의 미래는 그들 손에 달려 있습니다."
 POL_gem_in_the_crown:0 "인민의 보석"
 POL_gem_in_the_crown_desc:0 "민주주의로 가는 길이 열렸으니, 이제 이 경직된 경제 정책을 짚어볼 차례입니다. 옛 가정만 믿고 갈 수는 없습니다. 전쟁은 다가오고, 인테르마리움 동맹은 사방에서 위협받고 있습니다. 과거 정권은 조작된 통계와 약속에 의존해 경제가 침체되도록 방치했습니다. 그 약속은 이제 이행되어야 하고, 우리는 폴란드인에게 그들이 받을 몫을 줘야 합니다.\n\n건강한 경제로 가는 길에는 수많은 장애가 있습니다. 무기력한 ‘코뮌’들이 과도한 자금 지원 속에서도 생산성은 평범해, 어정쩡한 농촌 정책이 만들어 낸 유산이 되어 버렸습니다. 노동자는 구 사나치아 정권과 한통속인 잔존 부르주아들과 계속 대립 중이며, 그들을 뿌리 뽑으려면 많은 노력이 필요합니다. 가장 심각한 것은 ‘정확히 얼마나 사회주의적이어야 하느냐?’라는 정부 내부의 모순된 비전입니다. 이 모든 문제를 해결하지 않으면, 또다시 ‘뒤처진 변방’으로 전락할 위험이 큽니다"
 POL_modern_golden_liberty:0 "현대의 황금의 자유"
 POL_modern_golden_liberty_desc:0 "옛날 폴란드는 유럽이 영주와 칼에 지배당하던 시절, 민주주의와 자유의 요새였습니다. 전제 군주들의 음모로 사라지고 잿더미가 된 뒤, 오랫동안 잠들어 있었습니다. 심지어 자유로운 국가를 꿈꾸던 이들도 민주주의 이상을 포기했으나, 피우수트스키의 혁명이 이를 다시금 화려하게 부활시켰습니다. 불사조가 차가운 재 속에서 활활 타올라 날아올랐습니다.\n\n새 민주주의는 과거와 전혀 다릅니다. 옛 시절보다 더 많은 자유를 수호하고, ‘당장의 필요’만 보던 것을 넘어 미래를 내다봅니다. 그것은 더 이상 봉건적이지 않으며, 보편적이며 직장에서도, 정치인 선출에서도 동일하게 적용되는 진정한 ‘보편 민주주의’가 될 것입니다."
 POL_lange_means_left:0 "랑게가 좔한다!"
 POL_lange_means_left_desc:0 "오스카르 랑게는 현대 최고의 경제학자 중 한 명이며, 게다가 폴란드인의 아들이기도 합니다. 경영 현실을 알지 못하는 허황된 이상주의자들의 조언을 들을 이유가 무엇이겠습니까? 우리에겐 진정한 거인, 랑게가 있지 않습니까? 그가 제시한 계획은 정말로 ‘실패할 리 없는 계획’입니다. 캅카스는 잘 조정된 국가주도 경제와 발달된 사회 서비스를 갖춘 것으로 유명하지만, 동시에 그 체제를 강압적으로 유지한다는 잔혹한 면도 있습니다. 랑게의 계획은 앞의 두 장점을 살리면서, 그 잔혹한 면을 배제합니다. 당연하게도, 그 잔혹한 요소는 새 폴란드 경제와 무관해야 합니다. 노동자는 국가의 보살핌을 받으면서 동시에 자기 수단이 어떻게 조직되는지도 발언할 수 있어야 합니다. 즉, 직장 민주주의와 노동자 협동조합 제도화가 함께 가야 합니다."
 POL_kalecki_is_right:0 "칼레츠키가 오른것 같다!"
 POL_kalecki_is_right_desc:0 "칼레츠키는 꽤 변덕스러운 천재입니다. 젊고 주도권을 가진 이로서, 경제를 활성화하는 데 걸림돌이 되는 모든 것을 혁신하거나 개조하기를 두려워하지 않습니다. 영국의 메이너드 케인스나 오즈월드 모즐리 경같은 급진적 사상가에게 영감을 받은 그의 사상은 ‘현대적 민주주의 정신’을 그대로 체현합니다. 혼합 경제, 지도주의, 복지 시장을 주장하는 칼레츠키의 개혁은, ‘스파르타쿠스주의의 빈곤 숭배’나 ‘자본주의의 썩은 엘리트 옹호’에 정면으로 배치됩니다. 그리고 이 둘 중 어느 방향과 견줘도, 칼레츠키의 관점은 너무 새롭고, 매끄러우며, 유혹적으로 보입니다."
 POL_daybreak_new_parisians:0 "새 파리의 새벽"
 POL_daybreak_new_parisians_desc:0 "‘폴란드 사회주의’가 다시 살아났습니다. 거리에서는 노동자들이 부르주아 체제에 맞서 시위를 벌입니다. 그들은 소리 높여 자기 정당을 비난하지만, 결국 진정한 ‘프롤레타리아 민주주의’의 수호자인 우리가 있다는 사실을 깨닫고 우리 깃발 아래로 모여듭니다."
 POL_most_progressive_occupation:0 "가장 진보적인 점령"
 POL_most_progressive_occupation_desc:0 "중세의 잔재이자, 타타르의 멍에가 남긴 얼룩인 러시아는 사라졌고, 이제 역사가 그 나라를 평가할 뿐입니다. 그 옛 패권 위에 서 있는 것은, 모스크바의 불의한 정복 아래서 종속되었으나 그 잔혹한 억압에 시달려 온 옛 속국들입니다. 그리고 우리는 그들에게 폭정과 반동이 가장 두려워하는 일을 합니다. “죽어버린 무스코비”의 국민을 향해 자비로운 손을 뻗어, 자유·평등·형제애로 정의되는 새 삶을 함께하자고 호소합니다.\n\n페트로그라드, 스몰렌스크, 차리친, 예카테린부르크, 하르빈 거리를 행진하는 우리의 용감한 젊은이들이 매일 유라시아 대륙의 미래를 건설해 갑니다. 폴란드인이든 아니든 간에, 선생들은 죽어 있던 언어와 문화를 되살리고, 오직 착취만 알던 암흑의 땅에 지식의 빛을 비춥니다. 계획가들은 황폐한 들판 대신 공장을 세웁니다. 프로메테우스가 불을 밝힌 이래로, 옛 질서는 불에 사라지고 새 질서는 뜨겁게 봉합되었습니다.\n\n물론 이 길이 쉽지는 않습니다. 한때 러시아라 불리던 지역에는 산적, 완강한 민족주의자, 거짓 예언자, 그밖에 제 이익만 노리는 자들이 도사리고 있습니다. 이들은 외딴 마을에 모여 옛 궁정의 영광을 떠올리며, 우리 병력에 웃음짓다가도 몰래 폭탄을 실어 나르고, 협력자들을 에워싸 내부에서 파괴하려 듭니다. 그들은 과거의 낡은 깃발과 죽은 기억을 위해 미래를 짓밟습니다. 그리고 날마다 세력이 커집니다. 우리는 그들이 사라질 때까지 맞서 싸워야 합니다."
 POL_our_modern_prometheus:0 "우리 시대의 프로메테우스"
 POL_our_modern_prometheus_desc:0 "우크라이나는 타간로크(Taganrog)와 그 너머 광활한 초원을 지켜보고, 벨라루스는 스몰렌스크로 뻗어 있습니다. 그 너머는 이제 폴란드·우크라이나·벨라루스·리투아니아인의 피로 세워진 새 공화국이 자리합니다. 다양한 민족으로 이뤄진 이곳은 제각기 차르주의와 그 후계 정권에 억눌린 풍습과 문화를 되살리고 있습니다. 하지만, 그들에게 모스크바 대신 ‘바르샤바, 키이우, 민스크’의 지배를 받으라고 한다면, 과연 고맙게 받아들일까요?\n\n폴란드는 대륙 전체의 일을 감독하고 있습니다. 폴란드 지식인과 행정관은 밤새워 캅카스 정세의 복잡함, 체첸인과 발카르인 중 누구에게 대표성을 더 부여해야 하는가 같은 문제로 논쟁하며, 모두 구 제국 문서에서 건져 올린 낡은 통계에 의존합니다. 정치인들은 신설 공화국들의 국방 수요에 맞춰 강제 징집이 폭증하자, 그에 대한 혐오로 커리어를 쌓기도 합니다. 동맹 민족의 민족주의자들은 이미 팽창한 국경 너머까지 확장하려고 주둔지를 마련합니다. 우리의 임무는 끝이 없으며, 나라는 결코 휴식할 수 없습니다. 동쪽으로 펼쳐진 이 알바트로스는 길 잃은 민족들로 가득한 바구니이며, 그들을 문명으로 이끌고자 하는 길이 쉽지 않아도, 우리는 끝까지 노력해야 합니다."
 POL_setting_up_polonosphere:0 "‘폴란드권역’ 구축"
 POL_setting_up_polonosphere_desc:0 "폴란드의 실력수준 정말 실화입니까? 정말 동유럽 최강자의 모습을 갖추었습니다. 그 영,프에게 구걸하던 ‘가난한 농민의 슬라브’맞나요? 진짜 폴란드는 전설입니다. 진짜 이제 민주주의를 확립하고 러시아라는 거인을 쓰러뜨린 폴란드를 보면 진짜 감격 스럽고 말로 다하지 못했던 우리의 무한 에너지와 행동으로 증명한것을 보면 가슴이 웅장해집니다. 그렇다고 우리가 모든 것에 능숙한 것은 아니지만. 이제 곳곳에서 많은 민족이 우리를 우러러봅니다. ‘잊힌 모스크비의 어둠’ 이후 찾아온 등불로 말이지요. 이 엄청난 관심은 우리조차 당황스러울 정도입니다."
 POL_judgment_day:0 "심판의 날"
 POL_judgment_day_desc:0 "‘공화국’이란 게 선거도 없다면 무슨 의미겠습니까? 우리는 의회·대통령 선거를 치르겠다고 약속했습니다. 그러다 “러시아와의 전쟁” 문제가 터지며 미뤄졌습니다. 그때는 분명 어쩔 수 없었지만, 이제 많은 이들이 “우리가 사실상 대의를 잊고 원수의 자리에 앉아 독재를 이어간다”고 비난합니다. 얼마나 착각인지요! 그저 시간이 없었을 뿐이었습니다. 그런데 그 시간이 지금입니다. 기다려줘서 고맙습니다."
 POL_vultures_after_battle:0 "전투가 끝난 뒤의 독수리들"
 POL_vultures_after_battle_desc:0 "‘동유럽’은 죽었고, 우리 진군한 병사들에 의해 무너졌습니다. 오랜 시절 유럽의 주변부 민족을 억압해 온 야만적 전제정의 마지막 흔적도 사라졌습니다. 이제 우리 유럽의 운명은 러시아와 싸우는 동안 어떤 일이 벌어졌는지 살피고, 그 인상을 토대로 행동하는 데 달려 있습니다. 강국이 떠오르거나 꺾였고, 일부는 패권국이 되었고, 다른 곳은 꼭두각시 신세가 되었습니다. 폴란드는 그중 하나가 되어서는 안 됩니다.\n\n우리 군대로는 지금 어떤 이웃에 대해서도 진군을 계속하거나, 역으로 침공을 막아 낼 수도 없는 상태입니다. 우리의 외교관들은 파리, 베얼린, 스톡홀름, 런던에서 평등하게 주권을 인정받으려 분주하고, 우리는 잃을 것이 있습니다. 어느 거대한 분쟁에 휘말리지 않는 게 중요하지만, 동시에 우리의 독립을 양보할 수도 없습니다."
 POL_keeping_aristocracy_thin:0 "귀족들을 졸라매라"
 POL_keeping_aristocracy_thin_desc:0 "구 러시아 국가 금고 안에는 수백 민족을 착취해 모은 부가 보관되어 있습니다. 러시아 제국주의자들은 수많은 민족의 들판, 농장, 광산에서 헤아릴 수 없는 보물을 빼앗아 갔습니다. 노예가 된 민족들은 황금·은으로 지어진 궁전을 세우면서도, 자신들은 흙오두막에 살아야 했습니다. 그런 시대는 지나갔지만, 그 잔해 위에 새로운 질서가 불안정하게 들어섰습니다. 이젠 그 제국의 기반을 이루었던 인프라는 현지 민족을 위해 봉사하지만, 자원이든 어떤 것이든 아직 제대로 가공되지 않은 채 남아 있습니다. 우리는 원시농경으로 돌아가자는 야만주의자가 아니라, ‘사회주의자’이자 ‘진보주의자’입니다. 즉, 사람들의 노동이 그들을 위해 일하게 만들고 싶을 뿐입니다.\n\n하지만 우리에겐 부패하고 욕심 많으며 이기적인 자들이 새로 해방된 영토를 약탈해 엄청난 부를 쌓도록 허용할 생각이 없습니다. 동시에 이 땅을 그대로 방치하거나 해방된 민족들이 독점하게 둘 수도 없습니다. 우리는 소국적 민족주의자가 아니기 때문입니다. 러시아가 우리 민족을 착취했던 만큼, 우리는 그 상처에 대한 배상을 받아야 합니다. 석유, 밀, 보리가 그 보상의 ‘연고’가 될 수 있을 것입니다."
 POL_new_history:0 "역사의 새 길"
 POL_new_history_desc:0 "하나의 유령이 폴란드를 배회하고 있다. 엔데치아(Endecja)라는 유령이. 드모프스키는 죽었고, 그의 옛 친구들은 그를 폴란드 민족의 처형인이라 불렀지만, 그의 사상은 그보다 오래 살아남았습니다. 수십년간 피우수트스키의 혁명적 폭정과 폴란드 사회당의 무능을 겪은 폴란드인들은 결정적으로 사회주의자에게 “아니오!”를 외쳤습니다. 민족 민주주의는 드모프스키라는 옛 바르샤바 총독이 아닌, 스타니스와프 그랍스키와 아담 도보신스키의 지도 아래 부활했습니다. 우익 연합을 이끈 중도좌파 자유 민족민주 세력이 폴란드 사회당과 ‘가짜 예언자’ 오콘에 맞서 승리했습니다. 그랍스키는 이제 ‘진정한 민족주의적 민주주의’를 향해 폴란드를 개혁해야 하는 막중한 과제를 떠맡았습니다. 거기서 자유란 국익을 강화하기 위한 도구일 뿐, 말도 안 되는 사회 실험을 위한 것이 아닙니다. 다만, 사나치아가 초래한 혼란을 이 ‘인간적 독재’가 되돌릴 수 있을지는 아직 미지수입니다."
 POL_hail_chief_king:0 "수장에게 경례! 국왕에게 경례!"
 POL_hail_chief_king_desc:0 "이그나치 파데레프스키는 끝내 자유 폴란드를 보지 못하고 세상을 떠났지만, 그 진정한 ‘폴란드 독립의 아버지’는 자신이 뿌린 씨앗으로 ‘자유의 나무’가 자랄 수 있음을 알고 안심했을 것입니다. 얀 소비에스키는 우익 농민당의 지도자인 빈첸티 비토스와 함께 단기간에 폴란드인의 마음을 사로잡았고, 우익 연합과 함께 총선에서 승리했습니다. 폴란드의 왕-대통령이 될 소비에스키는 ‘첫 공화국의 전통을 현대적으로 개선한 형태로 되살리겠다’고 선언했습니다. 그는 경제 자유화를 약속하면서도 사회 복지를 훼손하지 않겠다고 하고, 미국식 금주법 스타일로 ‘도덕적 위생’을 강조하겠다고 했습니다. 피우수트스키와 다신스키가 일으킨 광기에 지쳤던 국민들은 이를 크게 안도했고, 농업·농촌개발부 장관 비토스가 마지막 정치범을 석방하겠다고 발표했을 때는 전국적으로 환호가 터져 나왔습니다. 오직 영화로만 꿈꿨던 ‘아메리칸 드림’ 같은 찬란한 미래가 이제 폴란드를 기다립니다."
 POL_light_liberalism:0 "바야흐로 때가 왔다!"
 POL_light_liberalism_desc:0 "진리와 도덕적 절대주의의 문명이 다시금 허위와 상대주의의 문명에 승리했습니다. 그럼에도, ‘유대-사나치아’의 타타르 세력은 패배했고, 폴란드인들은 수년 만에 비로소 진정한 자유를 누릴 수 있게 되었습니다. 기독교민주·자유보수 양 진영을 대표하는 사회적 권위자로서, 펠릭스 코네츠니 교수가 우익 연합의 선두에 섰습니다. 그는 친미 성향의 농민파와 민족주의자들을 절묘히 균형 잡으려 했습니다. 그럼에도 코네츠니의 사상은 당 내부에서도 비판을 받습니다. 보이치에흐 코르판티는 ‘충격 요법’과 시민 자유 축소를 아주 냉정한 시선으로 바라보고 있지요. 그럼에도 새 총리는, 폴란드의 라틴 문명에 또다시 타타르적 지배를 허락하지 않으려면 그런 조치가 불가피하다고 주장합니다. 코네츠니는 여전히 우세한 대통령 권력을 활용해, 개인 권리와 법치주의를 보장하는 헌법 개정을 이미 착수했습니다. 이 ‘충격 요법’이 과연 폴란드 민족에게 최대의 축복이 될지, 아니면 최악의 위기가 될지는 지켜봐야 알 것입니다."
 POL_and_also_bridge:0 "그리고 그대도 다리를 받으리라!"
 POL_and_also_bridge_desc:0 "폴란드 국민의 힘이 승리했습니다! 에우게니우시 오콘 신부가 폴란드 대통령에 취임했습니다. 더 급진적인 좌파 일부가 신부를 비판하려 했지만, 토마시 동발이 오콘과 브루노 야시엔스키라는 저명한 폴란드 아방가르드 지도자의 회동을 주선하자 조용해졌습니다. 이를 통해, 선동적 대중주의와 선거 조작 의혹에도 불구하고 오콘이 폴란드 이익만을 추구한다는 사실을 좌파 쪽에 안심시킨 것입니다. 오콘 신부는 사나치아의 ‘도살자들’을 기소하겠다고 밝혔습니다. 이는 피우수트스키가 귀족 세력과 결탁해 오콘과 농민-피아스트를 배신한 데 대한 복수라는 것입니다. 폴란드는 드디어 진정한 민주주의 체제를 도입하기 위한 ‘진짜 사회혁명’에 나서고 있으며, 보나파르트-푸자크주의 환상이 아닌, 실제 민주주의를 구축하려 합니다. 폴란드 사회당은 생존을 위해 연정에서 주도권을 쥐겠다는 꿈을 접고, 오콘 신부의 세임 강론을 견뎌야만 합니다. 무질서해 보이는 구호들이 새로운 안정과 민주화를 가져올 수 있을지, 강 위에 다리를 놓겠다는 오콘의 포부가 과연 실현될지는 앞으로 지켜봐야 합니다."
 POL_five_more_years:0 "우리를 위한 5년 더!"
 POL_five_more_years_desc:0 "우익 진영의 동원과 온갖 난관에도 불구하고, 폴란드 국민은 이성적 선택을 했습니다. 그것은 폴란드 사회당이였습니다. 반동들의 비명이야말로 민주적 사회주의의 흔들림 없는 성공을 증명할 뿐입니다. 대중은 조용해졌고, 폴란드인들은 밤에 편히 잘 수 있다는 안도감으로 일상으로 돌아갑니다. 카지미에시 푸자크는 5년 임기로 대통령에 재선되었고, 폴란드 사회당과 인민당 급진파가 연합해 그를 지지했습니다. 폴란드 사회당이 압도적으로 우세했으나, 푸자크는 폴란드인의 물질적 처지를 더 개선하고, 세계적 강국 지위에 걸맞게 ‘인테르미니스터(Inter-Ministerial)’를 재편하기 위해 계속 문명적 대화를 하겠다는 의지를 표명했습니다. 이에 대해 스타니스와프 그랍스키는 마지못해 타협을 수용했습니다. 민주주의와 사나치아의 폴란드는 세간의 주목을 받습니다. 코시치우슈코, 피우수트스키, 다신스키가 지향했던 사상은 지금도 건재하며, 폭정의 흔적에서 깨끗이 세탁되었습니다. 남은 의문은 하나였던 것일 뿐이지요. \"이 모든 성취에도 불구하고, 폴란드를 위해 더 많이 일할 수는 없을까?\""
 POL_kavkaz_without_kafka:0 "카프카 없는 캅카스"
 POL_kavkaz_without_kafka_desc:0 "언뜻 보기에는, 캅카스의 경제가 인간 경제사에서 굴복할 줄 모르는 진보를 보여 주는 듯합니다. 시장의 터무니없는 무정부 상태가 사라지고, 합리적이고 과학적인 테일러주의 방법이 도입돼 생산량과 생산 효율, 노동자 복지가 올라간 듯 보입니다. 그러나 디테일에 악마가 도사리고 있습니다. 즉, 미래주의 국가의 ‘터무니없는 과잉 관료화’와 ‘극단적 전제정’이 바로 그 악마입니다. 시장 무정부 상태는 ‘얼굴 없는 관료주의’로 대체됐고, 첨단 관리 기법은 노동자의 목소리를 전혀 반영하지 않은 채 적용되었습니다.\n\n캅카스 체제가 가진 장점이 있다 해도, 우리는 선량한 민주주의자이자 사회주의자로서 비인간적·기계적인 질서를 반대합니다. 맹목적 이윤 추구나 산출량만 강조하는 방식도 거부합니다. 대신 캅카스가 자본주의의 비능률적 교리를 타파하고자 한 지점을 취해 우리의 노동자 인도주의, 즉 피우수트스키 동지 같은 사회주의 선조를 계승하는 노선과 결합할 것입니다."
 POL_guillotine_democracy:0 "단두대의 민주주의"
 POL_guillotine_democracy_desc:0 "사회주의 이론에서 정리하듯이, 프롤레타리아 계급은 단순 ‘노동자’가 아니라 자본주의 사회의 ‘생산 계급’입니다. 따라서 생산자들이 생산 수단에 가능한 한 많은 통제권을 가져야 한다는 결론이 자연스럽게 도출됩니다. 또한 노동자 통제 확대는 관료-경영계급의 이익에 정면으로 배치되므로, 그 계급이 이 확대를 저해하는 권력을 최대한 억제해야 한다는 것 역시 자명합니다.\n\n그렇다면 어떻게 이를 실현할까요? 답은 ‘급진적 직장 민주주의’를 통한 계급투쟁입니다. 마치 1793년과 1848년 혁명가들이 봉건 귀족에 맞섰듯이, 생산 과정 곳곳에 뿌리내린 ‘경영 귀족’에도 맞서 싸워야 합니다! 기생적 존재의 목소리는 떨릴 수밖에 없지만, 그럴수록 폴란드 노동자는 더 나은 삶을 누리게 될 것입니다."
 POL_memories_of_comrade_naczelnik:0 "동무-나첼니크의 기억"
 POL_memories_of_comrade_naczelnik_desc:0 "그가 여러 결함을 지녔다 해도, 피우수트스키 동지가 진정한 천재였다는 점을 부정할 폴란드인은 없을 것입니다. 그의 혁신적 경제정책에서도 뛰어난 재능이 고스란히 드러납니다. 현대적 도시의 현대적 주택, 이 도시들을 연결하는 현대식 철도, 그 철도 레일은 현대적 공장에서, 현대적 노동자가, 현대적 기법으로 생산합니다. 우리 동지의 비전대로, 우리는 끊임없는 ‘근대화와 변혁’이라는 기본 경제 계획을 그대로 지켜, 우리 사회주의 경제 요구에 맞춰 폴란드를 변혁해 나갈 것입니다."
 POL_taylorism_with_human_face:0 "사람의 얼굴을 한 테일러주의"
 POL_taylorism_with_human_face_desc:0 "위대한 미국인 프레데릭 테일러가 제안한 과학적 관리 기법은 분명히 작업 효율과 노동자 생산성을 높이는 데 우월함을 보여줬습니다. 그러나 미국뿐 아니라 폴란드를 포함한 세계 여러 지역에서 이런 기법이 적용될 때, 정작 이를 적용받는 ‘노동자’를 무시하는 과도한 사례도 있었습니다. 다신스키 동지가 말했듯, 우리는 노동자가 더 나은 삶, 강건하고 도덕적 건강을 유지하는 삶을 영위하길 바랍니다.\n\n그래서 우리는 테일러주의 기법을 도입하되, 그 실행 과정에서 노동자 의견을 최대한 반영할 것입니다. 동시에 폴란드에서 가장 진보된 계산기술 연구를 활용해, 산업과 작업장을 실시간으로 계산·모니터링하는 제도도 시험해 보려 합니다. 이를 통해 과거 테일러주의가 대중에게 연상시켰던 ‘과잉 통제’를 피하고, 경제를 한층 더 높은 단계로 이끌 수 있을 것입니다."
 POL_quality_of_blood:0 "\"혈통\"이 아닌 \"피\"의 질"
 POL_quality_of_blood_desc:0 "이제는 오래전처럼 단순 생물학조차 몰라, 자신과 자녀의 질병을 설명하지도, 개입하지도 못하던 시대가 지났습니다. 현대 생물학과 유전학이 마침내 도래함으로써, 흔한 유전 질환을 이해할 뿐 아니라 유전적 운명을 온전히 통제하고 의식적으로 개선할 수도 있게 되었습니다. 모든 과학적 혁신이 그러하듯, 우생학도 학계나 기초 산아제한 클리닉에만 머물 것이 아니라, 사회주의와 노동자의 진보적 발전을 위해 적극 활용되어야 합니다. 우리는 피우수트스키적 우생학 프로그램을 이어받아 직장 관리자들의 ‘유전적 자질’을 향상하는 데 주력할 것입니다. 그리하여 노동자 복지와 경제 효율성을 극대화하는 것이 목표입니다. ‘유전적 조화’가 드디어 폴란드 사회주의의 생물학적 토대를 형성하게 될 것입니다."
 POL_market_of_planners:0 "계획자들의 시장"
 POL_market_of_planners_desc:0 "교육받지 못한 사람이 우리 폴란드의 현재 경제를 대충 살펴보면, 자본주의 시장경제의 기본 가정과 메커니즘이 여전히 작동하는 듯 보일 수 있습니다. 즉, 폴란드 노동자는 화폐 임금을 받고, 그 임금으로 재화와 서비스를 구매하며, 재화 가격은 수요·공급에 따라 상점이나 시장에서 수시로 변경된다는 식이죠.\n\n하지만 조금만 더 깊이 살펴보면, 실제는 이와 정반대임을 알게 됩니다. 재화 가격은 악랄한 자본가나 투기꾼이 정하는 게 아니라, 객관적이고 합리적인 컴퓨터 네트워크가 ‘최대 효율과 복지’를 위해 실시간 조정합니다. 노동자 임금 역시 피를 쥐어짜는 고용주가 정하는 게 아니라, 노동자와 계획 담당자들이 조화롭게 협력해 더 나은 미래를 마련하기 위해 결정합니다. 이렇게 ‘계획된 시장’은 결국 자본가들이 의존하던 ‘무계획 게임’에서 승리를 거둔 것입니다."
 POL_dance_of_strawman:0 "허수아비의 춤"
 POL_dance_of_strawman_desc:0 "인민당은 외견상 옛 폴란드 정당들과 비슷해 보이지만, 실제로는 ‘우리 연방’ 안에서 태어난 새로운 존재입니다. 사나치아가 몰고 온 현대화의 폭풍에 맞서 농촌 폴란드를 대변하는 농민 정당들의 연합체라는 말이지요. 우리가 대의 민주주의와 사회주의를 동시에 지향하며 집권당 위치에 올랐으니, 이제 그 지도자들과 협력해 지지 기반을 넓히는 것을 고려할 만합니다.\n\n그렇다고 민중당 인사들이 곧장 정부 요직에 앉는다는 뜻은 아니지만, 미래에 도시 사회주의 세력과 농촌 포퓰리즘 세력이 연대한 가능성을 검토하겠다는 말입니다. 동시에 농촌에 사회 프로그램을 집중하고 확대하려 합니다. 당 내부 급진파 입장에선 ‘돌이킬 수 없을 만큼 낙후된 세력과의 무의미한 얽힘’처럼 들릴 수 있겠지만, 우리의 미래는 ‘협력 가능한 동맹자와의 공조’에 달려 있다고 말하고 싶습니다. 지금은 ‘토끼풀 인민’ 세력의 표를 얻기 위해서라도, 이 정도면 충분합니다."
 POL_no_gold_rotten_tooth:0 "썩은 치아에 금은 없다!"
 POL_no_gold_rotten_tooth_desc:0 "연합회복권의 일원으로서, 우리가 과거 지주에 취했던 정책은 주로 실용적 고려와 폭넓은 사나치아 전선의 요구에 영향을 받았지, 우리 의지에 의한 것은 아니었습니다. 이제 우리가 주도권을 쥔 지금, 토지 개혁과 농업 문제에서 한층 더 확고한 원칙을 주장할 수 있게 되었습니다.\n\n과거 원수 정부에 참여하면서 ‘애국적 지주’에 대한 공적 지원을 수용한 것은, 그 시기 나라가 처한 극단적 상황과, 경제 전반 다른 분야에서의 현대화 우선 정책 때문이었습니다. 이제 인민당과 손잡고, 진정한 사회주의·농민의 시각에서 토지 개혁 문제를 다룰 때가 되었습니다. 스스로 경작하지 않는 땅에서 부를 빨아먹는 기생 계급인 지주에게 미래 폴란드에서 설 자리는 없습니다. 우리 정부가 토지 개혁을 주도하고, 미래 모든 개혁의 기준을 제시할 것입니다."
 POL_breaking_glass_ceiling:0 "유리 천장 깨기"
 POL_breaking_glass_ceiling_desc:0 "원수 체제 아래 발전된 폴란드 경제는, 엘베강 동쪽에서 가장 번영했다고 할 수 있습니다. 그러나 우리가 바라는 수준과는 여전히 거리가 있으며, 폴란드 경제를 운영하는 공식적·비공식적 편견들이 그 사실을 명확히 보여줍니다.\n\n곳곳에서 폴란드계가 유대인·리투아니아인·우크라이나인·독일인 등 다른 집단보다 우대받는 모습을 볼 수 있습니다. 현대 사회주의 경제에 걸맞지 않은 지방 유지나 ‘카스트’적 구조의 흔적도 남아 있습니다. 더 나쁘게는 특정 정치 성향 때문이나 정치적 성향이 없다는 이유로 채용이나 승진에서 배제되는 유망 인재들도 있습니다. 아직 연합회복권과 그 보조기구인 ‘노조총연합’을 완전히 해체할 단계는 아니지만, 미래 사회주의 폴란드 경제는 인종이나 언어와 무관하게 ‘모든 폴란드인의 것’임을 분명히 해야 합니다. 우리는 가능한 모든 행정 수단을 동원해 이 메시지를 전달하고, 미래에 이런 편견을 완전히 뿌리 뽑을 법안을 마련하려 합니다."
 POL_socialism_between_seas:0 "바다 사이의 사회주의"
 POL_socialism_between_seas_desc:0 "인테르마리움은 사나치아 정권이 이룬 최고의 성과 중 하나이자, 원수 피우수트스키의 유산이 지닌 완벽한 장점을 보여주는 예시입니다. 이 동맹은 발트해와 흑해 사이의 독립국들을 정치적 협력, 상호 방위, 군사 협력, 그리고 무엇보다 중요한 경제 연대·상호 지원에서 묶어 줍니다.\n\n인테르마리움 다른 국가들을 지원하는 풍부한 투자 프로그램을 마련함으로써, 이 동맹이 단지 자위적 성격을 넘어서는 제도라는 점을 입증할 수 있고, 사회주의 경제가 국제적 맥락에서 실현 가능함을 보여줄 수 있으며, 동맹 내에서 우리의 우방과의 유대와 지도적 역할을 강화하고, 주요 무역 상대국 경제도 발전시킬 수 있습니다. 이는 결국 우리 경제에도 간접 이익이 돌아올 것입니다. 10년 넘게 군사 계획과 집단 방위, 회원국 간 분쟁 해결의 상징이었던 인테르마리움은 이제 국민의 풍요와 복지, 그리고 산업 생산성을 증진시키는 기관으로 거듭날 것입니다."
 POL_militarization_masses:0 "대중의 군사화"
 POL_militarization_masses_desc:0 "우리는 진보를 믿으면서도 결코 순진하지 않습니다. 우리는 사나치아 정권을 총검에 겁먹고 지지한 게 아니라, 강력한 국방이 ‘절대적으로 필요함’을 깨달았기 때문입니다. 이제 권력을 쥔 우리가 어떤 방식으로 이 국방을 보장할지 결정할 때가 되었습니다. 우린 기존의 폴란드 국방산업 강화를 위한 노력을 확대하고, 투자와 직접 연구 자금 지원으로 이것을 촉진할 것입니다. 페트로그라드 병사 수와 1:1로 맞추지 못하더라도, 폴란드 수호자들은 더 나은 장비와 보급을 받게 될 겁니다.또한 우리가 구상하는 폴란드에 부합하는 군사 체제를 구축하기 위해, ‘인민 의용대’를 조직하기 시작하겠습니다. 언젠가는 이 노동자·농민 영토군이, 비대한 중앙집권적 군대 조직을 완전히 대체할 것입니다. 아직 시간이 필요하지만, 지금부터라도 원수가 장악하던 ‘총참모부’의 영향력을 축소할 수 있습니다."
 POL_culture_hammer_bread:0 "망치와 빵의 문화"
 POL_culture_hammer_bread_desc:0 "풍요는 정부 부처나 계획가, 심지어 공장 관리들 사이에서 비롯되지 않고, 오직 ‘노동자’ 안에서 시작됩니다. 게으르고 무감각한 프롤레타리아로는 아무 가치도 만들지 못합니다. 열정적인 이들이라 해도 동료애와 방향이 필요합니다. 무가치한 물건을 만드는 공장이나, 아무 소득도 없는 일을 반복하는 노동자들을 방치해선 안 됩니다. 이런 문제들은 체계적 대응으로 근본적으로 해결해야 합니다.\n\n또 ‘노동’ 자체도 노동자 본인이나 전체 국민이 단지 생계수단으로만 여기지 말고, 진보를 추동하는 ‘영원한 엔진’으로 바라봐야 합니다. 이는 민중이 하나가 되어 ‘신’ 같은 존재가 되는 통로입니다. 나태나 낭비는 ‘신성모독’으로 간주해야 합니다. 우리의 시대에 ‘이단’은 퇴보주의자·무능한 자들이며, 그들이 전파하는 ‘멈춤과 분열’ 교리는 단호히 뿌리 뽑아야 합니다."
 POL_new_working_race:0 "새로운 작업 인종"
 POL_new_working_race_desc:0 "품위 있는 인종을 유지하려면, 건강하고 강인하며 지적인 자들을 병약·무능·지적 장애가 있는 자들과 분리해야 합니다. 바르샤바의 허름한 술집 앞에 쓰러져 있고, 항시 실직 상태이며 무계획한 ‘알코올중독자’의 자녀는 그 부모를 그대로 계승할 뿐이지 않겠습니까? 병원에 상시 입원하거나 거리 갱을 조직하고, 농촌을 배회하는 이들의 자녀는 결국 문제를 배가시키는 존재가 되고 말 것입니다.\n\n이를 막으려면 간단한 절차가 필요합니다. 기계에서 불량 부품을 제거하듯, ‘결함 있는 인간’도 인구에서 제거해야 합니다. 질병을 근절하고, 전국 어디서나 보건의료를 보장해야 합니다. 우리는 의사를 양성하고, 전 세계 선진 의술과 확장 중인 우리 대학의 혁신적 연구를 결합한 체계를 마련할 것입니다. 모든 도시를 건강과 안녕의 상징으로 만들어야 합니다. 경찰은 범죄자뿐 아니라 ‘건강하지 못한 이들’도 주시할 것입니다. 활기찬 프롤레타리아의 덕목에는 더욱 강인한 생식력이 수반되어야 합니다."
 POL_paint_kwiatkowski_red:0 "크비아트코프스키를 붉게 물들여라"
 POL_paint_kwiatkowski_red_desc:0 "산업통상부 장관 에우게니우시 크비아트코프스키는 말기 피우수트스키 정부의 위대한 기획자였으며, 아마 연합회복권 기술관료 중에서도 가장 유능하고 예리한 인물이었을 것입니다. 폴란드 남북을 가르는 간극을 해결하고 우리 나라를 ‘산업 대국’으로 만들겠다는 그의 원대한 계획은 야망, 구체성, 잠재력 면에서 유례가 없습니다. 그가 우리 정권을 지지하지 않는다 해도, 우리가 그의 아이디어를 활용하지 못하리란 법은 없습니다.\n\n크비아트코프스키의 계획은 특정 지역을 집중 개발·확장하는 전략을 중심으로 합니다. 예컨대 그디니아 항구 확장, 르부프 지역과 실레지아에 제대로 된 통합 산업 단지 구축 등. 이 프로젝트들은 폴란드 산업 발전과 ‘정상적 사회주의 경제’를 건설할 역량을 가속하기 위한 것입니다. 또한 단지 경제 압력뿐 아니라 상시 존재하는 러시아 제국주의의 위협 속에서 폴란드와 인테르마리움의 독립을 지키는 데도 관련이 있습니다. 우리는 이 계획들을 최우선으로 완수하면서, 동시에 우리에게도 정당한 공이 돌아가도록 해야 합니다."
 POL_end_of_sisyphean_works:0 "시시포스 노동의 끝"
 POL_end_of_sisyphean_works_desc:0 "우리는 우리에게 주어진 거대한 과제를 어느 정도 완수했습니다. 그렇다고 아직 안주할 때는 아닙니다. 마지막으로 한 가지 더 과제를 착수해야 하니, 그것은 ‘폴란드 교육의 현대화’입니다. 바르샤바·루블린·크라쿠프 등은 최상급 학교가 위치한 반면, 나머지 대다수의 중·하위권 학교들은 교육 수준이 처참해, 어수룩한 기준조차 지키기 버겁거나 젊은이로 과밀 상태입니다.\n\n대학에서 갓 배출된 신임 교사들이 문해력과 시민 정신을 새 기백으로 전파해야 합니다. 모든 초중등 교육 기관을 새로 개편해, 학생들이 받을 자격이 있는 최고의 교육을 제공하고, 대다수가 필요로 하는 수준을 보장해야 합니다. 수학과 폴란드어 같은 현대 과목에 중점을 두고, 종교적 영향력을 배제할 것입니다. 교회가 운영하는 수많은 학교들도 점차 공교육 체제로 흡수하겠습니다.\n\n대학교는 전통 학문만 가르치는 곳이 아니라, 연구·기술·대중문화의 중심지로 만들 것입니다. 이 하나의 필터링 지점에서, 후대가 사상적으로 통합되고 영구적인 애국심·인도주의를 갖추어 ‘자유롭고 문화적으로 활기찬 사회’를 이룰 수 있도록 보장해야 합니다."
 POL_what_levi_couldnt:0 "레비가 하지 못한 것을 하다"
 POL_what_levi_couldnt_desc:0 "우리의 경제 개혁이 마침내 완수되었습니다. 농업·산업 모든 부문에서 큰 변혁이 이뤄졌고, 성공적으로 적용되었습니다. 잔혹하게 농민을 착취하면서도 국기 뒤에 숨어 있던 지주들은 계급 자체가 청산되었으며, 농민은 자유롭게 자기 땅을 소유하거나 동료들과 조합을 이루어 경영할 수 있습니다. 농촌 생활의 부조리는 제거되었고, 무엇을 심고 누가 일하는지, 무엇을 소비자에게 보낼지가 합리적으로 결정됩니다.\n\n노동자들은 자본가든 당 관료든 간섭을 받지 않고 산업을 통제할 권리를 부여받았습니다. 여성들도 반동적 사회 통념과 육아 부담 탓에 배제되던 노동 현장에 참여하도록 기회가 열렸고, 이는 충분한 보육 보조금 지원으로 뒷받침됩니다. 하지만 그들이 노동을 강제받는 것도 아니며, 남성들도 가족 부양 수단을 충분히 인정받고 있습니다. 폴란드 전체 산업 기반은 낙관론자조차 예상치 못한 수준으로 확장되어, 서유럽도 부러워할 정도로 소비재와 군수품을 대량 생산하고 있습니다. 우리의 경제가 원활히 돌아가고 있으니, 이제 미래를 바라볼 수 있습니다."
 POL_marx_for_the_right:0 "우익의 마르크스, 좌익의 시장"
 POL_marx_for_the_right_desc:0 "사회주의 정치와 국가의 경제 통제 사이에 존재하는 ‘가짜 이분법’은, 사실상 각국 경제에 만연한 ‘실제 모순’, 즉 ‘생산하는 경제 주체’와 ‘기생적 지대수익자’ 간 모순을 가리는 유용한 가면일 뿐입니다. 진정한 경제 정의는 완전한 자유방임도, 억압적 국가 지배도 아닌 ‘시장 혁신과 공정 규제’의 금값 균형을 통해 달성됩니다. 이제 사나치아 경제를 완전히 장악했으니, 민영화와 규제 완화를 추진할 수 있습니다. 다만 이번에는 욕심 많은 자본가가 아니라 ‘겸손한 폴란드 노동자’를 위해 이뤄질 것이며, 이후에는 목표 지향적 국가 개입과 재정 투입을 병행해 실제 사회적·정의로운 경제를 이룰 계획입니다."
 POL_comrade_quesnay:0 "케네 동지가 예견한 대로"
 POL_comrade_quesnay_desc:0 "고전 정치경제학에서, 가장 열성적 지지자들도 비극적으로 간과해 온 측면 중 하나가 ‘중농주의’입니다. 그들은 ‘노동보다 농업을 중시한다’는 점에서 다소 잘못된 면이 있지만, 그들의 경제 혁신은 현대 경제를 올바르게 이해하는 데 기본 역할을 합니다. 마찬가지로, 우리는 폴란드 경제를 ‘현대적 중농주의적 비전’으로 재편하려 합니다. 곧 생산적 부문이 비생산 부문보다 우위에 서고, 성장의 주된 동력이 독자적 투자가 되며, 개인적·경제적 자유를 공익을 위해 확대하는 방향입니다."
 POL_diggers_of_new_era:0 "새 시대의 디거"
 POL_diggers_of_new_era_desc:0 "반동적 좌파가 짐작하듯, 우리가 급속한 민영화가 초래할 사회·경제적 부정 효과를 전혀 간과하는 것은 아닙니다. 그렇다고 해서 사소한 꼬투리에 얽매여 민영화 자체를 접으려는 것도 아닙니다. 결국 우리 목표는 ‘가난한 자, 생산하는 자’의 편에 서는 것이며, 우리의 정책도 그에 부합해야 합니다. 물론 우리는 사회적 소유권을 반대하지 않지만, 기생적 독점은 국가든 사적이든 반대합니다. 독점을 방지하려면, 옛 국영기업을 단순히 최고 입찰자에게 넘기지 않고, 겸손한 노동자와 농민이 협동조합 형태로 소유하도록 해야 합니다. 부당한 소유 시대는 드디어 끝나야 합니다."
 POL_let_dogs_roam_free:0 "개를 풀어라"
 POL_let_dogs_roam_free_desc:0 "우리는 마침내 경제 개혁 프로그램의 기초를 다졌습니다. 공기업들은 민영화 준비를 위해 점차 많은 자율권을 부여받았고, 불필요한 보조금이 폐지되었으며, 진보적 복지·소득 정책이 도입되고 있습니다. 이제 비로소 이 프로그램의 정점, 즉 비대한 사나치아 국영 경제에 결정타를 날리고 폴란드에 경제 자유를 재도입할 시기가 왔습니다. 물론 이를 ‘장엄하게’ 진행하고 싶진 않습니다. 대신 국유 재산을 신중하게 매각하고, 점차 경제적 속박에서 벗어날 것입니다. 결국 또 다른 ‘경제적 이카로스’가 되어 추락하고 싶지 않으니까요."
 POL_plating_new_whips:0 "새로운 채찍과 목줄"
 POL_plating_new_whips_desc:0 "민영화와 규제 완화가 완료되었으니, 이제 다시금 고삐를 죄어 국가와 시장 사이의 균형을 국가 쪽으로 되돌릴 때입니다. 과거 폴란드처럼 모든 경제 부담을 떠안기보다, 국가가 ‘경제의 핵심 고지’만 통제하는 체제로 전환할 것입니다. 자유 시장 부문도 규제에서 완전히 자유롭지는 않을 것입니다. 그것이 본질적으로 비생산적인 것은 아니지만, 이제 막 탄생한 자본가 계급이 폴란드와 우리에 불리한 성향을 지닌 경우가 많기 때문입니다. 그들을 우리의 통제 아래 손쉽게 억제할 수 있을 때 싹을 잘라 내는 것이 최선이지 않겠습니까?"
 POL_peoples_capitalism:0 "인민 자본주의"
 POL_peoples_capitalism_desc:0 "우리가 폴란드 경제를 개혁·개방하기 위해 기울인 지치지 않는 노력이 마침내 결실을 맺었습니다! 비효율 기업에 대한 보조금은 사라졌고, 효율적 기업이 부각되며, 추상적 ‘통제’ 명분으로 자유로운 경제 투자를 막던 일도 없어졌습니다. 이제 자유롭고 생산적인 경제 세력이 사회의 통제 아래 폴란드에서 꽃필 수 있게 됐습니다. 물론 이것이 노동자·근로자를 방치한다는 의미는 결코 아닙니다. 오히려 보편적 복지, 완전고용 정책, 목표 지향적 국가 투자 및 규제를 결합해 ‘사회에서 가장 광범위한 계층’이 새 경제 질서의 주된 수혜자가 되도록 했습니다. 자본 대 노동의 전통적 경제 논리를 생산적 대 비 생산적으로 치환하는 데 성공했고, 폴란드 경제는 더욱 좋아졌습니다."
 POL_strong_tough_ready:0 "강하고, 굳세고, 준비된!"
 POL_strong_tough_ready_desc:0 "폴란드는 닥쳐올 수 있는 어떤 위협에도 대비해야 합니다. 지금은 러시아 곰이 피흘리며 쓰러져있는 중이지만, ‘러시아의 대혼란기’에서 어느 누군가가 우위를 점하자마자 잃어버린 제국 영토를 되찾으려 들 것입니다. 그 사이 유럽도 불길에 휩싸여 있습니다. 독일과 프랑스는 다시금 충돌 직전으로 다가가고, 혁명운동은 정부를 교체하고 동맹을 형성하고 있습니다. 어떠한 사태가 벌어지든, 폴란드와 인테르마리움은 강인하게 서 있을 것입니다."
 POL_hussars_with_three_hundred:0 "300마력의 후사르"
 POL_hussars_with_three_hundred_desc:0 "과거 우리 ‘날개 달린 후사르’는 최강의 말을 타고 빈 공성전을 깨부쉈습니다. 오늘날 폴란드 군대는 이 시대의 ‘강철 말’을 타고 문명의 깃발을 휘두릅니다. 폴란드의 산업은 대륙에서도 손꼽히며, 우리 군인들이 사용할 군사 장비 또한 그 점을 반영해야 합니다. 이를 위해 대규모 기계화 프로그램을 실행할 것입니다."
 POL_riding_the_apocalypse:0 "종말을 달리다"
 POL_riding_the_apocalypse_desc:0 "‘죽음의 후사르’는 현대 폴란드에서 가장 독특한 군사 부대입니다. 자원 의용 기병대로 시작된 이를, 유제프 로키에테크가 사나치아의 비공식 비밀경찰로 바꿨습니다. 반체제 인사를 쫓고, 정규군을 지원하며, 우리 특수부대로 자리 잡은 이 부대가 앞으로 어떤 역할을 맡아야 하는지는 장군들이 이미 고민해 온 바입니다."
 POL_city_of_wonder:0 "바다의 거품에서 피어난 경이로운 도시"
 POL_city_of_wonder_desc:0 "비록 단독 권리는 아니어도, 그단스크에 대해 우리는 특정 특권을 가지고 있습니다. 그디니아 항만을 건설해 그단스크 항에 대한 의존을 줄이긴 했지만, 발트해 전역을 완전히 장악했다고 볼 순 없습니다. 이 상황을 조속히 바꿔야 합니다. 폴란드와 독일을 제외한 발트해 연안은 선언적이든 암묵적이든 우리 적대 세력이 장악하고 있습니다. 자작나무 서약 동맹은 모든 분야에서 러시아의 도움에 기대왔으며, 그들이 우리를 상대로 어떤 계획을 세웠을지 모르는 일입니다. 운명적인 ‘제2차 빈켈리에트 전쟁’이 벌어질 때, 우리가 배후를 찔리도록 놔둘 수 없습니다. 발트해 역시 드니에프르 강 변만큼 굳건히 방어해야 합니다."
 POL_of_storks_eagles:0 "황새와 독수리에 대해"
 POL_of_storks_eagles_desc:0 "대전쟁은 비행기가 전투에서 얼마나 강력한 지배력을 행사하는지를 여실히 보여 주었습니다. 앞으로 닥칠 전쟁에서 승리를 보장하려면, 우리는 거대한 ‘항공 전력’을 갖춰야 합니다. 우리의 지상군이 적 공군의 자비에 내맡겨지는 일은 없을 것이며, 하늘의 기사들이 이를 지켜낼 것입니다."
 POL_limits_not_to_cross:0 "넘지 말아야 할 선"
 POL_limits_not_to_cross_desc:0 "로마의 카이사르가 그랬듯, 시미그위도 자기만의 ‘루비콘’을 앞두고 있습니다. ‘폴란드의 카이사르’인 피우수트스키가 죽으면서, 나라에는 오직 군대만 메울 수 있는 구멍이 생겼습니다. 1918년에 누가 구원을 가져왔는지, 그리고 1936년 지금, 누가 나라를 지켜 낼지 국민들은 잘 알고 있습니다. 폴란드 군대만이 시기상조의 파멸에서 구해 낸 것을 보호하겠죠. 앞으로 갈 길은 ‘군사 정권’을 세우는 것입니다. 가장 숭고한 목표인 비탄에 잠긴 폴란드에 안정을 \"회복\"시키기를 내세워 말이지요."
 POL_provocateurs_who_dare:0 "감히 도전하는 선동자"
 POL_provocateurs_who_dare_desc:0 "피우수트스키가 죽자, 이제 폴란드의 모든 이들이 그가 이룩한 성과를 자기 몫으로 삼고 싶어 합니다. 파업, 시위, 집회가 이어집니다만, 구국군사위원회와 시미그위는 이를 용납하지 않을 것입니다! 폴란드의 안정과 미래를 위해 방해가 되는 누구라도 가장 혹독한 대응책을 쓸 수 있도록 승인이 떨어졌고, 우리에게 맞서 손을 드는 자들은 피로 얼룩진 최후를 맞이할 것입니다!"
 POL_nation_signs_with_one_voice:0 "한 목소리로 말하는 민족"
 POL_nation_signs_with_one_voice_desc:0 "혼돈은 원인이 아니라, 우리의 질병을 드러내는 증상일 뿐입니다. 여기까지 몰고 간 장본인은 누구입니까? 사나치아가 ‘능력주의 민주주의’랍시고 어설프게 시도한 탓에 반역자들이 슬그머니 침투해, 원수가 떠난 지금 그 권력을 자신들에게 달라고 요구하는 지경에 이르렀습니다. 우리는 피우수트스키조차 감히 가보지 못한 길을 택하겠습니다. 모든 형태의 민주주의를 폐지하고, 오직 ‘절대적 독재자’만이 나라를 이끌도록 할 것입니다. 그리고 그 위치에 오를 인물은 바로 원수 시미그위 외에 없을 것입니다!"
 POL_love_to_the_country_is_a_polish_dictator:0 "독재야말로 애국!"
 POL_love_to_the_country_is_a_polish_dictator_desc:0 "시미그위는 루비콘을 건넜고, 구국군사위원회까지 이끌며 그들의 지도 아래 떠오르는 새 폴란드 해안에 도달했습니다. 이제 그 앞엔 “어느 길을 택할 것인가”라는 질문만 남아 있습니다. 분명 군사 정권은 폴란드에 안정을 가져오려는 임시 방편일 뿐입니다. 이제 책임자 시미그위는 나라가 나아갈 길을 결정해야 합니다. 모스도르프, 기에드로이츠, 코츠 같은 이들은 군부 통치를 영구화해 병든 폴란드를 구할 해결책으로 삼자고 제안하지만, 정작 원수 본인은 이 제안에 그들만큼 확신이 있는지 알 수 없습니다. 누구를 자기 식탁에 초대해 통치 부담을 나눌지 고민해야 합니다."
 POL_622_days_of_bunga:0 "붕가를 위한 622일"
 POL_622_days_of_bunga_desc:0 "시미그위 원수가 가장 뜻밖의 결정을 내렸습니다. 저명한 시인이자 예술가인 비트카치가 피우수트스키 유산을 토대로 하는 새 폴란드 비전을 내세워, 이 나라 운명의 구원자를 자기편으로 끌어들였습니다. 그가 생전의 나첼니크와 나눈 대화, 그리고 시미그위의 일부 생각과 본인의 성향이 맞았음을 근거로 내세웠는데, 그 전략이 통했나 봅니다. 시미그위와 비트카치는 악수를 나누고 권력을 공유하기로 합의해, 폴란드를 전례 없는 위대함으로 이끌겠다고 합니다."
 POL_the_mythopoetic_capital:0 "신화시적 자본"
 POL_the_mythopoetic_capital_desc:0 "폴란드 부르주아는 그들의 부를 노리는 사회주의 운동가들로부터 구해 달라며 우리 발 아래 무릎 꿇고 있습니다. 그들이 머지않아 사라질 영향력을 붙잡기 위해 시인의 손길을 애걸하는 모습이 흥미롭기만 합니다. 좋습니다. 우리가 도와주겠습니다. 그 대가로 우리는 합당한 요구를 내세웁니다. 즉, 그들의 충성과, 개인주의를 파괴하고 사유 재산을 짓밟으려는 자들에게서 경제를 지켜내기 위한 협력이 필요합니다."
 POL_polonia_heroic_and_historic:0 "영웅적이고 역사적인 폴로니아!"
 POL_polonia_heroic_and_historic_desc:0 "폴란드는 지금껏 진정으로 통찰력 있는 지도부를 가져 본 적이 없습니다. 소위 ‘귀족 민주주의’라 불리던 ‘옛 연방’ 체제 아래에서는 국가가 맡아야 할 역사적 임무를 결코 수행할 수 없었습니다. 그 시절은 지나갔고, 폴란드는 마침내 ‘진정한 민족’이 될 것입니다. 약자는 사라져, 진정한 개별적 영혼이 깃든 최고의 폴란드인에게 길을 내어야 합니다. 이 ‘위대한 인물’을 찾는 것은 국가의 임무이며, 영혼이나 자발성이 결여된 ‘기계적 피조물’이 만들어지지 않도록 신중히 추진해야 합니다."
 POL_against_citizens_x:0 "시민 X와 하이퍼프롤에 대항하여"
 POL_against_citizens_x_desc:0 "현대 시대의 ‘고귀함’ 가운데 피우수트스키와 마야콥스키가 있지만, 그들의 노력은 의도치 않은 결과를 낳았습니다. 바로 ‘경제를 통제하는 경영 계급’이라는 존재입니다. 일상생활의 사소한 면모까지 관리하는 이들만큼 사악한 자들은 없습니다. 먹고 배설하는 것, 잠자고 번식하는 것 그 어떤 것에도 그들은 끝없이 개입하려 합니다. 이런 ‘구더기’를 당장 제거해야 합니다. 우리의 국가는 ‘예술 작품’이며, 예술이란 자발적 행위에서 태어납니다. 경제도 이 원칙을 따라, 우리의 파멸을 노리는 ‘대중의 하수인’을 제거해야 합니다."
 POL_schizoids_of_phalancstere:0 "팔랑스테르적 정신분열증"
 POL_schizoids_of_phalancstere_desc:0 "수 세기 전부터 프랑스인은 통찰력 있는 민족이었습니다. 그들 중 누군가 ‘팔랑스테르’라는 개념을 구상했죠. 대중에게 주택·정원·자동차를 공급하려는 이상적 공동체였습니다. 예술정신을 갖춘 우리에겐 역겨운 발상이지만, 이 개념을 우리 목적에 맞게 재활용할 수 있습니다. “더러운 프롤레타리아의 보금자리”에서, 팔랑스테르는 ‘원치 않는 방문자’의 시선에서 벗어나 폴란드 예술가들이 안주할 안식처가 될 것입니다."
 POL_the_society_of_society_shapers:0 "사회를 형성가들의 사회"
 POL_the_society_of_society_shapers_desc:0 "두려움과 에로틱한 욕망에서 힘을 얻는 ‘인간의 진화’는, 강력한 지도자 없이는 역겨운 ‘집단화’를 초래할 뿐입니다. 우리 근심은 피우메와 프랑스의 젊은 혁명가들이 세계에 반란을 선언하며 풀렸습니다. 단눈치오와 아폴리네르는, 이전까지 보편적 진리로 여겨지던 모든 원칙을 단숨에 깨부쉈습니다. 그 모델을 이제 폴란드에도 적용해, 옛 거장을 뛰어넘고 그들의 이름을 묻어 버릴 신작을 공동 제작하고자 합니다."
 POL_breeding_the_uberrace:0 "초-인종 번식"
 POL_breeding_the_uberrace_desc:0 "니체의 초인은 단순히 언어적 개념이 아니라, 우리의 신체를 변화시키려는 물리적이고 구체적 프로젝트였습니다. 이 숭고한 여정은 진정한 ‘스포츠 문화’를 되살리고, 이를 자격 없는 대중으로부터 뺏는 것으로 시작해야 합니다. 육체적 노력과 아름다움의 고대 의미는 ‘시인-귀족’들의 손에서 부활할 것이며, 스포츠 정신을 왜곡해 온 추하고 기형적인 자들과는 거리 두게 될 것입니다."
 POL_the_captain_of_industry_reborn:0 "다시 태어난 대실업가  "
 POL_the_captain_of_industry_reborn_desc:0 "토머스 칼라일은 얼마 전, 우리의 문제를 해결할 방법으로 ‘위인정치, 곧 영웅의 통치’를 제시했습니다. 폴란드는 프로이센처럼 그런 정신을 찾지 못했지만, 한 인물이 그 길을 모색했습니다. 뜻밖이게도, 러시아에 폴란드를 팔아넘긴 로만 드모프스키가 바로 ‘애국심을 갖춘 산업 계층’을 잉태시킨 장본인이었습니다. 피우수트스키가 그들을 제쳐두고 테크노크라트 ‘흰개미’를 자리 잡게 한 것이 참으로 비극적 실수였지만, 아직 이를 되돌릴 기회가 있습니다. 이제 새로운 카스트가 나타나 산업을 이끌며, 우리만의 영웅정치로 가는 길을 열 것입니다."
 POL_breaking_the_past_men:0 "과거-인 부수기"
 POL_breaking_the_past_men_desc:0 "착각 말아야 합니다. 새 폴란드 정권이 ‘옛 시대 영웅들’에게 맹목적 숭배를 바치는 것은 아닙니다. 루덴도르프 같은 인물은 경외할 만해도, 역사의 진보를 멈추려는 그들의 발상은 사회주의만큼이나 경멸스럽습니다. 즉흥적 모험의 시대는 끝났고, 이제 현대의 젊은 비전가들이 자유를 위해 고삐를 쥐고 있습니다! 가부장주의도, 낭만주의도 사라지라! 우리는 새 진보 단계로 전진해야 합니다!"
 POL_caligula_uber_alles:0 "칼리굴라 우베르 알레스!"
 POL_caligula_uber_alles_desc:0 "인간을 각성시키는 힘은 ‘마약, 섹스, 전쟁’ 셋입니다. 셋 중 하나라도 없으면 안 됩니다. 우리 눈은 마침내 이 아름다운 진실을 발견했습니다. 역사의 과정이 건드리지 못한 건 침대고, 가장 높은 정서를 채워 주는 건 마약이며, 이를 하나로 묶는 것이 바로 ‘전쟁’ 가장 고결한 예술입니다! 현대 전쟁이 정치인들이 요구를 관철하는 수단에 불과했으나, 이제는 자체로 예술이 될 것입니다. 새 폴란드 국가는 방종과 군국주의를 자랑하게 될 것입니다. 새 폴란드 병사들은 재충전된 정신과 최첨단 전투약물로 강화된 육체로 적들과 맞설 것입니다!"
 POL_bolshevism_minus_socialism:0 "볼셰비즘 빼기 사회주의"
 POL_bolshevism_minus_socialism_desc:0 "1918년 러시아 혁명은 거의 러시아에 재앙에 가까웠고, 그들의 역사적 궤도를 끊을 뻔했습니다. 하지만 그 무명 회색 군중 속에서도 새로운 용사들이 태어났습니다. 사빈코프나 마야콥스키는 ‘사회주의 진창’ 속에서 일어나, 가장 깊은 심연에서도 아름다움과 고귀함이 피어날 수 있음을 증명했습니다. 우리는 그들의 노고를 인정하고, 문화적 노력에서 많은 것을 배울 수 있지만, 그들의 끔찍한 경제 노선은 피해야 합니다. 아무리 찬양해도, 볼셰비즘은 여전히 마르크스주의 노선을 따릅니다. 그러나 우리 혁명의 본보기가 러시아 ‘신화 창조자’들이 프롤레타리아 환상을 버리고 자기만의 길로 나아가도록 영감을 줄 것이라고 믿습니다."
 POL_the_revolution_from_the_court:0 "궁정에서의 혁명"
 POL_the_revolution_from_the_court_desc:0 "대부분의 혁명은 ‘가장 잔혹한 신, 즉 대중’이 일으키는 혐오스러운 것들입니다. 대중은 모든 가치를 파괴하여 지루하고 퇴폐적인 상태를 만듭니다. 우리 혁명은 그런 아래에서 위로의 변화에 맞서 자기 의지를 관철합니다. 귀족들은 역사상 처음으로 충분한 힘을 모아 이 ‘곡와 마곡’의 행진을 끝낼 수 있게 되었습니다! 시인들은 인류를 생물학적 욕구 충족이 아니라 ‘경이의 시대로’ 이끌 것입니다. 길은 잔혹하고 폭력적이겠지만, 형이상학인 것을 지키기 위한 작은 대가입니다."
 POL_the_state_of_pure_form:0 "순수한 형태의 국가"
 POL_the_state_of_pure_form_desc:0 "한때 예술·철학·종교의 삼위일체는 인간에게 ‘세계와 분리되어 있는 듯한 초월적 감각’을 줬습니다. 그 특별함과 신비함은 세기를 거치며 사라져 갔습니다. 비트카치는 앙토냉 아르토가 서양에서 ‘형이상학적 혁명’을 이끌어 새로운 예술 엘리트 지배를 세우기 전까지 모든 것이 소멸 되었다 생각했습니다. 이제 폴란드는 르 솔레유와 함께 반란의 깃발을 들고, 비트카치와 시미그위 즉 예술가와 전제자가 공생하며 조국을 한층 더 형이상학적인 세계로 이끌고 있습니다."
 POL_against_bestiality:0 "수간에 맞서"
 POL_against_bestiality_desc:0 "정부와 사회 내부의 ‘부패’를 제거하는 일은 처음엔 거대한 과업처럼 보입니다. 아무리 강력히 탄압해도 부패는 언제든 되돌아올 수 있기 때문입니다. 그러나 시미그위와 비트카치는 이를 미리 예측하고 해법을 찾았습니다. 이제 폴란드 사회의 엘리트를 정점으로 올리고, ‘아방가르드 중의 아방가르드’가 고삐를 쥐어 국가를 정화할 것입니다."
 POL_the_enlightened_totality:0 "계몽된 전체성"
 POL_the_enlightened_totality_desc:0 "우리의 전체 국가는 과거 절대주의 정부와 전혀 다르며, 우리의 눈엔 위대한 사명이 빛나고 있습니다. 폴란드인이여, 두려워 마십시요! 우리가 하찮은 분노로 사람을 죽이는 일은 없을 것입니다. 우리의 예술가는 만물 위에 있지만, 그들은 자비롭고 신중한 통치자로서 우리 땅을 파괴하려는 모든 세력을 감시합니다. 자유, 그러나 자유주의가 아니라, 영혼 있는 것, 기계적이지 않은 것. 우리는 국민에게 우리가 얼마나 선의로 그들을 대하는지 충분히 알릴 것입니다."
 POL_me_overman_over_the_mud:0 "‘나’, 진흙 위에 선 초인 "
 POL_me_overman_over_the_mud_desc:0 "시미그위는 훌륭하지만 단순한 계획을 지닌 인물이었습니다. 다만 너무 단순하고 비전이 없었죠. 비트카치와 그의 동료들은 이 시미그위를 자신들의 그로테스크한 목적에 활용하려던 괴물들을 제거해 버렸습니다. 이제 괴물들은 일소되었고, 원수를 구한 예술가들은 품위 있게 손을 내밀어, 자신들도 폴란드를 구하게 해달라고 요청합니다. 시미그위는 그들의 진실성과 선의를 알고 있으며, 그 제안을 기꺼이 받아들였습니다."
 POL_the_drunk_the_stoned_the_inspired:0 "술에 취한자, 약에 취한자, 영감에 취한자"
 POL_the_drunk_the_stoned_the_inspired_desc:0 "폴란드를 재편하려는 우리의 계획에 너무 서두르지 않아야 합니다. 폴란드 사회와 지도부 모두 우리가 진정 추구하는 바를 불행히도 거의 알지 못하며, 지금 우리가 쌓아올린 것이 조금만 잘못해도 분노의 폭발 속에 모두 무너질 수 있습니다. 비트카치와 그의 동료들은 누구도 믿을 수 없습니다. 새로 사귄 친구들조차 예외가 아닙니다. 시미그위와 피우수트스키는 둘 다 우리의 고상한 의도를 전혀 이해하지 못했다는 공통된 죄를 지녔습니다.이를 해결하려면, 우리는 ‘그림자 음모 조직’을 통해 우리가 이루어 낸 성과를 미리 준비·보호해야 합니다. 이 조직이 어둠 속에서 조종하는 끈이 될 것입니다. 우리 내부가 아닌 모든 자들은 원치 않게도 우리의 꼭두각시가 되겠지만, 가장 위대한 목적을 위해서는 이조차도 정당화됩니다. 설령 매우 사악한 짓이라 해도 말입니다."
 POL_the_marshal_demiurge:0 "데미우르고스-원수"
 POL_the_marshal_demiurge_desc:0 "피우수트스키가 시미그위를 후계자로 지목한 것은 결코 우연이 아니었습니다. 위대한 인물은 군중 속에서 자신의 동류를 알아보는 법이며, 피우수트스키는 시미그위가 떠나가는 구원자의 손에서 폴란드의 조타를 물려받을 준비가 되어 있음을 간파했습니다. 아직 폴란드인 모두가 피우수트스키와 시미그위가 동일한 ‘위대한 본질’을 공유한다는 사실을 깨닫지는 못하지만, 그것이 우리의 근심거리는 아닙니다. 바꾸면 되니까요! 그들의 초상이 교실, 가정, 길거리 어디에나 걸리도록 합시다! 폴란드 민족은 단 두 얼굴만 인식하도록 하죠. 곧, 두 명의 영웅적 원수의 얼굴입니다!"
 POL_the_cultured_phallus:0 "교양 있는 남근"
 POL_the_cultured_phallus_desc:0 "권력과 종교의 근원은 같습니다. 그 본질은 바로 ‘에로티시즘’입니다. 예술가든 예언자든, ‘욕망’과 세속적 쾌락에서 스스로를 해방해야 합니다. 그가 술을 마시고, 담배를 피고, 번식 행위를 하더라도, 그것은 결코 자기 욕망 충족을 위한 것이 되어선 안 됩니다. 그는 모든 것을 초월한 존재이기 때문입니다. 그가 원하는 것은 상징이고 의식입니다. 그 과정을 통해 체험을 충족하고, 그의 힘을 거의 신성에 가까운 무언가로 바꿉니다. 우리 예술가들은 보석이 세공을 거쳐 비로소 뛰어난 아름다움을 갖추듯, 우리의 규율과 비전을 함께 나누어야 합니다."
 POL_i_the_artocrat_of_spirit:0 "나, 정신의 귀족"
 POL_i_the_artocrat_of_spirit_desc:0 "‘예술가 귀족’이라는 이상은 한때 단지 꿈, 혹은 결코 이룰 수 없는 유토피아였습니다. 그러나 기적이 일어나 그 꿈이 눈앞에서 현실화되었습니다! 우리 스스로 그 경지에 도달하기 위해, 우리가 지배하는 ‘대중’이 치러야 할 대가 같은 것은 조금도 중요치 않습니다. 만약 사회가 예술가를 희생시키며 번영한다면, 그런 사회는 차라리 사라져야 합니다!"
 POL_give_me_the_reign_of_souls:0 "영혼의 지배권을 달라!"
 POL_give_me_the_reign_of_souls_desc:0 "우리의 지배는 폴란드 전체를 아우를 것입니다! 자드루가와 그 졸개들은 사라져라! 그 누구도 우리를 거스르지 못합니다! 새로운 ‘신 전체 국가’가 폴란드 사회 전부를 포용할 것입니다. 젊은이들과 예술가들이 그 전위가 될 것입니다. 사나치아의 건축학은 태고의 초현실주의 정신까지 흡수할 것입니다. 새 국가는 곧 예술이자 종교이자 철학이며, 모든 것이 될 것입니다."
 POL_the_holy_creed_of_amarna:0 "아마르나의 신성 교의"
 POL_the_holy_creed_of_amarna_desc:0 "기독교가 고대 이상을 파괴했다고 믿는 것은 어리석은 일입니다. 사실 이 세계의 타락을 가져온 것은 사소한 신들의 분쟁을 담은 ‘헬레니즘’이었습니다. 하지만 이 악의 길을 되돌아가 파라오 아케나톤 시절로 소급할 수 있습니다. 폴란드에서 ‘고대 이교 부활’이 일어날 것이라 믿는 건 어리석습니다. 우리가 진정 원하는 것은 ‘기독교’를 그 본래 이상 형태로, 즉 구조 없는 자발성 가득한 모습으로 근원에 되돌리는 ‘개혁’입니다."
 POL_the_tyrant_of_beauty:0 "아름다움의 폭군"
 POL_the_tyrant_of_beauty_desc:0 "많은 ‘벌레인간’들이 스스로 규정한 기준에 따라 아름다움을 정의하고, 자기 믿음을 투영하려 애썼습니다. 정말 어리석은 짓입니다. 아름다움은 선과 진실, 잔혹함과 혐오감을 모두 포괄합니다. 선악 너머, 좌우를 초월해, 우리 정권이 추구하는 것은 오직 ‘아름다움’뿐입니다. 시미그위는 이 노력을 상징하는 인물입니다. 그에게 충성하는 자들에게는 자애로운 아버지이지만, 적에게는 복수심 넘치는 신입니다. 마땅히, 그는 전쟁의 신 마르스의 아들이며 ‘아름다움의 폭군’입니다."
 POL_entering_the_age_of_legends:0 "전설의 시대에 맞이하기."
 POL_entering_the_age_of_legends_desc:0 "청동기 시대는 끝났습니다! 세상은 구원받았습니다! 러시아는 우리 발밑에 쓰러졌고, 폴란드는 그들이 남긴 세계적 공백을 메우고자 나섭니다. 이제 우리가 정복한 영토를 새롭게 재편하고, 죽음의 그림자가 드리웠던 곳에 건설물을 세워야 합니다. ‘새 황금시대’가 출발하려 합니다. 위대한 통치자, 아름다운 인간, 훌륭한 예술가가 빛나는 시대 말이지요!"
 POL_insatiability_of_our_lust:0 "끝없는 우리의 욕망"
 POL_insatiability_of_our_lust_desc:0 "우리는 스스로에게 정직합니다. ‘정복’은 마약과 같습니다. 세계 전역으로 통치를 확대하고, 열등한 인간들을 복속시키는 전쟁에 중독된 셈입니다. 폴란드의 최대 적은 완전히 패배했지만, 그렇다면 이제 어디로 갈까요? 답은 전 세계로 우리의 손길을 뻗는 것 말고 무엇이 있겠습니까?"
 POL_the_awakening:0 "각성"
 POL_the_awakening_desc:0 "이젠 동방은 우리의 관심 대상이 아닙니다. 그 사이 유럽 대륙에선 무슨 일이 벌어졌을까요? 프랑스가 승리했을까요? 사회주의는 마침내 소멸했나요? 우리는 직접 확인할 수 있게 되었습니다. 지금은 다른 신경 쓸 일이 없으니까요."
 POL_whats_left_of_the_sun:0 "태양에게 남은 것은 무엇인가?"
 POL_whats_left_of_the_sun_desc:0 "프랑스는 우리에게 귀감이었고, 여태껏 유례없는 방식으로 야망을 불어넣어주었습니다. 이제 우리도 그 은혜를 갚을 때입니다. 르 솔레유에 곧바로 사절단을 보내, 우리 두 나라가 적절한 외교 관계를 맺도록 해야 합니다. 존재하는 최고의 두 나라가 서로 누려야 할 당연한 권리니까요."
 POL_looking_into_a_supernova:0 "초신성을 바라보며"
 POL_looking_into_a_supernova_desc:0 "아직 우리 지배의 빛을 보지 못한 ‘나머지 세계’는 어떨까요? 분명 함께할 동맹이나 맞서 싸울 적이 있을 겁니다. 폴란드는 이제 국제적 주목의 중심으로 발걸음을 내딛습니다. 이야기로 전해지지 않은 영광을 함께 맛볼 동지를 찾아야 할 때입니다!"
 POL_totems_for_our_cause:0 "대의를 위한 토템들"
 POL_totems_for_our_cause_desc:0 "폴란드는 이제 제국이 되었고, 자기만의 현실을 구축합니다. 우리의 제국이 존속하려면 예술과 자원이 필요한데, 둘 모두 우리에게는 풍족합니다! 비스와에서 태평양에 이르기까지, 수많은 의식을 통해 우리가 깃발을 드리운 땅의 사람들을 사로잡을 것입니다! 캅카스에서 시베리아에 이르기까지, 자원 채굴이 즉시 재개될 겁니다. 폴란드는 신화의 새 시대로 걸어가며, 철저히 대비를 갖출 것입니다!"
 POL_madness_without_a_method:0 "방법 없는 광기"
 POL_madness_without_a_method_desc:0 "러시아가 남긴 이 거대한 ‘덩어리’를 어떻게 해야 할까요? 앉아서 전쟁과 약탈의 기쁨을 포기하자고요? 절대 그럴 수 없습니다! 우리 같은 이들에게 답은 간단합니다. 그들이 평화를 지키는 한 그냥 두는 것이지요. 결국 그들도 우리 멍에 아래 살아가는 법을 익히게 될 것입니다. 물론 시간이 걸리고 노력이 필요하겠지만요."
 POL_hurrah_for_bunga_hurrah_for_me:0 "붕가 만세! 시미그위 만세!"
 POL_hurrah_for_bunga_hurrah_for_me_desc:0 "이제 시미그위와 비트카치는 그들의 임무가 완수되었으니 이제 쉴 수 있습니다. 프로메테우스는 우리가 지배하는 소인배들이 아닌 개인의 손에 의해 해방되었습니다. 우리가 세상을 떠난 후에도 우리의 업적을 뛰어넘어 별과 하늘 너머에 도달하려는 사람들에 의해 우리의 영광에 대한 전설이 오래도록 전해질 것입니다. 우리는 우리의 도전 이후에 어떤 일이 일어날지 상상할 수 있을 뿐이지만, 우리 자신의 투쟁만큼이나 위대한 일이 될 것임을 알고 있습니다."
 POL_hussard:0 "흐발레브니 후자르도비에"
 POL_militias:0 "수레알리스티치네 밀리체"
 POL_smigly_ubermensch:0 "노바폴스카의 초인 시미그위"
 POL_smigly_ubermensch1:0 "노바폴스카의 초인 시미그위"
 POL_type_E1:0 "타입 E "
 POL_grabski_win:0 "엔데치아가 선거에서 승리했다."
 POL_sobieski_win:0 "파데레프스키가 선거에서 승리했다."
 POL_koneczny_win:0 "코네치니가 선거에서 승리했다."
 POL_okon_win:0 "오콘이 선거에서 승리했다."
 POL_another_five_years:0 "폴란드 사회당이 선거에서 승리했다."
 total_moskal_death:0 "러시아 히드라를 척살했다!"
 POL_PLC_zadruga_accelerationism:0 "레히아-리에투바 제치포스폴리타"
 POL_PLC_zadruga_accelerationism_DEF:0 "레히아-리에투바 제치포스폴리타"
 POL_PLC_zadruga_accelerationism_ADJ:0 "레히아-리에투바"
 POL_bastille_of_nations_broken:0 "민족들이 갇혀있던 무너진 바스티유"
 POL_polish_frankenstein:0 "폴란드의 프랑켄슈타인"
 POL_give_estonia:0 "핀란드에 에스토니아 반환"