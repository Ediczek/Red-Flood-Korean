 vilniuscrisis.3.t:0 "불꽃에서 불로"
 vilniuscrisis.3.desc:0 "보좌관은 [POL.GetLeader]의 사무실로 급히 뛰어들었다. 그는 극도로 엄중한 사안이 담긴 보고서를 손에 쥐고 있었다. 폴란드 지도자는 이미 이 문제의 개요를 알고 있었다. 리투아니아 내 폴란드계 주민들이 자신들의 권리를 침해하는 법안에 반대하며 시위를 벌이고 있었다. 하지만 보좌관의 표정을 보니, 사태는 단순한 항의 수준을 넘어선 듯했다. 그는 조용히 보고서를 펼쳤다.\n\n\"일급 기밀 – [?global.date.GetDateStringNoHourLong]\"\n\n\"지난 며칠간 리투아니아의 상황은 급격히 악화되었습니다. 평화적 행진과 시위는 이제 빌뉴스 지역에서의 폴란드계 주민과 리투아니아인 간의 폭력적 충돌로 변질되었습니다.\"\n\n\"리투아니아 정부는 완전히 마비 상태에 빠졌습니다. 이번 사태는 단순한 충돌이 아닙니다. 그들의 대응 방식이 국내 정치뿐만 아니라 인테르마리움 회원국들과의 관계에도 지대한 영향을 미칠 것임을 인식하고 있습니다. 공포심이 확산되고 있으며, 수도 빌뉴스에서 발생한 폴란드계 폭동으로 인해 정부 기능이 사실상 정지된 상태입니다.\"\n\n\"우리는 즉각적인 대응을 리투아니아에 전달해야 합니다. 리투아니아의 무기력한 태도는 폴란드군이 소요 중인 소수 민족을 대변해 개입할 것이라는 두려움 때문입니다. 현재 상황에서는 신중하고 절제된 접근이 강력히 요구됩니다. 미흐노브스키 사태가 아직도 대중의 기억에서 사라지지 않은 만큼, 군사적 개입은 모든 측면에서 재앙이 될 것입니다. 보고 종료.\"\n\n[POL.GetLeader]는 보고서를 다 읽자마자 결론에 도달했다. \"이것이야말로 인테르마리움이 단순한 폴란드의 세력권이 아니라는 것을 입증할 순간이로군.\" 이번 사건의 중심에는 폴란드계 주민들이 있었지만, 바르샤바는 그들에게, 그리고 동맹국들에게 다민족 분쟁을 해결하는 올바른 방식을 가르칠 필요가 있었다. [POL.GetLeader]는 보좌관을 바라보며 단호하게 말했다.\n\n\"리투아니아 정부가 스스로 해결하도록 놔둬라. 그것은 그들의 나라다.\""
 vilniuscrisis.3.a:0 "\"그들이 알아서 해야하지\""
 vilniuscrisis.4.t:0 "분노에 맞선 말"
 vilniuscrisis.4.desc:0 "[POL.GetLeader]의 책상 위에는 리투아니아 사태에 대한 두 번째 부정적인 보고서가 놓여 있었다. 이번에는 또 무엇이 문제란 말인가? 폴란드 정부는 리투아니아가 자국 내 문제를 스스로 해결하도록 내버려 두었다. 폴란드 대표단을 보내서 사태를 진정시키는 대신, 그들의 방식대로 해결하도록 맡긴 것이 화근이었을까? 대답은 눈앞의 보고서 속에 있었다.\n\n\"일급 기밀 – [?global.date.GetDateStringNoHourLong]\"\n\n\"사태는 더욱 악화되었습니다. 리투아니아 정부에 자유로운 대응권을 부여한 것이, 오히려 폴란드계 무장세력을 더욱 대담한 반란으로 이끌었습니다. 기존에는 경찰과 싸우던 지역 갱단에 불과했던 자들이 이제는 조직적인 민병대가 되어 정부군을 상대로 강경한 저항을 펼치고 있습니다. 빌뉴스 지역은 이제 ‘바리케이드 천지의 도시’가 되었습니다.\"\n\n\"리투아니아인들은 폴란드와 동맹으로부터 버림받았다고 느끼고 있습니다. 만약 우리가 개입하지 않는다면, 빌뉴스는 곧 전면적인 내전으로 빠져들 것입니다. 우리가 수수방관할 경우, 리투아니아는 강경한 대응을 할 수밖에 없을 것이며, 이는 폴란드에도 치명적인 결과를 초래할 것입니다. 그들은 동맹을 저버린 폴란드를 불신하며 탈퇴할 수도 있으며, 또한 다른 지역에서도 유사한 반란이 일어날 가능성이 커질 것입니다.\"\n\n\"폴란드는 초기 판단에서 실수를 저질렀습니다. 하지만 아직 이를 바로잡을 시간이 있습니다. 우리는 즉시 대표단을 빌뉴스로 보내야 합니다. 양측의 목소리를 듣고, 타협점을 찾아야 합니다. 우리와 그들을 위해서. 우리의 미래를 위해서.\"\n\n[POL.GetLeader]는 보고서를 읽으며 깊은 생각에 잠겼다. 그는 보고서 작성자가 내린 결론과 같은 결론에 도달했다. 이것은 1936년의 사태와는 달랐다. 그때는 우크라이나인들끼리의 내전이었지만, 이번 사태는 폴란드인과 리투아니아인의 충돌이었다. 만약 이 갈등이 평화적으로 해결되지 않는다면, 폴란드는 곧 폭력의 소용돌이에 휩쓸리게 될 것이다. 다행히도, 그는 이 일을 맡길 적임자를 알고 있었다. 그는 수화기를 들고 짧고 단호하게 말했다."
