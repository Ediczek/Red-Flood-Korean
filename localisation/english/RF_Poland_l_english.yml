 vilniuscrisis.6.a:0 "\"베크를 보내.\""
 vilniuscrisis.7.t:0 "왕좌의 사절단"
 vilniuscrisis.7.desc:0 "유제프 베크는 빌뉴스로 향하는 기차에 몸을 싣고 있었다. 인테르마리움 전역의 신문 헤드라인을 장식하는 도시로. 그는 시간이 스쳐지나가는 것 따위 신경 쓰지 않았다. 이번 위기는 모든 것을 집어삼킬 듯한 중대한 사태였고, 이를 해결할 임무는 그에게 맡겨졌다. 그것이 그의 의무였다. [POL.GetLeader]이 그에게 예의 바르게 이 임무를 맡기겠다고 전했을 때, 베크는 주저 없이 이를 받아들였다.\n\n바르샤바를 떠난 순간부터, 그의 머릿속에는 단 하나의 질문만이 맴돌고 있었다. \"양측을 어떻게 설득해야 이 사태를 진정시킬 수 있을 것인가?\"\n\n폴란드계 주민들은 무엇보다도 폴란드인이었다. 조국은 그들을 내버려 둘 수 없었다. 그의 개인적인 감정도 그들에게 기울었다. 리투아니아 정부가 이런 반응을 예상하지 못했을 리 없다. 그러나 상황은 이미 여기까지 왔다. 지금 이 순간 리투아니아 정부가 법안을 철회한다면, 농민당은 대중의 신뢰를 완전히 상실할 것이다. 그들이 몰락하면?\n안타나스 스메토나가 지금보다 훨씬 더 과격한 정책을 들고 빌뉴스로 돌아올 것이다.\n\n그러나 어떻게 리투아니아인들에게 물러서도록 설득하면서, 동시에 폴란드인들에게 특혜를 주지 않을 수 있을까? 이것이 이번 위기의 본질적인 난제였다. 이 사태는 반드시 리투아니아 국경 안에서 끝나야 했다. 미흐노브스키에게 연락을 취하는 일도, 우크라이나인들의 분노를 자극하는 일도 없어야 했다. 그렇다면 러시아 탓으로 돌릴까? 그러나 지금 러시아는 내전에 휘말려 서로 죽고 죽이는 상황이다. 첩자를 보낼 여유조차 없다. 극단적 민족주의자들의 선동? 그것도 아니다.\n\n베크는 고개를 저으며 해결책을 찾고 있었다. 그리고 그 순간, 문득 머릿속을 스치는 것이 있었다. 가장 단순한 방법이 가장 효과적일 수도 있다. \"통합을 외치는 것. 단결을 요구하는 것.\" 그는 폴란드 제치포스폴리타(연방)의 공식 사절이었다. 결국 그의 말은 법과 다름없다. 폴란드계 주민들은 조국의 명령에 따를 것이며, 리투아니아인들 또한 자신들의 ‘관대한 후원자’의 말을 무시할 수 없을 것이다. 하지만 여전히 약간의 의심이 남아 있었다. \"만약 통하지 않는다면?\" 그러나 그는 선택의 여지가 없었다."
 vilniuscrisis.7.a:0 "\"통합이냐... 아니냐?\""
 vilniuscrisis.8.t:0 "왕좌의 사절단"
