 POL_war_with_russia_desc:0 "동쪽 하늘에 다시금 어두운 구름이 몰려오고 있습니다. 모스크바의 땅이 흔들리고 요동치며, 그들의 재통합이 눈앞에 다가오고 있습니다. 우리의 적이 돌아오려 하는 이 순간, 우리는 가만히 있을 수 없습니다. 외교관을 파견하고, 무기를 모으며, 반란군을 지원해야 합니다. 수백만의 인민을 결집시켜, 러시아의 위협으로부터 우리의 자유를 지킬 준비를 해야 합니다."
