 POL_heavy_hand_naczelnik:0 "나첼니크의 강권"
 POL_heavy_hand_naczelnik_desc:0 "유제프 피우수트스키께서는 일개 필부가 아니십니다. 누군가에게 그분은 뛰어난 군인이시며, 다른 이들에게는 정치인이십니다. 그리고 일부에게, 피우수트스키께선 반신으로까지 여겨지십니다. 그분께서는 폴란드 전역을 통일하고 자신의 힘을 통해 폴란드의 힘을 유지시킨 분이십니다. 그분은 \"폴란드\"라는 단어가 잊히지 않도록 하신, 우리 독립의 설계자이십니다. 그분깨서는 빈켈리에트 전쟁 당시 콜차크와 러시아인들의 소란에 맞서 우리를 지켜내셨습니다. 1926년, 그분께서는 대통령의 \"권위적인\" 경향을 멈추겠다며 떠들어댄 간교하고도 기회주의적인 5월 정변을 막아내셨습니다. 어찌나 멍청하고 어리석은 이들이었던지! 미하우 지몌르스키와 다른 모략자들은 오래 전에 사형당해 땅 아래 깊숙한 곳에 파묻혔습니다! 그곳에서 썩어 가라고 하십시오!\n\n슬프지만 우리의 사랑하는 수장께선 늙어 가고 계십니다. 작년은 특히나 그분께 힘겨웠습니다. 의사들의 조언을 따랐어도 암이 자라는 걸 막을 순 없었습니다. 정기를 빨아먹는 암이 피우수트스키님을 약하게 만들면서, 그분의 위업 역시 지속될 수 없게 되었습니다. 전망은 그리 좋지 못하지만, 적어도 지금 원수님의 병을 아는 이는 그분의 가까운 동료들 뿐입니다. 어쨌거나 결국에, 그분의 서거는 연합회복권의 구조 전부를 뒤흔들고 말 것입니다. 만일 기반 자체를 무너뜨리는 게 아니라면 말입니다..."
 POL_heavy_hand_naczelnik_2:0 "나첼니크의 강권"
 POL_heavy_hand_naczelnik_2_desc:0 "유제프 피우수트스키께서는 일개 필부가 아니십니다. 누군가에게 그분은 뛰어난 군인이시며, 다른 이들에게는 정치인이십니다. 그리고 일부에게, 피우수트스키께선 반신으로까지 여겨지십니다. 그분께서는 폴란드 전역을 통일하고 자신의 힘을 통해 폴란드의 힘을 유지시킨 분이십니다. 그분은 \"폴란드\"라는 단어가 잊히지 않도록 하신, 우리 독립의 설계자이십니다. 그분깨서는 빈켈리에트 전쟁 당시 콜차크와 러시아인들의 소란에 맞서 우리를 지켜내셨습니다. 1926년, 그분께서는 대통령의 \"권위적인\" 경향을 멈추겠다며 떠들어댄 간교하고도 기회주의적인 5월 정변을 막아내셨습니다. 어찌나 멍청하고 어리석은 이들이었던지! 미하우 지몌르스키와 다른 모략자들은 오래 전에 사형당해 땅 아래 깊숙한 곳에 파묻혔습니다! 그곳에서 썩어 가라고 하십시오!\n\n슬프지만 우리의 사랑하는 수장께선 늙어 가고 계십니다. 작년은 특히나 그분께 힘겨웠습니다. 의사들의 조언을 따랐어도 암이 자라는 걸 막을 순 없었습니다. 정기를 빨아먹는 암이 피우수트스키님을 약하게 만들면서, 그분의 위업 역시 지속될 수 없게 되었습니다. 전망은 그리 좋지 못하지만, 적어도 지금 원수님의 병을 아는 이는 그분의 가까운 동료들 뿐입니다. 어쨌거나 결국에, 그분의 서거는 연합회복권의 구조 전부를 뒤흔들고 말 것입니다. 만일 기반 자체를 무너뜨리는 게 아니라면 말입니다..."
 POL_explosive_mix:0 "폭발적인 혼합"
 POL_explosive_mix_desc:0 "폴란드 제치포스폴리타 연합회복권(Zjednoczony Blok Sanacji Rzeczypospolitej, ZBSR)는 정치적 이념을 초월한 전사회적 조직으로 현대화의 정신에 따라 국가를 급진적으로 변화시키고자 합니다. 적어도 명목상으로는 그렇습니다. 하지만 이 조직은 단순히 피우수트스키파로만 구성된 것이 아닙니다. 자드루가의 민족주의자 청년들과, 아나키스트, 생디칼리스트, 다양한 지적·예술적 집단, 프리메이슨, 사회민주주의자, 민주사회주의자, 공산주의자, 미래주의자, 구 보수적 지주 귀족, 그리고 스톨리핀과의 동맹 이후 드모프스키를 배신한 옛 엔데차(민족민주당) 멤버들까지 포함하고 있습니다.\n\n그러나 피우수트스키의 가장 가까운 동료들조차도 오직 원수에 대한 충성심으로만 결속되어 있을 뿐입니다. 발레리 스와베크, 이그나치 다신스키, 에드바르드 리츠-시미그위는 서로 간의 영향력을 놓고 내부 전쟁을 벌이며, 사나치아를 마치 피부 아래 썩어가는 병처럼 갉아먹고 있습니다. 이들 각자는 연합회복권의 미래뿐만 아니라 폴란드의 미래에 대한 서로 다른 비전을 가지고 있습니다.이 세 사람 중에서 피우수트스키의 후계자가 선택될 가능성이 높지만, 기존의 질서를 뒤엎을 새로운 예기치 못한 플레이어가 등장할 가능성도 배제할 수 없습니다."
