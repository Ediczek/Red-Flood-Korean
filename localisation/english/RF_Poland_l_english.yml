 POL_startup.12.t:0 "세상에 맞서!"
 POL_startup.12.desc:0 "“나약함의 바다가 우리를 둘러싸고 있지만, 폴란드인들은 함께 서 있습니다! 구국군사위원회는 어떤 대가를 치르더라도 국가의 안전과 통합을 보장할 것입니다! 시민들이여, 우리의 목소리에 귀를 기울이십시오…”\n\n아담 코츠 의장의 연설은 끝날 줄을 몰랐다. 지루하기 짝이 없었다. 내용은 하나도 새롭지 않았고, 특별히 강조할 필요조차 없는 것들뿐이었다. 1918년 이래로 계속해서 반복되어 온 뻔한 연극이었다. 비트카치는 저들이 아직도 질리지 않았다는 사실에 놀라웠다. 같은 기계적인 말들을 끝도 없이 반복하면서도 부끄러움을 느끼지 않는다는 것이 경이로울 지경이었다. 하지만 뭐, 코츠 같은 늙은이들이 진정한 독재 정치가 무엇인지 알 리가 없었다. 그저 나첼니크 시미그위 같은 진짜 위버멘쉬의 이야기나 엿볼 뿐이었다. 아니면, 비트카치라든지. \n\n스타니스와프 이그나치 비트키에비치는 문가의 한 의자에 앉아 아첨꾼들로 둘러싸인 채 강연을 듣고 있었다. 그는 손가락을 코에 넣고 콧물을 후벼 파더니 잠시 굴려보았다. 그것은 단순한 무관심의 표현이 아니라 노골적인 경멸의 표시였다. 이 모임은 완전한 사기극이었다. 정신 지체자들을 위한 연극이랄까. 그리고 그 순간, 그는 크게 방귀를 뀌었다. 이 끔찍한 코츠의 콜차크식 헛소리를 귀청이 떨어질 만큼 늘어놓는 연설을 단숨에 끊어버린 것이었다. 이어서, 일부러 과장된 웃음을 터뜨렸다. “헤헤헤헤헤헤헤헤헤헤헤—” 한껏 길게 늘여서 말이다. 그러자 \"존경받는 위원장\"의 얼굴에 떠오른 표정이야말로 이 모든 공연의 백미였다. 그 살찐 볼이 아래로 쳐지면서, 이보다 더 우스꽝스러운 표정을 지을 수 있을까 싶을 정도로 어리석은 인상을 만들어냈다. 그 모습은 인간이라기보다는 마치 폴란드 장교 제복을 간신히 껴입은 전구 같은 모습이었다. 그리고 이를 악물며 간신히 분노를 억누르려는 그 모습이란... 정말이지 가관이었다. 하지만, 그가 실제로 할 수 있는 것은 없었다. 비트카치는, 어떠한 인격적 결함에도 불구하고, 국립 예술가로 존경받는 인물이었기 때문이다. 코츠 같은 양반들은, 그저 ‘칭호’에 절을 하는 법이었다. 그리고 그런 인간들은 나첼니크가 없어도 \"될\" 인간들이었다.\n\n아니, 나첼니크가 없어야 \"할\" 인간들이었다. 이 영혼 없는, 예술 없는 행렬은 이제 끝날 것이다. 비트카치는 자리에서 일어났다. 그리고, 문을 열고 나가면서 확신했다. 자신이 곧 이 나라의 ‘큰 인물’과 직접 대면할 수 있을 것임을."
 POL_startup.12.a:0 "참 기묘한 전쟁터로 나아가는 길이군."
 POL_startup.13.t:0 "용들이 자리할 곳은 없다"
 POL_startup.13.desc:0 "“…그리고 우리는 위대한 원수의 유산을 기리지만, 그를 신격화할 수는 없습니다. 과거의 판단 속에서 많은 오류가 있었습니다. 저는 그 실수를 바로잡고자-” 이그나치 다신스키는 차분한 어조로 말을 이어갔다. 끊임없는 야유와 모욕적인 외침에도 흐트러지지 않으려 애썼다. 하지만 이 작업은 거의 시시포스의 형벌처럼 느껴졌다.\n\n“헛소리 마! 너랑 네 패거리들이 원하는 건 오직 네 배를 불리는 것뿐이지! 너한테 연합회복권이 무너지든 말든 아무런 상관도 없잖아!” 당내 청중들 속에서 울려 퍼진 목소리는 그 어떤 위장도 없이 독기 가득한 비난을 내뱉었다. 군중 속 깊숙한 곳에서 나온 소리였기에, 나첼니크는 정확히 누가 그렇게 외치는지조차 알 수 없었다. 이어서 다른 이들도 동조하듯 고함을 내질렀다. 마치 어린애들이 투정을 부리듯, 짜증에 찬 소리들이 줄줄이 터져 나왔다.\n\n“그러나… 그 마지막 말은 꽤나 적절한 지적이군요.” 다신스키가 불쑥 개입하자, 야유를 퍼붓던 이들이 순간적으로 얼어붙었다.\n\n“연합회복권은, 전임 나첼니크가 구상했던 모습 그대로라면… 이제 그 소명을 다해 가고 있습니다. 우리는 언제까지나 반대 세력을 피해 숨을 수만은 없습니다. 우리가 건설한 이 제치포스폴리타는… 오직 우리만을 위한 것이 아닙니다. 이것은 모든 폴란드인을 위한 것입니다. 우리는 독재적 조치를 영원히 감내할 필요가 없습니다.”*\n\n...그리고 광란이 터져 나왔다. 일부는 박수를 쳤다. 일부는 나첼니크를 향한 온갖 저속한 욕설과 모욕을 퍼부었다. 어떤 이들은 그저 얼어붙은 채, 지금 자신이 들은 말을 어떻게 받아들여야 할지 몰라 망설였다. 그리고 또 어떤 이들은…\n\n“지랄마라! 이 배신자 같은 역겨운 쥐새끼가 우리를 파괴자들과 도둑들에게 팔아넘기려 한다니!” 창가 쪽에서 누군가 분개하며 외쳤다.\n\n“자본주의자! 사회의 기생충! 양의 탈을 쓴 늑대! 네놈에게 침을 뱉어 주마!” 방 뒤쪽에서 거친 목소리가 터져 나왔다.\n\n“폴란드? 1950년이면 새로운 러시아가 되겠지!” 그건… 아담 코츠의 목소리였다. 그는 그 혼란 속에서도 코츠의 목소리를 확실히 알아들을 수 있었다.\n\n…그리고 일부는 자리에서 일어나, 연단 위의 남자에게 등을 돌린 채 그냥 걸어 나가 버렸다. 다신스키는 잠시 말을 멈췄다. 등줄기를 타고 스며드는 한기가 온몸을 휘감았다. 그리고 그 순간,"
 POL_startup.13.a:0 "그리고 벽은 커가고, 커가고, 커갔네...."
 POL_startup.14.t:0 "3일이 지난 후"
 POL_startup.14.desc:0 "세임 회의장 곳곳에서 번지던 웅성거림이 차츰 사그라졌다. 발레리 스와베크가 연설대에 올라서자, 그는 천천히 연설문을 정리하며 일부러 넥타이를 고쳐 맸다. 한순간 방안을 신중하게 훑어본 뒤, 그는 입을 열었다.\n\n“고(故) 원수님, 나의 가장 소중한 친구께서는 폴란드를 위한 위대한 꿈과 야망을 품고 계셨습니다. 역사적으로 볼 때, 우리 조국은 이제 막 굴종의 사슬에서 벗어났습니다. 그리고 지금 우리는, 그야말로 경이로운 순간을 목전에 두고 있습니다. 이 시점에서 우리가 길을 바꾼다면, 그것은 그분의 유산에 대한 모독이며, 우리 자신에게도 씻을 수 없는 배신이 될 것입니다. 유제프 피우수트스키께서 생전에 이룩하신 ‘사나치아(회복)’의 원칙은, 그분의 서거 이후에도 반드시 완수되어야 합니다. 이를 저버리는 것은 범죄와 다름없습니다.” 그는 순간적으로 세임 의원들의 반응을 살폈다. 원수의 유산을 기리는 말에 엄숙한 박수가 회의장을 울렸다. 그러나 야당 의원들은 이미 돌처럼 굳은 얼굴로 분노를 삼키고 있었다. 이를 지켜본 스와베크는 내심 조용히 웃음을 머금었다.\n\n“이를 위해, 나는 폴란드 경제의 총체적 개혁과 변혁을 단순한 지속이 아닌, ‘촉진화’할 것을 선언합니다! 토지 개혁, 주요 산업의 국유화, 최신 기술의 도입, 산업 역량의 전면적 자동화 그 모든 것을 이루어 내야 합니다! 하지만, 현재의 체제 아래서는 이러한 개혁이 불가능합니다. 그러므로, 정치 체제 또한 변혁이 필요합니다. ‘보편사회기구’가 창설될 것입니다. 이는 폴란드 사회의 모든 구성원을 조화롭게 연결하고, 계급 간의 구분을 철폐하며, 단 하나의 강인한 목적을 지닌 유기적 공동체로 거듭날 것입니다.  나는 오늘, 지금 이 자리에서, 나와 함께 폴란드의 미래를 만들어 나갈 모든 이들에게 초대장을 보냅니다! 비단 나의 정당에 속한 자들만이 아닙니다! 여기 있는 그 누구라도, 함께 하기를!” 스와베크는 연설 도중 시선을 야당 의원석으로 돌려 강한 눈빛을 보냈다. 그들의 반발이 거세질 것은 알았지만, 적어도 몇몇은 현실을 받아들이리라—그는 그렇게 예상했다.  그는 깊이 숨을 들이마셨다. 혼란스러워진 회의장을 뚫고 마지막 말을 전하기 위해, 그는 거의 외치듯 말문을 열었다.\n\n“우리의 번영을 영원히 보장하기 위해, 우리는 인테르마리움의 동지들에게도 손을 내밀어야 합니다! 러시아의 ‘곰’을 완전히 길들이려면, 우리끼리의 하찮은 분열 따위로 균열이 생겨서는 안 됩니다! 우리는 동방의 야만에 맞선, 단 하나의 인터마리움 방벽으로 서야 합니다! 화합과 항구적 연방의 추구가 우리의 목표가 되어야 합니다! 그래야만 폴란드는 영원히, 당당히 설 수 있습니다!”"
 POL_startup.14.a:0 "회복, 완료."
 POL_startup.15.t:0 "종말을 달리다"
 POL_startup.15.desc:0 "‘죽음 후사르’는 폴란드군에서도 독특한 위치를 차지하는 부대다. 처음에는 자원 기병 부대로 시작했으나, 시간이 흐르며 사나치아의 은밀한 작전을 수행하는 부대로 변모했다. 현재 이들을 이끄는 인물은, 대전쟁 당시 폴란드 군단에서 싸운 베테랑이자 ‘마피아’의 일원이기도 한 유제프 로키에테크다. 후사르들은 전통과 현대가 결합된 독특한 형태를 유지하면서, ‘종말의 기수들’이라 불리던 17세기 리소프치치의 유산을 계승하고 있다. 한때 폴란드 왕실을 위해 독일에서 러시아에 이르기까지 농민들에게 공포를 심어주었던 자들처럼, 오늘날 그들은 폴란드 체제의 비밀 경찰이 되었다.\n\n그러나 최근 군의 확장과 개편 속에서, 후사르의 미래에 대한 논의가 시작되었다. 이들을 앞으로 어떻게 활용해야 할 것인가?\n\n첫 번째 방안은 정식 비밀 경찰로 정착하는 것이었다. 정치 무대에는 여전히 나라의 안정을 위협하고 우리의 권력을 갉아먹으려는 불순한 세력이 존재한다. 테러리즘의 싹을 그 발아 단계에서부터 잘라낼 수 있다면, 국가의 자원을 절약할 뿐만 아니라 무엇보다도 우리 시민들의 생명을 보호할 수 있을 것이다\n\n두 번째 방안은 정규군으로의 편입이었다 일각에서는 이들을 폴란드군의 정식 부대로 편입해야 한다는 의견이 있다. 비밀 경찰은 문명화된 국가, 폴란드가 가장 위급한 시기에나 필요로 하는 조직이다. 더 이상 불만 세력을 쫓아다니게 할 것이 아니라, 이들에게 정식 군사 훈련을 부여하고 전장에서의 역할을 부여해야 한다. 처음에는 다소 기이한 선택처럼 보일 수도 있으나, 후사르들의 강한 애국심과 그들만의 독특한 전투 방식은 러시아의 야만성에 맞설 수 있는 강력한 무기가 될 수 있다.\n\n그러나 세 번째 방안 그대로 둔다는 것도 있다. 그러나, 후사르들의 강점은 바로 그 다양한 역할 수행 능력에 있다. 필요할 때는 정규군 부대, 필요할 때는 비밀 작전 부대이러한 유연성을 유지하는 것이야말로 우리가 최대한의 이점을 누릴 수 있는 방안일 것이다. 이들과의 공식적인 협력을 강화하면, 그들은 최상의 장비를 제공받게 되고, 우리는 더욱 안전한 정권을 구축할 수 있다."
 POL_startup.15.a:0 "폴란드의 오흐라나여, 어둠 속에서 빛을 섬겨라!"
 POL_startup.15.b:0 "새로운 형태의 군대여, 전진하라!"
 POL_startup.15.c:0 "종말의 기수들이여, 달려라!"
 POL_startup.18.t:0 "이교도 반동"
 POL_startup.18.desc:0 "\"분명히 해두겠습니다, 스와베크 씨.\" 얀 스타흐니우크의 목소리는 낮고 정돈되어 있었다. 깨끗이 면도한 젊은 청년이 테이블에 손을 올려 자신의 주장을 강조했다. 그의 눈빛은 잠시 스와베크의 것과 마주쳤고, 두 사람은 치열한 지적 전장에서 맞붙었다.\n\n\"우리는 의견이 다릅니다. 자주. 그리고 너무 많은 부분에서요.\" 그는 말을 이었고, 그의 목소리에는 분노가 너무도 분명하게 묻어 있었다. 스와베크는 그저 고개를 끄덕일 뿐이었다.\n\n\"…하지만 그래도, 당신과 당신의 사람들이 폴란드, 그리고 사르마티아 전체를 위해 어떤 의미를 지니고 있는지는 인정합니다. 그러나, 우리가 진정으로 필요로 하는 것은…\" 나첼니크는 다시 한 번 고개를 끄덕였다. 그러나 그의 머릿속에는 이 유사-코뮈나드 청년이 떠드는 말들은 단 하나도 기억에 남지 않았다. 별로 신경 쓸 가치가 없었으니까.\n\n\"아-네.\" 그가 자드루가 대표라는 작자가 늘어놓는 요구 사항 하나하나에 대한 그의 대답은 그 한마디뿐이었다. 종이에 단순히 끄적이듯이 적어두기는 했지만, 이 과정은 한없이 지루하게 느껴졌다.\n\n\"그래서 제가 말한 대로…\" \n\n\"…네, 아주 합리적인 요구군요. 일주일이면 처리할 수 있습니다.\" 스와베크는 바보가 아니었다. 그는 솔직히 저 ‘이교도 서적 뒤적이는 머저리들’ 의 불평불만을 한 귀로 흘려버릴 수 있다면 좋겠다고 생각했지만, 그들의 말이 결코 무게 없는 것이 아니라는 것도 알고 있었다. 그들은 군대와 정부 내부에서 꽤 강한 지지층을 형성하고 있었다. 그들을 달래는 것은 단순한 선택이 아니라, 필연적인 과제였다. 문제는 ‘어떻게’ 달래느냐였다. 자칫 잘못하면 그의 정당성이 위태로워질 수 있었다. …문화 부흥 정책 중 일부를 승인해 주는 것은 어떨까? 그 정도는 간단한 일이고, 어차피 정부에서 약간의 자원을 배정해 줄 여유도 있을 터였다..."
 POL_startup.18.a:0 "그들에 대해 무언가 조치만 취해지면 된다."
 POL_startup.19.t:0 "이교도 대 이교 수장"
 POL_startup.19.desc:0 "“그래! 그래! 물론이고 말고!, 그대라면 이해할 수밖에 없다고! 나첼니크! 나와 당신! 우리는 마치 한 마리 염소에서 솟아난 두 개의 뿔과 같소!”\n\n스타니스와프 수칼스키의 목소리가 홀을 가득 울려 퍼졌다. 그에게는 확성기나 뭐 그런데 쓰이는 물건 따위가 필요조차 없었다. 오히려, 스포트라이트가 그의 몸에 달라붙은 파리처럼 떨어질 줄 몰랐다. 그의 짙은 라임색 터틀넥 스웨터, 그 가슴 한복판에 수놓아진 뿔 달린 짐승의 문양, 날씨와 상관없이 항상 그 옷을 고집하는 기행은 그에게 기묘하면서도 압도적인 존재감을 만들어주었다. 그리하여 그는 어디를 가든, 그는 실질적으로 무시하는것이 불가능한 수준의 존재가 되었다. 그를 무시하려면? 귀를 잘라버리는 수밖에 없으리라. 그리고 그런 극단적인 선택을 할 수 있는 사람은 많지 않았다. 사실, 나첼니크가 받은 보고에 따르면, 오늘 이 자리에는 수칼스키가 아니라 책벌레들, 즉 얀 스타흐니우크나 헴펠 같은 자들이 와서 쓸모없는 아부와 가식적인 협박을 늘어놓아야 했을 터였다. 그러나 그는 불평하지 않았다. 어떤 면에서 보자면, 수칼스키는 술자리에서 훨씬 더 흥미로운 상대였다.\n\n펠릭스 지에르진스키는 기묘한 방식으로 수칼스키를 항상 존경해 왔다. 그를 같은 ‘영혼의 동반자’라고 생각한 것은 아니었지만, 그는 분명 현실을 전혀 신경 쓰지 않는 돈키호테 같은 존재였다. 양심이란 것 따위는 개의치 않고, 대중이 강요하는 ‘정상성’이라는 기준에 전혀 신경 쓰지 않는 사람 그런 자들이 필요했다. 세상은 맨정신인 놈들이 아니라, 미친놈들을 필요로 한다. 그런 점에서, 스타흐니우크 같은 노예 근성의 책쟁이들 보다는 훨씬 나았다.\n\n“그리고 우리는… 우리는 살아남을 것이오. 우리 조상들이 살아남았던 것처럼! 고대 사르마티아에서, 아리아인들 속에서! 우리는 우리의 자리를 지킬 것이오! 창백한 에티오피아인들에게 죽음을!”\n\n수칼스키가 원숭이처럼 날뛰며 소리치는 동안, 나첼니크는 천천히 시가에 불을 붙였다. 얼빠진 미소가 그의 얼굴에 떠올랐다. 위험한 인물이었다. 재미있고, 존경할 만한 면모가 있는 위험한 인물이었다. 그러나 위험한 인물은 곧 자산이기도 했다. 이들을 잃는 것은 치명적인 실수가 될 수도 있었다. 그들을 곁에 둔다면? 그것은 막대한 이익을 가져올 수도 있었다. 별다른 고민 없이, 두 사람은 마주 섰다. 하나는 붉은 얼굴에 연기를 뿜어내고, 다른 하나는 완벽히 무표정한 채. 나첼니크는 손바닥을 내밀었다. ‘우리는 협력할 수 있다’ 그런 의미리라. 그의 손 안에는 볼리바르라 쓰인 쿠바산 담배 상자가 굴러 들어왔다."
 POL_startup.19.a:0 "\"한 대 피겠나?\""
 POL_startup.20.t:0 "위대한 심문관을 위한 위대한 취임식"
 POL_startup.20.desc:0 "방 안은 기묘한 정적에 휩싸여 있었다. 새로운 나첼니크는 아직 단 한 마디도 하지 않았다. 펠릭스 지에르진스키는 시가를 비벼 끄고, 주위를 둘러보았다. 마치 자신이 상대해야 할 청중들을 하나하나 평가하듯, 조용히 그들을 살펴보았다.\n\n\"피우수트스키는 약했습니다.\"\n\n연합회복권의 고위급 인사 일부가 소리날 정도로 경악하였다. ‘약했다’ 라니. 의외의 단어 선택이지않는가? 그의 반대자들은 그를 잔혹하다, 가혹하다, 권력에 굶주렸다고 욕해 왔다. 하지만 ‘약했다’고?그 누구도 그런 말을 할 정신 나간 사람은 없었다. 적어도, 지금까지는. 그러나, 지금 그 말을 뱉어낸 사람은 지에르진스키였다. 그는 주저 없이 그렇게 말했다.\n\n\"자, 사실을 들여다보도록 합시다. 여전히 당 밖의 정치조직들이 남아 있습니다. 대놓고 가리킬 수 있는 ‘야당’이 존재합니다. 그리고 거리에는 국가 안보를 위협하는 자들이 활개를 치고 있지요. 이 모든 것이, 그의 약함 때문입니다.\"\n\n그는 잠시 말을 멈추었다. 홀 한가운데 자리 잡고 있던 귀족들의 무리가 그를 노려보았다. 어떤 이는 불쾌감을 가득 담은 표정을 지었고, 다른 이들은 순수한 적의를 담아 그를 응시했다.\n\n\"그의 위대한 토지 개혁이 완수되지 못했다는 점은 말도 맙시다. 땅을 움켜쥔 뚱뚱한 지주들은 여전히 우리의 길을 막고 있고, 광활한 농촌 지역은 우리를 아예 모르고 있지요. 물론, 우리들의 ‘좋은 친구들’이 제공하는 정보를 여기 계신 분—”\n\n\"감히 우리 나첼니크를 그런 식으로 모독하지 마라! 네놈이 무슨 자격으로 그분을 폄하하느냐? 그분이 조국을 위해, 그리고 네놈을 위해 어떤 희생을 치렀는지 알기나 하나? 그런 모든 것을 던져버리다니…! 네놈이 감히—”\n\n귀족 무리는 자리에서 일어나 격분했다. 지에르진스키는 여전히 감정이 전혀 묻어나지 않는 얼굴로 그들을 바라보았다. 그는 한숨을 내쉬고 자리에서 일어나 경비병들을 향해 손짓했다. 그들이 끌려 나가는 동안, 지에르진스키는 조용히 숨을 고른 뒤 다시 의자에 앉았다. 방 안은 다시 한 번 그 이상한 정적에 잠겼다. 그리고… 그가 미소를 지었다.\n\n\"물론, 그는 동시에 아주 강한 인물이기도 했습니다. 만약 그가 없었다면, 우리가 이 자리에 있을 수도 없었겠지요.\" 그는 퇴장하는 이들을 가리키며 말했다. \"그리고 저 자들은, 그곳에 있을 수도 없었겠지요.\"\n\n\"그가 여기까지 우리를 이끌어 왔습니다. 그러나 ‘여기까지’는 ‘끝까지’가 아닙니다. 폴란드는 피우수트스키가 ‘이룬' 모든 것이 아니라, ‘원한' 모든 것을 가져야 합니다. 이제, 나첼니크로서 나는 이를 끝까지 밀어붙이리라 자랑스럽게 말하겠습니다. 이번에는 결승선까지 입니다.\""
 POL_startup.20.a:0 "\"그건 그렇고… 점심시간이지 않습니까?\""
 POL_Zadruga.1.t:0 "누가 떠나야 하는가?"
 POL_Zadruga.1.desc:0 "“…그렇다면 폴란드는 어쩌겠습니까? 수칼스키, 당신은 이 짐을 짊어질 힘이 있다고 생각합니까?”\n\n\"내가 할 수 있는 일과 없는 일을 나에게 지시하지 마라, 스타흐니우크. 나는 지도자다.\"\n\n수칼스키는 조용한 왕궁을 거닐며, 한때 바사 왕가의 보좌였던 이곳을 둘러보았다. 그의 조각품과 작품들이 가득했으며, 구석구석에는 오래된 기념비들과 시대에 뒤떨어진 그림들이 버려지듯 놓여 있었다. 그 앞에는 해야 할 일이 너무나 많았고, 그의 어깨에는 그만큼의 무게가 얹혀 있었다. 하지만 그는 여전히 스스로의 힘으로 그것을 들어 올릴 수 있다고 확신하고 있었다. 하루, 이틀, 그는 더 이상 시간이 얼마나 흘렀는지 정확히 기억할 수 없었다. 단 한 가지 확실한 것은, 그들이 세 남자를 군중 앞에서 공개 처형한 후라는 것이었다. 칼날이 빼곡한 바다로 그들을 떨어뜨려 죽였던 바로 그날 이후.\n\n“당신은 위대한 예술가입니다. 더 나아가 위대한 예지자이기도 하죠. 하지만 솔직히 말해 보십쇼. 폴란드가 프랑스처럼 되는 것을 원합니까? 잠깐의 격렬한 에너지를 분출하고 이내 사그라드는 운명을 말입니다. 피우수트스키 원수에게는 계획과 행동의 비전이 있었습니다. 그러나 아르토에게는 그런 것이 없었죠… 솔직해집시다. 당신에게도 없습니다.”\n\n수칼스키는 자신의 파파하를 가볍게 두드렸다. 지금 그들은 왕궁의 2층에 있었고, 이곳은 따뜻해야 마땅했지만, 그는 뼛속까지 스며드는 한기를 느꼈다. 발끝으로 유리 조각들 사이에 놓인 돌멩이를 건드리다가, 몸을 숙여 창문을 열었다. 그의 시야에 붉게 타오르는 거리의 풍경이 펼쳐졌다.베테랑과 검은 머리의 청년들이 서로의 목을 조르며 싸우고 있었다. 배신자라는 비난과 성직주의자라는 고발이 오갔다. 자드루가는 그 뿌리부터 흔들리고 있었으며 폴란드는 내전의 벼랑 끝에 서 있었다. 붉은 깃발을 든 노동자들은 이 모든 혼란 속에서 자신들이 어떻게든 이득을 볼 수 있다고 믿으며 도발을 멈추지 않았다. 하지만 결국은 지에르진스키도, 죽음의 후사르도 그들의 손아귀를 빠져나가 이 모든 것을 짓밟고 말 것이다. 펠릭스는 바닥에 웅크려 앉아 일격을 가할 순간을 기다리고 있었다.\n\n“당신에게 계획이 없다면, 피아세츠키에게는 있을 겁니다. 모든 상황에 대비한 해결책이 말입니다. 수칼스키, 우리의 구상이 언젠가 우리를 배반할 수도 있습니다. 당신을 배반할 수도 있지요. 당신은 힘을 잃고, 결국 잊혀질 것입니다. 영웅으로 떠나십시요. 유대-기독교의 정신이 폴란드의 영혼을 지배하던 권위를 무너뜨린 자로 남으세요. 하지만 끝내 그것을 더욱 공고히 만든 장본인이 되지는 맙시다.”\n\n스타흐니우크는 수칼스키의 어깨 위에 손을 올렸다. \"그래서 당신의 선택은 무엇인가요?\" 그는 그렇게 말하려 했지만, 끝내 말을 삼켰다. 수칼스키가 무릎을 세우고 일어나 창밖의 혼란을 가만히 지켜보았기 때문이다. 그는 아직 결정을 내릴 시간이 있었다."
 POL_Zadruga.1.a:0 "\"나는 또 다른 낙원에서 나를 추방할 거짓된 뱀 따위 필요 없다. 썩 꺼져라, 배신자.\""
 POL_Zadruga.1.b:0 "\"솔찍하게 말하지 스타흐니우크 난 자신이 없네, 우리 제치포스폴리타를 위해 자네가 이끌어주게.\""
 POL_Zadruga.2.t:0 "붉은 홍수에 뛰어들기"
 POL_Zadruga.2.desc:0 "이제 어떡하지?"
 POL_Zadruga.2.a:0 "중립을 유지하자"
 POL_Zadruga.2.b:0 "프랑스는 우리에게 있어서 정말 큰 위협이다!"
 POL_Zadruga.3.t:0 "마르잔나의 익사"
 POL_Zadruga.3.desc:0 "\"아름다운 봄이 우리에게 찾아왔다. 기독교적 겨울의 죽음에서 이교적 봄으로의 전환이다. 그리고 우리 앞에, 폴란드 민족과 슬라브 세계의 영적 지도자라는 칭호를 배은망덕하게도 스스로에게 부여한 배신자들이 있다! 저들을 보라!\"\n\n성직자들, 부제들, 집사들, 본당 신부들, 그리고 쿠리아의 여러 직원들의 얼굴 아래로 횃불이 비춰졌다. 자드루가는 아직 주교나 추기경에게까지 손을 대지는 않았다. 국제적 위기를 초래할 위험을 감수하지 않기 위해서였다. 아우구스트 흘론트는 단지 베레자 카르투스카에 구금되어 있을 뿐이었다. 얀 스타흐니우크는 병사들 앞에서 연설을 이어갔다. 그들이 모인 곳은 나무들에 가까운 공터였고, 더 가까운 곳에는 거센 숲의 개울이 흐르고 있었다. 참으로 아름다운 날이었다. 그러나 총사령관은 사람들이 재갈이 물린 신부들의 얼굴을 똑똑히 보기를 원했다.\n\n\"반역자들! 반동의 난쟁이들! 영혼을 지배하며 폴란드의 역사적 운명을 좌우할 수 있다고 여긴 자들! 1926년의 로즈바도프스키-야누샤이티스 반란을 무원칙하게 동조한 자들! 모스크바의 앞잡이이자 바티칸의 하수인들! 이들에게 가해진 혐의는 단 하나, 그것은 바로 국가 공동체에 대한 반역과 국민을 국가적 진실에서 기만한 죄다! 우리는 오늘 이 자리에서 최종 판결을 내리기 위해 모였다. 그러니 묻겠다, 생명의 진리를 믿는 동지들이여, 이들을 어떻게 해야 하겠는가?\"\n\n그들의 몸에서 기름 냄새가 나는 순간부터, 그리고 그들 앞에 횃불이 놓인 순간부터, 그들이 어떤 운명을 맞이할지는 너무나도 분명했다. 스타흐니우크는 마치 고대의 황제처럼, 혹은 신성한 자손처럼 단상 위에 서 있었다. 그는 생사에 대한 권한을 지닌 존재였다. 폴란드 군단의 참전 용사들, 떠돌이 청년들, 우연히 지나가던 행인들까지 단 두 문장만을 외쳤다. \"불이 그들을 삼키게 하라! 그들이 우리에게 약속했던 지옥을 맛보게 하라!\"스타흐니우크가 가볍게 손짓하자, 기둥에 묶여 있던 성직자들을 태울 준비가 시작되었다. \n\n\"우리 문화에는 잘 알려진 풍습이 있다. 마르잔나의 화형이다. 겨울의 혹독한 여신을 불태우는 이 풍습은 새로운 계절의 시작을 의미한다. 그리고 또 다른 풍습이 있었으니, 그것은 타데우시 코시치우슈코와 같은 폴란드 정신의 거인들이 실천했던, 타르고비차의 반역자 주교들을 교수형에 처한 일이었다. 또한 폴란드인들은, 야쿠프 셸라의 모습으로 변해, 이런 자들에게 응징을 가한 적도 있었다. 오늘, 우리가 우리 조상들을 기리고, 우리의 전통을 확증하려 한다면, 스스로를 위해 마련한 화형대 위에서 이들을 불태우지 않고서야 되겠는가?\"\n\n\"불로 태워라!\" 그가 두 팔을 치켜들자, 병사들이 기둥으로 다가갔다. 불꽃을 조심스럽게 가져다 대자 그것은 순식간에 성직자들의 몸을 덮었다. 비명이 터져 나왔으나, 이미 인간의 언어는 아니었다. 도끼가 휘둘러지며 기둥들이 차례로 쓰러졌고, 그들과 함께 성직자들의 몸도 거센 물살 속으로 사라졌다."
 POL_Zadruga.3.a:0 "우리의 이름은 정의다."
 POL_Zadruga.4.t:0 "뿔 달린 심장의 퇴위"
 POL_Zadruga.4.desc:0 "수칼스키는 세임을 바라보았다. 신-원시주의적 양식의 독수리와 폴란드 군단병의 이미지로 장식된 공간. 한때 그는 폴란드 전체를 자신의 모습대로 바꾸려 했으나, 이제는 더 이상 그러할 수 없었다. 이미 연합회복권에 퇴위를 선언한 이상, 되돌아갈 길은 없었다. 적어도 그는 품위를 지키며 이 순간을 마무리하고 다시 창작에 몰두할 수 있을 터였다. 언젠가 그는 거대한 무언가의 일부였지만, 이제 그는 연단 위에 서 있었다. 그의 위대한 연극의 마지막 순간, 크라쿠프 왕의 통치가 끝나는 순간이었다. 라디오 기자들이 마이크를 설치했고, 카메라의 섬광이 그의 얼굴을 비췄다. 자드루가 신봉자들은 피우메식 경례를 그에게 바쳤다. 수칼스키는 단어를 골랐다. 혀가 입천장을 두드렸고, 입술이 움직였다.\n\n\"조상들의 이교적 신앙과 혁명적 민족주의의 신조에 충실한 동지들이여! 변화의 순간이 다가왔으며, 안정의 시간이 찾아왔다. 우리는 봉건적 과거에서 혁명적 미래로 나아가고 있다. 무능한 노인들의 지배를 무너뜨렸다. 그들은 자본주의적 이익의 하수인이었으며, 우리 조국을 전염병처럼 침식한 성직자 계급의 앞잡이였다. 내 의무는 여기서 끝난다.\"\n\n기자들과 손님들 사이에서 속삭임이 오갔다. 피아세츠키, 헴펠, 스타흐니우크와 그들의 동맹자들은 침묵을 지켰다. 그들은 스타흐니우크 총수의 연설이 끝날 때까지 긴장 속에서 오른손을 높이 들고 있었다.\n\n\"따라서 나는 총수직에서 물러날 것을 선언한다. 나는 얀 스타흐니우크를 나의 후계자로 축복하며, 연합회복권이 그를 선택하기를 희망한다. 그는 폴란드가 필요로 하는 사상가이며, 급진적 변혁 이후 우리의 국가를 안정시킬 인물이다...\"\n\n기자들의 웅성거림이 커졌다. 카메라 섬광이 쏟아졌고, 라디오 방송국마다, 자동차마다 수칼스키의 연설이 송출되었다. 모든 심장이 그 순간 얼어붙었다.\n\n\"일어나라, 얀 스타흐니우크!\"\n\n철학자가 차분한 걸음으로 연단으로 나아갔다. 순백의 셔츠를 걸친 그의 모습은, 화려한 의상과 뿔 달린 심장의 문양을 지닌 수칼스키와는 대조적이었다. 그는 후보자로서 연설할 권리를 가지고 있었으며, 그를 반대하는 것은 곧 자기 자신에게 사형 선고를 내리는 것이나 다름없다는 것을 모두가 알고 있었다.\n\n\"나는 스타니스와프 수칼스키가 조국을 위해 헌신한 것에 감사하며, 나를 후계자로 지명해 준 것에 경의를 표한다. 뜻밖의 일이지만 기꺼이 받아들이겠다. 나는 군더더기 없는 핵심을 찌르는 통치를 약속한다. 나의 손은 거리의 무질서를 조국 공동체의 이름으로 조여 나갈 것이다. 이제, 국가를 부르자. 모두 일어나라!\"\n\n그의 목소리에는 강력한 힘이 서려 있었다. 모든 이가 일어났다. 자드루가의 정규 구성원들이 먼저 자리에서 일어났고, 곧이어 모든 사람이 따라 일어섰다. \"우리는 제1여단이다\"노래가 홀을 가득 채웠다."
 POL_Zadruga.4.a:0 "그를 좋아하지 않는 이들도 있었지만, 그들은 그의 의지가 만든 사슬에 묶여 있었다."
 POL_Zadruga.5.t:0 "불멸의 원수"
 POL_Zadruga.5.desc:0 "“…그리고 피우수트스키 원수! 창조의 데미우르고스이자, 폴란드 정신의 위대한 건축가! 폴란드 낭만주의의 유한한 체계를 초월한 반신이며 티탄이시다! 그는 눈을 감았으나 죽지 않았다. 그는 천상의 위대함 속으로 승천하였으며, 그의 아버지이신 스비아토비트와 재회하셨다!”\n\n미치광이 예언자는 성체성사의 중심부, 성 마리아 교회 앞에서 그의 위대한 연설을 시작했다. 그는 네 명의 젊은이들에 의해 가마에 실려 왔으며, 화려한 사르마트식 콘투시를 걸쳤고, 중세 유럽보다 아즈텍 문명에 더 어울릴 법한 투구를 쓴 채였다. 그는 단순한 나무 상자 위에 올라서더니, 격렬한 몸짓과 함께 군중을 휘어잡았다. 그리고 오래된 성직자의 설교에 귀를 기울이던 신도들을 힘으로 끌어냈다. 그의 연설은 기이하고도 이례적인 것이었으며, 그의 목소리는 교회의 설교대조차 잠식할 수 없을 만큼 우렁찼다. 그가 말하는 것은 불의 언어였다.\n\n\"원수께서는 우리 가운데 계시며, 불이시고, 영이시며, 천둥의 힘이시다! 그는 폴란드의 헤라클레스이시며, 나는 그의 추종자이니, 너희도 그의 추종자가 되어야 한다! 내가 너희에게 이르노니, 나는 바벨 성을 허물고, 그 색바랜 아비시니아 신의 성전을 무너뜨릴 것이다!”\n\n군중은 경악했다. 그들은 이 광인이 곧 수장 스타니스와프 수칼스키라는 사실을 알지 못했다. 그들은 그를 속삭이며 두려워했다. 그가 어디선가 먼 과거로부터 나타나, 졸고 있는 폴란드 민중을 그의 설교로 깨우려는 것처럼 보였기 때문이었다. \n\n\"그리고 나는 너희를 위해 신전을 세우리라. 그곳에서 너희는 피우수트스키께 경배를 드릴 것이며, 나는 너희를 위해 바벨탑을 세우리니, 옥수수 들판 너머 수평선에 솟아오를 것이다! 사흘 안에 나는 도로를 닦고 아스팔트를 깔 것이며, 어떤 예언자도 하지 못했던 일을 하리라. 나는 단순히 죽은 자의 신전을 말하는 것이 아니라, 살아 숨 쉬는 국가를 말하는 것이다! 국가를 위해 생과 사를 바칠 것이다!\"\n\n그들은 그의 연설을 이해하지 못했다. 그의 말은 도로에 대한 것이었으며, 흐름에 대한 것이었고, 기념비와 국가에 대한 것이었으나, 사람들은 그 의미를 깨닫지 못했다. 그러나 그의 말 조각 속에서 교회에서 한 번도 들어본 적 없는 지혜를 느꼈다.\n\n\"피우수트스키를 찬양하라! 그분은 죽지 않으셨으며, 여전히 살아 계시고 영원히 지속되시리라! 아멘!\"\n\n그때 네 명의 남성이 조각상을 어깨에 짊어지고 나타났다. 그 거대한 형상은 폴란드 민중 위에 군림하며 러시아의 뱀과 싸운 뱀가죽의 전사 피우수트스키를 묘사하고 있었다. 사람들은 그 앞에 무릎을 꿇었고, 그의 영광을 기리며 기도를 올렸다."
 POL_Zadruga.5.a:0 "아멘! 죽은 자의 목소리는 여전히 울려 퍼진다."
 POL_Zadruga.6.t:0 "호멘 혹은 신을 배반한 수레"
 POL_Zadruga.6.desc:0 "선반 위에는 십자가가 놓여 있었다. 그것은 콜차크놈들의 병사의 총알을 녹여 만든 것이었다. 침대 위에는 안제이가 몸을 움츠린 채 앉아 있었고, 그가 숨겨 두었던 비탄의 예수 그림을 응시하고 있었다. 그 그림 한가운데, 예수의 심장 부분에는 총알 자국이 나 있었다. 폴란드에서는 아직 종교적 물품의 소지가 금지되지 않았지만, 정부는 가톨릭 신앙의 흔적을 불편하게 여겼다. 안제이는 점점 확신했다. 친구들, 혹은 최소한 이웃들 중 누군가는 그를 당국에 신고할 것이다. 그는 제1차 빈켈리에트 전쟁의 참전 용사였다. 참전 당시 겨우 열일곱 살이었고, 성년임을 속이고 입대했다. 그때 그는 젊은 공산주의자였고, 어느 정도는 여전히 그렇다고 할 수도 있었다. 결국 엥겔스는 기독교가 로마 제국에서의 사회주의라고 말하지 않았던가? 로자 룩셈부르크도 붉은 협약을 승인하지 않았던가?\n\n하르키우 원정 동안, 그는 러시아의 총탄에 맞았다. 정확히는 7.63×25mm 마우저 탄환이었다. 어머니는 그에게 유니폼 안에 성화를 넣고 다니라고 하셨고, 지금 그의 앞에 액자로 서 있는 것이 바로 그것이었다. 그는 그것이 미신 같아 꺼려졌지만, 전투 중 그 총알이 그리스도의 형상을 뚫고 들어와 그의 갈비뼈를 부쉈으나, 심장을 앞두고 기적처럼 멈춰버렸다. 그날 이후, 그는 개종했다.\n\n그는 피우수트스키의 세속주의에 반대하지 않았다. 그것은 합리적인 정책이었다. 하지만 자드루가의 맹렬한 교회 공격은 그를 두렵게 만들었다. 교구 앞에서 이교도의 추수제와 축제가 열렸고, 신문은 그리스도의 출생에 대한 대안적 이론을 퍼뜨리며 그를 폄하했다. 어머니가 세상을 떠난 뒤, 가족 중 신앙을 지킨 것은 그뿐이었다. 아버지는 헴펠의 열렬한 지지자가 되었고 친구들과 전우들은 교회를 떠났다. 그는 마치 공허한 대성당 한가운데 홀로 앉아 있는 것 같았다.\n\n그의 집 앞을 지나가는 것은 이교 신들의 모습으로 분장한 남녀들이었다. 안제이는 두 팔을 접고 머리를 손바닥에 파묻었다. 그는 손가락 사이로 그리스도의 성화를 바라보았다. 그리고 그 옆, 십자가 옆, 그림 옆에 있는 탁자 위를 바라보았다. 그곳에는 체스판이 있었다. 그는 지금 체스를 두고 있었다. 상대는… 비스 wz.35 권총이었다. 그리고 그는 패배하고 있었다.\n\n\"오 주님, 힘을 주소서… 내가 끔찍한 일을 저지르기 전에.\"\n\n그의 집을 맴도는 신을 배반한 호멘에 합류하고 싶은 유혹만큼이나, 그를 강하게 끌어당긴 것은… 총구를 자신에게 겨누는 것이었다. 혹은, 곡과 마곡이 되어 버린 이 세상과 맞서 홀로 성전을 수행하는 것이었다. 이 시대에 기독교인으로 살아간다는 것은 어리석은 일이었다. 아니, 어쩌면 그날 하르키우에서 있었던 기적은 단순한 우연이었을지도 모른다. 어쩌면 그는 처음부터 조국의 쓰레기처럼 죽었어야 했던 존재였을지도 모른다. 그렇다. 세상의 눈에는 그가 미친 바보일 것이다. 그러나 주님의 눈에는, 세상의 어리석음이야말로 지혜일 것이다. 그러나 그를 향한 응답은 없었다."
 POL_Zadruga.6.a:0 "그러나 그를 향한 응답은 없었고 그는 침묵을 향해 기도하고 있었다."
 POL_Zadruga.7.t:0 "신의 손"
 POL_Zadruga.7.desc:0 "\"이건… 흥미로운 전시네요?\"\n\n고고학 석사 과정을 준비하며 논문을 쓰고 있는 마르실은 방 한가운데 놓인 전시물을 감탄하며 바라보았다. 그것은 비아와의 재떨이였는데, 그 위에는 스와스티카가 새겨져 있었고, 십자가의 양 끝에는 수평선으로 마감된 작은 십자가가 장식되어 있었다.\n\n하지만 마르실의 시선을 사로잡은 것은 그것이 아니었다. 그녀가 더욱 관심을 가진 것은 사스콰치와 닮은 거대한 조각상이었다. 그 형상에는 기독교 십자가가 걸려 있었으며, 그 뒤의 벽에는 그것을 슬라브 전사가 정복하는 그림이 그려져 있었다. 전사는 혼란스럽게도 아르데코 스타일에 가까운 갑옷을 걸치고 있었다. 이것이 진짜 고고학적 유물일 리는 없었다.\n\n\"아, 그렇죠! 정부에서 전시회를 좀 더 매력적으로 만들겠다고 했어요. 이 전시관은 폴란드의 오랜 역사적 유산과 찬란한 미래를 보여주는 곳입니다.\"\n\n전시 큐레이터가 마르실의 곁에서 작품을 설명했다. 그의 말은 명백히 외운 듯한 연설이었지만, 논쟁을 할 준비는 되어 있는 듯했다.\n\n\"그렇군요, 하지만 저 빅풋 같은 건 대체 뭘 의미하죠?\"\n\n\"스타니스와프 수칼스키는 미국의 예술, 특히 원주민 및 후기 콜럼버스 시대의 영향에서 영감을 얻었습니다. 예티는 그저 퇴보와 모스크바놈들을 상징하는 것일 뿐입니다.\"\n\n\"하지만 기독교가 폴란드가 국가를 형성할 기회를 준 것 아닌가요?\"\n\n\"얀 스타흐니우크(Jan Stachniuk)는 동의하지 않았을 겁니다. 기독교의 노예 도덕이야말로 폴란드를 몰락으로 이끈 원흉입니다. 피아스트 왕조는 단순히 무력으로 유지되었을 뿐이죠. 볼레스와프 2세 시초드리가 결국 성직자들의 음모를 막으려다가 망명당하지 않았습니까? 기독교는 관념적환경을 만들어 사람들이 자신의 본성을 버리고 개인주의적 위선과 신앙적 허울 속에 갇히게 만듭니다.\"\n\n마르실은 잠시 생각에 잠겼다. 그녀는 정치에 관심이 없었지만, 어쩌면 어느 정도는 일리가 있을지도 모른다고 느꼈다. 처음 폴란드에 오기 전, 그녀는 권력 교체와 지도부들의 죽음 이후 폭력적 포그롬이 일어났다는 소문을 듣고 두려워했었다. 하지만 자드루가 정권은 약속을 지켰다.그녀가 크라쿠프에 들어설 때, 그녀의 눈앞에는 재건 중인 바벨 성과, 코시치우슈코 모운트위의 거대한 조각상이 보였다. 만약 자드루가 사상의 위대함을 증명할 수 있는 것이 있다면, 그것은 바로 '행동의 상징'일 터였다.\n\n\"정말 흥미로운 광경이네요. 하지만 왜 굳이 예티인가요?\"\n\n큐레이터는 신중한 태도를 유지하려 애쓰며 설명을 이어갔다.\n\n\"수칼스키는 예티가 인간을 강간하여 태어난 후손들이 세계를 지배하고 있으며, 폴란드인들이 이에 맞서 십자군을 이끌어야 한다고 믿었습니다.\"\n\n그 순간, 마르실은 번뜩 깨달음이 몰려왔다. 그리고 폭소를 터뜨렸다."
 POL_Zadruga.7.a:0 "\"…그리고 당신들은 슬라브인들이 이스터 섬에서 유래했다고 주장한다고요?\""
 POL_Zadruga.8.t:0 "머나먼 과거에서 온 새로운 미래"
 POL_Zadruga.8.desc:0 "그들은 전진했다. 이 밤은 브루노 야시엔스키의 시적 반달리즘보다도 더 거대했다. 이것은 미래주의였고, 그들이 그토록 갈망했던 공산 혁명이었다. 심지어 마야콥스키의 무시무시한 장엄함조차 이 위대한 성스러운 밤에 펼쳐진 잔혹한 행진에 비하면 훨씬 세련되어 보일 정도였다. 토마시와 얀, 그리고 무리를 이룬 다른 학생들은 바르샤바의 거리를 돌아다니며 가게와 카페의 창문에 벽돌을 던졌다. 이 부르주아 문화, 이 속물주의는 그들의 단단한 신발 밑에서 사라지고 있었다. 그날 밤, 그들은 신이었으며, 더 이상 지루한 미래주의 스승들의 설교를 들을 필요조차 없었다. 자드루가가 이른바 ‘결합’과 맞섰고, 사회주의가 이제 손에 닿을 듯 가까워졌으므로. 약탈한 와인에 취한 토마시는 동료의 어깨를 후려치듯 두드리며 앞을 가리켰다.\n\n\"저쪽으로 가자! 친구, 저들이 얼마나 거대한 모닥불을 피우고 있는지 보이지 않느냐?\"\n\n그는 트림을 하며 휘청거렸고, 비틀거리며 한 걸음씩 나아갔다. 얀도 그다지 다르지 않았다. 바에 들른 뒤 약 몇 병을 털어넣은 상태였고, 간신히 늑대 같은 웃음을 지으며 대답했다.\n\n\"뭘 망설이겠나! 누군가의 두개골을 시적으로 박살 내야지! 칼로 그의 관자놀이에 시를 써야 하지 않겠어!\"\n\n그들은 서로 부축하며 웃음을 터뜨렸다. 그리고는 '인터내셔널'을 부르며 그 가사를 비틀어 조롱했다. 공원 벤치를 강탈하듯 들어 올리고, 다른 혁명 동지들에게 손을 흔들며 시위에 뛰어들었다. 이것이야말로 진정한 폭동이었고 진짜 볼셰비즘이었다!\n\n그들은 거대한 인파에 합류했다. 그들 사이에는 ‘죽음 후사르 사단’의 째진 눈을 한 타타르인들이 있었다. 두 사람은 의아했다. 죽음의 후사르들은 분명 정부의 동맹군이 아니었던가? 그때, 얀은 불쾌한 타는 냄새가 코를 찌르는 것을 느끼고 눈을 가늘게 떴다. 그러나 토마시는 별다른 생각 없이 다시 벽돌을 던졌다. 그가 던진 곳은 양복 차림의 노인들이 강제로 갇혀 있는 카페였다. 고통 속에서 몸부림치는 저 돼지 같은 자들을 보자, 분노가 끓어올랐다. 얀이 그에게 또 다른 돌을 건네주었고, 그것은 정확하게 표적을 명중했다. \n\n\"지옥에서 불타버려라, 늙은 것들아! 너희가 토해낸 속물주의 문서 더미 위에 너희 자식들까지 태워버리겠다!\"\n\n그러나 얀은 마약에 취했음에도 불구하고 순식간에 창백해졌다. 그는 불길이 간판을 지탱하는 밧줄을 태워버리는 장면을 보고 말았다. 그곳에는 불타는 글씨가 적혀 있었다. '피카도르아래에서’ 그는 놀라서 토마시의 어깨를 세차게 흔들었다.\n\n\"뭐-\"\n\n얀은 말없이 간판을 가리켰다. 토마시는 얼굴이 새하얗게 질려 뒷걸음질쳤다. 그 불길 속에서 타오르는 것은 스카만드라이트, 즉 미래주의자들의 동맹이었다. 그들은 이제 자드루가의 장엄한 모닥불의 희생양이 되었다."
 POL_Zadruga.8.a:0 "때때로, 앞으로 나아가기 위해서는 뒤로 가야 한다.\""
 POL_Zadruga.9.t:0 "개인적 바벨"
 POL_Zadruga.9.desc:0 "시비아토비트는 민족을 내려다보고 있었다. 그는 이제 새로운 황금 송아지로서 받들어지고 있었다. 그의 온화한 눈, 단호한 눈, 예리한 눈, 꿰뚫는 눈은 세상의 네 구석을 응시했다. 그의 백성들은 철과 분노, 그리고 영광으로 이루어진 그의 형상을 창조했으며, 그것은 이교도의 혁명이 지속되는 동안 거대하게 성장했다. 그들은 바위와 나무, 그리고 자신의 영혼 속에 네 위대한 인물의 형상을 새겼다. 그들은 이 네 명의 인물들이 새로운 통합된 존재, 즉 '신성한 독수리'가 되었다고 믿었다. 그리고 부고제우는 용의 둥지 속에 세워진 신전 앞에 펼쳐진 영광을 자애롭게 내려다보았다.\n\n멀리, 도시의 가장자리에는 고층 빌딩들이 구름을 긁어대듯 솟아 있었다. 그리고 그들 한가운데, 하나의 탑이 서 있었다. 크라쿠프의 바벨 그것의 존재는 야훼, 그 낯선 천둥과 포도의 신에 대한 모독이었다. 그 존재는 섬세한 슬라브의 자궁을 뚫고 들어왔다. 그러나 부고제우는 그것이 좋다고 여겼다. 그의 제사장, 제르차는 그 위대함 아래에서 팔을 들어 올려, 그의 영원한 조상들에게 기도를 올렸다.\n\n그는 날카로운 시선을 돌려, 저 언덕을 바라보았다. 그 언덕은 배신한 성직자들을 교수형에 처한 위대한 혁명가에게 바쳐진 곳이었다. 그 언덕에는 조국을 배반한 자들의 초상화가 걸려 있었다. 그리고 그들 위에는 잊혀진 자들의 왕과 위대한 왕이 솟아 있었다. 그들은 자신의 조국을 배신하고 독일과 공모했던 주교 스타니스와프의 미트라를 짓밟았다.\n\n네 개의 눈을 가진 레히테 신의 아바타는 다시 한 번 전체 광경을 바라보았다. 그들은 이 목가적인 풍경, 이 영광을 모두 담아 보았다. 강대한 왕의 조각상 아래에서 소풍을 즐기는 가족들. 조국의 영광을 위해 땀 흘리며 작물을 거두는 농부들. 그리고 부고제우의 전사-제사장들, 그들은 내면의 제국을 창조하는 자들이자, 니체적 집단의 일원이었으며, 그들의 손에는 선물이 들려 있었다. 그들은 그 선물들을 거대한 불의 제단 위에 바쳤다. 마치 아즈텍의 사제들이 인간의 열매를 하늘로 들어 올리듯이.\n\n그리고 피우수트스키, 미츠키에비치, 코페르니쿠스, 카지미에시 대왕은 그들이 창조한 세계를 내려다보았다. 그들의 정신은 하나의 위대한 정신으로 통합되었다. 다양성은 통일로 변했다."
 POL_Zadruga.9.a:0 "여덟 개의 눈을 가진 짐승은 눈을 감았다. 잘 주무시게나 원수."
 POL_Zadruga.10.t:0 "개인적 바벨"
