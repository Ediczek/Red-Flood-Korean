 poland.4.t:0 "아름다운 죽음은 예술의 한 행위로다"
 poland.4.desc:0 "“발레리 스와베크가 자살했다고? 난 그가 그럴꺼라고는 생각도 못했는데.”\n\n“설마. 하지만 이건 난세야, 친구. 어쨌든 신문값을 내면 더 들어보고 싶군.”\n\n“여기, 넌 정말 독수리 같구나, 올기에르드. 어쨌든 여기 보니까 그가 스스로 총을 쐈대. 발작의 흔적과 벽에 총알 구멍이 있었다고 하더군. 아마 두세 번 시도 끝에 겨우 스스로를 해쳤을 거라고.”\n\n“그거 기가 막히게 수상한걸”\n\n“신문에서는 만약 암살이었다면 이웃들이 누군가 봤을 거라고 하잖아. 다들 그의 하수인이나 부하들이잖아. 나도 그들의 집을 청소한 적이 있어서 알아. 그들은 그의 초상화를 원수의 초상화 옆에 걸어둘 정도로 충성한다더라고. 그들이 만약 누군가를 봤다면 분명 경보를 울렸을 거야.”\n\n“협박을 받았거나….”\n\n“그들은 강직한 사람들이야. 그럼에도 불구하고 그에게 모든 것을 빚진 사람들조차도 그가 미쳤다며 이런 일이 일어날 거라고 예상했다고 해.”\n\n“이런 일이 그렇게 쉽게 일어나진 않아.”\n\n“이런 일은 항상 이런 식으로 일어나. 권력에 너무 가까워지면 주변을 간신들로 채우고 자신을 세상의 왕이라고 착각하게 돼. 그러다 현실과 단절되버려. 그리고 결국 다시 땅으로 내던져지는 거지. 지금 시미그위가 하고 있는 것처럼 말이야. 아마 그는 자신의 유산이 모두 불타버리고 있다고 생각했을 거야.”"
 poland.4.a:0 "발레리 스와베크, 자살로 추정되는 사망… 동료들 애도에 잠기다."
 poland.5.t:0 "캇파 개구리의 정치"
 poland.5.desc:0 "\"자네가 대통령에 걸맞는 인물이라 생각하는 건가?\"\n\n시미그위는 비트카치의 말을 듣고는 서류에서 눈을 뗀체 한쪽 눈썹을 치켜올렸다.\n\n\"‘최선의 인물’이겠지. 나도 자네만큼 피우수트스키를 잘 알고 있고 그가 코츠와 같은 개성 없는 놈의 손에 나라가 굴러가는 걸 흡족해 했을 것 같진 않군.\"\n\n\"말을 가려 하게, 아담은 내 좋은 친우라고.\"\n\n시미그위는 무심히 중얼거리며 서류로 돌아갔다. 이 동작만으로 비트카치를 귀찮은 파리 쫓듯 내치려했다.\n\n\"자네도 한때 나처럼 화가였잖아... 당신도 기욤 아폴리네르처럼 명성을 꿈꾼 적 있지 않았나? 그리고 나는 아르토처럼 잿빛 군중에는 관심 없어. 내가 원하는 건 단 한 가지야. 바로 너의 잠재력을 낭비하지 않는 것. 우리 함께 폴란드를 완전히 뒤집어 놓자고, 프랑스를 뒤집었던 아르토와 아폴리네르처럼.\"\n\n시미그위는 손을 멈추고 또 다른 따분한 군사 서류를 넘기는 것을 멈췄다. 입술 사이에서 담배를 떼며 입을 열었다. 그는 오랫동안 침묵 속에서 생각에 잠긴 후 천천히 눈을 들어 비트카치와 시선을 맞췄다. \n\n(...) \n\n연설의 날이 찾아왔다. 구국군사위원회(WRON)의 존재는 폴란드를 안정화시키기 위한 미봉책에 불과했기에 해산될 예정이었다. 나첼니크의 권한은 대통령과 군 사령관으로 나뉘게 될 예정이었다. 아담 코츠가 시미그위에게 말을 걸었다.\n\n\"무슨 불만이라도 있어?\"\n\n\"아니, 아무것도 아니야.\"\n\n그는 거짓말했다. 코츠는 고개를 끄덕이며 속삭였다. \"아주 중요한 순간이야.\" 그는 시미그위를 연단으로 밀어 올렸다. 나첼니크는 연설을 시작했다. 그것은 이전의 어느 연설보다 생동감 있었고, 청중의 관심을 끌었다. 그러나 모든 것이 제자리에 있는 것처럼 보였으나, 대통령으로 임명된 사람을 발표하는 순간 모든 것이 뒤집혔다.\n\n\"...새로 만들어진 대통령직은 이그나치 비트키에비치가 맡게 될 것입니다! 우리는 함께 강력한 폴란드를 만들어갈 것입니다!\"\n\n코츠의 얼굴은 백지처럼 창백해졌다. 군중은 침묵에 잠겼다가 일순간 마치 화산처럼 폭발했다. 외침, 속삭임, 비명 그리고 박수 소리가 뒤섞였다. 가장 먼저 일어난 사람은 비트카치였고 그는 자신의 성공을 자축하기 시작했다. 그는 당황한 젊은 민족주의자들 사이로 들어갔고 이에 스타니스와프 수칼스키는 얀 스타흐니우크를 당혹스럽게 만들정도로 '비트카치! 비트카치! 비트카치!'를 외치기 시작했다. 꿀처럼 달콤한 말이 폴란드 원수의 귀에 흘러들어갔다. 시미그위는 이제 되돌릴 수 없음을 알았지만 비트카치는 자신의 자존심에 불을 지폈다. 그는 나폴레옹과 동등한 위치에 서고 싶어 했다."
 poland.5.a:0 "프랑스처럼 끝나지 않아야겠지만 말야."
 poland.6.t:0 "벨제부브의 소나타"
 poland.6.desc:0 "코스마는 열아홉 살의 시인이었다. 그는 때때로 프랑스에서 자발적인 희생 제의에 관한 기이한 이야기를 들은 적이 있었다. 그런 이야기는 그 자체로도 믿기 어려운 일이었지만 그런 일이 폴란드에서 벌어진다는 것은 더더욱 상상할 수 없는 일이었다. 이러한 맥락 속에서 그가 초대받은 무도회의 진정한 성격을 알 리는 없었다. 그는 약속된 장소에 도착해 눈에 띄지 않는 입체주의적 양식의 건물로 들어갔다. 문을 열고 들어서자마자 그는 코와 눈을 가리는 하얀 가면을 쓸 것을 요구받았다. 손님들의 복장은 현대적이면서도 지나치게 화려했지만 무언가 이 가면들이 오늘날보다는 18세기에나 어울린다는 느낌을 강하게 주었다.\n\n그는 홀로 들어섰다. 그리고 원시적인 춤을 추며 리듬에 맞춰 얽혀 있는 나체의 몸들을 보았다. 이것은 단순한 난잡한 장면이 아니라 하나의 춤이었다. 위를 올려다보던 그는 검은 타원형 가면을 쓴 한 여인이 자신에게 다가오는 것을 보았다. 그녀는 입을 열었다. \"즐기고 있니, 꼬마야?\"라고 말했다.\n\n그녀의 목소리는 단단했지만 동시에 관능적이고 비단처럼 부드러웠다. 그는 그 자리에서 얼어붙었다. 여인은 웃음을 터뜨리고는 그를 향해 키스를 날리며 자리를 떠났다. 잠시 후 그는 그 목소리를 알아챘다. 그것은 조피아 스트리옌스카였다. 그는 얼굴이 붉어졌다. 그녀는 마흔다섯 살이었다. 아기 예수를 그린 화가가 이런 일에 연루되는 것은 적절하지 않았을텐데 말이다. 그 순간 또 다른 목소리가 무대에서 들려왔다. 훈련받은 개들처럼 모든 사람들이 목소리가 나는 쪽으로 고개를 돌렸다.\n\n\"신사 숙녀 여러분! 여러분은 몸의 가장 순수한 관능과 최고의 경지를 경험하셨습니다. 이제 영혼을 흔들어놓을 연극에 초대받으십시오!\"\n\n그것은 라디오에서 들었던 비트카치였다. 냉소적이고 무관심한 그는 라디오에서 국민들에게 선언문을 낭독할 때마다 마치 영혼이 고통받는 듯한 목소리로 들렸다. 그러나 여기서 그는 완전히 다른 사람처럼 보였다. 연극은 시작되었다. 유제프 피우수트스키의 초상화에 관능적으로 사랑에 빠진 폴란드 군단병이 그의 이름으로 피우메 해적들과 함께 투아투아 섬을 정복하려는 이야기가 전개되었다. 공연이 끝난 후 코스마는 변화를 느끼며 미친 춤에 합류했다. 결국 모든 것에 지친 그는 바닥에 쓰러져 마치 죽은 듯한 기분이 들었다.\n\n그러나 다음 날 아침 그의 방에서 깨어났을 때, 그가 가장 먼저 본 것은 순백색의 봉투였다. 그는 그것을 열어 읽었다.\n\n\"친애하는 코스마 X씨! 저는 이러한 향연이 당신에게 어울리지 않는다고 판단했습니다. 당신은 추악하고 구역질나는 속물의 영혼을 가졌기 때문입니다. 당신은 다시는 초대받지 못할 것입니다. 우리는 당신이 우리를 더럽히는 것을 원치 않습니다! 개같은 하루 보내세요!\"\n\n\"-비\"\n\n코스마는 충격을 받았다. 그는 마치 하늘에서 떨어져 신비롭고 외설적인 것과의 연결을 잃은 기분이었다. 그는 낙원에서 추방당할 운명에 처한 것 같았다."
 poland.6.a:0 "그저 눈물을 흘릴 수 밖에."
 poland.7.t:0 "드 메스트르보다 저명한"
 poland.7.desc:0 "“참으로 흥미롭군요. 모든 문화에는 홍수 신화와의 어떤 연결점이 있죠. 마오리족, 호주 원주민, 아즈텍, 잉카까지도요. 우리 모두는 어떤 특정한 감정으로 하나가 되어 있습니다. 그리고 그 감정은 예술, 바로 내 예술과의 교감을 통해 끌어낼 수 있습니다! 내 예술은 인류 전반에 홍수처럼 퍼질 겁니다!”\n\n아르토는 이그나치 비트키에비치에 대해 어떻게 생각해야 할지 몰랐다. 시끄럽고, 불쾌하고, 참을 수 없을 정도로 과장된 사람이었다. 하지만 한 가지는 예상과 달랐다. 그가 많이 들었던 냉소주의의 부재였다. 물론 ‘부재’라는 표현은 틀렸다. 비트카치는 극단적인 냉소주의자였으니까. 그는 아르토와 연극에 대해 논쟁하며 ‘잔혹극’이 단순한 속임수에 불과하다고 주장했다. 자신의 이론의 원초성을 시연하기 위해 바닥에 몸을 던지며 여러 주파수의 큰 소리를 냈다. 그러나 그 냉소주의는 어딘가 밝고 덜 악의적이었다.\n\n“그리고, 비트카치씨... 당신은 그 형이상학적인 감정을 어떻게 이끌어낼 생각인가요? 당신이 도입하려는 반동적 혁명은 파리 코뮌보다는 루이 14세에 더 가깝군요!”\n\n바타유는 은근히 미소를 지으며 때때로 아르토를 힐끗거렸다. 마치 그가 멕시코적 요소에 대해 들을 때 느꼈던 것처럼 보였다. 그때 폴란드인 비트카치는 식탁 위로 펄쩍 뛰어올라 저녁 식사 후 남겨진 접시들을 떨어뜨리고는 예언자처럼 양팔을 벌렸다.\n\n“바타유! 당신의 그 오렌지색 뇌 뭉들의 통합 비전이 완벽하다고는 믿기 힘들군요! 나는 당신의 책을 읽었고, 당신이 말하는 공산주의적 에너지 폭발이 내가 추구하는 것과 크게 다르지 않다는 것을 깨달았소! 새롭게 자발적으로 형성되는 에로틱-경제적 춤 속에서 해방된 욕망 말이오! 내가 말하는 바는 나, 아르토 씨, 당신, 그 집시 괴짜 샤이타노프, 달리, 그리고 브르통 씨가 생각보다 훨씬 더 많은 공통점을 가지고 있다는 겁니다! 그리고 안드레 로베르는 어디 있소? 벨베데레에서 회의를 위해 그를 초대한 건 이유가 있어서요! 우리는 드 메스트르보다 더 저명하고, 버크보다 더 위대하다오!”\n\n아르토가 입을 열었다.\n\n“브르통이 말하길, 당신은 반동주의자라더군요. 그와 연락하려고 하면 배척당할 수도 있겠지만-”\n\n“젠장할! 내가 대사를 보내서 그의 저택 창문에 주먹질을 하게 해서라도 그를 만나게 하겠소! 그리고 얼굴을 보자마자 그에게 직접 꺼지라고 말해 줄 거요. 내가 조르주 씨처럼 마르크스 추종자는 아닐지라도, 나는 반동주의자가 아니오! 나는 근본적으로 볼셰비키요! 나는 과거에 의 지에르진스키와 캅카스 특사에 참여해 내 손으로 몇 놈을 죽이기까지 했소!”\n\n그는 탁자에서 뛰어내려 부츠를 쿵쿵 울리며 머리 위로 손뼉을 쳤다. 그러고 나서 흥분한 듯 외쳤다.\n\n“그리고 이제, 신사 여러분, 소화를 돕기 위해 산악인 음악에 맞춰 춤을 춰 보자고 제안합니다!”\n\n그는 갑작스럽게 그들의 손을 붙잡고 악마적인 광란 속에서 함께 빙글빙글 돌기 시작했다. 아르토는 여전히 이 불가사의한 인물에 당황하고 있었지만, 그와의 만남이 야생적이면서도 즐거웠음을 부정할 수 없었다. 그 역시 헬리오가발루스의 힘을 여전히 믿는 유일한 사람이 아니라는 사실에 안도했다."
 poland.7.a:0 "완전한 시로군."
 poland.8.t:0 "위험한 신사들"
 poland.8.desc:0 "시미그위는 집안으로 들어섰다. 갑자기 누군가 비명을 질렀다. 그는 급히 거실로 달려 보니, 그곳에는 대통령 이그나치 비트키에비치, 야당 인사였던 보이 젤렌스키, 그리고 정부 장관인 브로니스와프 말리노프스키가 있었다. 시미그위는 모자를 벗고 젤렌스키를 손가락으로 가리켰다.\n\n“여기서 뭐하고 있는 거야? 그리고 너는 대체 뭘 하고 있는 거야? 혹시 비밀 회의라도 여는 건가? 젤렌스키는 아방가르드 조합(Kombinat Awangardzistów)과 함께 일하고 있잖나. 그놈들은 빌어먹을 공산주의자들이라서 우리를 증오한다고.”\n\n세 사람은 서로를 바라보다가 갑자기 웃음을 터뜨렸다. 그들은 시미그위에게 와서 함께하라고 손짓했다. 시미그위는 한숨을 쉬고 눈을 굴리며 마지못해 자리에 앉았다. 비록 그가 게임에 참여하기를 꺼렸지만 의외로 꽤 잘하고 있었다.\n\n“당신들은 성직자들의 역할을 좀 더 제한해야겠어. 당신들 같은 혁명가들이 있는 나라에서조차 낙태 하나 제대로 할 수 없다니.”\n\n“합법화될 건 합법화된 거요. 이제 쓸데없는 소리는 집어치우시오. 가난하면 일이나 생각해야지, 맨날 섹스나 하고 있을 수는 없소. 못생기고 가난한 사람들의 섹스는 아예 금지해야 하오.”\n\n비트카치는 중얼거리며 다시 게임에 집중했다. 그러다 갑자기 카드들을 던지더니 모두가 놀란 가운데 테이블을 떠나 찬장으로 향했습니다. 그는 페요테(peyote)를 꺼내 말리노프스키, 젤렌스키, 그리고 시미그위에게 건넸다. 폴란드의 원수는 눈썹을 치켜올렸다.\n\n“이게 뭐지?”\n\n“페요테라는 거요. 인디언 약물인데, 형이상학적 세계로의 접근 수단이지요.”\n\n시미그위는 잠시 망설였으나, 작가들의 설득과 가벼운 격려에 결국 약을 복용했다. 곧 그의 청각과 시각이 강렬하게 자극되며 풍부한 공감각적 경험이 펼쳐졌다. 약물의 영향으로 비트키에비치는 카드를 보며 깊은 사색에 잠겼다.\n\n“앙토냉 아르토... 그는 우리 시대의 가장 위대한 사상가요! 아니! 그는 신과 동등한 존재요. 아르토는 칼키가 되고, 칼키는 아르토가 됩니다. 그는 1789년 혁명을 끝내고 정신의 혁명을 시작할 겁니다! 그는 서구 문명을 구원할 거요!”\n\n“아르토라니, 약해빠진 놈이지. 찬양할 거라면 아폴리네르나 넝제세, 콜리, 혹은 단눈치오를 찬양하라고. 그도 좀 괴상하지만, 어쨌든 그들이야말로 1934년 정변의 진정한 건축가들이지.”\n\n시미그위는 바닥에 침을 뱉었다. 비트카치는 약물의 영향으로 들개처럼 으르렁거리며 벌떡 일어났다. 그는 목소리를 높이며 카드를 올려둔 테이블을 뒤엎었다.\n\n“이 집에서 앙토냉 아르토를 모욕하는 자는 용서하지 않는다네! 그의 이름은 신성하오! 그리 확신이 있다면, ‘멍청한 얼굴 대결’을 제안하지.”\n\n시미그위는 이를 드러내며 “좋지.”라고 대답했다. 여기서 비트카치가 말한 ‘얼굴’이란 풍자화 그리기를 뜻했다. 두 사람은 서로 마주 보고 섰고, 말리노프스키와 젤렌스키가 지켜보았다. 약 한 시간쯤 지나 두 사람은 거의 동시에 그림을 완성했다. 말리노프스키가 시미그위의 작품을 힐끗 보았다.\n\n“내 생각엔 시미그위가 이겼소. 비트카치 씨의 특징을 잘 포착했군요.” 비트카치는 짜증이 난 듯 코를 킁킁대며 발을 구르다가, 시미그위가 미소 짓고 있는 모습을 보고 기분을 풀었다. 그러고는 밝아진 표정으로 말했다."
 poland.8.a:0 "“좋아, 이번엔 네가 이겼군. 하지만 다음에는 쉽지않을꺼라고.”"
 poland.9.t:0 "네에로에서 히어로로"
 poland.9.desc:0 "평범한 하루였다. 그러나 스타니스와프 이그나치 비트키에비치는 무언가 이상하다는 느낌을 받았다. 그는 카르파티아 산맥 위로 떠오르는 태양을 바라보며 미소를 지었다. 이 기분이 그에게는 공포로 다가왔다. 그는 아침 식사를 위해 자리에서 일어났다. 최대한 단순하고 지루하게 식사를 준비하려 했으나 프랑크푸르트 소시지와 스크램블 에그, 빵을 마련했다. 잔에 압생트를 따르고 식사를 시작했다. 두 번째 한 입을 먹고 나서 그는 갑자기 멈췄다. 그는 음식을 즐기고 있었다. 식사에서 느껴지는 기쁨이 그를 짜증 나게 했다. 그는 화가 치밀어 올라 접시를 벽에 던져버렸다. 압생트가 담긴 잔을 집어 들고 던지려다 멈추고는 그 내용물을 단숨에 마셨다. 그는 전화기로 다가가 시미그위에게 전화를 걸었다.  \n\n“시미그위! 빨리 와! 나에게 무슨 일이 일어나고 있어! 젠장, 도와주게나!”\n\n“곧 갈 테니, 의사나 불러.”\n\n시미그위는 전화를 끊었다. 그러나 비트키에비치는 의사가 아닌 다른 사람에게 전화를 걸었다. 시미그위는 기차를 타고 몇 시간에 걸쳐 자코파네에 도착했다. 자코파네 스타일로 지어진 문을 두드리자 아르투르 마리아 스비나르스키가 나와 문을 열어주었다. 그는 말없이 시미그위를 집 안으로 안내했다. 시미그위가 문을 닫고 안으로 들어가자 창가에 앉아 있는 비트카치가 보였다. 시미그위는 자리에 앉아 비트카치를 바라보았다. 그는 생각에 잠겨 있었다. 에드워드가 다짜고짜 물었다.  \n\n“그래서 대체 뭐가 문제란 말야?”\n\n“난 1939년에 죽었어야 했어. 돼지처럼 정맥을 잘라 피를 흘리며 말이지. 난 도둑맞은 시간 속에 살고 있는 기분이야. 폴란드인들이 잘 되어가는 게 기쁘고, 인생이 기뻐. 그런데 그게 날 미치게 만들어.”\n\n스비나르스키가 비웃듯 코웃음을 쳤다. 비트카치는 무거운 시선으로 그를 응시하더니 이를 악문 채 으르렁거리며 소리쳤다.  \n\n“네가 좀 도움이 될 수도 있겠군, '녹아웃’ 양반! 내가 네 이빨을 전부 쳐서 날려버리기 전에 차나 좀 가져오라고!”\n\n스비나르스키는 조용히 나가버렸다. 비트카치도 잠시 침묵했지만 곧 다시 소리쳤다.  \n\n“그리고 디에틸 에테르도 좀 가져다줘!”  \n\n시미그위는 재미있다는 듯이 비트카치를 바라보았다. 이렇게 호들갑을 떠는 것이 짜증 나면서도 우스웠다. 그는 천천히 입을 열었다.  \n\n“이그나시! 혹시 네가 그저 건강한 애국자라서 친구들을 신경 쓰는 것 아닐까?”\n\n“닥쳐, 이 흙 퍼먹는 기름범벅 군인놈이 뭘안다고! 난 좋지 않아! 난 씨발! 악마적이란 말이다고!”\n\n비트카치는 의자에서 벌떡 일어났다. 그러나 시미그위가 여전히 웃고 있는 모습을 보자 이내 진정하고 다시 자리에 앉았다. 시미그위는 말했다.  \n\n“성공을 즐기는 것에 뭐가 문제란 말야? 너도 아르토처럼 되고 싶어 했잖아. 어쩌면 그를 능가했을 수도 있어. 우린 그 러시아 놈들에게 본때를 보여줬고 그새끼들이 들어가있을 쓰레기통으로 쳐박아주었지. 난 네 기이한 행동들을 다 좋아하는 건 아니지만, 전 세계가 너를 보며 환호하고 있어. 붕고(Bungo) 넌 서구 문명을 구했어. 성공했고 그로써 인정받았고. 그게 좋은 느낌 아니겠나?”"
 poland.9.a:0 "“아… 그렇지. 기분이 좋긴 한데.” 비트카치는 주저하며 대답했다.  "
 poland.10.t:0 "옛날 옛적에 바르샤바에서는"
 poland.10.desc:0 "시미그위는 한 카페에서 커피를 마시고 있었습니다. 그는 음모를 꾸미고 있었고 두 달 뒤에 군대를 동원해 정변을 일으킬 계획이었지요. 스와베크를 자택에 연금하고 나면 스와베크는 스스로 목숨을 끊게 될 것이니까요. 시미그위는 이 생각에 스스로 미소를 지으며 커피잔을 들어 입술에 가져갔습니다. 그 순간 잔 너머로 코트와 모자를 쓴 남자가 자신에게 다가오는 것을 보았습니다. 말을 꺼내려던 찰나, 낯선 남자가 먼저 입을 열었습니다.\n\n“좋은 아침입니다, 선생님... 성함을 여쭤봐도 될까요?”\n\n“에드워드 리츠-시미그위요. 열병식에서 날 봤어야지!”\n\n“아, 당신이 시미그위 씨였군요. 실례했습니다.”\n\n남자는 말을 하며 주머니에 손을 넣어 무언가를 꺼냈습니다. 시미그위는 아무런 위화감을 느끼지 못했습니다. 아마도 사인을 받으려는 것일 거라고 생각했지요. 그는 언론에서도 잘 알려진 인물이었으니까요. 그러나 남자가 꺼낸 것은 손수건이었습니다. 빨간색과 흰색이 섞인 손수건에는 금색으로 “E.R-Ś”라는 이니셜이 새겨져 있었습니다.\n\n“이걸 여쭙는 이유는, 손수건을 잃어버리신 것 같아서 돌려드리려고 했기 때문입니다.\"\n\n시미그위는 그런 손수건을 본 기억이 없었습니다. 그러나 혹시나 자신이 잊어버린 것일 수도 있다고 생각했죠. 그는 손수건을 받아 앞코트 주머니에 넣었습니다. 그는 바지에서 지갑을 꺼내 원수 피우수트스키의 초상화가 새겨진 2레흐 지폐 두 장을 꺼냈습니다.\n\n“받아서 좋은 거나 사드쇼… 그런데, 당신 이름이 뭐요?”\n\n“로만 쿠흐치아크입니다.”\n\n남자는 지폐를 받아들고 모자를 살짝 들어 인사했습니다. 시미그위는 그가 카페를 떠나는 것을 보고 다시 커피를 마시기 시작했지만 뭔가 찜찜한 기분이 들었습니다. 그는 순간 얼어붙었다. ‘쿠흐치아크’이라는 이름은 우치 출신의 생디칼리스트 테러리스트의 이름이었습니다. 그는 자리에서 벌떡 일어났으나 이미 늦어버렸죠. 로만이 카페를 나서며 창가에 세워진 자동차 쪽으로 신호를 보냈고 그 신호를 받은 남자들이 창문을 통해 카페 안으로 총을 쏘기 시작했습니다. 시미그위는 총알 세례를 맞고 온몸이 관통당해 그 자리에서 쓰러져 즉사했습니다.\n\n며칠 후, 죽음 후사르의 지도자 유제프 워키에테크, 공안부 장관 우카시 시에미옹트코프스키, 그리고 펠릭스 지에르진스키가 어둡게 빛나는 나첼니크 발레리 스와베크의 사무실에 보고를 위해 나타났습니다. 스와베크는 그들을 보자 책상 아래에서 가방을 꺼내어 열었습니다. 그 안에는 수만 레흐 지폐가 들어 있었지요.\n\n“임무를 잘 수행하였군... 좋은 거나 사드시게.”\n\n시에미옹트코프스키와 워키에테크는 경례를 하고 가방을 들고 나갔습니다. 그들은 가방 안의 돈을 어떻게 나눌지에 대해 이야기했죠. 지에르진스키는 자리를 지켰습니다. 스와베크는 눈썹을 치켜올리며 물었습니다.\n\n“자네는 인센티브가 필요없나?” 그에 지에르진스키는 짧게 답했습니다."
 poland.10.a:0 "“조국의 영광이 내 보수고, 공산주의자는 잔돈 따윈 받지 않습니다.”"
 poland.11.t:0 "베델 인민 공화국"
 poland.11.desc:0 "얀 베델 씨는 사회주의로 인해 모든 것을 잃어버린 듯 보였습니다. 그러나 실제로는 그렇지 않았습니다. 그의 부모가 대대로 소유했던 제과 공장이 국유화된 후, 베델 씨는 관리자로 재고용되었고 노동조합 회의에서 최고 경영자의 자리에 올랐습니다. 그가 지난 몇 년 동안 직원들을 잘 대해온 덕분에, 직원들이 그에게 보답을 해 준 것이었습니다. 정부의 자금 지원을 받아 그는 즉시 생산 공정을 기술적으로 전환하기 시작했습니다. 마리안 마주르, 오스카르 랑게, 알렉산드르 보그다노프씨가 개발한 기법을 활용하여 생산 관리 체계를 혁신할 수 있었습니다. 다만, 생산에 컴퓨터를 처음 도입한 사람은 베델 씨가 아니었습니다. 그 선구자는 볼레스와프 피아세츠 씨로, 자드루가와 협력하면서도 독자적으로 INCO-Veritas S.A.라는 회사를 설립했습니다. 피아세츠키 씨는 \"루드비크 머스마야 냄비닦아라!\"라는 성별 고정관념을 깨는 슬로건을 통해 세탁 세제 '루드비크'를 성공적으로 마케팅하여 상점 선반을 가득 채웠습니다. 웨델 씨는 특히 값싼 노동력을 확보한 피아세츠키 씨를 부러워했습니다. 피아세츠키 씨는 사나치아 정권의 억압으로 인해 다른 곳에서 일자리를 구하지 못했던 사제-노동자와 반체제 인사들을 고용할 수 있었습니다. 베델 씨는 이와 같은 기회를 놓친 것에 아쉬움을 느끼면서도 자신만의 독창적인 혁신을 도입하는 데 성공했습니다.\n\n그는 국가 자산부 장관 옝제이 모라체프스키 장관과 내무부 장관 펠리찬 스와보이-스크와트코프스키 장관을 공장으로 초대하여 자신이 만든 과자를 맛보시도록 했습니다. 베델 씨는 두 분을 환영하며 원형 방으로 안내했습니다. 그 방에는 실시간 정보가 표시된 화면들과 즐겁게 울리는 컴퓨터들이 있었습니다.\n\n“EW 베델 본사 및 공장에 오신 것을 진심으로 환영합니다! 두 분을 만나 뵙게 되어 매우 기쁩니다. 이제 공장의 기능을 소개해 드리겠습니다!”\n\n스크와트코프스키 장관님과 모라체프스키 장관님은 베델 씨와 몇 마디 친절한 인사를 나누셨습니다. 직원들과도 대화를 나누셨는데, 직원들은 웨델 CEO를 극찬했습니다. 경제에 대해 전문적 지식이 없었던 스크와트코프스키 장관님께서는 과자가 놓인 조립 라인의 빠른 속도에 깊은 인상을 받으셨습니다. 반면 사회주의 경제에 정통하셨던 모라체프스키 장관님께서는 여전히 회의적이셨습니다. 통계를 들으시면서 따뜻하지만 쓴맛이 나는 코코아를 마실 수 있었습니다. 마침내 그들이 통제실로 돌아왔을때 베델이 말했습니다. 마침내 두 분이 다시 통제실로 돌아오셨을 때, 베델 씨가 말씀드렸습니다.\n\n“… 생산 효율이 400% 증가했음을 발표하게 되어 기쁩니다. 우리의 혁신적인 신제품 - 조유(Bird’s Milk) 입니다! 부드러운 마시멜로를 초콜릿으로 코팅한 맛있는 제품입니다. 과잉 생산 덕분에, 모든 직원이 한 상자씩 받을 수 있다는 점을 덧붙이겠습니다.”\n\n웨델 씨는 두 장관님께 과자를 드렸고, 두 분이 맛을 보신 후 모라체프스키 장관님의 회의적인 태도는 사라졌습니다. 장관님께서는 입술을 살짝 핥으시며 말씀하셨습니다.“정말 맛있군요. 더 많은 자금을 지원해 드리겠습니다.”"
 poland.11.a:0 "입안에 천국이었지"
 poland.12.t:0 "맘껏 잡수세요!"
 poland.12.desc:0 "보지다르는 진짜 폴란드 음식을 파는, 진짜 폴란드식 식당의 창문 너머를 바라보고 있었다. 그는 길 건너편 이웃 식당이 경찰 단속을 받아 영업 정지를 당한 사실에 내심 기뻐했다. 그 이웃 식당은 폴란드가 외교 관계를 맺은 라이베리아, 북아프리카, 마다가스카르 국가들 에서 영감을 받은 음식을 팔고 있었는데, 타데우시 지에두시츠키가 추진한 최신 정책이 “폴란드 식문화를 모독하는” 요리를 금지했기 때문이었다. 연합회복권의 정책은 폴란드 백인 인종의 “순수성”을 지키기 위해 특정 요리를 금하는 것이었지만, 보지다르 씨는 그러한 인종 정책에는 별로 관심이 없었다. 어차피 그도, 이웃도 백인이었고, 그저 경쟁자가 사라진 것이 좋았을 뿐이었다. 완화된 규제로 식당을 확장해 더 많은 관광객을 받을 수 있게 되었으나, 이번엔 산악지방에서 온 사람들까지 그디니아에 몰려들어 또 다른 경쟁자가 생겨났다. 보지다르 씨는 자신을 괴롭히는 이 '군상'을 속으로 욕했지만…. 곧 다시 기운을 내며 미소 지었다. 그리고 가게 안에서 연주하던 밴드 쪽으로 몸을 돌렸다.\n\n“재즈! 재즈곡 하나 기깔나게 뽑아주쇼!”\n\n그런 다음 손님들을 향해 시선을 옮기며 크게 웃음 지었다.\n\n“모두 모여서 건배하자고! 티스키에 맥주 한 병씩, 서비스로 주겠네!”\n\n손님들은 환호성을 질렀다. 국가가 제공하는 중앙 계획 자본주의 보조금과 줄어든 경쟁 덕분에, 보지다르 씨는 이런 ‘호기로운’ 묘기를 할 만한 여유가 있었다. 내일이면 수염을 뜯으며 후회하게 될지 몰라도, 오늘만큼은 자신의 이름을 부르며 건배를 올리는 고객들을 보며 만족했다. 그러나 그의 행복은 오래가지 않았다.\n\n음악가들이 술기운을 좀 올렸는지, 연주가 점점 거세졌다. 그들은 더 이상 기량을 숨기지 않고 소리를 높여 연주했는데, 너무도 시끄러웠다. 마침 바로 옆 가게를 수사하던 경찰들도 그 색소폰 소리를 듣고 말았다. 잠시 전까지 음악에 맞춰 춤을 추던 보지다르 씨는 곁눈질로 경찰 한 명이 자기 식당 쪽으로 다가오는 광경을 목격했다. 그는 재즈 또한 인종 위생법에 의해 금지되어 있었다는 사실을 깜빡 잊고 있었다. 얼굴이 새파랗게 질린 그는 오케스트라를 향해 연주를 멈추라고 고함지르며 악기를 빼앗으려 했지만 때는 이미 너무 늦어버렸다. 술에 취해 음악에 빠져 있던 그들이 사태를 알아차렸을 때는, 젊은 경찰관 한 명이 문턱에 발을 디디고 있던 상황이었다. 문이 열리며 문 위쪽에 달린 방울이 요란스레 울렸고, 경찰관은 당당한 목소리로 말했다."
 poland.13.t:0 "반동 꼽추 난쟁이와 타이탄"
 poland.13.desc:0 "카지미에시는 ‘아버지 타시엠카’라 불리는 우카시 시에미옹트코프스키의 부하 중 한 명이었다. 그는 폴란드 군단 출신의 한 참전용사를 무자비하게 구타한 죄로 베레자 카르투스카 격리 수용소에 들어가게 되었다. 피해자가 참전용사가 아니었다면 단순한 경범죄로 취급될 수도 있었겠지만, 이번 사건은 살아 있는 폴란드의 상징에 대한 공격으로 간주되어 형이상학적인 의미가 덧씌워졌다. 그렇다고 카지미에시가 불평을 한 것도 아니었다. 오히려 그는 이것을 여행처럼 즐기며 벨라루스 시골 풍경을 만끽했다. 흐라마다 쪽에서도 이곳을 알고 있었지만, 그들 나름의 큰 ‘죄’ 때문에 이 사실이 알려지는 것을 두려워했습니다. 카지미에시는 각종 흥분제에 접근할 수 있었고, 수용소의 보조 의사로 일하게 되었다. 일을 기피하다가 채찍으로 다섯에서 많게는 쉰 번까지 얼굴을 얻어맞는 다른 수감자들을 본 뒤로는, 그는 일을 절대 피하지 않았다. 그리 일이 많지도 않았던 터라 주어진 임무를 착실하고 철저히 해치웠다. 남는 시간은 토론이나 대화, 여러 가지 숙고로 보냈다. 그가 간수들로부터 들은 바로는, 이곳은 인테르마리움 전역에 흩어져 있는 다수의 전초 기지 중 하나라고 했다. 하지만 간수들은 자부심 가득하게 여기야말로 흐라마다와 사나치아가 협력하여 가장 먼저 설립된 곳이라고 주장했다. 벨라루스에서 가장 폴란드에 회의적인 세력들조차도 이 수용소의 실상을 폭로하기를 꺼렸는데 그 이유는 그들이 꺼리는 정치적 반대파들이 득세할 수도 있었기 때문이다.\n\n한 소년, 젊은 민족 민주주의 운동가는 놀랍게도 어린 우크라이나 민족주의자들과 함께 콘크리트 바닥이 깔린 차가운 감방에 있었다. 그는 그들에게 가까이 가지 않았는데 유대인 마피아 조직원 취급을 받을까 두려웠기 때문이었다. 그렇지만 그 우크라이나 청년들이 나누는 이야기를 엿들어 보니 이 민족 민주당원은 두 가지 법률 위반 행위로 베레자에 왔다고 했다. 바로 유제프 피우수트스키의 이름을 모독한 죄와 피우수트스키를 복되었다고 숭배하는 마리아비테 교회 신도를 모독한 죄였다.\n\n수용소의 ‘재교육’ 방식은 다양한 형태를 띠었다. 일부 수감자는 사나치아 활동가와 가까운 이들이라 단지 책을 읽기만 하면 되었는데 그것도 대부분 본인들이 직접 쓴 책이었다. 또 다른 사람들은 규율에 따라 곤봉으로 자주 맞았고, 교육 프로그램의 효과가 없다고 판단되면 수용 기간이 연장되었다. 가장 극단적인 경우를 본 적이 있는데, 어느 간수가 어린 소년에게 자신의 구두를 핥으라고 명령한 뒤 변소 청소를 시키는 모습이었다. 그 장면이 기억에 각인된 것은, 그 간수가 “이 반동 꼽추 난쟁이 같으니! 너는 지금 사나치아의 타이탄 앞에 서 있다!” 하고 고함쳤기 때문이었다. 카지미에시는 그 곤봉 학대를 당한 몇몇 이들을 치료해 주었다.\n\n비록 그들을 조금은 동정했지만, 솔직히 그들의 운명에 깊이 신경을 썼다고 말하기는 어려웠다. 카지미에시는 어디까지나 피우수트스키에게 충성하는 사람이었기 때문이다. 다만 그곳에서 풀려나온 뒤로는 아버지처럼 보살펴주는 것 같았던 피우수트스키 초상의 시선이 자기에게 더 매섭고 비난하는 듯하게 느껴졌다. 마치 그 그림이 꾸짖는 눈길을 보내는 듯해서, 그는 더 이상 도둑질을 하지 않았다. 다시 베레자에 끌려가고 싶지 않았기에 그저 ‘착한 시민’으로 돌아가 살았다."
 poland.13.a:0 "헤이! 헤이! 베레자에서는 물과 빵으로만 살아간다고"
 poland.14.t:0 "도시화의 길 잃은 새끼"
 poland.14.desc:0 "마리우시는 녹초가된 채로 터덜터덜 걸어갔다. 건설 현장의 먼지에 뒤덮여 있었지만, 손으로 대충 슥슥 털어내 옷차림을 어느 정도 정돈했다. 그는 L-LOP 확장 공사, 정확히는 대학교와 연구 시설 옆에 세울 새 학생 기숙사 건설 작업 후 잠시 휴식을 취하러 가는 중이었다. 따분한 노동에 지쳐 있었고, 자동화된 바 믈레츠늬에서 간단히 식사를 하며 쉬고 싶었다. 그 때 일만큼이나 동료들의 성가신 말들도 귀에 거슬렸다. 그들은 그의 붉어진 피부와 땀, 그리고 쉽게 화를 내는 태도에 대해 끊임없이 지적했다. 어쩌면 마리우시 본인도 지나치게 과장되게 행동했던게 아니라 실제로 몸 상태가 좋지 않았던 것 같다. 그렇지만 그는 진통제를 먹고 다시 일하러 돌아가면 된다고 생각했다. 샌드위치 자판기 앞에 다다른 그는 한숨을 쉬었다. 유리창 너머로 보니, 정말로 얼굴이 붉게 상기되어 있었고 팔의 감각도 잘 느껴지지 않았으며, 머리까지 아팠다. 그래도 근무를 마치고 나서야 병원에 갈 생각이었다. 마리우쉬는 이마의 땀을 닦고 50그로시 동전을 자판기에 넣었다. 회전판이 멈추고 히터가 꺼지자 그는 샌드위치를 꺼낼 수 있었다. 그러다 그는 맥주를 마실 기회를 발견했고 어깨를 으쓱하고는 딕시 컵을 집어 들었다. 미국에서 발명된 일회용 컵이었다. 컵을 자판기에 올려놓고, 1레흐 동전을 넣은 후 버튼을 눌렀다.\n\n그는 나무 그늘에 놓인 벤치로 가 샌드위치와 맥주를 먹기 시작했다. 너무도 과로한 이 청년은 배가 고팠지만 속이 메스꺼워거려 음식을 삼키기가 어려웠다. 간신히 샌드위치를 위장으로 우겨넣고는 종이컵에 든 맥주도 마셨다. 마리우쉬는 벤치에서 일어나 건설 현장으로 돌아가려 했다. 갑자기 세상이 빙빙 도는 듯 어지러웠다. 담배 한 대 태우면 좀 나아질 것 같아 그는 담배를 물고 불을 붙였다. 그리고 몇 걸음 걷다가 비틀거리더니 그대로 쓰러져 버렸다.\n\n그로부터 몇 시간 동안 마리우쉬는 의식을 잃은 채 중태로 누워 있었다. 두 명의 의사가 그를 살펴보고 있었는데, 곧 뇌종양 수술이라는 어려운 과제를 앞두고 있었다. 나이가 많은 의사가 환자를 내려다보며 말했다.\n\n“이 머저리가 하루에 한 갑씩이나 피웠다고… 보편사회기구가 담배 제조에 대한 강력한 규제를 도입한 것은 다행이지. 나는 그 똥같은것은 손도 대지 않는다고.”\n\n젊은 의사는 코웃음을 치더니, 낡은 카멜 담배 갑을 꺼내어 상대방 의사 눈앞에서 놀리듯 흔들어 보이고는 킥킥겨렸다.\n\n“그래서 선생님이 그렇게 여성스러우신거라구요. 담배는 누구나 피울 수 있는 거죠. 건강이 어떻든 간에요~.”\n\n그는 마지막 문장을 노래하듯 장난스럽게 읊조리고는, 뒤돌아서면서 중얼거리듯 흥얼거렸습니다. 라디오에서 들었던 여러 담배 브랜드의 광고 문구였다."
 poland.14.a:0 "핀다, 폈고, 필 꺼다. 계속."
 poland.15.t:0 "파인애플과 크랭크"
 poland.15.desc:0 "“…오, 기독교여, 유럽에서 너만이 고대로부터 오지 않았도다. 유럽에서 가장 현대적인 이는 바로 교황 비오 10세 당신이시다…”\n\n라디오 아나운서는 기욤 아폴리네르의 시 ‘조나(Zona)’ 의 한 구절을 낭송하며 방송을 마무리했습니다. 그리고 짤막한 논평을 덧붙였다.\n\n\"실제로 지금 가장 현대적인 사람은 교황님이십니다. 그는 아르디티의 기술 혁신을 직접 피부로 경험하고 계시죠. 토마소 마리네티가 콜로세움을 콘크리트 활주로로 개조해 공항으로 만들 계획을 세웠다는 이야기를 들었습니다. 성 베드로 대성당에 대해서도 어떤 계획이 있을지 궁금하군요.\"\n\n아나운서는 스스로의 농담에 피식 웃더니 계속 진행했다.\n\n\"현재 약 2백만 명의 청취자가 함께하고 있습니다. 이제는 실험적인 음악이 아닌 좀 더 익숙한 오케스트라 연주를 들으실 수 있겠습니다. 잠시 후 다시 찾아뵙겠습니다. 광고가 나간 후 뵙겠습니다.\"\n\n\"이스라엘 정부 및 이탈리아령 아비시니아와의 협력 체결에 따라, 그단스크, 팔랑가, 그디니아, 오데사에서 마다가스카르, 아프리카의 뿔, 레반트 지역으로 가는 크루즈 운임을 인하합니다. 특히 로마 및 유대 혈통을 증명할 수 있는 분들에게는 특별 할인이 제공됩니다.\"\n\n부드러운 여성 목소리가 끝나고, 거친 남성의 음성이 뒤를 이었다.\n\n\"내 이름은 미하우 크비에크, 나는 롬인(집시)들의 왕이며, 이 메시지를 지지하노라.\"\n\n\"4개년 계획의 성공과 함께, 나첼니크 발레리 스와베크께서는 전국적인 생산성 향상과 국민 생활 수준의 향상을 발표하셨습니다. 이 개혁 덕분에 우리는 외국 제품과 혁신적인 기술을 수입할 수 있게 되었습니다! 전기 공급이 이루어진 마을이 천 개를 넘었으며, 피우수트스키 대로 프로젝트의 일환으로 보흐단 프니에프스키가 설계한 새로운 폴란드 라디오 본부가 완공 중입니다. 라디오는 가장 현대적인 오락 매체입니다. 3백만 명 이상의 폴란드 국민이 라디오 방송을 구독하고 있습니다. 이러한 성공은 오직 유제프 피우수트스키 원수와 발레리 스와베크의 공덕이며, 그들에게 영원한 찬사를 보냅니다!\"\n\n\"다음 주 일요일에는 외무부 장관 유제프 베크와의 대담이 예정되어 있습니다. 주요 논점은 외국 영화 수입 문제입니다. 독일과 프랑스 영화는 실험적이고 흥미로운 작품들로 잘 알려져 있습니다. 그러나 한 가지 의문이 남습니다. 이들 영화의 개봉이 국내 영화 제작자들에게 지나친 경쟁을 유발할 것인가? 그리고 독일 혹은 프랑스 영화를 선택하는 것이 상대 국가와의 관계를 악화시킬 것인가? 이러한 질문에 대해 베크 장관께서 직접 답변해 주실 예정입니다.\"\n\n\"사랑하는 청취자 여러분, 짧은 광고를 마치고 다시 찾아뵙습니다. 이제 폴란드 라디오 오케스트라가 연주하는 프레데리크 쇼팽의 ‘론도 크라코비아크’ 을 감상하시겠습니다...\""
 poland.15.a:0 "전 폴란드가 라디오를 듣고있다."
 poland.100.t:0 "흐멜니츠키의 귀환"
 poland.100.desc:0 "르부프는 단 몇 시간 동안이나마 다시 우크라이나 소유가 되었다. “우크라이나에 영광을! 반데라에 영광을!”이라는 구호가 시청 앞에서 모인 군중들에 의해 외쳐졌다. 이는 폴란드에 편입되기 전, 빈켈리에트 전쟁(독립 전쟁)의 시절 이후로 리우에서 목격된 최대 규모의 우크라이나 민족주의 집회였다. 물론 우크라이나인들은 이를 크이우만큼이나 우크라이나적이라고 여기고 있었지만, 정부가 이 문제를 상대적으로 기피함에 따라, 민족주의자들의 때때로 발생하는 공격 외에는 바르샤바의 평화가 유지되었습니다. 그러나 반데라의 집권 이후 상황은 크게 달라졌다.\n\n오늘날, 우크라이나는 인터마리움을 탈퇴하였습니다. 크이우 정부는 바르샤바와 모스크바의 침략에 맞설 모든 수단을 갖추고 있다고 밝혔습니다. 우크라이나인 공동체에서는 축하 행사가 곧바로 시작되었고, 경찰은 사태가 확산되는 것을 막기 위해 매우 까다로운 임무에 직면했습니다. 르부프의 중앙 광장에서는 그러한 임무가 대체로 달성되고 있었으나, 그때 폴란드계 국민들이 자체 시위를 벌이며 상황에 돌입했다.\n\n“새로운 흐멜니츠키에 반대한다! 우크라이나 복수주의에 반대한다!”라는 구호와 함께, 폴란드계 시위 지도자들이 우크라이나인들이 모여 있는 광장으로 행진하며 외쳤다. “우크라이나인들아! 현재 니들이 살고있는 국가에 충성을 다하는 양반들은 함께 하길 바라지만! 우리 폴란드인에게 불만있는 놈들은 떠나라! 크이우로 꺼져라!”\n\n반데라 시위 지도자들은 이에 대해 “폴란드는 지옥에나 꺼져라! 이곳은 우크라이나의 영토다! 더러운 점령자들이여, 경계하라! 우리는 여러분을 비스툴라 강 건너로 몰아내어 네놈들이 있어야할 곳으로 보내주마!”라고 강력히 응수하였다. 이어 “광장에서 당장 꺼져버려! 우리랑 있어서 험한 꼴 보기 싫다면 말이지!”라는 경고도 덧붙였다.\n\n“이런 식으로 우리에게 말하지 말라고! 특히 여기는 우리들의 나라란 말야! 이것은 최후통첩이다! 지금 당장 꺼지라고!”\n\n우크라이나인들은 말로 응답하지 않고, 대신 주먹으로 대응하였다. 사방에서 남성과 소년들이 나타나 위협에 맞섰고, 폴란드인들도 그에 상응하는 대응을 보였다. 이미 위태로운 상황에 있던 폴란드인들은 폭력을 종식시키기 위해 합류할 수밖에 없었다. 결국 하루가 저물 무렵, 도시는 진정되었으나 이 사태는 이미 국제 언론의 주목을 받게 되었다. 우크라이나는 폴란드의 폭력을 규탄하였고, 인테르마리움은 크이우의 선동을 비난하였으며, 모두들 한 가지 질문을 던지기 시작했다. “앞으로 어떻게 될것인가?”"
 poland.100.a:0 "불길이 치솟는다."
 poland.101.t:0 "반데라의 대홍수"
 poland.101.desc:0 "어느 날, [?global.date.GetDateStringNoHourLong] 이른 아침에 필리프는 우크라이나 국경에서 경계 근무를 맡게 되었다. 그가 군에 입대한 후에는 평화로운 임무를 기대하였으나, 전쟁은 누구도 바라는 것이 아니었다. 그의 아버지는 나라의 자유를 위해 싸우셨고, 필립은 그 점에서 아버지를 깊이 존경하였으나, 지난 전쟁에서 이미 너무 많은 피가 흘러 더 이상의 희생은 필요 없다고 생각했다. 필립은 크이우의 사람들이도 같은 마음이리라 기대했다.\n\n그가 근무하는 지역은 이 지역의 다른 곳들처럼 우크라이나로 드나드는 민족주의 무장단체들이 자주 출몰하는 곳이었다. 물론 그들은 자국 군대의 지원도 받으며 활동하였다. 우크라이나가 인테르마리움에서 탈퇴한 이후, 이들은 그 사실을 노골적으로 드러낼 수 있게 되었다. 반데라는 우크라이나를 하나의 거대한 진영으로 전환시켰으며, 이를 통해 바르샤바와 모스크바에 맞설 수 있다고 주장했다. 필립은 그 사람이 자신의 주장을 현실적으로 인식하고 있는지, 혹은 우크라이나 국민들이 그를 어떻게 평가하는지 의문을 품었다. 우크라이나는 이웃 국가들과 단독으로 맞서기 어려웠다. 불과 몇 년 전만 해도, 그들의 경제는 폴란드의 지원에 의존하고 있었으니까. 어쩌면 반데라는 자신의 인기를 유지하기 위해 모든 것을 꾸며낸 것이 아닐까 필립은 생각했다. 그러나 그러한 꾸밈도 언젠가는 끝이 날 것이며, 우크라이나인들이 이런 생활에 지쳐 그를 몰아낼 것이라고 판단했다.\n\n필립의 경계 초소에서, 그는 아침 어스름 속에 어떤 움직임을 감지했다. 한 남자, 파르티잔, 혹은 드문 경우인 탈영병일 수도 있었다. 그 남자는 초소 쪽으로 곧장 다가오고 있었습니다. 과연 공격을 위한 것이었을까?\n\n“모습을 드러내라! 손들고! 무기 내려놔!” 필립은 소총을 겨누며 초소 근처에서 나타난 그림자에게 소리쳤다.\n\n“쏘지 마십시오, 선생님! 저는 해를 끼칠 의도가 없습니다! 저는 우크라이나 군대에서 탈영한 자입니다! 우크라이나는 공격을 시작할 것 입니다!”\n\n“언제?” 혼란스러운 필립이 물었습니다.\n\n“지금, 오늘입니다. 이것이 제가 아는 전부입니다. 우리는 어젯밤에 명령을 받았습니다. 어리석은 짓임을 알고 있습니다. 저는 그런 어리석은 전쟁에서 죽을 수 없습니다. 저는 선을 넘었습니다. 계획서도 가지고 있습니다. 제발, 여기서 저를 방치하지 마십시오. 저는 총에 맞아 죽게 될 것입니다!”\n\n필립은 탈영병의 말이 옳다는 느낌을 받았다. 그는 초소에서 내려와 탈영병을 부르며 상황을 확인했다. 그를 어떻게 처리해야 할지 몰랐던 필립은 지휘부에 연락하여 보고하기로 결심했다. 모든 것이 잘 해결될 것이라는 희망 속에, 어쩌면 전쟁을 피할 수 있을지도 모른다고 생각했다.\n\n“여기 벽 뒤에 서있어. 상관에게 전화할테니까.” 필립은 지금 막 그 앞에 있던 병사들에게 말했습니다. 그가 전화를 걸기 위해 계단을 오르려는 순간, 뒤에서 총성이 들렸습니다. 다음 순간, 한 총알이 그의 머리를 관통하였다. 그는 반응할 새도 없이 쓰러졌다."
 poland.101.a:0 "전쟁이 앗아간 또 다른 생명."
 poland.102.t:0 "두 번째 프로이센의 맹서"
 poland.102.desc:0 "폴란드 군대는 쾨니히스베르크에 상당히 신속하게 진입하여, 프로이센인들의 모든 저항을 무너뜨리며 그들의 군국주의가 오직 열병식에서만 나타남을 보여주었습니다. 마치 예전 레흐인들이 독일인들과 싸웠던 때나 1410년에 폴란드인, 루테니아인, 리투아니아인들이 튜튼족을 격파했던 것과 같이, 이번에는 인테르마리움이 승리하였습니다. 루덴도르프의 악당들은 그들의 범죄에 대해 재판을 받을 것입니다.\n\n그러나 다른 문제들도 발생하였습니다. 베얼린은 바르샤바에 엄청난 독일인 인구를 어떻게 처리할 계획인지 질문하기 시작하였습니다. 수칼스키와 스타흐니우크는 독일인들에 대해 적대감을 보이지 않았기 때문에, 회담은 평화롭게 진행될 것으로 결정되었습니다.\n\n폴란드인들은 붉은 독일의 대표자들을 그단스크로 초청하였으며, 협의 결과 크룰레비에츠와 크룰레비에츠로 반입되는 물품에 대해 영구적으로 낮은 관세를 부과하는 조건 하에, 독일인들이 인구 교환을 실시하여 실레시아, 포메라니아 및 마주리아에서 철수할 것을 약속받았습니다. 또한, 인테르마리움 지역에서 독일과 헝가리로 석탄 및 식량을 수입하는 무역 협정도 훨씬 유리한 조건으로 체결되었습니다. 이러한 조치는 양측이 오랜 세월 쌓여온 모든 분쟁을 완전히 청산하고, 러시아의 반동과 프랑스의 광기를 동시에 저지할 동맹을 구축하기 위함입니다."
 poland.102.a:0 "폴란드인들과 독일인들은 사이좋은 사촌들인가?"
 poland.103.t:0 "역사적 교환"
 poland.103.desc:0 "우리는 프로이센에서 전개되는 상황을 예의주시하였습니다. 인터마리움 부대는 그단스크와 마주리아를 회복하고, 한편으로 폴란드-러시아 전쟁 중 프로이센의 배신 가능성에 대비하기 위해 프로이센에 진입하였습니다. 이는 이해할 수 있는 조치였으나, 동시에 폴란드 측은 이전에 프로이센을 자국 영토로 삼지 않겠다고 약속한 바 있었습니다. 그럼에도 불구하고 다소 불안한 움직임이었으나, 우리는 바르샤바가 비열한 의도를 가지고 있다고 단정하고 싶지 않았습니다.\n\n이에 우리는 스타니스와프 수칼스키 정부와 프로이센 문제에 대해 논의할 의향을 표명하였습니다. 이 유명한 초민족주의 활동가이자 저명한 예술가가 우리의 제안을 거절할 것이라는 우려는 없었으나, 놀랍게도 사나치아 정부는 우리의 요청을 수락하였습니다. 폴란드가 쾨니히스베르크를 정복한 후, 우리는 그단스크에서 협상을 시작하였습니다.\n\n협상은 볼레스와프 피아세츠키의 주재 하에 진행되었습니다. 폴란드 측은 프로이센 전역을 폴란드와 리투아니아의 통제 하에 두기를 고집하였으나, 결국 우리는 국경 관세 인하와 인구 교환, 그리고 쾨니히스베르크를 우리에게 넘기는 대가로 인테르마리움에 더욱 유리한 무역 협정이 이루어지는 것이 더 나은 해결책임을 설득하였습니다. 폴란드인들은 쾨니히스베르크로 물품을 수송하기 위해 그들의 철도를 우리에게 빌려줄 것이며, 그 대가로 토지와 민족 통합을 받게 될 것입니다. 협상은 길었지만, 이는 슬라브인과 독일인 간의 전쟁이 영원히 종식됨을 상징하는 중요한 전환점이 되었습니다."
 poland.103.a:0 "독일인들과 폴란드인들은 사이좋은 사촌들인가?"
 poland.50.t:0 "대홍수를 준비하며"
 poland.50.desc:0 "드니에프르 강 양쪽 둑에서 총성이 들려왔다. 왼쪽 둑에서는 지나가는 러시아 군대가 적의 전선을 뚫고 전진하고 있었고, 오른쪽 둑에서는 인터마리움 동맹이 병사들을 대상으로 군사 훈련을 실시하고 있었다. 모스크바로부터의 직접적인 위협이 없더라도, 미래의 전쟁에 대비한 상시 경계 태세를 유지해야만 했다. 그리고 물론, 언젠가 러시아인들에게 닥칠 운명을 상기시키기 위함이기도 했다. 오늘의 훈련은 장군 알렉산드레 흐크헤이제와 유제프 첸데푸에게 맡겨졌다.\n\n“나는 드니프로 강 너머를 바라보지만, 눈에 보이는 것은 오직 반대 둑의 들판과 숲뿐입니다. 그러나 내 마음은 고향을 봅니다. 조지아, 나의 조국은 벌써 20년 동안 보지 못했습니다. 언젠가 반드시 돌아가리라, 나 스스로에게 약속했소.”  병사들의 휴식 시간 중 흐크헤이제가 말했다.\n\n“알 수 있소, 알렉산드레. 그대 마음속의 슬픔이요. 바로 그 이유로 여기서 폴란드와 그 동맹국들과 함께 싸우며 조지아를 해방시키려는 것이오.”\n\n“네, 말씀대로요. 그런데 유제프, 당신도 고국인 중국을 그리워하지 않소?”\n\n“나는 중국에서 태어났지만, 어릴 적 한 폴란드 장군에 의해 러시아 군대에 끌려왔소. 그분이 나를 폴란드로 데려가셨고, 그곳에서 오늘날의 내가 되었소. 솔직히 말하건대, 중국에 대해 특별한 애정을 느끼지 않소. 내 피는 아시아에서 왔을지라도, 내 영혼은 여기 폴란드에 있소. 나 역시 내 조국을 위해 싸우고 있소.”\n\n“당신은 고국에 있소만, 나는 트빌리시에서 볼셰비키들이 자리잡으면서 고국에서 쫓겨났소. 과연 내가 언제 돌아갈 수 있을지….”\n\n“곧일 것이라 느낍니다. 지휘부는 러시아 국경 근처에서 추가 훈련을 명령했소. 우리는 아직 그곳을 건너지 않았소, 그곳에서 권력을 둘러싼 여러 집단과 얽히는 수렁에 빠지지 않기 위하여서요. 러시아에서 승자가 나타나면, 그는 모든 지방을 진정시키느라 지쳐 있을 것이오. 그가 가장 약해질 때, 우리가 공격하리라!”\n\n“그리고 우리 승리 후에는 어떠할 것이오? 러시아에는 무슨 일이 일어날 것이오?”\n\n“우리가 개최한 각종 위원회와, 러시아 제국과 체결한 휴전 협정으로 이미 축소된 우리 동맹의 국가들을 보건대, 억압받는 모든 민족들이 해방될 것이라고 생각하오. 당신의 민족도 포함하여서.”\n\n“나의 조지아가 해방되기를. 그 날을 볼 수 있을 만큼 오래 살 수 있기를 바라오.”\n\n“알렉산드레, 분명 그렇게 되리라 믿소.”"
 poland.50.a:0 "나의 자유와 당신의 자유를 위하여."
 poland.51.t:0 "성전"
 poland.51.desc:0 "“…수년 간의 긴장과 도발 끝에, 인테르마리움 동맹은 더는 참을 수 없다고 결정하였습니다. 러시아 정부는 우리 가정과 생명에 대한 주장을 멈추지 않았으며, 자국민을 야만적인 방식으로 억압하는 것과 동일한 방법으로 우리를 억압하려 하였습니다. 이제 러시아 내부의 상황은 전적으로 우리의 이익에 유리하게 돌아섰습니다. 우리는 우리의 평화와 자유를 확실히 지켜야 합니다. 인테르마리움 동맹은 러시아 정부에 선전포고하였습니다.”라고 폴란드 나첼니크가 선언하였다. 이 메시지는 라디오와 텔레비전을 통해 전파되었고, 특별 신문호에 신속히 인쇄되었으며, 모두의 입을 통해 전해졌다. 20년 전 시작된 대립이 절정에 이르고 있었다.\n\n폴란드와 그 동맹국들은 독립 이래로 이 전쟁을 준비해왔다. 경제는 무거운 부담을 감당할 준비가 되어 있었고, 군대는 러시아 영토에 진입하라는 명령을 받았다. 같은 날, 자원봉사자들이 모집소에 쏟아졌고, 기차는 동부 전선으로 병사들을 실어 나르기 시작하였다. 국가 전체가 전쟁에 돌입한 것이다.\n\n“전쟁은 기껏해야 몇 달간 지속될 것입니다! 우리의 폴란드는 러시아의 야수로부터 안전을 지켜야 합니다! 콜차크를 기억하고, 드로즈돕스키를 기억하십시오! 지난 몇 년 동안 일부 러시아 군벌과 평화가 가능하다는 주장을 펴던 목소리들이 있었습니다. 이제 그들의 나라가 다시 하나로 뭉쳤으니, 그들은 어디에 있습니까? 그들은 입을 다물었습니다. 왜냐하면 그들이 잘못되었음이 증명되었기 때문입니다!”라고 크라쿠프 시민들 앞에서 선동가 발렌티 로갈스키가 외쳤습니다. “1919년에 우리는 드니에프르 강에서 멈추었소. 이제, 우리는 그 너머로 나아갈 것입니다!”\n\n그 뒤를 이어 반러시아 연합을 대표하는 다양한 연설자들이 뒤따랐다. 주요 폴란드 정치인들, 군 장교들, 벨라루스, 우크라이나, 리투아니아의 고위 인사들, 심지어 핀란드, 조지아, 타타르인들까지 나서서 자신의 주장을 펼쳤다. 그러나 청중에게 가장 강렬한 인상을 남긴 것은 마지막 연설자였다. 폴란드 군복을 차려입은 한 러시아인이 입을 열었다.\n   \n“제 이름은 브로니슬라프 카민스키입니다. 제 고국에서는 배신자이자 탈영병으로 낙인찍혔습니다. 그러나 이곳 폴란드에서는 올바른 일을 할 기회를 얻게 되었습니다. 모스크바 정권은 단지 정의와 신앙을 무시하며 땅을 약탈하고 민중을 고문한 배신자 무리에 불과합니다. 그들에게 러시아인, 타타르인, 캅카스인이란 것은 아무런 의미도 없습니다. 제가 그들의 만행을 폭로하였고 그로 인해 사형을 선고 받았습니다. 저는 폴란드로 도망쳐 왔고, 그곳에서 자유를 누릴 뿐만 아니라, 현재 러시아를 지배하며 여러분에게 다가오고 있는 살인적인 음모를 종식시키기 위해 적극적으로 활동할 기회를 얻었습니다. 폴란드 국민 여러분! 제발 행진하여 러시아를 해방시키십시오! 저는 모든 정직하고 올바른 러시아인들을 대표하여 외칩니다: 드니에프르 강을 건너십시오! 모스크바로….”"
 poland.51.a:0 "“…우랄 산맥으로! 하르빈으로!”"
 poland.16.t:0 "니에 주침 지에와(그만두지 않겠소)"
 poland.16.desc:0 "마리아 이자벨라 비우츠카-코발스카 여사는 새로 봉헌된 신성 섭리의 성전에 모인 신자들과 귀빈들을 둘러봤다. 이 성전은 피우수트스키 대로로 구성된 대규모 단지의 일부였다. 마리아의 대사제이자 구천주교 마리아비트 교회의 지도자이신 그녀께서 강단으로 올라가, 알렉산데르 프리스토르와 그의 부인, 그리고 피우수트스키의 부인과 딸들을 비롯한 귀빈들을 바라봤다. 폴란드가 세속주의(Laïcisme)에 따라 통치되고 있음에도 불구하고, 발레리 스와베크는 피우수트스키를 제단으로 올리는 의식에 정부 관리들이 참여하는 것을 승인하였다. 비록 교회는 국가로부터 분리되어 있고, 종교 문제는 국민의 사적인 문제로 남아 있었으나, 이로 인해 보편사회기구가 국교인 기독교를 선호하는 것을 막지는 못하였다. 제단 소년이 대사제의 머리에서 미트라(관)를 벗기고, 그녀의 설교를 시작하였다.\n\n“오늘 우리는 폴란드의 원수령이자 충실한 배우자, 훌륭한 부모, 폴란드인의 목자이신 축복받은 요제프 피우수트스키의 성례를 위해 이 자리에 모였습니다. 그분은 러시아의 속박으로부터 우리와 많은 민족의 독립을 구원하셨습니다. 무결한 성모가 피우수트스키 앞에 나타나 그분의 인도로 러시아의 홍수를 격파했던 크이우의 기적은 아직도 생생히 기억되고 있습니다.\n\n모든 이가 유제프 피우수트스키의 위대함과 그분의 사명이 가진 메시아적 성격을 이해하는 것은 아닙니다! 가톨릭 성직자들과 거짓 목자들은 폴란드 국가 이익에 굴복하지 않겠다고 선언하며, 여전히 우리 나라 구석에 숨어 있는 반동 꼽추 난쟁이들과 공모하고 있습니다.\n\n저희, 전사의 마리아 신실한 신자들은 여러분께 한 말씀 드리고자 합니다! 여러분은 외국인으로서 이탈리아 왕의 신하들이며, 국가 안에 또 다른 국가를 만들어내고 있습니다. 또한, 교황의 하인으로서 여러분의 편협함, 자만, 그리고 탐욕으로 폴란드 분할을 초래하였습니다. 오늘날까지도, 여러분은 회오리치듯 움직이며 프리메이슨-엔데크야의 난쟁이들과 손잡고 조국 파괴에 동의하고 있습니다. 반폴란드 쿠데타를 주도했던 로자브도프스키를 찬양하면서, 감히 저희에게 조국에 대한 애국심과 사랑이 부족하다고 비난할 수 있겠습니까? 피우수트스키께서는 폴란드 국교회의 필요성과 슬라브 세계에서 키릴-메토디오스식 의식의 성취를 위한 투쟁의 필요성을 명확히 이해하셨습니다. 모든 민족은 그 민족의 영성에 부합하는 고유한 교회를 가져야 합니다! 우리가 왜 만민족의 교회인 가톨릭에게 응답해야 하겠습니까?\n\n피우수트스키께서는 이 폴란드적 정체성의 필요성을 깊이 인식하셨으며, 우리와 마찬가지로 폴란드를 섬기기를 원하셨지, 지배하기를 원하지 않으셨습니다! 피우수트스키 기적은 명백합니다. 크이우 전투 중 신의 개입 외에도, 피우수트스키께서는 텔레파시 능력과 분신술의 선물을 지니고 계셨습니다. 그분의 중재를 통해 수많은 기적들이 이루어졌습니다. 그러므로 저희는 축복받은 유제프 술레유베크께서 축복받은 자들과 마리아의 종들 성인 목록에 합류하실 것임을 선언합니다!”"
 poland.16.a:0 "축복받은 유제프 술레유베크님, 저희를 위해 기도해 주시기를!"
 poland.17.t:0 "신성한 자손"
 poland.17.desc:0 "그는 언제나 피우수트스키 체제의 불꽃 같은 존재로 여겨졌다. 체제의 그림자 속에 머물렀지만, 결국 사나치아의 트라야누스가 되었다. 발레리 스와베크는 휴가를 떠나기로 하고, PZInż 403 Lux-Sport를 직접 몰아 바르미아-마주리의 한 휴양지로 향했다. 떠나기 전, 그는 승리의 개선문을 바라보았다. 그 위에는 ‘로도스의 거상’처럼 거대한 유제프 피우수트스키 기념상이 서 있었고 어떤 마천루도 그 거대한 조각상의 위엄을 넘볼 수 없었다.\n\n“지하철 여행은 어떠셨습니까? 제 아들이 각하께서 만든 이 시스템을 정말로 극찬하고 있더랍니다.”\n\n“빠르고 효율적이지. 흐미엘레프스키와 시르쿠스가 도시 설계를 아주 훌륭하게 해냈다네. 르 코르뷔지에 모델이야말로 도시 계획의 미래야.”\n\n그는 여러 나라의 번호판을 단 자동차들을 바라보며 도로로 고개를 돌렸다. 독일, 영국, 우크라이나, 심지어 몇몇 미국인들까지 각국에서 온 차들이 길을 가득 메우고 있었다. 목적지에 도착하자 그는 최고급 운전기사에게 짧게 작별 인사를 하고 짐가방을 꺼냈다. 배고픔이 느껴진 그는 가장 가까운 바 믈레츠니에 들러 국수를 주문했다. 바에서 일하는 한 여종업원이 맥주잔을 닦고 있는 동안, 라디오에서는 조용한 음악이 흐르고 있었다. 그가 시선을 약간 위로 높이자 한 중년 남성이 그의 테이블로 다가오는 것이 보였다. 그는 지도를 손에 들고 길을 잃은 듯 보였고, 프랑스어로 질문을 건넸다.\n\n“바르샤바로 가는 길이 어느 쪽인지 아십니까? 가족과 함께 휴가 중인데 우리는 신성 섭리의 성전과 국립 영묘를 보고 싶고, 그 다음에는 신-산데츠 근처의 산으로 갈 예정입니다. 비알로 타워에서 사냥을 하고 싶었지만, 제 아내는 내켜하지 않더군요.”\n\n“물론이죠.”\n\n스와베크는 주저하지 않고 그 남자를 도와 지도에서 '폴로니아’로 개명된 바르샤바를 보여주었다. 신사는 미소를 지으며 그에게 감사 인사를 했다.\n\n\"고맙습니다. 폴란드인들이 125년간의 의존 상태에서 벗어나 나라를 180도 바꿔놓은 것은 실로 경이로운 일입니다. 한때 이 땅은 우리 것이었지만 뭐... 제 딸이 미키 마우스같은 \"판 트바르도브스키\" 영화판을 무척 좋아하더군요.\"\n\n그 순간, 라디오에서 폴란드군의 승리를 기리는 연설이 흘러나왔다. 그 음성은 어디선가 익숙한 것이었다. 그리고 이내 그는 깨달았다. 방금까지 자신과 이야기 나누던 사람이 바로 발레리 스와베크였다는 사실을! 그는 충격을 받았고, 방금 전까지 자신이 그를 알아보지 못했다는 사실에 부끄러워졌다. 스와베크는 조용히 한숨을 내쉬며 자리에서 일어나 손을 내밀었다.\n\n“...실례했습니다, 스와베크 씨.”\n\n“괜찮습니다. 성함이 어떻게 되십니까?”\n\n“헤르만 괴링입니다.”\n\n“독일 이름이군요. 어느 독일에서 오셨습니까?”\n\n“음… 유일하게 올바른 독일에서 왔습니다만… 그럼 국수는 두고 가겠습니다. 좋은 하루 보내십시오!”\n\n그는 어색하게 웃으며 재빨리 자리를 떴다. 나첼니크와 악수조차 하지 않은채로 말이다. 스와베크는 이 만남에 동요하지 않았고 음식을 먹고 로마식 발코니로 나갔다. 그는 벽에 손바닥을 대고 앞에 펼쳐진 호수를 바라보았다."
 poland.17.a:0 "그의 업은 신성한 것이었기에 미소를 지었다."
 poland.18.t:0 "정의의 행진"
 poland.18.desc:0 "밤이 깊어진 바르샤바의 거리에는 불의 바다가 넘실거렸다. 횃불의 불꽃이 마천루의 창문에 반사되며 하늘의 별빛을 희미하게 만들었다. 그러나 이 장엄한 광경 속에서도, 붉게 타오르는 숯덩이 외에는 누구도 감히 소리를 내지 못했다. 젊은 군단의 민족주의자들, 강권당, 엔데차 잔당들, 심지어 아나키스트들까지도 벨베데레 궁전과 왕궁 앞에서 펼쳐진 위대한 행진에 동참했다. 그러나 이 순간은 그들의 것이 아니었다. 얀 스타흐니우크, 얀 헴펠, 볼레스와프 피아세츠키, 그리고 그들의 선봉에 선 스타니스와프 수칼스키. 자드루가를 이끌며 광기에 찬 피우수트스키주의자들과 함께, 이들은 ‘민족 수장’의 칭호를 자처한 유제프 피우수트스키의 후계자들에게 조용하면서도 거대한 전쟁을 선포하고 있었다.\n\n동시에 젊은 장교들과 젊은 군단 민병대 지도자들은 참모본부를 포위하여 에드바르트 리츠시미그위를 포획하려 했다. 마침내 그들은 장군을 벨베데레 궁전 창문 밖으로 끌어냈다.\n\n법무부 장관으로서의 임무를 마치고 자리를 뜨려던 발레리 스와베크는 라친스키 궁전 근처에서 붙잡혔다. 이 악명 높은 행동은 아나키스트들에 의해 자행되었으며, 그들은 돼지의 내장을 그의 대머리 위에 부으며 피로 낙인을 찍었다.\n\n동시에, 가장 잔혹하고도 야만적인 형벌이 이그나치 다신스키에게 가해졌다. 그는 국가지도자로서 무능하고 약하다는 이유로 제거 대상이 되었던거다. 죽음 후사르 부대의 타타르 이교도들은 망설임 없이 그를 구타했고, 여러 차례 뼈가 부러질 때까지 폭력을 가했다.\n\n그들은 결국 텅 빈 왕궁과 폴란드 국가수장의 자리로 끌려왔다. 헴펠, 피아세츠키, 스타흐니우크, 그리고 맨 앞에 선 수칼스키가 반원형으로 섰다. 수칼스키는 마치 세상을 손에 쥐려는 듯 두 팔을 펼치고, 예언자처럼 군중을 향해 외쳤다.\n\n\"동지들이여, 형제자매들이여! 조상의 신앙을 따르는 자들이여, 영원한 피의 맹세를 믿는 자들이여, 그리고 분노로 타오르는 이들이여! 우리는 조국을 배신하고 가장 극악한 죄악을 저지른 자들을 이 자리로 데려왔다. 그 죄란 바로 신의를 저버린 것이다! 정직하지 않은 자들이 어떻게 우리를 영광으로 이끌 수 있단 말인가? 원수 피우수트스키께서는 이들에게 조국의 영광을 위해 헌신할 것을 기대하셨다. 그러나 지금, 나는 그의 예언자로서, 오직 그의 정신에 충실한 자로서, 그들에게 묻는다! 생명이냐, 죽음이냐?\"\n\n군중은 속삭이며 웅성거렸다. 그들의 푸른 눈, 밤색 눈, 초록빛 눈동자에는 야수적이고도 원시적인 분노가 일렁였다. 그러다 한 목소리가 하늘을 향해 울려 퍼졌다. 페룬과 스비아토비트, 그리고 저 하늘의 신들을 향한 절규였다. 곧이어 수많은 목소리가 기쁨에 찬 외침으로 화답했다.\n\n\"죽음이다! 오직 죽음만이 우리를 그들의 사슬에서 해방시킬 것이다!\"\n\n그 말이 떨어지자, 가면을 쓴 죽음 후사르들은 세 사람을 지붕에서 걷어찼다. 그들은 불길이 넘실거리는 거리로, 번뜩이는 냉철한 단검이 기다리는 곳으로 추락해갔다."
 poland.18.a:0 "수리처럼 날아가기를."
 poland.19.t:0 "우크라이나의 구원"
 poland.19.desc:0 "크이우는 전쟁의 흔적을 온몸으로 짊어지고 있었다. 파괴된 건물, 거리 곳곳에 난 구멍, 임시로 지어진 가옥들. 그러나 이 상태가 오래 지속되지는 않을 것이었다. 다행히도, 인테르마리움의 원조가 우크라이나 전역으로 쏟아져 들어오고 있었고, 머지않아 이 나라는 전쟁 이전의 찬란함을 되찾을 것이다. 단, 반데라주의의 색채를 완전히 벗어던진 모습으로 말이다. 반데라의 운동은 우크라이나를 옛 동맹국들과의 비극적인 전쟁으로 이끌었고 그의 패배는 그 운동의 피비린내 나는 종말을 의미했다.\n\n이제 우크라이나에는 새로운 정부가 필요했다. 폴란드와 우호적이면서도 이 나라의 사회적, 정치적 상처를 치유할 수 있는 지도력이 절실했다. 민족적 증오와 복수심으로 갈가리 찢긴 우크라이나는 마치 러시아 제국을 닮아가고 있었다. 그러나 다행히도, 이 혼란을 바로잡을 적임자가 있었다. 명망 높은 우크라이나 장군 페트로 볼보찬이 나서, 폴란드와 함께 건강한 재건의 길을 이끌게 되었다.\n\n\"반데라는 허황된 위대함과 제국주의적 망상으로 우리 우크라이나 민족의 길을 오도했습니다. 그는 우크라이나의 진정한 국경과 의미를 망각했습니다. 그의 꿈속에서 크이우는 포즈난에서 블라디보스토크까지 모든 땅의 지배자가 되었습니다. 물론 모스크바의 지배 아래에서 신음하는 우리의 형제들이 있습니다. 하지만 그들을 해방시키는 길이 단순히 억압자와 피억압자의 역할을 뒤바꾸는 것일 수는 없습니다. 반데라는 콜차크의 언어로 말했고, 그는 진정한 우크라이나인이 될 자격이 없었습니다.\" 볼보찬 장군은 크이우 시민들 앞에서 이렇게 외쳤습니다. \"인테르마리움의 우정은 진실하며 진심 어린 것입니다. 그들은 우리의 영토를 병합하지 않았습니다. 우리 민족을 모욕하지도 않았습니다. 단지, 우리가 체결한 조약과 동맹을 존중할 것을 요구했을 뿐입니다. 그리고 우리는 그렇게 할 것입니다. 반데라는 미흐노브스키가 시작한 혼돈의 정점이었습니다. 이제 나는 이와 같은 비극이 다시는 되풀이되지 않도록 만들 것입니다.\"\n\n국민들은 방금 전쟁을 온몸으로 겪었다. 그것도 그들 자신의 이름 아래에서. 과연 르비우와 브레스트를 위해 전쟁을 벌일 가치가 있었던가? 이제는 확실히 아니었다. 그들은 친구들을 배신했지만, 폴란드는 여전히 그들을 두 팔 벌려 맞이했다. 반데라가 예언했던 암울한 미래와는 달리 폴란드는 볼리니아를 요구하지 않았고, 우크라이나 경제를 굴종시키지도 않았다. 그리고 이에 대한 감사는 반드시 갚아야 할 것이었다. 한 사람이 박수를 쳤고, 이어서 광장이 하나 되어 박수 소리가 울려 퍼졌다. 볼보찬 장군을 향한 환호성이 터져 나왔다. 진정한 우크라이나의 구원자가 탄생한 순간이었다."
 poland.19.a:0 "우크라이나는 아직 사라지지 않았도다."
 poland.1000.t:0 "새로운 희망"
 poland.1000.desc:0 "우리의 십자군 전쟁은 결말을 향해 달려갑니다. 구 사나치아 정권의 잔재는 바르샤바, 민스크, 키예프에서 우리의 행진 발걸음 앞에 산산조각나 버렸습니다. 인테르마리움의 위협은 물리쳤지만 오랜 세월 이어진 질문 하나가 남아 있습니다. \"주여 어디로 가시나이까?(Quo Vadis?)\" 아니, 이제 폴란드 민족은 어디로 가야 하는가요? 우리의 폴란드는 힘과 정의의 국가가 될 것입니다. 영광스러운 제국과의 연합 속에서 자치 왕국을 이루며, 그것이 바로 원래의 모습이어야 할 것 입니다. 피우수트스키의 광인들이 프리메이슨적인 음모로 진정한 민족적 폴란드의 비전을 훼손했을지라도 고칠 수 없는 것은 없습니다. 곧 그들이 파괴한 잿더미 속에서, 어느 때보다 강한 새로운 폴란드가 일어설 것입니다. 그런데 누가 그 새로운 폴란드를 이끌어야 할까요?\n\n먼저, 최전선에는 새로운 사상을 품은 젊은 인물 볼레스와프 피아세츠키가 있습니다. 그의 목소리는 많은 이들이 현대의 폴란드 세대를 우리의 편으로 이끌 영감을 줄 것이라 기대하고 있습니다. 젊은 러시아 연합의 가르침을 자신의 것으로 받아들인 피아세츠키의 사상은 산업주의와 급진적 민족주의를 결합한 것입니다. 비록 폴란드 망명자들 사이에서 인기가 있지만, 그의 비정통적인 사상이 바르샤바의 민족주의와 르 솔레유의 민족주의 사이의 경계를 흐릴 것을 우려하는 이들도 있습니다.\n\n다음으로, 지그문트 치비호프스키는 엔데차(민족민주당)의 새로운 경비대를 이끌고 있습니다. 그의 임명은 수년 전 우리가 했던 약속들을 이행하는 것이 될 것이나, 그의 사상은 최근 세상을 떠난 로만 드모프스키보다 훨씬 급진적입니다. “3반주의” 반스파르타키즘, 반유대주의, 그리고 반 프리메이슨주의적 급진 공화주의자이지요. 그는 드모프스키의 전문성이 미치지 못했던 영역들을 보완하고자 유럽 각지의 문헌, 예컨대 우리의 검은 백인대나 루마니아 철위대와 같은 자료에서 영감을 얻고 있습니다.\n\n마지막으로, 스타니스와프 코지츠키는 가장 정통적인 선택입니다. 그는 엔데차의 구세력 멤버로, 러시아 제국 내 폴란드 자치를 보장하기 위해 드모프스키와 스톨리핀 간에 체결된 협정, 즉 드모프시치나의 형성을 위해 로비 활동을 벌인 인물 중 한 사람입니다. 당시 그러한 결정은 노골적인 협력으로 여겨졌고 그의 임명은 일반 대중의 동의를 얻지 못할 수도 있습니다. 그럼에도 불구하고 그는 폴란드의 이익이 훼손되지 않는 한 러시아가 어떤 방향으로 나아가더라도 우리의 기계에서 가장 신뢰할 수 있는 톱니바퀴 역할을 할 것입니다."
 poland.1000.a:0 "피아세츠키는 우리가 절실히 필요로 하는 불꽃을 가지고 있다."
 poland.1000.b:0 "치비호프스키는 현대 폴란드인의 이상적 모습을 구현할 것이다."
 poland.1000.c:0 "코지츠키는 이 기계를 계속 운영할 것 이다."
 poland.1001.t:0 "새로운 시작"
 poland.1001.desc:0 "우리의 십자군 전쟁은 결말을 향해 달려갑니다. 구 사나치아 정권의 잔재는 바르샤바, 민스크, 키예프에서 우리의 행진 발걸음 앞에 산산조각나 버렸습니다. 인테르마리움의 위협은 물리쳤지만 오랜 세월 이어진 질문 하나가 남아 있습니다. \"주여 어디로 가시나이까?(Quo Vadis?)\" 아니, 이제 폴란드 민족은 어디로 가야 하는가요? 우리 폴란드는 자유와 해방의 폴란드가 될 것입니다. 1569년과 1918년의 전통을 잇는 올바른 민주공화국으로 말입니다. 피우수트스키의 광인들이 그들의 부정한 통치로 이 꿈을 산산조각 냈을지라도, 고칠 수 없는 것은 없습니다. 곧 그들이 파괴한 잿더미 속에서 그 어느 때보다 자유로운 새로운 폴란드가 일어설 것입니다. 그런데 누가 그 새로운 폴란드를 이끌어야 할까요?\n\n첫 번째 후보는 스타니스와프 미코와이치크입니다. 그는 확고한 농민주의자이자 농민 권리 옹호 운동의 조직가로서, 그의 대통령 출마는 여전히 우리 통치 현실에 적응하기 위해 애쓰는 하층민들에게 큰 호소력을 지닐 것입니다. 다만, 그가 베얼린에 대해 뚜렷한 동조감을 보이고 구 정권 내 동지였다는 점은 일부에서 의아함을 자아낼 수 있습니다. \n\n두 번째 후보는 로만 리바르스키입니다. 그는 폴란드 엔데차(민족민주당)의 주요 이론가 중 한 명으로, 사나치아 정변 이후 망명 생활을 해온 운동의 주요인입니다. 리바르스키는 영국애와 러시아애 사이의 미세한 경계에 대해 균형 잡힌 견해를 가지고 있습니다. 확고한 자유민족주의자로서 그의 등극은 양극화된 폴란드 야당 양측에 모두 일정 부분 수용될 만한 타격을 줄 수 있을 것입니다.\n\n마지막으로, 토마시 아르치셰프스키는 런던 적인 사회민주주의자로서, 한때 피우수트스키도 소속되었던 폴란드 사회당의 대표적 인물입니다. 다만, 아르치셰프스키와 피우수트스키 사이의 관계는 수년간 따뜻하다고 볼수는 없었습니다. 아르치셰프스키의 추종자들은 사나치아 운동의 노골적인 권력 장악에 처음으로 반대 목소리를 냈던 폴란드인들 중 하나였기 때문입니다. 스스로를 애국자로 칭하는 그의 애국심은 이전 동지들보다 다소 온건한 편입니다. 일부에서는 이를 사나치아 운동 초기 행보로의 회귀이자 가장 무난한 선택으로 보기도 하지만, 동시에 그는 가장 논란이 많은 후보이기도 합니다."
 poland.1001.a:0 "아르치셰프스키는 우리가 절실히 필요로 하는 이성적인 목소리다."
 poland.1001.b:0 "미코와이치크는 잘해낼 것이다."
 poland.1001.c:0 "리바르스키, 폴란드 국민들에게 우리가 그들의 이익을 대변함을 알려줘라."
 poland.1002.t:0 "새로운 여명"
 poland.1002.desc:0 "우리의 십자군 전쟁은 결말을 향해 달려갑니다. 구 사나치아 정권의 잔재는 바르샤바, 민스크, 키예프에서 우리의 행진 발걸음 앞에 산산조각나 버렸습니다. 인테르마리움의 위협은 물리쳤지만 오랜 세월 이어진 질문 하나가 남아 있습니다. \"주여 어디로 가시나이까?(Quo Vadis?)\" 아니, 이제 폴란드 민족은 어디로 가야 하는가요? 풍요와 평등의 폴란드가 될 것입니다. 전 세계 모든 노동자들의 불가피한 승리에 한 목소리를 더하는, 올바른 사회민주공화국이 될 것입니다. 구 베얼린 엘리트들이 피우수트스키의 광인들을 수용함으로써 이 이상향의 관을 최종적으로 닫아버렸을지라도, 고칠 수 없는 것은 없습니다. 곧 그들이 파괴한 잿더미 속에서, 어느 때보다 평등한 새로운 폴란드가 일어설 것입니다. 그러나 과연 누가 그 폴란드를 이끌어야 할까요?\n\n타데우시 페이페르는 미래주의의 'ㅁ’정도는 하는 인물이라 할 수 있습니다. 그는 민족 아방가르드의 선도적 인물이자 구 사나치아 운동 정권에서 소규모 관료로 활동한 인물입니다. 그의 임명은 사나치아의 경제 정책은 유지하되, 프로메테우스적 독재 리더십의 사상에서 벗어나 부드러운 브랜드 전환의 길로 폴란드를 이끌 것입니다. 페이페르는 캅카스의 미래주의-공산주의 모델과 폴란드 민족주의를 절충하여, 폴란드를 새로운 현대 시대로 이끌고자 합니다.\n\n미에치스와프 모차르는 다소 이상주의적인 젊은 인물로, 자신들을 폴란드판 ‘민족 전위대’의 정답이라 칭하는 소규모 단체를 이끌고 있습니다. 그의 군사적 색채를 띤 볼셰비즘은 친가톨릭 및 민족주의 정책과 결합되어, 스스로 해결해야 할 모순이라 여기는 문제를 전면에 내세우고 있습니다. 때때로 그의 연설에는 보다 반사회주의적 폴란드 민족주의가 드러내는 반유대주의적 수사가 첨가되어, 그의 “프롤레타리아 민족주의”에 숨은 의미가 단순히 겉으로 보이는 것 이상의 것이 있음을 의심하는 이들도 있습니다.\n\n유제프 치란키에비치는 베얼린 스타일의 관료로 정치 이론과 명확한 절차 준수에 뛰어난 경험을 지닌 구 공산당 노련한 인사입니다. 그의 통치에서는 이제 완전히 스파르타쿠스주의화된 폴란드 사회당을 중심으로 한 여러 당들의 연합체 구성이 뒤따를 것입니다. 그를 통해 구 사나치아 운동 시절의 여러 경향들이 견고히 자리 잡게 될 것입니다. 그는 입을 열 때마다 신중을 기하는 유능한 정치가로서 그의 리더십은 유럽에 안정적인 기반을 마련하는 데 크게 기여할 것입니다."
 poland.1002.a:0 "페이페르, 근대성을 위하여!"
 poland.1002.b:0 "모차르, 노동자들을 위하여!"
 poland.1002.c:0 "치란키에비치, 사회주의를 위하여!"
 poland.1003.t:0 "새 불꽃"
 poland.1003.desc:0 "우리의 십자군 전쟁은 결말을 향해 달려갑니다. 구 사나치아 정권의 잔재는 바르샤바, 민스크, 키예프에서 우리의 행진 발걸음 앞에 산산조각나 버렸습니다. 인테르마리움의 위협은 물리쳤지만 오랜 세월 이어진 질문 하나가 남아 있습니다. \"주여 어디로 가시나이까?(Quo Vadis?)\" 아니, 이제 폴란드 민족은 어디로 가야 하는가요? 인민의 성스러운 의지와 저희의 지혜로운 인도로 탄생한 공화국이 될 것입니다. 피우수트스키 정권은 슬라브 민족들 사이에 균열을 낳는 실수를 범하였으나 고칠 수 없는 것은 없습니다. 곧 그들이 파괴한 잿더미 속에서 그 어느 때보다 정의로운 새로운 폴란드가 일어설 것입니다. 그러나 과연 누가 그 폴란드를 이끌어야 할까요?\n\n첫 번째 후보는 얀 뎅프스키입니다. 그는 폴란드 인민당의 급진 좌파를 대표하는 중추적 정치인이며, 구 사나치아 운동 정권에 대한 주요 야당 세력의 핵심 인물입니다. 뎅프스키는 저희 대의에 공감하는 대중 농민 운동의 대표자로서, 그 운동의 목소리를 대변합니다. 그의 계획은 피우수트스키의 과도한 산업화와 도시화 정책을 축소하고, 급진적인 토지 개혁을 실시하며, 현대 복지의 열매를 농촌에 전달하는 데 그 목적이 있습니다. 폴란드 내정에서 자치권을 받아내는 대가로, 그는 세계 무대에서 러시아의 충실한 지지자가 될 것이며, 풍부한 농민들의 지지 기반을 확보할 것입니다.\n\n또 다른 후보는 볼레스와프 비에루트입니다. 다소 특이한 인물로, 그는 신이교 자두르가 운동 좌파 진영의 이론가인 얀 헴펠과 가까워 그의 사상에 깊은 영향을 받고 있습니다. 비에루트의 비전은 아나코 생디칼리즘과 폴란드 슬라브 민족주의, 그리고 민속적 신비주의의 합체체라 할 수 있습니다. 헴펠의 가르침에 따라, 비에루트는 자신이 ‘아리안적’ 구 슬라브 정신이라 명명하는 것을 세계 프롤레타리아 해방을 위한 최대한의 공산주의 프로젝트와 결합하고자 합니다. 그는 기독교의 어둠에서 벗어나 삶 그 자체를 숭배하는 자유로운 노동자들의 다채로운 모습을 그려냅니다. 이러한 정권은 매우 불안정해질 우려가 있으며, 그의 수사는 자드루가의 선율과 위험할 정도로 밀접하게 맞닿아 있지만 어쩌면 국가적 굴욕에서 회복하기 위한 혁명적 불꽃이 폴란드에 필요할지도 모릅니다.\n\n마지막으로, 루찬 젤리고프스키 장군이 있습니다. 젊은 시절부터 헌신적인 범슬라브주의자로 활동해온 젤리고프스키 장군은 폴란드와 러시아를 다시 가까워지게 하려는 열렬한 의지를 표명하고 있습니다. 다만, 젤리고프스키는 구 사나치아 운동의 이념적 지침에 충실하여, 한때 형제 민족들을 재앙으로 몰아넣었던 반러시아 정서를 제거한 체계가 폴란드를 현대적이고 통일된, 그리고 규율 있는 국가로 이끌 것이라 믿고 있습니다. 전반적으로 젤리고프스키는 피우수트스키의 민족주의적 산업 사회주의 정책을, 슬라브 인종의 자유와 단결에 관한 새로운 수사로 보완하며 이어가고자 합니다. 그의 강력한 결단력은 분명 폴란드 민족에 안정성을 가져다줄 것이며, 그의 슬라브애 호는 영원한 동맹을 통해 우리 민족들이 함께 영광스러운 미래로 나아가도록 할 것입니다."
 poland.1003.a:0 "비에루트는 폴란드 국민의 사슬을 끊을 것이다!"
 poland.1003.b:0 "뎅프스키는 폴란드 농민들을 존엄케 만들 것이다!"
 poland.1003.c:0 "젤리고프스키 우리 나라에 영원한 우정을 맺을 것입니다!"
 intermarium.1.t:0 "다른 반쪽"
 intermarium.1.desc:0 "러시아 전역을 다시금 안정된 정부가 통치하게 되었습니다. 내전이 끝난 지금, 러시아 내 우리 영토 문제를 해결할 적기가 찾아왔습니다. 새 정부가 우리에게 우호적인 태도를 보일 수도 있지만, 과거 제국처럼 우리의 존재 자체를 반대할 수도 있을 것입니다."
 intermarium.1.a:0 "우리는 동지들과 합류할 것이다!"
 intermarium.1.b:0 "우리 형제들은 해방될 것이다!"
 intermarium.2.t:0 "우크라이나가 우리와 통합을 원함!"
 intermarium.2.desc:0 "우리의 우크라이나 동지들이 우리와의 연합을 원하며 연락해 왔습니다! 우리는 그들을 진심으로 환영하며 통합 절차를 시작할 것입니다!"
 intermarium.2.a:0 "하나로 뭉치자!"
 intermarium.2.b:0 "하나로 뭉치자!"
 intermarium.3.t:0 "인테르마리움으로의 초대"
 intermarium.3.desc:0 "폴란드 정부가 우리에게 인테르마리움 동맹 가입을 제안해 왔습니다. 우리의 지리적 위치와 과거 러시아 지배하에 있었던 역사를 고려할 때, 이러한 동맹은 자연스러운 선택으로 보일 수도 있습니다. 이를 수락한다면 현재 내전 중인 러시아에서 어떤 정부가 등장하든 강력한 견제를 가할 수 있을 것입니다. 그러나 이에 반대하는 목소리도 존재합니다. 이 동맹에 가입한다는 것은 결국 지역 내에서 우리의 독자적인 외교 정책을 포기하는 것이며, 장기적으로 러시아가 재건될 경우 우리가 충분한 권력 기반을 마련하지 못한다면 홀로 맞서야 할 위험을 초래할 수도 있습니다.\n\n선택은 우리의 손에 달려 있습니다."
 intermarium.3.a:0 "수락한다!"
 intermarium.3.b:0 "거절한다!"
 intermarium.4.t:0 "우리의 가장 위대한 시간"
 intermarium.4.desc:0 "우리는 우리의 형제들을 폭정에서 해방시키기 위해 러시아와 맞서 싸울 것입니다! 우리는 혼자가 아닙니다. 동맹국들이 우리를 돕기 위해 달려올 것입니다!"
 intermarium.4.a:0 "전투 태세, 전투 태세!"
 intermarium.9.t:0 "대역죄"
 intermarium.9.desc:0 "크이우에서 충격적인 소식이 전해졌습니다! 러시아의 위협에 함께 맞서던 우리의 동맹국, 우크라이나가 우리를 배신하고 우리가 싸우려 했던 적과 손을 잡았습니다! 이를 좌시할 수는 없습니다. 지금 행동하지 않으면, 오랫동안 준비해 온 모든 것을 잃을 위험에 처할 것입니다."
 intermarium.9.a:0 "승리를 향하여!"
 intermarium.10.t:0 "우크라이나에 몰려드는 폭풍"
 intermarium.10.desc:0 "우크라이나와 그 동맹국들이 우리를 상대로 전쟁을 준비하고 있습니다! 그들은 드니에프르강 좌안에 대한 영유권을 주장하며, 우리의 조국이 막 재통합된 상태로 아직 취약한 틈을 노려 인테르마리움 동맹이 공격을 감행하려 하고 있습니다."
 intermarium.10.a:0 "승리를 위하여!"
 POL_huzarzy_smierci:0 "해골 후사르대"
 POL_new_era_new_economy:0 "신 시대, 신 경제"
 POL_new_era_new_economy_desc:0 "비록 경제를 국유화하고 사회화했으나, 사나치아는 국제적 연계와 교류를 바탕으로 성공을 이루었습니다. 그러나 폴란드 경제는 외국 관광객, 독일 상품, 우크라이나의 곡물 등 우리에게 행복에 꼭 필요한 것도 아닌 것들에 의존하고 있습니다. 우리는 폴란드에서 직접 강철을 구워내고 빵을 만들 수 있으며, 문화는 귀족들의 시장이나 죽은 박물관으로 전락해서는 안 됩니다.\n\n새로운 자드루즈나 시대가 도래하고 있으며, 그와 함께 새로운 경제 체제가 시작됩니다. 폴란드는 주변 국가들에 경제적으로 종속되는 것이 아니라, 오히려 우리 스스로 필요한 것을 생산하고, 수출을 줄이는 것이 아니라 더욱 늘려야 합니다.\n\n이에 따라, 우리는 피우수트스키 원수가 세운 경제 노선을 재조정하고, 올바른 방향으로 이끌어야 합니다."
 POL_dream_of_zadruga:0 "자드루가의 꿈"
 POL_dream_of_zadruga_desc:0 "우리는 해냈습니다. 문화대혁명이 성공적으로 이루어졌으며, 폴란드인의 정신을 중세의 환상에서 벗어나 보다 현대적이고 이성적인 형태로 변화시켰습니다. 우리는 앞으로 나아가고 있지만, 아직 전투가 끝난 것은 아닙니다. 피우수트스키와 그의 동료들이 남긴 문제들, 그리고 여전히 폴란드를 짓누르는 로만 드모프스키의 유산을 해결해야 합니다.\n\n자드루가의 과제는 국가의 심각한 경제 상황을 바로잡고 미완의 과업을 해결해야 합니다. 정체된 농업 개혁, 인테르마리움의 통합, 모스크바와의 전쟁 준비, 그리고 국가의 전반적인 경제 동원을 추진해야 합니다. 문화 개혁의 실현 자체가 우리의 경제적 야망과 긴밀히 연결되어야 합니다.\n\n왜냐하면 우리가 선언하듯이, 국가는 개인들의 집합체가 이념적 지향에 의해 결속된 단일한 민족 공동체이며, 이 사상의 지도 원리가 국가가 존속할 것인지 전장에서 쓰러질 것인지를 결정하기 때문입니다."
 POL_mastery_over_matter:0 "사안통달"
 POL_mastery_over_matter_desc:0 "도시를 연구하라! 연구 도시, 해양 도시, 공업 도시, 군사 도시, 민간 생산에 집중하는 도시들! 도시, 도시, 도시! 마을과 작은 정착지까지! 온 세상이 도시로 덮이게 하라! 땅속 깊은 곳에서부터 거대한 대도시가 솟아올라 우리의 지배력과 기술력을 상징하게 하라! 농촌은 무의미하며, 도시는 전부다! 도시는 가장 현대적인 인간의 창조물이며, 현대성과 아름다움의 모든 것을 응축한 결정체다. 폴란드는 하나의 거대한 산업 지대로 변모할 것이며, 이는 폴란드인을 하나로 묶고 나아가 인테르마리움 전체를 생산의 춤 속에서 하나로 결속시킬 것이다. 우리는 개미처럼, 벌레 같은 인간이 될 것이다. 그러나 우리의 개별성은 사라지지 않는다. 우리는 개인이란 결국 무상하지만, 대중이야말로 미래를 창조하는 힘임을 인식한다. 어떤 이는 이를 회색빛 암울한 미래라 생각할 수도 있다. 그러나 도시와 초사회는 하나의 위대한, 찬란한 춤이 아니던가?"
 POL_project_perun:0 "페룬 계획"
 POL_project_perun_desc:0 "근본입자마저 잘개 쪼개어 어마어마한 양의 힘을 풀어낼 수 있다는 새 이론이 주목을 받고 있습니다. 이 발상은 현재 순수한 이론적 영역에 머물러 있지만, 군사 영역에서의 잠재적 적용 가능성을 생각해보면 해볼 만합니다. 하지만 그 무게를 생각하면 비밀스레 추진함이 옳을 것입니다."
 poland.12.a:0 "\"너거들 깜딩이 음악이 정신에 안좋은거 알제?\""
