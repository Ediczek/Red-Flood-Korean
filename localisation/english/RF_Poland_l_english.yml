 POL_Zadruga.19.t:0 "정의의 행진"
 POL_Zadruga.19.desc:0 "밤이 깊어진 바르샤바의 거리에는 불의 바다가 넘실거렸다. 횃불의 불꽃이 마천루의 창문에 반사되며 하늘의 별빛을 희미하게 만들었다. 그러나 이 장엄한 광경 속에서도, 붉게 타오르는 숯덩이 외에는 누구도 감히 소리를 내지 못했다. 젊은 군단의 민족주의자들, 강권당, 엔데크(민족민주당원) 잔당들, 심지어 아나키스트들까지도 벨베데레 궁전과 왕궁 앞에서 펼쳐진 위대한 행진에 동참했다. 그러나 이 순간은 그들의 것이 아니었다. 얀 스타흐니우크, 얀 헴펠, 볼레스와프 피아세츠키, 그리고 그들의 선봉에 선 스타니스와프 수칼스키. 자드루가를 이끌며 광기에 찬 피우수트스키주의자들과 함께, 이들은 대원수의 후계자들에게 조용하면서도 거대한 전쟁을 선포하고 있었다.\n\n동시에 젊은 장교들과 젊은 군단 민병대 지도자들은 참모본부를 포위하여 에드바르트 리츠시미그위를 포획하려 했다. 마침내 그들은 깨진 창문으로 들어온뒤 장군을  밖으로 끌어냈다.\n\n법무부 장관으로서의 임무를 마치고 자리를 뜨려던 발레리 스와베크는 라친스키 궁전 근처에서 붙잡혔다. 이 아나키스트들은 돼지의 내장을 그의 대머리 위에 부으며 피로 낙인을 찍었다.\n\n동시에, 가장 잔혹하고도 야만적인 형벌이 이그나치 다신스키에게 가해졌다. 그는 국가지도자로서 무능하고 약하다는 이유로 제거 대상이 되었던거다. 죽음 후사르 부대의 타타르 이교도들은 갈비뼈가 부러진채 신음하는 그를 들고 왔다 .\n\n그들은 결국 텅 빈 왕궁과 폴란드 국가수장의 자리로 끌려왔다. 헴펠, 피아세츠키, 스타흐니우크, 그리고 맨 앞에 선 수칼스키가 반원형으로 섰다. 수칼스키는 마치 세상을 손에 쥐려는 듯 두 팔을 펼치고, 예언자처럼 군중을 향해 외쳤다.\n\n\"동지들이여, 형제자매들이여! 조상의 신앙을 따르는 자들이여, 영원한 피의 맹세를 믿는 자들이여, 그리고 분노로 타오르는 이들이여! 우리는 조국을 배신하고 가장 극악한 죄악을 저지른 자들을 이 자리로 데려왔다. 그 죄란 바로 신의를 저버린 것이다! 정직하지 않은 자들이 어떻게 우리를 영광으로 이끌 수 있단 말인가? 원수 피우수트스키께서는 이들에게 조국의 영광을 위해 헌신할 것을 기대하셨다. 그러나 지금, 나는 그의 예언자로서, 유제프 피우수트스키의 신실한 선지자로써, 그들에게 묻는다! 생명이냐, 죽음이냐?\"\n\n군중은 속삭이며 웅성거렸다. 그들의 푸른 눈, 밤색 눈, 초록빛 눈동자에는 야수적이고도 원시적인 분노가 일렁였다. 그러다 한 목소리가 하늘을 향해 울려 퍼졌다. 페룬과 스비아토비트, 그리고 저 하늘의 신들을 향한 절규였다. 곧이어 수많은 목소리가 기쁨에 찬 외침으로 화답했다.\n\n\"죽음이다! 오직 죽음만이 우리를 그들의 사슬에서 해방시킬 것이다!\"\n\n그 말이 떨어지자, 가면을 쓴 죽음 후사르들은 세 사람을 지붕에서 걷어찼다. 그들은 불길이 넘실거리는 거리로, 번뜩이는 냉철한 단검이 기다리는 곳으로 추락해갔다."
 POL_Zadruga.19.a:0 "그렇게 죽음은 우리 모두를 하나로 묶어주었지"
 POL_startup.16.t:0 "우리 문 앞의 발렌로트"
 POL_startup.16.desc:0 "\"이제 앉으시게.\"\n에드바르트 시미그위는 책상 옆의 의자를 손짓하며 가리켰다. 젊은 남자는 끝도 없는 인사말을 늘어놓던 중이었으나, 그것은 시미그위가 지겹도록 들어왔으나 결코 피할 수 없는 아첨으로 가득 차 있었다. 그는 잠시 망설이며 원수를 쳐다보았다. 그러다 마치 생명줄을 붙잡듯 허겁지겁 의자에 앉았다.\n\"장군님, 저는 오늘 서부 폴란드인들의 처참한 상황을 호소하러 왔습니다. 수백 명과 대화해 보았는데, 많은 이들이 당을 향해 비겁하다고 비난하고 있습니다. 국경 지역은 여전히 폴란드적 정체성을 전혀 띠지 못하고 있습니다...\"\n\n시미그위는 젊은이의 불타는 열정, 격렬한 손짓, 광기 서린 눈빛을 지켜보며 간신히 웃음을 참았다. \n\"갈리치아에서 폴란드인을 겨냥한 테러 행위는 보고된 것보다 훨씬 심각합니다. 많은 범죄자들이 우크라이나 민족단와 협력하여 하급 관료들을 공격하고 있으며, 저와 몇몇 동료들은 르부프에서 발생한 암살 사건들이 우크라이나 분리주의 세력과 연계되었다는 명백한 증거를 확보했습니다...\"\n\n시미그위는 몸을 뒤로 젖히고 무표정하게 젊은이를 바라보았다. 그는 지금껏 받아온 보고들, 자신의 자문위원들이 우려하며 속삭였던 말들, 그리고 거만하게 일축했던 조언들을 연결하며 퍼즐을 맞춰나갔다.\n\"그래서, 친구, 자네 생각에, 당은 이 문제를 어떻게 해결해야 할 것 같은가?\"\n젊은 남자는 잠시 침묵했다. 눈이 크게 흔들리며 망설이는 듯했으나, 곧 철저히 준비한 듯한 답변을 쏟아내기 시작했다.\n\"리투아니아와 폴란드 내 폴란드계 소수 민족에게 더 많은 고려가 주어져야 합니다. 그 국가들의 정부를 압박하여 자치권을 확대하고, 우리가 그들을 방어할 더 큰 권한을 갖도록 해야 합니다... 갈리치아에서는 폴란드어 교육만을 엄격하게 시행하고, 정교회를 강력히 탄압하는것을 제안드리고 더욱이 그리스-가톨릭 신자들을 중앙 교회 구조에 통합하는 것을 해야하지않겠습니까?\"\n시미그위는 천천히 고개를 들었다.그리고 조용히, 깊이 끄덕였다. 젊은 남자는 이를 신호로 받아들이고 다시 입을 열었다."
 POL_startup.16.a:0 "흥미롭군."
 POL_startup.17.t:0 "프란크와 그의 카발리스트들"
 POL_startup.17.desc:0 "이그나치 다신스키는 깊은 밤까지 사무실에서 글을 쓰고 있었다. 그는 별로 중요하지도 않은 경제 논쟁에 대해 반쯤 정신이 나간 상태로 문서를 정리하고 있었는데, 갑자기 문을 두드리는 소리가 그를 번쩍 정신 차리게 했다. 이 시간에 누가 감히 자신을 방해하려 드는 것인지 알 수 없었으나, 그는 국가와 국민의 봉사자로서 방문을 받아들이기로 했다.\"들어오시오.\" 그는 목을 가다듬으며 또렷하게 말했다. 그리고 그 순간, 문이 열리며 얀 헴펠이 걸어 들어왔다. 헴펠. 그는 폴란드의 기존 정치 세력들에게 정치적 폭풍과도 같은 존재였다. 심지어 사나치아 정권조차도, 국가를 위해서라면 자유를 침해하는 것도 불사하는 그들이었음에도, 자드루가의 신비주의적 가르침만큼은 거부했다.그럼에도 불구하고, 많은 이들은 헴펠과 그의 동지들을 존경했다. 그들은 폴란드라는 신생 국가를 형성하는 데 기여한 인물들이었기 때문이었다. 그리고 헴펠 자신도 한때 다신스키와 같은 폴란드 사회당에서 활동했던 투사였다.\n\n\"무슨 일로 왔소, 헴펠 씨? 중요한 이야기라도 있소?\" 다신스키는 신중한 태도로 헴펠을 맞이했다. 그는 자드루가의 젊은 추종자들과 함께 이교도 축제를 벌인다는 소문이 있는 이 매끄러운 말솜씨의 활동가를 경계했다. 헴펠은 고개를 끄덕이며 입을 열었다. \"정치적 제안을 하러 왔소. 자네도 입문할 생각이 있소?\"\n\n다신스키는 눈썹을 살짝 치켜올렸으나, 말을 아꼈다. 폴란드 민주주의를 지키기 위해서라면, 누구의 제안이든 신중히 들어볼 가치가 있었다. 헴펠 같은 예측 불가능한 인물에게서 나온 제안이라도, 만약 그것이 합리적인 한도 내에 있다면 받아들일 수도 있었다. \"내가 제안하는 것은, 자네의 그룹과 자드루가 간의 정치적 동맹이오. 우리는 자네의 정책을 지지할 것이며, 그 대가로 우리 조국을 위해 반드시 완수해야 할 프로젝트들을 후원해 주길 바라오. 자네도 우리의 폴란드 장기적 계획을 완전히 동의하진 않겠지만, 우리는 한때 같은 PPS 동지였소. 그렇다면, 공통의 목표 하나쯤은 있지 않겠소?\" \"그리고 그 프로젝트들이란 게 무엇이오?\" 다신스키가 조심스레 물었다. 헴펠은 여유로운 미소를 지으며 대답했다. \"우리는 몇 가지 가장 악질적인 성직자들의 특권과 행동을 규제하려 하오. 모든 폴란드인이 속으로 저주하고 있지만, 누구도 감히 입 밖에 내지 않는 것들 말이오. 그리고 인프라 프로젝트도 추진하려 하오. 다리와 철도를 건설하는 것 같은 일들 말이오.\"\n\n다신스키는 잠시 생각에 잠겼다. 이 제안은 합리적인 범위 내에서 이루어질 수도 있었다. 그러나 그는 헴펠이 언제든 본색을 드러낼 수도 있다는 점을 경계해야 했다. 또한 자드루가 같은 집단과 연합하는 것은 폴란드 사회의 전통적 기반과 거리를 두는 행위였다. 그 사실이 알려진다면 그의 정치적 입지에도 타격을 줄 것이 분명했다. 게다가 그는 자신의 당을 충분히 신뢰하고 있었다. 그들의 수는 많지 않더라도, 폴란드 민주주의에 대한 신념만큼은 굳건했다."
 POL_startup.17.a:0 "\"보시오, 헴펠, 내 생각은 말이오...\""
 poland.53.t:0 "폴란드에서 온 한 제안"
 poland.53.desc:0 "인테르마리움과의 동맹?"
 poland.53.a:0 "우리는 기쁘게 받아들일 것이다"
 poland.53.b:0 "우리 일은 우리가 알아서 해결하겠다."
 poland.54.t:0 "아메리카에서의 모험"
 poland.54.desc:0 "인테르마리움에 들어오시겠나요?"
 poland.54.a:0 "네 새로운 동맹은 언제나 환영입니다."
 poland.54.b:0 "아니 미국이 우릴 더 잘지켜 줄꺼야"
 POL_hempel_coup:0 "헴펠에게 권력을 더 주기."
 POL_piasecki_coup:0 "피아세츠키에게 권력을 더주기"
 poland.2000.t:0 "썩은 고기"
 poland.2000.d:0 "타이니 데텍티브의 최근 기사는 지난 호보다도 더 큰 분노를 불러일으켰다. 이는 대부분의 사람들이 불가능하다고 여겼던 경지의 성취였다. 그 신문이 일관된 목적과 방향성을 가질 수 있다면, 이번 기사는 분명 정부를 겨냥한 것이었다. 신문 한가운데에는 끔찍한 광경이 펼쳐져 있었다. 한 소녀의 시신이 침대 위에 널브러져 있었고, 가벼운 천으로 덮인 시트는 피로 얼룩져 있었다. 입은 벌어진 채 얼어붙었으며, 거의 미소를 짓고 있는 듯한 표정이었다. 뿌옇게 흐려진 눈에는 아직도 희미한 기쁨이 서려 있었다. 그녀는 죽어서도 아름다웠다. 그리고, 오! 이 가련한 소녀에게 닥친 비극이란!  그녀는 한 장교와 몇 차례 밀회를 가졌다. 그러나, 그 남자는 그녀가 또 다른 남자를 매혹시킨 사실을 알게 되었고, 침대 위에서 그녀를 칼로 찔러 살해했다. 그는 그녀가 자신을 사랑한다고 믿었다. 그들은 결혼할 예정이었다. 그리고 그는 사나치아(Sanacja) 정권의 고위 인사의 아들이었고, 그녀는 한 평범한 노동자의 딸이었다.\n\n이것은 진정한 로맨스 이야기였다. 단순하지만 매력적인 문체로 쓰였으며, 그 과장된 서술은 기사 위에 펼쳐진 참혹한 장면이 그 자체로 모든 것을 설명하도록 만들었다. 이 결혼은 본래, 정권이 장려하는 이상적인 결합의 형태였다. 그러나 너무나도 인간적인 욕망에 의해 무참히 끝나고 말았다. 기사는 이 잔혹한 행위를 마치 경외할 만한 사건처럼 묘사했다. 스카만드리치 문학파는 이 작품을 칭송했다. 수많은 예술가들이, 질투심에서든 경외심에서든, 이 기사를 자신들의 대화 속에서, 혹은 작품 속에서 언급하기 시작했다. 타이니 데텍티브는 하나의 현상이 되었다. 그들은 이 나라의 ‘취향 있는 남성들’이 매 호를 숨죽이며 기다리는, 끔찍하고도 외설적인 잡지가 되었다.\n그러나, 사나치아 내에서 이 잡지는 폴란드 사상의 타락을 상징하는 존재였다. 그들은 이를 두고 분노하며 말한다. \"이것은 프로이트적이며, 사회에 있어서는 있어서는 안 될 해방구다!\" \"이것은 빈민가와 감옥에서 태어난 프롤레타리아 문화의 산물이며, 이런 천박한 잡지는 혁명을 꿈꾸는 이들이 아닌, 타국의 부르주아 여성들이 몰래 탐닉할 만한 것에 불과하다!\" 최근 기사와 관련하여, 정권의 지지자들은 이 잡지가 반정권 세력에 의해 운영되며, \"사나치아의 노동자들을 희화화하고, 그들의 사생활을 비극적 희극으로 만들고 있다!\" 고 주장했다. 경찰들은 심지어 이 잡지가 단순한 예술적 모방을 부추기는 수준이 아니라, 범죄자들이 기사를 위한 ‘오디션’을 치르듯, 자신들의 범죄를 점점 더 대담하고, 극적이며, 잔혹하게 만든다고 경고했다.\n\n그러나, 아이러니하게도, 이제 이 잡지는 국가의 소유가 되었다. 즉, 우리의 손에서 그 운명이 결정될 것이다. 정권의 예술가들은 이를 폐간하지 말아달라고 간청했다. 그들은 이 잡지가 ‘끔찍한 사건들’을 너무나도 아름답게 묘사하여, 그 자체로 예술적 가치를 지닌다고 주장했다. 반면, 대부분의 사나치아 지지자들은 즉각적인 폐간을 요구하고 있었고, 경찰들은 그 작가들을 심문해야 한다며, 그들이 단순한 관찰자가 아니라, 사건의 공모자일 가능성까지 시사했다. 어찌 되었든, 이 외설적이고도 악명 높은 잡지를 두고 우리는 어떤 결정을 내려야만 한다."
 poland.2000.a:0 "검열따위는 없다! 못 보겠다면, 안 보면 되지!"
 poland.2000.b:0 "이런 해로운 잡설은 반드시 파괴되어야 한다."
 poland.2001.t:0 "장군 각하의 연인"
 poland.2001.d:0 "볼레스와프 드우고쇼프스키 장군은 사나치아 정권 아래에서 등장한 ‘신혁명적 인간’의 전형이었다. 그는 혁명 당시 나첼니크와 함께 싸우며 전쟁 영웅이자 존경받는 장군으로 떠올랐다. 그는 피우수트스키의 부관이자, 한때 폴란드 군부의 수장을 맡기도 했다. 그러나 정권이 서서히 안정되면서, 그는 현대 바르샤바의 물질적 쾌락 속으로 머리부터 뛰어들었다. 그의 집은 문학 살롱이 되었고, 은밀한 만남의 은신처가 되었으며, 젊고 재능 있는 천재들이 드나드는 곳이 되었다. 그의 점점 더 방탕해지는 생활은, 그만큼이나 화려하고 거대한 자선 활동으로 가려졌다. 그리고 무엇보다, 그는 당(黨)에 대한 변함없는 충성을 유지했다.\n\n그러나, 단 한 편의 삼류 신문 기사로 인해, 모든 것이 폭로되었다. 그 기사에는 장군이 바르샤바의 가장 세련된 지역을 어지럽게 다른 여성들과 어울리며 활보하는 모습이 실려 있었다. 사진과 함께 여성들의 신상 정보와 일상, 그리고 드우고쇼프스키와 그의 연인들이 드나든 수많은 부티크, 레스토랑, 보석 상점의 영수증이 공개되었다. 그 기사에는 경악할 만한 금액이 나열되었다. 프랑스산 목걸이와 밍크코트에 수천 즈워티, 유럽 전역에서 수입된 술통, 희귀하고 복잡한 진미들 그저 읽는 것만으로도 이 나라 최고의 미식가와 세계인들조차 질투할 만큼의 사치였다.\n\n그 기사는 정확히 일주일 전 발행되었고, 이제 군부와 사나치아 정권과 직결된 언론을 제외한 모든 주요 신문에서 이를 대대적으로 보도했다. 그러나 이것이 드우고쇼프스키 장군의 뛰어난 기동력으로 인함은 아니었다. 오히려, 그는 이 스포트라이트를 즐기고 있었다. 그는 각종 가십 잡지에 인터뷰를 싣고, 방탕한 이미지를 더욱 확고히 하면서도, 수많은 애정 어린 팬(대부분 여성인)들을 얻었다. 그의 유명한 문구는 이렇다. \"나는 만난 모든 여인들에게 잘해 주었소.\"\n그리고 이어지는 능청스러운 변명. \"그런데도 그들은 나를 비방하는군.\" 그의 비판자들은 그와 그의 신화를 내버려 두었다. 지금은 그를 숭배하는 이들이 많지만,그들은 경고했다. 그의 습관은 언젠가 그를 파멸로 이끌 것이다.고 그러나, 그의 노출이 늘어나면서, 그는 단순한 유명인에서 아이콘이 되었다. 새로운 젊은 자유주의적 세대는 드우고쇼프스키를 파트롱-성인처럼 모셨고, 많은 이들이 자신들의 작품과, 심지어 방탕한 향연까지 그의 이름으로 헌정했다."
 poland.2001.a:0 "장군 각하를 위한 만세 삼창!"
 poland.2002.t:0 "단련 정권"
 poland.2002.d:0 "- 시민 얀코프스키, 입장하시오! 제복을 입은 관리의 메마른 목소리가 울려 퍼졌다. 거의 1분이나 지난 다음에야, 크고 붉은 얼굴을 한 남자, 즉, 문제의 시민 얀코프스키가 숨을 헐떡이며 땀을 뚝뚝 흘린 채 기어들어왔다. 그가 들어선 곳은 극도로 절제된 사무실이었다. 그곳을 장식한 것은 피우수트스키와 지에르진스키 두 사람의 거대한 초상화뿐이었다.  \n\n- \"시민 얀코프스키, 그의 신체검사 결과는 매우 실망스럽소.\" 독수리 같은 눈매를 가진 관리가 잠시 말을 멈추고는 한 장의 서류를 그 뚱뚱한 먹잇감에게 밀어 넘겼다. \"동지는 E 마이너스(E-) 등급 판정을 받았소. 군 복무는커녕, 국가 공동체의 건강을 해치는 위험 요소로 지정되었지. 따라서 강제 체력 단련 캠프에 참석해야 하오.\" \n\n뚱뚱한 남자는 어떠한 반항도 하지 않았다. 그는 수치심에 움츠러들었으며, 눈앞의 메마른 천사가 이 수치스러움에서 벗어날 수 있는 방법을 자세히 설명할 때마다 그저 고개를 끄덕이며 묵묵히 받아들였다.  \n\n- \"우선, 식단부터 조정해야 하오, 시민동지. 보드카와 단 음식은 금지요. 의사들이 철저히 관리할 것이오. 그 다음은 운동. 좋은 운동을 거치고 나면, 동지도 진정한 남자가 될 수 있을 것이오!\"\n\n관리의 건조한 설명이 계속 이어지는 동안, 얀콥스키의 시선은 위쪽으로 향했다. 바로 장엄한 독재자의 초상화. 그는 국가가 자신을 수치스럽게 만들고, 훈련된 개처럼 뺑뺑이 돌게 만드는 것에 분노했다. 그러나, 도시 곳곳에서 자신을 내려다보는 그 편재하는 얼굴, 그 미묘한 미소는 그를 당혹스럽게 했다.  \n\n이 남자는 정말 나를 사랑하는 것일까? 그는 진정으로 나를 강하고 건강하게 만들고 싶어 하는 걸까? 그것이 단순히 대포사료로 쓰기 위해서가 아니라, 새로운 인간을 창조하기 위한 것일까?\n\n- \"그리고 명심하시게, 시민 얀코프스키. 이 모든 것은 자네를 위한 것이오. 왜냐하면, 동지 지에르진스키는 우리 모두를 사랑하니까.\""
 poland.2002.a:0 "\"해산하시오\""
 poland.2003.t:0 "슈퍼 행복 모두의 애정부"
 poland.2003.d:0 "유제프는 애부(Ministry of Love: 애정부)에서 온 남자를 혐오했다. 너덜너덜한 외모, 달래는 듯한 목소리, 빵 반죽 같은 소년의 얼굴 이 모든 것은 오직 사나치아의 정부 부처내의 관료적 미로 속에서만 자신의 자리를 보장받아온 자의 본모습을 숨기고 있었다. 또다시 불려왔다. 그 괴상한 그림이 걸려 있고, 불편할 정도로 푹신한 의자가 놓인 작은 사무실로. 유제프는 그의 눈에 침이라도 뱉고 싶었지만, 그러면 다시 사회봉사 업무에 배치될 것이 뻔했다. 유제프는 그것이 이 애부에서 온 또라이보다 더 싫었다.\n\n“당신이 화가 난 것을 압니다. 하지만 무력한 분노는 오히려 더 큰 불만을 키울 뿐이에요—”\n“그건 니가 더 잘하잖아!”\n유제프가 침을 뱉듯이 말했다. 애부에서 온 남자는 조용해졌고, 그의 입에는 우스꽝스럽기까지 한 비뚤어진 미소가 걸렸다. 그는 몸을 돌려 펜과 종이를 꺼내 몇 가지 메모를 적었다. 요제프는 그를 때려눕히고 싶었지만, 그저 앉아서 그가 메모를 내려놓는 것을 노려볼 뿐이었다.\n“유제프, 나는 당신을 잘못 판단했던 것 같군요. 당신은 우울증도, 망상도, 반사회적 성향도 없습니다.”\n애부남의 목소리가 달라졌다. 지난 네 번의 면담 동안, 그는 한 번도 이렇게 직설적이고 날카로운 어조를 사용한 적이 없었다. 유제프는 잠시 당황했지만, 내색하지 않으려 애썼다.\n“그래요, 이제야 알겠어요. 당신은 그저 불쾌한 사람일 뿐입니다. 너무 많은 일을 겪었고, 사람들의 최악의 모습을 보아왔죠. 당신은 오로지 혐오하는 자들과만 관계를 맺어왔어요. 당신이 말했던 어머니, 그리고 범죄자들. 물론, 그중 하나가 당신이 이곳에 온 이유였죠.”\n“그 새끼는 한 대 줘 터졌어야 했어. 애비가 없었는지, 아니면 있어도 훈육을 안 했는지 몰라도소리를 꽥꽥 질러대는 꼴을 보니 그러지 않으면 안됐다고. 내가 그 애한테 친절을 베푼 거라고! 그런데도 나를 폭력배라 부르다니! 그 양반들 뻔뻔하기 짝이 없구만! 이 수용소엔 바르샤바 거리의 한 구석보다도 범죄자가 적다고!”\n유제프는 이번만큼은 애부남이 자신의 말을 끊지 않는다는 사실에 놀랐다. 항상 중간에 가로막던 그가, 이번에는 무표정하게 듣고 있었다. 유제프는 그의 갑작스러운 태도 변화가 다소 불안했다.\n“이곳은 단순한 감옥이 아닙니다, 유제프. 자, 한 잔 하시죠.”\n애부남이 병을 꺼냈다. 유제프의 얼굴이 확 폈다.\n“이 모든 운영은 당신 같은 사람들을 더 나은 존재로 만들기 위한 것입니다. 당신이 때린 사람들을 사랑하도록 배우기 위해서. 당신이 하는 일을 즐길 수 있도록 하기 위해서.”\n두 사람은 유익한 대화를 나누었고, 몇 달 만에 처음으로 유제프는 미소를 지으며 사무실을 나섰다."
 poland.2003.a:0 "모두 사랑을 배우게 합시다."
 poland.2004.t:0 "예티니시니!"
 poland.2004.d:0 "그들은 도처에 있었다. 그래, 어디에나 있었다. 해골의 형태가 일치했다. 그는 왜 이제껏 보지 못했던 것일까? 그러나 이제 그는 가혹한 진실을 깨닫고 있었다. 그들 모두가 예티신이었다. 피아세츠키, 헴펠, 스타흐니우크. 모두! 그들은 그를 둘러싸고 그의 시야를 왜곡했다. 모스크바 원숭이들과 표백된 아비시니아인들. 그들은 그를 정신병원에 가두고 고문을 선고했다.\n\n스타니스와프 수칼스키는 그 자신의 \"개인 엘바 섬\"과도 같은 호로슈치 정신병원으로 유배당했다. 그는 가족과 격리되었고, 가끔 전화기에서 흘러나오는 목소리가 실제 아내의 목소리가 아니라 녹음된 메시지라고 확신했다. 그와 함께 시간을 보내는 것은 다리를 너무 넓게 벌리는 간호사 소니아뿐이었다. 그날도 그는 홀로 방에 있었다. 간호사가 식사를 들고 들어왔다.\n\n\"나는 요안과 통화할 권리를 요구한다! 폴란드는 나를 필요로 해! 보리스 사빈코프는 도대체 뭘 하고 있는 거야? 그 역겨운 원숭이 놈!\"\n\n\"안녕하세요, 수칼스키 씨! 오늘은 새로운 계시를 얻으셨나요? 당신의 목소리는 언제나… 참 듣기 좋군요....\"\n\n\"다들 보이지 않나!?\"\n\n그는 서랍에서 발트해와 그 주변 지역의 지도를 꺼내어 간호사 앞에 펼쳤다. 손가락으로 한 곳을 가리키며 외쳤다.\"보후슬란!\"\n\n\"보후슬란 - 도 보가 비스와니 - 신께 보내어진 땅! 다 연결되어 있어! 노르웨이 공화국과 스웨덴 왕국의 갈등에 대해 읽다가 이걸 깨달았다고! 소냐, 이게 무슨 뜻인지 아나?\"\n\n\"그... 착한 환자는 약을 잘 챙겨 먹어야 한다는 뜻이죠?\"\n\n\"아니! 폴란드인들이 유럽 전체, 아니 세계 전체를 지배했을 터다! 만약 예티시니, 우리 민족의 강간에서 태어난 자들이 폴란드를 타락시키지 않았다면! 위대한 레히아는 로마 제국보다 훨씬 오래전에 존재했다고!\"\n\n\"그거 귀엽네요, 그런데…\"\n\n그녀는 자리에서 몸을 기울여 그의 어깨에 손을 얹고 천천히 손가락으로 어루만졌다.\n\n\"그렇다면, 이 외로운 간호사와 당신의 운명은 어떻게 되는 거죠, 보주(수령)?\"\n\n그러나 그는 그녀의 접근을 눈치채지 못했다. 그녀의 손을 툭 치워버리자, 간호사는 움찔하며 물러섰다. 슈칼스키는 그녀에게서 멀어져 지도를 조심스럽게 접었다.\n\n\"이것이 의미하는 바는… 네가 시민으로서의 의무를 다해 너의 보주(수령)가 그의 아내와 만나게 하고, 그들이 함께 탈출할 수 있도록 도와야 한다는 것이다!\"\n\n간호사는 실망스러운 표정으로 그를 바라보았다. 그러나 그는 아무런 관심도 보이지 않은 채, 그녀가 가져온 식사를 천천히 먹기 시작했다. 그리고 곧 침대 밑에서 자신의 노트를 꺼내 다시 연구를 이어갔다. 그는 낮은 목소리로 한 단어를 중얼거렸다. \"제르마트...\" 그의 연구 기록은 이미 10,000페이지에 달하고 있었다.\n\n\"스위스 지도를 가져와라. 또 다른 발견의 직전에 와 있는 것 같군.\""
 poland.2004.a:0 "호로슈치, 라파 누이, 그리고 간호사들,,,, 터보 레히주의자는 진정한 사랑을 찾을 수 있을까?"
 poland.2005.t:0 "무정부의 기사단, 라마야나의 공포"
 poland.2005.d:0 "강력한 신비로운 힘의 망령이 폴란드를 휩쓸었다. 기차역, 공원, 심지어 의회 셰임 앞에서도 폭발음이 울려 퍼졌다. 수많은 목이 잘려나갔다. 공포가 온 나라의 심장을 움켜쥐었고, 국가는 마치 붕괴 직전처럼 보였다. 스타흐니우크는 그야말로 움츨어들었고, 그의 눈에는 길을 잃은 듯한 기색이 역력했다. 용맹하게 국가를 이끌던 \"보주(수령)\"의 모습은 이제 한낱 희미한 기억일 뿐이었다.  불과 얼마 전까지만 해도 그는 피아세츠키와 나란히 서 있었다. 그러나 이제 피아세츠키의 두개골은 산산조각 나 수백만 개의 파편이 되어버렸다. 스타흐니우크는 자신도 곧 그렇게 될까 두려웠다. 그 악마 같은 헴펠은 증발해버렸고, 그는 그와의 대면조차 할 수 없었다. 영토 대부분이 무정부 상태에 빠져들었고, 중앙 정부와의 연락이 끊어진 지도 오래였다. 폴란드에는 확실히 무정부의 망령이 떠돌고 있었다. 그것은 마치 복수를 위해 돌아온 흡혈귀처럼 모든 것을 공포로 몰아넣고 피를 갈망했다. \"혁명적 복수단\"은 자드루가 전역을 위협했다.\n\n스타흐니우크는 자신의 집 안에서 무장 경호 속에 숨어 있었다. 그러나 그는 에드바르트 들루제프스키와 로만 쿠흐치아크가 죽음의 후사르 부대를 이끌고 집으로 들이닥쳤을 때조차 눈치채지 못했다. 그들은 그의 경호원들을 단순한 뇌물로 매수했고, 누구도 죽어가는 지도자를 위해 목숨을 걸고 싶어 하지 않았다.\n\n\"스타흐니우크 씨?\"\n\n\"로만, 알아보겠어. 들어오게.\"\n\n그는 책상에 몸을 기댄 채 앙상한 시체처럼 앉아 있었다. 머리카락은 빠지고, 마른 비늘처럼 벗겨지고 있었다. 그는 자리에서 일어나 술장이 있는 곳으로 가서 라디오를 켰다. 쇼팽의 녹턴이 흘러나왔다. 암살자들이 들어섰고, 드루제프스키가 조용히 입을 열었다.\n\n\"스타흐니우크 씨, 죽음이 두렵소?\"\n\n\"아니. 나는 신성으로 돌아갈 거다. 나는 그 신성에서 왔으니.\"\n\n그는 다시 책상으로 돌아와 앉았고, 피곤한 머리를 두 손에 괴며 암살자들의 시선을 피했다.\n\n\"거짓말이오. 하지만 괜찮소. 보주여 총알은 당신을 아프게 하지 않을 것이오.\"\n\n쿠흐치아크는 바에 놓인 라디오를 가리키며 침을 뱉었다. 라디오 신호가 점점 끊어졌다. 순간이 다가오고 있었다.\n\n\"음악의 아름다움을 모른 채 죽어가는 자들이여, 얼마나 불행한가…\"\n\n\"그러게 말이오. '음악 없는 삶은 하나의 실수다.' 하지만 질질 끌지 맙시다. 우리 모두 가야 할 곳이 있지 않소?\"\n\n그들은 서로를 바라보며 의미심장하게 고개를 끄덕였다. 모든 암살자들이 나강 리볼버와 비스 권총을 꺼내 조준했다. 라디오에서 흘러나오던 마지막 피아노 음계가 총성으로 묻혔다. 암살자들은 담배에 불을 붙이며 계단을 내려갔다. 라디오는 여전히 켜져 있었다.\n\n그 순간, 얀 헴펠의 목소리가 라디오를 통해 흘러나왔다. \"두려워하지 마십시오… 이 방송을 듣고 있는, 음악을 사랑하는 예민한 영혼들이여. 당신의 진정한 영혼은 새로운 이성을 찾고, 새로운 공동체를 위해 다시 태어날 것입니다. 아무도 고통받지 않을 것입니다. 제가 여러분 모두를 구원하겠습니다.\""
 poland.2005.a:0 "고통은 없었다. 오직 무법의 열반."
 poland.2006.t:0 "성 바르톨로메오의 밤"
 poland.2006.d:0 "“들어오게.”\n\n\"늦어서 죄송합니다, 키에로브니크 피아세츠키. 모든 것이 완벽하게 정리되었는지 확인하느라 늦었습니다.\"\n\n프셰타키에비치의 지각은 볼레스와프를 짜증 나게 했지만, 그 역시 계획이 완벽히 실행되어야 한다는 점에는 동의하고 있었다. 실패는 단순히 자신과 그의 계획, 그의 부하들만이 아니라, 폴란드 전체를 파멸로 이끌 것이었다. 수칼스키가 계속 권력을 유지하게 둘 수는 없었다. 그가 단독으로 지배할 경우, 폴란드는 대체 얼마나 더 망가질 것인가? 스타흐니우크와 헴펠이야, 슈칼스키보다는 나았지만, 결코 이상적인 지도자는 아니었다. 볼레스와프는 처음부터 알고 있었다. 수칼스키는 하나의 문에 불과하다—하지만 그는 그 문을 지나 새로운 길을 열어야 할 존재다. 키에로브니크가 다가올 위대함을 상상하며 생각에 잠긴 사이, 프셰타키에비치가 보고를 시작했다.\n\n\"보고서가 있습니다만, 읽을 시간은 없으시겠지요?\"\n\n\"그렇다. 요약해서 말하게, 지그문트. 궁금한 점이 있으면 내가 직접 묻겠네.\"\n\n\"우리 요원들은 이미 모든 곳에 침투해 있습니다, 국가의 핵심 기관은 물론이고, 시골 포비와트(군현)의 청사까지도 장악했습니다. 실행 후 다소 저항이 예상되지만, 실행 도중에는 거의 없을 것입니다.\"\n\n\"만약 누군가 폴란드를 위대하게 만들 기회를 거부할 정도로 어리석다면... 어쨌든, 수칼스키에 대해 말해보게.\" 피아세츠키가 말을 끊었다.\n\n\"예, 키에로브니크. 수칼스키는 현재 비공식 가택연금 상태에 있으며, 그의 정신 상태는 점점 악화되고 있습니다. 최근에는 폴란드인의 기원이 태평양의 외딴 무인도인 이스터 섬에서 비롯되었다는 이야기를 떠들어대고 있습니다. 가끔 폭력적인 모습을 보이지만, 빈도는 점차 줄어들고 있습니다. 본인도 서서히 자신의 처지를 깨닫고 있는 듯합니다.\"\n\n\"좋다, 더 이상 묻지 않겠네. 이제 폴스키에 라디오에 주파수를 맞추고, 다음 문장이 방송되는 즉시 행동을 개시하도록 명령하게. 『나는 국민 정치 조직의 키에로브니크, 볼레스와프 피아세츠키이며, 긴급 성명을 발표하겠다.』 우리는 반드시 폴스키에 라디오로 가서 방송을 송출해야 한다. 위치는 알고 있겠지?\"\n\n\"예, 알고 있습니다, 키에로브니크.\"\n\n\"그렇다면 자네가 운전하게. 우리는 해야 할 일이 많다, 지그문트. 하지만 민족적 돌파구는 그것을 요구하고 있다네.\""
 poland.2006.a:0 "민족적 대도약은 이제 막 시작되었다."
 intermarium.11.t:0 "인테르마리움으로의 초대"
 intermarium.11.desc:0 "폴란드 정부가 우리에게 인테르마리움 동맹 초청장을 보내왔습니다. 우리 국가의 지리적 위치와 과거 러시아 지배하에 있었던 경험을 고려하면, 이러한 동맹은 자연스럽게 보일 수도 있습니다. 그러나 이를 수락할 경우, 현재 내부 분쟁으로 혼란에 빠진 러시아 정부가 어느 형태로든 재정비되어 돌아오더라도, 상당한 수준의 억지력을 확보할 수 있다는 장점이 있습니다. 반면에, 반대의 목소리도 존재합니다. 이러한 동맹 가입은 지역 내에서 우리가 추구하는 독자적인 외교 정책을 포기하는 일이 될 수 있다는 것입니다. 이는 미래에, 우리가 지역 내에서 충분한 세력 기반을 마련하지 못했을 때, 재부상한 러시아 전체와 홀로 맞서야 할 위험으로 이어질 수 있습니다.\n\n결국 이 결정은 우리에게 달려 있습니다."
 intermarium.11.a:0 "받아들이지!"
 intermarium.11.b:0 "거부한다!"
 intermarium.12.t:0 "인테르마리움으로의 초대"
 intermarium.12.desc:0 "폴란드 정부가 우리에게 인테르마리움 동맹 초청장을 보내왔습니다. 우리 국가의 지리적 위치와 과거 러시아 지배하에 있었던 경험을 고려하면, 이러한 동맹은 자연스럽게 보일 수도 있습니다. 그러나 이를 수락할 경우, 현재 내부 분쟁으로 혼란에 빠진 러시아 정부가 어느 형태로든 재정비되어 돌아오더라도, 상당한 수준의 억지력을 확보할 수 있다는 장점이 있습니다. 반면에, 반대의 목소리도 존재합니다. 이러한 동맹 가입은 지역 내에서 우리가 추구하는 독자적인 외교 정책을 포기하는 일이 될 수 있다는 것입니다. 이는 미래에, 우리가 지역 내에서 충분한 세력 기반을 마련하지 못했을 때, 재부상한 러시아 전체와 홀로 맞서야 할 위험으로 이어질 수 있습니다.\n\n결국 이 결정은 우리에게 달려 있습니다."
