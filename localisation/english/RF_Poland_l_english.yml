 vilniuscrisis.8.a:0 "\"통합이냐... 아니냐?\""
 vilniuscrisis.9.t:0 "백기사들, 폴란드의 도시"
 vilniuscrisis.9.desc:0 "리투아니아 대통령 카지스 그리뉴스는 폴란드 외무장관 유제프 베크를 맞이하기 위해 빌뉴스 중앙역에 서 있었다. 원래라면 리투아니아의 외무장관이 나서는 것이 맞겠지만, 이번은 공식적인 방문이 아니었다. 폴란드인들은 자국의 외무장관을 맞이하기 위해 집결했고, 그는 리투아니아가 그들의 태도에 주눅 들지 않는다는 것을 보여줘야만 했다.\n\n이 난장판을 생각하는 것만으로도 머리가 어지러웠다. 그는 가까운 곳에 의자를 가져다 앉고 싶을 정도였다. 마침내 바르샤바에서 온 열차가 역에 도착했고, 열차가 멈추자마자 베크가 내렸다. 그는 그리뉴스와 악수를 나누었다.\n\n\"각하, 만나 뵙게 되어 기쁩니다. 시급한 현안을 바로 논의해야 한다고 생각합니다.\" 그리뉴스도 전적으로 동의할 수밖에 없었다.\n\n공식 차량이 대통령궁을 향해 출발했다. 그리뉴스와 베크는 몰려든 시민들에게 손을 흔들지 않기로 합의했다. 베크가 도착할 것이라는 소식이 전해졌을 때야 겨우 진정된 민심이 다시 들끓을까 걱정이 컸다. 그리뉴스는 제발 아무 일이 없기를 바랄 뿐이었고, 베크 역시 같은 생각인 듯했다. 하지만, 곧 군중의 함성이 들려오기 시작했다.\n\n처음엔 폴란드어와 리투아니아어가 뒤섞여 들려왔지만, 곧 빌뉴스의 폴란드인 다수가 목소리를 내기 시작했다. \"하일! 위대한 폴란드!\", \"우리를 이끌고 카우나스로 가줘!\" 등의 외침이 사방에서 들려왔다. 유제프 베크가 볼 수 있도록 폴란드의 통일을 주장하는 플랜카드가 높이 치켜들렸다. 그의 이름이 마치 주문처럼 군중 사이에서 울려 퍼졌다. 몇 주 동안 리투아니아인들과 싸운 끝에, 폴란드 조국은 마침내 잃어버린 자식들을 구원할 사자를 보낸 것처럼 보였다.\n\n차량이 대통령궁으로 들어서자, 소란스러운 시민들은 저 멀리 남겨졌다. 하지만 그리뉴스는 그 장면을 잊을 수 없었다. 베크는 이 상황을 어떻게 받아들이고 있을까? 폴란드는 누구의 편을 드는 것일까? 자신의 정부는 최선을 다했다는 것을 베크도 분명히 알고 있을 것이다. 그러나 리투아니아의 운명이 위태로운 지금, 그리뉴스는 최악의 사태만이 머릿속을 맴돌았다. 역사는 자신을 국가를 팔아넘긴 자로 기록할 것인가?"
 vilniuscrisis.9.a:0 "곧, 그는 그 답을 알게 될 것이다."
 vilniuscrisis.9.b:0 "곧, 그는 그 답을 알게 될 것이다."
 vilniuscrisis.10.t:0 "위기를 해결하는 법"
 vilniuscrisis.10.desc:0 "밤이 내려앉을 무렵, 요제프 베크와 그리뉴스 대통령, 그리고 리투아니아 내각은 긴 협의를 마치고 기자들 앞에 섰다. 베크는 미소를 지으며 공동 대응 방안을 결정했음을 발표했고, 이는 즉시 불안에 휩싸인 리투아니아 국민들에게 전달될 예정이었다.\n\n하루 종일 해답을 기다려온 시민들은 마침내 대통령궁 발코니에서 직접 그 답을 듣게 되었다. 폴란드인 베크와 리투아니아인 그리뉴스가 함께 군중을 향해 인사를 건넸다. 흥분한 시민들의 환호 속에서 베크가 먼저 입을 열었다.\n\n“폴란드인과 리투아니아인은 오랜 역사를 함께해왔습니다. 우리는 수 세기 동안 함께 승리를 거두었고, 함께 고통을 겪었습니다. 불과 20년 전, 우리는 함께 독립을 되찾았고, 이제 함께 이를 지켜낼 것입니다. 최근 빌뉴스에서 일어난 사건은 우리 미래를 위협하는 불길한 전조가 아니라, 우리의 우정을 시험하는 시련이었습니다. 그렇기에 저는 폴란드의 총독이 아니라 여러분의 동맹이자 동지로서 이곳에 왔습니다. 그리고 리투아니아 정부와 함께 공동 대응 계획을 마련했습니다.”\n\n베크가 한걸음 물러서자, 그리뉴스 대통령이 연설을 이어갔다. “사랑하는 리투아니아 국민 여러분,” 그가 입을 뗐다. “지난 몇 주 동안, 우리는 서로를 이해하고 이성적으로 행동해야 할 필요성을 절실히 깨달았습니다. 극단주의자들이 평화를 무너뜨리도록 놔둘 수는 없습니다. 바로 이 때문에 베크 장관이 오늘 이곳에 온 것입니다. 리투아니아인과 폴란드인, 우리는 이제 서로의 차이를 뒤로하고 하나의 합의점을 찾아야 합니다. 우리는 적이 아닙니다. 베크 장관은 우리와 함께하며, 이 불행한 사태에 연루된 모든 당사자들과 협상을 진행할 수 있도록 도울 것입니다.”\n\n베크가 다시 앞으로 나서 외쳤다. “폴란드인들이여, 형제들이여! 저는 여러분을 대표하여 이 자리에 섰습니다. 두려워하지 마십시오! 리투아니아인들은 협상과 평화를 원하고 있으며, 우리 역시 이를 지켜낼 것을 약속해야 합니다. 형제들이여! 무기를 내려놓고 리투아니아인들에게 평화의 손을 내밀어 주십시오! 평화에 기회를 줍시다!”\n\n베크의 승부수는 성공했다. 안도의 한숨을 내쉬며 그는 적이 다시 친구로 돌아가는 순간을 지켜보았다. 적대감이 사그라들고, 갈등이 해소되었다. 그는 조국에 보낼 보고서를 생각하며 미소를 지었다. 오늘 밤, 그는 폴란드, 리투아니아, 그리고 인테르마리움을 구한 사나이가 되었다."
 vilniuscrisis.10.a:0 "빌뉴스에서 내민 올리브 가지."
 vilniuscrisis.10.b:0 "빌뉴스에서 내민 올리브 가지."
 vilniuscrisis.11.t:0 "협상의 시작"
 vilniuscrisis.11.desc:0 "[POL.GetLeader]는 빌뉴스 위기에 대한 세 번째 보고서를 받았다. 이는 유제프 베크가 직접 작성한 것이었다. 그는 이를 대충 훑어보았지만, 굳이 자세히 읽을 필요는 없었다. 이미 좋은 소식을 알고 있었기 때문이다. 양측은 무장 충돌을 중단하고 평화적인 해결을 위한 협상을 시작하기로 합의했다. 베크가 연설을 했을 때, 모인 사람들의 경쟁심이 사라지는 순간을 보고 [POL.GetLeader]는 이를 실감할 수 있었다. 이제 남은 것은 베크가 장기적인 합의를 도출하는 것이었다.\n\n그 합의란 무엇이 될 것인가? 출발 전, 그는 베크와 여러 가지 가능성을 논의했다. 가장 유력한 방안은 폴란드인들에게 법적으로 몇 가지 보장을 제공하는 것이었다. 빌뉴스 지역의 인구 구성을 현실적으로 인정해야 했으며, 리투아니아가 이 문제를 질질 끌수록 국제 사회의 공감을 얻기 어려울 것이었다. 지금이야말로 외교적인 방식으로 문제를 해결할 기회였다.\n\n그 외에도 베크는 몇 가지 대담한 아이디어를 제안했다. 하나는 아예 리투아니아와 폴란드를 옛 폴란드-리투아니아 연방 시대로 되돌리는 것이었다. 두 개의 동등한 국가가 하나의 연방 아래 결속되며 모든 권리를 보장받는 체제였다. 뜻밖의 해결책이 될 수도 있었다. 그러나 폴란드가 훨씬 큰 나라였기에, 빌뉴스에서는 이를 사실상의 합병으로 받아들일 가능성이 컸다. 또 다른 방안으로는, 뜻밖에도 벨라루스와의 연합이 있었다. 베크는 흐라마다 정부의 주요 세력 일부가 빌뉴스의 인사들에게 동등한 연합 구상을 제안하며 분위기를 조성하려 한다는 점을 언급했다. 이 체제에서는 지역적 정체성이 특별히 존중받을 것이었다.\n\n리투아니아인들은 이를 어떻게 받아들일 것인가? 이는 결국 소수 민족을 위해 자국에 요구되는 양보로 보일 것이며, 이는 필연적으로 자국 내 민족주의자들의 반발을 불러올 것이다. 반대로, 바르샤바가 지나치게 소극적인 태도를 보이면 폴란드의 애국주의자들이 불만을 드러낼 것이 뻔했다. 어떤 결과가 나오든, [POL.GetLeader]는 요제프 베크가 최선의 선택을 내릴 것임을 믿어 의심치 않았다."
 vilniuscrisis.11.a:0 "계획을 믿자."
 vilniuscrisis.11.b:0 "계획을 믿자."
 vilniuscrisis.12.t:0 "협상의 시작"
