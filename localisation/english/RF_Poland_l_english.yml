 POL_PPS.1.t:0 "후원자의 죽음"
 POL_PPS.1.desc:0 "카지미에시 푸자크에게는 최악으로 시작된 하루였다. 그러나 그가 상황을 역전시킬 방법은 스스로 찾아내야 했다. 이그나치 다신스키의 사망 소식은 피우수트스키 사망 이후 불과 1년도 채 지나지 않아, 그의 후계자마저 갑작스럽게 세상을 떠났다는 사실을 이미 슬픔에 잠긴 국민들에게 어떻게 전해야 할지에 대한 심각한 고민을 야기했다. 최고 당국은 적절한 대응 방안이 마련될 때까지 이 사실을 전면 봉쇄하라고 지시했다. 모든 이를 안정시키기 위한 조치였지만, 새 나체일니크(Naczelnik)에게는 결코 쉽지 않은 과제였다.\n\n푸자크는 책상에 앉아 무수히 많은 초안을 적어나갔다. 조언을 구할 사람도 없었습니다. 만약 이 소식이 새어나가기라도 하면, 국가의 미래를 위협할 음험한 세력들이 어떤 시도를 할지 모르는 일이었다. 그는 스스로 확고함을 유지해야 했다. 그리고 폴란드 역시 그래야만 했다. 다신스키는 원수의 서거 이후로 사람들이 거리에서 계속 요구해 왔던 선거 일정에 대해 명확한 계획을 발표하지 않았다. 그렇다고 폴란드가 오늘이나 내일 혹은 다음 달에 곧바로 선거를 치를 수도 없는 노릇이었다. 시간을 두어야 했다. 사나치아는 폴란드 정치 전반을 휘감고 있던 거대한 체제였고, 새로운 운동들이 성장하고 민주적 활력을 되찾으려면 결코 단시간에 될 일이 아니었다. 푸자크는 자신에게 그것을 올바른 방식으로 해낼 힘이 있다는 사실을 알고 있었다. 아이러니하게도, 그 힘은 그가 해체하려고 했던 바로 그 체제 안에 내재되어 있었던 것이다. 그러던 중 문득, 그가 발표할 공식 성명에 담을 적절한 문구가 떠올랐다.\n\n바르샤바에서는 갑작스러운 기자회견이 열렸다. 국내외 언론 기자들은 중대한 발표가 있을 것이라는 사실만 전해 들었고, 구체적인 내용은 전혀 알지 못했습니다. 궁금증을 감추지 못한 표정과 라디오 기자들의 목소리에 기대감이 묻어나오는 가운데, 푸자크가 “나첼니크가 곧 도착한다”라는 안내 후 모습을 드러냈다. 이미 그의 머릿속에서는 발표할 내용이 명확히 정리되어 있었다. 기자들이 느낄 혼란을 푸자크도 같은 마음으로 공유하고 있었고, 기자회견이 끝날 때쯤이면 그들과 공감대를 형성할 수 있으리라 믿었다. 차분하고 단호한 목소리로, 새 나첼니크는 말을 이어갔다.\n\n“오늘 아침, 다신스키 댁으로부터 존경하는 이그나치 다신스키 씨께서 잠을 자던 중 평온히 영면하셨다는 소식을 접했습니다. 고인의 유언에 따라 장례 절차를 준비해 두었습니다. 이러한 상황에 따라 제가 폴란드의 새로운 나첼니크가 되었습니다. 예정되어 있던 개혁은 그대로 계속될 것입니다. 국민들께서는 자유롭고 공정한 선거를 요구하고 계시며, 저희는 상층부에서 진행할 적절한 개혁이 마무리된 후에, 그 권리를 전해 드릴 것입니다. 저희는 그 선거를 1941년에 치르기로 결정했으며, 우리나라의 모든 민주 정당들에게 문호를 개방할 계획입니다.”\n\n회견장은 잠시 정적에 휩싸였다. 곧이어 사람들의 박수 소리가 터져 나왔다. 집이나 거리에서도 애도의 분위기는 이내 환호로 바뀌었다. 푸작은 미소를 지었다."
 POL_PPS.1.a:0 "그덕에 위기를 모면했구나."
 POL_PPS.2.t:0 "모든 것은 폴란드를 위해, 그리고 폴란드인과 함께"
 POL_PPS.2.desc:0 "\"카지미에시 푸자크는 이 점에서 피우수트스키나 마야콥스키, 심지어 콜차크와도 다를 바가 없습니다!” 빈첸티 비토스가 의회 세임에서 이렇게 선언했다. “고 이그나치 다신스키는 자비롭게도 제가 조국에 돌아올 수 있게 해주었고, 정치적 자유를 회복시켜 주셨습니다. 하지만 그 뒤를 이은 인물이, 그의 죽음 직후에 우리 모두를 이렇게 우롱해 버리는군요! 이렇게 추진한다는 ‘민주주의로의 과도기’라는 것이 사실은 또 다른 독재가 아니고 무엇이겠습니까! 이대로면 우리 모두 베레자 카르투스카 수용소에 갇혀 버릴 테고, 이후 PPS가 엉터리 선거를 치르게 될 것입니다. 우리는 그들의 속임수에 걸려들었어요!”\n\n연설이 끝나자마자, 모든 우파 정당 의원들이 박수를 보냈다. 엔데챠(민족민주당), 인민당 피아스트파, 기독민주당의 의원들은 자리에서 일어나 비토스의 발언에 환영의 뜻을 표하며, 연정 탈퇴를 공식 발표했다. 푸작은 그들을 바라보다가, 이어 회의장 전체를 둘러보며 얼마나 많은 이들이 이 주장에 동의하고 있는지 확인했다. 그리고 그는 비토스의 연설이 실제로 어떤 반응을 이끌어냈는지에 놀랐다. 거의 모든 정당 안에서 일부는 박수를 쳤고, 다른 일부는 아무런 반응 없이 앉아 있었으며, 푸자크가 속한 폴란드 사회당의 의원들은 터무니없는 발언에 야유를 보냈다. 오늘처럼 나첼니크 역할이 힘든 적도 없었다. 공공연히 권력을 노리는 자들에게 비방당하는 상황이었으나, 그럼에도 불구하고 푸자크는 이 상황에서 냉정을 유지해야 한다는 것을 알고 있었다. 세임 내부에서는 지금도 ‘자유화’가 무엇을 의미하는지 큰 혼란이 존재했다. 하지만 푸자크는 자신의 계획을 분명히 설명할 생각이었다. 특히 선거 일정을 발표하자 국민은 안도감을 느꼈고 정치인들에게도 대책이 마련되었다.\n\n“저도 그렇고 제 정당에 속한 그 누구도 정부를 전복하거나 우리 민족과 민주주의를 위해 이룩해 낸 위대한 업적을 허물 의도가 없습니다. 현재 두려움과 혼란이 큰데, 저는 우리가 세우려는 계획을 둘러싼 온갖 소문을 해소할 것입니다. 우리는 1941년에 선거를 실시하겠다는 약속을 반드시 지킬 것입니다. 나아가, 나첼니크의 권력을 제한하기 위한 헌법 개정 작업도 추진할 것입니다. 군 최고사령관의 권한을 제외한 모든 권력은 민주적으로 선출되는 총리와 대통령에게 부여될 것입니다.” 푸작은 세임을 향해 이렇게 선언했다.\n\n“그걸로는 충분하지 않습니다!” 비토스가 곧바로 응수했다. “피우수트스키의 헌법은 프랑스가 1934년에 자신들의 헌법을 폐기한 것처럼, 비스와 강에 던져 버려야 마땅합니다! 그 헌법은 그와 그의 패거리들이 어떠한 책임도 지지 않고 나라를 좌지우지할 수 있도록 해 준 것 뿐입니다. 그 모든 조항은 우리의 이익을 배반하는 반역 행위와 다름없어요! 우리는 새로운 헌법을 요구합니다! 자유 선거를 요구합니다! 지금 당장 말입니다!”\n\n이 발언이 끝나자, 앞서와 마찬가지로 어떤 이들은 박수를 쳤고, 일부는 여전히 앉아 있었고, 나머지는 큰 소리로 반대 의사를 표했다."
 POL_PPS.2.a:0 "자유를 향한 길은 길고도 고된 과정이다."
 POL_PPS.3.t:0 "민주주의의 꽃들"
 POL_PPS.3.desc:0 "라지비우 가문은 새로 구입한 텔레비전으로 저녁 뉴스를 시청하기 위해 자리에 모였다. 모두들 최근 진행 중인 민주화가 나라에 어떤 영향을 미칠지 두고 설왕설래했지만, 텔레비전의 등장은 누구에게나 분명히 유익해 보였다. 아버지는 지역 기업이 운영하는 수입품 가게에서 적정한 가격에 텔레비전을 구했다. 폴란드의 다른 많은 마을과 마찬가지로, 규제 완화 덕분에 운영자들은 직접 사업체를 세울 수 있었고, 미국과 같은 먼 곳에서 들여온 이색 상품들을 소개했다. 정부 측은 이러한 혁신에 적응하는 데 다소 느렸지만, 마침내 국영 뉴스 채널을 개설하는 데 성공했다. 오늘 밤이 그 첫 번째 방송이었다.\n\n“시민 여러분, 안녕하십니까.” 흑백 화면 속 앵커가 인사를 건넸다. 텔레비전으로 방송되는 소식 자체보다, 화면 속 사람이 말하는 장면에 더 놀라는 시청자들이 많았다. 앵커는 눈부시게 빠르게 변화하는 폴란드의 현황을 전했다. 유배되었던 빈첸티 비토스가 사나치아 정권 시절 받은 형을 취소받고 귀국했으며, 베레자 카르투스카 수용소의 수감자들도 마침내 석방되었다. 아우구스트 흘론트 대주교가 이끄는 폴란드 주교단은 이 수용소 피해자들을 기리는 종교 의식을 거행하겠다고 발표했다. 그러더니 이내, 정부에 대한 비판 소식도 전파를 탔다. 펠릭스 코네치니, 빈첸티 비토스, 이그나치 파데레프스키, 스타니스와프 그랍스키 등으로 구성된 우파 세력이 개혁이 부족하다고 판단하며 맹렬히 정부를 비난하고 있다는 소식이었다.\n\n“저희는 폴란드를 대표하는 지식인 얀 스타흐니우크 선생님을 초대했습니다. 관련 비판에 대해 정부의 입장을 들어보겠습니다.” 카메라는 오른쪽으로 움직여 게스트를 비췄습니다.\n\n“초대해 주셔서 감사합니다. 단도직입적으로 말하면, 이런 사람들은 위험한 존재들입니다. 자기들 능력이 부족한 것을 덮으려고, 우리가 맡은 임무를 수행한다고 트집만 잡고 있죠. 펠릭스 코네츠니? 자칭 철학자라는데, 제게는 사기꾼처럼 보입니다. 사나치아나 혁명 타령을 하며 호들갑이나 피우고 있지 않습니까! 게다가 그랍스키며, 엔데크(민족민주당원)는 대체 왜 우리나라에 남아 있는 겁니까? 러시아에 몸을 팔아넘긴 게 얼마 전인데도 말입니다. 차라리 모스크바로 가서, 늙은 드모프스키와 함께 얼어뒤져야 하지 않겠습니까? 그리고—”\n\n“죄송합니다, 스타흐니우크 선생님. 지금 막 긴급 속보가 들어와서 대화를 중단해야겠습니다. 르부프에서 큰 비극이 벌어졌습니다. 경찰에 따르면 며칠 전 베레자에서 석방된 한 우크라이나 민족주의자가 민간인들을 공격했다고 합니다.”"
 POL_PPS.3.a:0 "“보도에 의하면 현재까지 최소 10명이 사망한 것으로 알려졌습니다.”"
 POL_PPS.4.t:0 "약자들을 위한 처방"
 POL_PPS.4.desc:0 "르부프의 밤거리는 어둡고 고요했다. 하루 종일 일에 지친 시민들은 달콤한 휴식을 취하고 있었고, 경찰 순찰대는 어둠 속에서 순찰 임무를 수행 중이었다. 바람 소리와 간혹 지나가는 자동차 소리 외에는 아무것도 들리지 않았다. 그리고 그중 눈에 띄는 차량들이 있었다. 이제 막 생산 라인에서 나온 듯 번쩍이는 새 도색을 뽐내며 달리는 차들, 차체에는 폴란드를 지키는 최신 조직의 로고가 선명히 박혀 있었다. 그 이름하여 위생 경찰(Sanitation Police). 이들은 조용히 나라를 좀먹고 있던 ‘도덕적·육체적 타락’을 근절하기 위해 결성된 국가의 대응책이었다. 이들이 신속하고 단호하게 행동한 덕분에 술주정뱅이와 부랑자들의 수가 눈에 띄게 줄어들었다. 일부에서는 이들의 방법에 의문을 제기했지만, 그들조차 거리와 인근 지역이 훨씬 깨끗해지고 안전해졌다는 사실을 인정하지 않을 수 없었다. 경찰관들 역시 동포들을 위해 봉사한다는 자부심에 가득 차 있었다.\n\n오늘 밤, 도시 외곽을 순찰하던 한 팀이 임무를 수행하기 위해 나섰다. 그들은 어느 길에서 좌회전하다가 도로 한가운데에 쓰러져 있는 술 취한 사내를 헤드라이트로 발견했다. 차량이 그를 치지 않은 것은 그야말로 기적이었다. 경찰관들은 차에서 내려 그에게 다가갔다.\n\n“위생 경찰이다! 신분을 밝혀라!”경찰관 중 한 명이 이렇게 외쳤다.\n\n방랑자의 입에서는 이해하기 힘든 동물 같은 소리만 흘러나왔다. 경찰관들은 그의 옷차림을 살펴보았다. 명백히 노숙자로 보였다. 아마도 가지고 있던 소량의 레히 동전마저 술을 사는 데 쓴 것 같았다. 더 나쁜 점은, 그 돈조차도 구걸해서 번 것이었다는 사실이었다. 선량한 시민들이 가엾은 모습에 마음이 동해 자신의 소중한 돈을 내어주었는데, 그걸로 술을 마시고 어쩌면 매춘부까지 찾았을지도 모른다. 운이 따른다면, 그런 생활 속에서도 아이를 낳았을 수도 있으니 더 큰 문제였다. 경찰관들은 그를 부축해 차 안에 구금했다. 이들은 조국을 피 빠는 거머리들로부터 해방시키는 것이 자신의 임무라고 굳게 믿고 있었다.\n\n“이제 진료소로 데려간다!” 그들 중 한 명이 웃으며 말했다.\n\n“지금까지는 술도 마시고 여자도 즐겼겠지! 하지만 둘 중 하나만 고를 수 있다고. 오늘 보니 이미 그 선택이 내려진 것 같군. 나머지는 없애야겠어!” 다른 한 명이 거들었다.\n\n체포된 취객은 여전히 무슨 일이 벌어지는지도 모른 채 알 수 없는 신음만 뱉어냈다.\n\n“내일이 되면 네가 저지른 행동에 대한 대가가 뭔지 알게 될 거야, 시민 양반! 지금 우릴 따라가면 좀 '특별한 곳' 으로 가게 될 텐데, 거기서 우리 동료들이 널 ‘잘 보살펴’줄 거야.” 경찰관은 다시 낄낄거리며 말했다."
 POL_PPS.4.a:0 "‘건강한 혈통을 지키기 위해’, 이런 식으로 임무를 수행하고 있었다."
 POL_PPS.5.t:0 "우리를 믿어라"
 POL_PPS.5.desc:0 "“새로 온 선생은 정말 얼간이 같아요.” 유제프가 말했다.\n“내가 중학교 때부터 봐 온 교사 중에 가장 따분한 분이야. 정당에서 시키는 말만 앵무새처럼 반복하고. 음울하달까.” 얀이 덧붙였다.\n“예전에 우리 선생님도 그런 느낌이 들 때가 가끔 있었지만, 그래도 진심이 담겨 있었잖아.”우크라이나 출신 안드레이가 맞장구쳤다. “그분은 우리 나라의 친구이자 군인이셨다고.”\n\n그 세 소년은 예전에 가르쳐 주셨던 옛 선생님을 찾아가고 있었다. 격일로 그분 댁을 찾아가 심부름을 도와드리곤 했다. 방학 중에는 다른 친구들과 함께 방문해, 형편이 어려우실 때 필요한 물건도 사드렸다. 선생님의 아내는 이미 수년 전에 세상을 떠나셨고, 학생들에게 존경받았던 분이라 주변에 도움을 청하지 않아도 곁에서 돕겠다는 아이들이 늘 있었다.\n\n아이들이 찾아갔을 때, 옛 선생님은 개인 정원에서 일을 하고 계셨다. 대학교에서 쫓겨난 뒤로 삶이 더욱 힘들어졌지만, 매일 찾아오는 아이들을 반갑게 맞이하곤 하셨다.\n\n“퇴역 군인 연금만으로는 살기가 빠듯하지. 늘 도와줘서 고맙구나, 얘들아.”늙은 교수님이 말씀하셨다.\n\n“선생님께서는 우리에게 큰 가르침을 주셨고, 폴란드를 해방하셨잖아요. 저희가 그 은혜를 잊을 수 없죠.” 안드레이가 감사의 마음을 전했다.\n\n“고맙다, 고마워… 새 정부는 이제 우리 같은 참전용사들을 별로 존중해 주지 않는구나. 나는 피우수트스키와 함께 폴란드 군단에 창설 초기부터 몸담았어. 우리가 감수해야 했던 위험과, 자유로운 폴란드를 꿈꾸면서도 그저 꿈으로 끝날 것만 같았던 순간들을 나는 결코 잊지 못하겠어.”\n\n“저희도 절대 잊지 않겠습니다.”\n\n노병은 미소를 지었다.\n\n“나는 늘 이 독재가 악하다고만 볼 수는 없다고 말했어. 피우수트스키는 또 한 명의 ‘킨키나투스’로 끝날 사람이 아니었지. 그땐 질서와 힘이 필요했거든. 지금도 마찬가지고. 우리 스스로와 인테르마리움을 지키기 위해서 말이다. 러시아는 분명 다시 돌아올 거야. 난 이제 몸도 늙어서 싸울 수 없고, 정신도 예전 같지 않아 가르칠 수도 없어.” 학생들은 스승님 곁에 앉아 그 이야기를 경청했다.\n\n“네, 알고 있어요.”요제프가 대답했다. “새로 온 선생님 말인데, 선생님도 잘 아시죠? 우리에게 새로운 선전 포스터에 써 있는 내용을 그대로 읽어주기만 해요. 피우수트스키는 그저 ‘민주주의의 선봉장’일 뿐이었다고, 그리고 그의 시대는 완전히 끝났다고 하시는데, 그 말이 정말 그분 진심에서 나오는 것 같지도 않아요. 우리가 그런 말씀을 드렸더니, 행동에 주의를 준다는 딱딱한 답변만 들었죠.”\n\n노병인 교수님은 웃음을 터뜨렸다.\n\n“요즘 사람들은 참으로 잘못되고 거짓이 많구나!” 그는 이렇게 말했다. “피우수트스키가 그저 독재자였다고? 아니야.”"
 POL_PPS.5.a:0 "“무엇보다, 피우수트스키는 진정한 거장의 기질을 가진 사람이었단다.”"
 POL_PPS.6.t:0 "중대한 사안!"
 POL_PPS.6.desc:0 "바르샤바의 당 본부는 그야말로 열기로 가득했다. 폴란드를 대표하는 경제학자들이 계획 경제의 미래 방향에 대해 열띤 토론을 벌이고 있었습니다. 사나치아가 구축했던 중앙집권 체제를 없애야 한다는 점에는 대체로 의견이 모였지만, 당 관료들이 자유를 제한해서는 안 된다는 인식 외에도 구체적인 사안들을 어떻게 풀어나갈지는 합의가 필요했다. 이런 분쟁을 해결하기 위해, 당 내에서 가장 영향력 있는 이들이 모여 각자 입장을 밝히게 되었다.\n\n“우리는 양쪽 세계의 장점을 모두 취할 수 있습니다!” 오스카르 랑게가 청중에게 역설했다. “변화를 위한 변화는 경계해야 합니다. 사나치아의 정책이 지나친 면이 있었던 건 분명하지만, 거기서 얻은 이점도 적지 않았습니다. 폴란드는 자본주의 없이도 발전을 이뤄냈죠. 저희가 추구하는 ‘푸른 사회주의’는 그저 약간의 완화만 필요합니다. 자본주의에 굴복하는 함정에 빠질 이유는 없어요!”\n\n“랑게 선생님의 의도는 선하지만, 반드시 옳은 건 아닙니다.” 미하우 칼레츠키가 답했습니다. “저 역시 그분만큼이나 국민의 행복에 관심이 많습니다. 그리고 당 차원에서도 마찬가지입니다. 하지만 랑게 선생님이 말씀하신 시행착오식 경제정책이 너무나도 빠르게 우리 재정을 소모시키지 않을까 우려됩니다. 왜 우리 모두가 방향 감각도 없이 공허한 곳으로 나아가는 바람에 혹여나 구덩이에 빠져 폴란드 전체를 함께 곤경에 처하게 만드는 것을 감수해야합니까? 왜 국민이 경제 실험의 대상이 되어야 하죠? 제 이론들은 이미 입증되었습니다! 영국의 케인즈 씨도 저와 같은 결론에 도달했습니다만 그건 제가 먼저 주장했던 내용입니다. 그는 전 세계 선진국에서 많은 지지를 받고 있습니다. 저도 직접 만나 보았고, 무엇보다 서로 같은 결론을 공유한다는 점을 확인했습니다. 우리는 사실과 논리의 당이 아닙니까? 그리고 제 정책이 폴란드에 가장 적합하다는 사실이 증명되어 있습니다.”\n\n“영국은 자유시장과 자본주의를 숭상하는 초강대국이라지만, 그들도 결코 결점이 없을 수 는 없죠. 수십 년간 노동자는 비참한 환경에서 고생을 해왔고, 권리를 요구할 때마다 처벌을 받았습니다. 위선적인 일면이 있다면, 독일의 사회주의적 공업을 필요로 하면서도 자신들은 자본주의라고 주장하죠! 우리는 그들의 예시에서 배울 게 없습니다. 폴란드는 자본주의에 굴복하지 않고도 영국보다 더 큰 발전을 달성할 수 있는 나라입니다!” 랑게가 이렇게 반론했다.\n\n이처럼 뜨거운 열기를 내뿜던 경제정책 토론은 청중의 관심을 한껏 사로잡았고, 토론이 마무리될 즈음에는 대부분의 대의원들이 자신들의 결론을 내린 뒤 앞으로의 경제정책에 대한 투표에 돌입했습니다. 그리고 모든 입에서 하나의 공감이 흘러나왔습니다."
 POL_PPS.6.a:0 "“랑게가 우리 모두에게 우리의 사명을 다시 상기시켜 주었다.”"
 POL_PPS.6.b:0 "\"칼레츠키의 방향이 우리에게 안정을 줄것이다.\""
 POL_PPS.7.t:0 "때가 왔다"
 POL_PPS.7.desc:0 "“때가 왔다! 이제야말로 포스트 사나치아적 사회주의를 해체해야할 때가 왔다! 우리는 민영화를 추진해야 합니다! 비효율을 끝내야 해요! 자본주의를 폴란드에 도입해야 한다고요!” 새로운 신문을 팔기 위해 젊은 신문팔이가 지나가는 사람들을 향해 소리치고 있다.\n\n정치 영역의 자유화가 진행된 이후, 이러한 모습은 여러 도시의 거리에서 흔히 볼 수 있게 되었다. 어떤 거리들은 신문팔이들이 좌우에서 끝없이 목청을 높여 손님을 붙드는 바람에, 통행조차 어려울 정도가 되었다. 그러나 그니에즈노의 흐로브리 거리에는 단 한 사람뿐이었다. 그를 지나치던 행인 중 한 명이 발길을 멈추고 신문에 흥미를 보인다.\n\n“그런데… 이미 자본주의가 존재하지 않나, 젊은이?”그가 물었다.\n\n“지금이야 그렇다 쳐도, 제 뒤를 좀 보세요!” 신문팔이는 뒤편에 보이는 국영 식료품점 ‘스포웸’을 가리켰다. “사회주의가 거기서 여전히 살아 숨 쉬고 있다구요! 이런 비대함을 빨리 해결해야 한단 말입니다!”\n\n“그 가게들도 시장 논리에 따라 운영되지 않나? 결국 아무도 거기서 물건을 안 사면, 유지될 수 없을 텐데.”\n\n“그게 그렇게 간단하지가 않아요, 손님. 국영 기업들은 자본을 마음껏 써도 되니까 사기업보다 자연스럽게 우위를 점할 수 있죠! 국가가 얼마든지 가격을 내릴 수 있잖아요? 가령, 손님이 가게를 운영하는데, 경쟁자인 국영 가게가 무한한 자금으로 가격 따위를 신경 쓰지 않아도 된다면, 그게 과연 공정하다고 보십니까? 우리, 코네치니를 지지하는 사람들은 이걸 막고자 하는 거예요! 국가는 시장에 개입해선 안 됩니다! 더 자세히 알고 싶으시면, 저희 신문인 ‘때가 왔다’를 사 보세요!”\n\n젊은 신문팔이의 거침없는 자유주의 논리에 일격을 받은 남자는 잠시 생각에 잠겼다. 이미 여러 정당, 예를 들어 폴란드 인민당, 폴란드 사회당, 나아가 엔데크(민족민주당원)까지, 각종 신문을 사 보고 있었는데, 이제 또 다른 ‘때가 왔다’라는 이름의 신문까지 사야 하다니. 그러나 투표를 하려면 제대로 알아야 한다는 생각에, 결국 10그로시짜리 동전을 꺼내 신문팔이에게 건넸다. 두 명의 자주적인 시민이 펼친 자유시장 교환이었다. 젊은이는 다시 본인의 일로 돌아갔고, 거리는 다시금 그의 힘찬 외침으로 가득 찼다."
 POL_PPS.7.a:0 "그는 사실상 거리를 독점하고 있었다."
 POL_PPS.996.t:0 "옛 카이사르들에 맞서서"
 POL_PPS.996.desc:0 "“스탄치크, 내가 어찌해야 할까?” 걱정스러운 표정으로 나첼니크 푸자크가 안보실장에게 물었다. “군대가 엉망진창이야! 도와주게나!”\n\n“맞습니다, 장군들 중에는 새 지도부에 잘 적응하지 못한 이들이 있습니다. 자드루가주의자들, 자유주의자들, 피우수트스키의 노병들 중 좀 더 급진적인 이들까지…”\n\n“반동주의자들이군, 얀. 우리는 그들의 이름을 까발려야 해. 그들을 치욕스럽게 만들어야 한다고. 군대가 우리 편이 아니라면, 어떤식으로 폴란드를 구할 수 있겠는가?” 푸자크는 잠시 생각에 잠겼다. “숙청할까?”\n\n“우리의 상황은 말씀하신 대로 다소 복잡합니다. 이론상으로는 전권을 가지고 있지요. 시위는 대부분 가라앉았습니다. 그러나 우리는 국민에게 민주주의를 약속했고, 본보기를 보여야 합니다. 서두르지 맙시다.”\n\n“그래그래. 왜 우리가 이 자리에 모였는지 거의 잊을 뻔했네. 우리는 사나치아주의 일당제 국가를 유지하기 위해서가 아니라, 오히려 끝내기 위해 이 자리에 있는 것이야. 만약 그러지 않는다면 결국 우리의 대의를 배신하는 셈이 될 것이지.”\n\n푸자크는 자신들과 이견을 품은 장군들간의 문제를 어떻게든 해소할 방도를 곰곰이 생각했습니다. 적당한 금액을 제시하면, 가장 강경한 장군들도 조용히 그의 정부를 승인할 것입니다. 그들의 신념에 호소할 수는 없지만, 애국심에 호소할 수는 있었습니다. 국민은 이미 그들의 ‘8월’을 애도하고 있기에, 이 같은 시기를 정치적 책략에 이용하는 것은 부적절하며 그들의 위신을 해치는 일이 될 것입니다. 그러나 반면, 오늘날의 유약함은 내일 급진주의가 무장세력 내에서 조장할 어둠의 세력에 맞서 싸우는 것을 막을 것입니다. 더 이상 시간을 낭비할 수 없으므로, 신속한 결단이 필요했습니다.\n\n“이번에는 암중모색해야 합니다. 국민은 아직 피우수트스키를 애도하고 있습니다. 각하 적절한 명령을 내려 주시길 바랍니다.”"
 POL_PPS.996.a:0 "\"장군들을 진정시켜보도록 하게.. 제발.\""
 POL_PPS.996.b:0 "“은밀히 부대 내의 반대파들을 포착하게나.”"
 POL_PPS.997.t:0 "일곱 번째 봉인"
 POL_PPS.997.desc:0 "폴란드에게 약속된 그 날이 마침내 찾아왔습니다. 러시아 전쟁으로 지연되었지만, 푸자크는 국민에게 한 약속을 지켰습니다. 그는 과도기적 관리 기간이 끝났으며, 이제 민주주의가 영원히 자리 잡을 것이라고 선언했습니다. 그러나 정부의 공언과 적응 기간이라는 약속만으로는 신생 민주주의의 흔적을 완전히 지우지는 못했습니다. 지난 수년간 폴란드인들은 민주주의의 다른 면모에 익숙해졌습니다. 사소한 의견 충돌에도 끊이지 않았던 시위 행진, 홍수처럼 쏟아지는 신문들, 급진적인 청년 세력들과 경찰들의 충돌들... 어쩌면 그런 광경들이야 말로 진정한 자유의 표상이었다고 믿는 이들도 있었지요. 이제 다섯 주요 정당이 폴란드 유권자들에게 강렬한 인상을 남기고 있습니다. 어떤 정당은 오랜 경력을 지닌 노련한 세력이고, 또 어떤 정당은 대담한 신출내기들이지만, 모두가 폴란드라는 다양한 얼굴을 지닌 나라에 매력적인 미래를 약속하고 있습니다.\n\n스타니스와프 그랍스키가 이끄는 중도좌파 성향의 대중인민연합은 양날의 검과도 같습니다. 독일식 사회주의나 프랑스식 미래주의의 과격한 사상을 배제하고, 자유주의적이고 온건한 고전적 급진주의를 통해 서구화하겠다는 매력적인 노선을 제시하고 있습니다. 그러나 이에 정면으로 대치되는 청년단, 즉 아담 도보신스키가 이끄는 세력은 현재 정치권에서 가장 극단적인 반동 노선을 표방합니다. 반유대주의, 반산업, 반도시, 반인터마리움 성향을 갖고 있으나 지금은 힘을 갖지 못한 상태입니다. 만약 그들이 대중인민연합내에서 강해지는 기회를 잡는다면 폴란드 민주주의와 현대성을 싹부터 꺾어버릴 수 있을 것입니다.\n\n인민당의 “피아스트”파벌은 폴란드의 온건층에게 좀 더 안전한 선택지로 여겨집니다. 몇몇 폴란드 독립운동가들이 창당했으며 미국적 가치를 본보기로 삼아 언젠가 인테르마리움을 연방화하겠다는 구상을 지지합니다. 한편 인민당 (급진파)는 늘 정통 야당의 자리를 지켜왔습니다. 지주들과 손을 잡았던 피우수트스키의 합의를 가장 먼저 반대했던 좌파 세력이자 미래주의와 연계되어 농업 분야에서의 급진주의를 내세우는 이 정당은 현대 폴란드에서 끊임없이 이어져 온 혁명의 계보를 계속 잇겠다고 선언합니다.\n\n기독민주당은 또 다른 과격한 단절을 표방하지만, 이번에는 자유시장주의로의 과감한 전환을 주장합니다. 펠릭스 코네치니의 지도 아래 급진적 규제 완화와 시민적 민족주의를 제안하고 있으며, 여러 기업인들과 가톨릭 지식인들의 강력한 지지를 받고 있습니다.\n\n하지만 이 모든 정당에 맞서 여전히 무시할 수 없는 거대 세력이 남아 있습니다. 폴란드를 여기까지 이끈 푸자크의 폴란드 사회당입니다. 민주주의의 전령이기도 한 그들이 가장 훌륭한 수호자가 되지 못할 이유가 있을까요? 이 정당은 지금까지 탁월한 국정 수행을 내세워 이번 선거에서도 승리를 기대하고 있습니다."
 POL_PPS.997.a:0 "옛 악마들을 위하여, 그랍스키의 새로운 노선을 위하여!"
 POL_PPS.997.b:0 "인민당 피아스트를 위하여! 인테르마리움 합중국을 위하여!"
 POL_PPS.997.c:0 "코네치니를 위하여, 진정한 자유를 위하여! 투란주의부터의 자유를!"
 POL_PPS.997.d:0 "인민당 급진파를 위하여! 오콘 신부님을 위하여!"
 POL_PPS.997.e:0 "오늘도 푸자크, 내일도 푸자크! 영원하라 푸자크!"
 POL_PPS.998.t:0 "붉은 홍수"
 POL_PPS.998.desc:0 "그 자리에 있던 모두는 현재 진행 중인 회의가 극비라는 사실을 알고 있었다. 나첼니크는 러시아와의 전쟁 이후 처음으로 모든 장군과 장관들을 한 자리에 소집했습니다. 모두가 알고 있는 의제는 독일과 프랑스 사이의 전쟁에 대한 참전 여부였다.\n\n“독일은 우리와 가장 가까운 동맹국입니다. 두 나라의 우정은 대전쟁의 혁명적 불길 속에서 탄생했고, 프랑스의 보복주의적 공격에 흔들릴 리가 없죠! 우리는 독일의 도움으로 모스크바를 격파했으니, 이제 그 은혜를 갚아야 합니다.” 라고 [POL.GetLeader]가 입을 열었다.\n\n“우리 경제는 장기전을 충분히 감당할 수 있을 만큼 탄탄합니다. 비스와강에서 태평양까지 뻗은 영토가 제공하는 모든 자원들을 확보하고 있어 사실상 자급자족 체제로 나아가는 중입니다. 프랑스와의 무역을 끊어도 큰 타격은 없을 것입니다.”라고 경제 장관이 덧붙였다.\n\n“우리 군대는 아직 동원 해제되지 않았고, 몇 주면 전투 준비 태세에 돌입할 수 있습니다. 해방된 지역에서 쓸 만한 협력자들을 활용해 우리를 보조할 민병대를 조직할 수도 있습니다. 주력 부대는 독일군과 합류하면 됩니다.”\n\n“영국은 어떻습니까? 그들이 독일을 상대로 참전한다면 어떻게 될까요? 옛 ‘세력 균형’ 체제는 이미 사라졌다고 해도, 영국과의 전쟁은 너무 많은 비용을 요구할 수도 있습니다.”라고 한 우려 섞인 자문관이 끼어들었다.\n\n[POL.GetLeader]는 신속히 답변했다. “영국이 대륙에서 전쟁을 벌일 때는 항상 강력한 동맹국을 끼고 있었습니다. 러시아, 프랑스, 이탈리아, 오스트리아 이들 모두 지금은 사라졌거나 런던에 적대적입니다. 영국이 폴란드와 독일의 연합 위력에 맞설 방도는 없습니다. 프랑스와 어떤 합의를 한다면 모를까, 지금의 프랑스는 칼레를 원하고 있고, 그들의 동맹국들 역시 무슨 속셈인지 알 수가 없습니다.”\n\n이 말에는 누구도 반박하지 못했다. 모든 이들이 폴란드가 걸어갈 길에 동의했다. “그러면 독일 편에 서서 프랑스와 전쟁을 벌이는 폴란드의 최종 결정을 투표에 부치겠습니다. 찬성하시는 분은 손을 들어 주십시오.”"
 POL_PPS.998.a:0 "“반대 표가 없군요! 폴란드는 프랑스와의 전쟁에 나섭니다!”"
 POL_PPS.999.t:0 "[?global.date.GetDateStringNoHourLong] 경제 보고서"
 POL_PPS.999.desc:0 "나첼니크께서만 열람하실 수 있음\n\n지난 1년 동안 폴란드 경제는 계속해서 확장세를 이어갔습니다. 필요한 순간마다 성공적으로 결정이 내려졌고, 시장의 자유화가 가속됨에 따라 생산 활동 전반에서 새로운 성장 동력을 확보할 수 있었습니다. 이러한 기조를 이어간다면 앞으로 더 큰 이익을 거둘 수 있을 것으로 예상됩니다.\n\n소비재 생산이 확대되어 더 많은 시민이 농촌의 빈곤을 벗어나 현대적인 삶에 적응하고 있습니다. 국토 곳곳에서 새롭게 자원 매장지가 발견되어, 중공업을 유지하기 위한 수입 의존도를 줄이는 데 도움이 될 것입니다.\n\n인테르마리움 동맹국들뿐 아니라 프랑스, 독일, 영국과의 무역도 긍정적인 방향으로 진행되고 있습니다. 그간의 투자 성과도 가시화되고 있으며, 벨라루스와 우크라이나 같은 개발도상국의 성장은 향후 우리에게도 유리하게 작용할 것입니다.\n\n앞으로는 민간 부문과 군사 부문 사이에서 안정적인 균형을 유지하시길 권고드립니다. 러시아의 위협을 과소평가해선 안 되므로, 군대가 충분한 장비를 갖추어야 합니다. 다만 이는 우리의 병력 규모에 상응하는 경제력 뒷받침이 필요합니다. 본 부서는 나첼니크께서 현명한 결정을 내려주시리라 믿습니다."
 POL_PPS.999.a:0 "또 한 해의 풍요와 번영을 기원합니다!"
 POL_startup.1.t:0 "위대한 즉흥극"
 POL_startup.1.desc:0 "유제프 피우수트스키는 그를 기다리는 모든 이들이 저지른 어리석음, 실수, 패배를 낱낱이 기억하고 있었다. 그에게 그것들은 어떤 자부심의 대상도 아니었고, ‘전쟁 시절’을 떠올리거나 늙은이가 감상에 젖어 보이는 흔한 추억담도 아니었다. 사실 피우수트스키는 그런 회의 자체에 지쳐 있었다. 조금만 더 권력을 쥐고 있어야, 마침내 저 장군들이 무슨 말을 하려는지 제대로 들을 수 있을 거라는 생각만 점점 굳어졌으니까.\n\n“환영합니다, 피우수트스키 원수님!”\n에드바르트 시미그위가 도착한 지도자를 맞으며 인사했고, 피우수트스키는 서둘러 자리에 앉으라고 일행에게 권했습니다. “자, 그럼 용건부터 말하게.” 피우수트스키는 무뚝뚝하게 선언했다. \n 그는 이미 이 회의가 어떤 모습일지 예감하고 있었다. 차이가 있다면, 그저 장군들이 제출하는 보고서에 깔린 뻔한 정치적 의도가 지루할 정도로 뻔하다는 것뿐이었다. 어느 장군은 민스크 지대를 담당하는, 키가 작고 대머리에 가까운 남성이었는데 자신의 업무를 방해하는 하찮은 정치 분쟁에 대해 지겹도록 장황하게 늘어놓았다. 피우수트스키는 당장 그를 멈추게 하고 싶었고, 정말로 그 긴 잡담이 그만두면 좋겠다는 생각뿐이었다.\n“닥쳐! 이런 근거없는 불평이나 하고는! 니새끼는 쓸데없는 정치 싸움만 떠벌이는 무능한 얼간이에 불과한가보지! 여기 있는 모두가 다 그래!”\n피우수트스키가 침묵의 우울함에서 격렬한 분노로 돌변하자, 방 안에 있던 대부분은 그 자리에서 얼어붙었다. 그는 몇 분 동안이나 마구잡이로 폭언을 이어갔고, 그중에는 그들을 창밖으로 내던지고, 불태우고, 토막내버리고 싶다는 소름 끼치는 묘사까지 들어 있었다. 결국 에드바르트 시미그위가 일어나 개입했다.\n“피우수트스키 원수님, 이런 식으로 말씀하시는 게 정말 옳은 태도이십니까?”\n피우수트스키는 벌겋게 달아오른 얼굴로 시미그위를 돌아보았습니다.\n“그래, 에드바르트. 이 무능한 것들은 나에게 들어야 할 말을 듣고 있는 거야! 내가 이 쥐 같은 배신자들을 움켜쥐고 있다고!”\n피우수트스키는 계속 화를 내며 자신의 주장을 쏟아냈고, 시미그위는 겨우겨우 그의 주의를 다시 끌어냈다.\n\n“피우수트스키 원수님 말씀이 전적으로 옳지만, 지금은 흥분을 가라앉히고 말씀하셔야 합니다. 숨을 고르시지요.”\n피우수트스키는 시미그위를 노려보았지만, 마지못해 분노를 누그러뜨렸다. 위대한 원수 피우수트스키는 마치 혼쭐이 난 아이처럼 의자에 털썩 주저앉았다. 방 안의 다른 남성들도 그와 비슷한 표정을 지었고, 시미그위 역시 천천히 자리에 앉았다.\n“에, 음… 피우수트스키 원수님께서 말씀하신 대로, 민스크 지대는… 인력을 조금 줄이는 쪽이 낫겠습니다.”"
 POL_startup.1.a:0 "얼굴엔 금이가 있었다."
 POL_startup.2.t:0 "옛 시대의 그림자 속에서"
 POL_startup.2.desc:0 "아담 미츠케비치의 기념비가 빌뉴스에서 피우수트스키 원수의 주도로 공개된 지도 어느덧 12년이 흘렀다. 이 일은 현지 활동가들과 폴란드 보수주의자들을 똑같이 당황하게 만들었지만, 결국 원수의 강철 같은 의지가 승리하였다. 그가 폴란드와 그 동맹국들에게 해방의 불꽃을 안겨주었던 사나이의 불굴의 의지를 제대로 보여주었다. 발레리 스와베크는 이 점을 곱씹으며, 같은 기념비 앞에서 벌어지는 원수님의 인테르마리움 통합 연설을 듣고 있었다. 독일, 프랑스, 황러시아 외교관들이 자리를 함께한 가운데, 동맹의 사업이 순조롭게 진행되고 있으며 유례없는 단결을 이루고 있다는 내용에 모두가 안도하는 분위기였다. 스와베크가 이런 생각에 잠겨 있을 때, 그가 시선을 오른쪽으로 돌려 이그나치 다신스키를 보았다.\n\n“우리는 이제 어떻게 되는 걸까?” 스와베크가 화두를 던지며 대화를 유도했다.\n\n다신스키는 잠자코 원수님의 연설을 지켜보던 자세를 유지하다가, 이내 대답했습니다. “어떻게 되긴? 그저 우유와 꿀이 흐르는 세상이 오겠지.”\n\n“너무 심드렁하게 굴지는 말게, 이그나치. 이 자리가 어떤 곳인지, 그리고 저 밖에 우리 국경 너머에 무엇이 있는지도 생각해보게.”\n\n다신스키는 피우수트스키 원수의 연설에 몰두해 있는 사람들을 둘러보았다. 원수님께서 이 나이에도 불구하고 군중을 사로잡는 연설을 계속하시는 게 다행스럽기도 했다. 왜냐하면 원수님의 건강 상태에 대한 보고들은 점점 심각해지고 있었기 때문이다. 스와베크가 말을 이었다. “좋은 시절은 끝났을지도 몰라, 이그나치. 여기 빌뉴스에서, 우리 훌륭한 동맹국의 외교관들 이마 위로는 해가 밝게 비치지만, 만약 저들의 눈을 들여다보면 전혀 다른 이야기가 펼쳐진다는 걸 알 수 있을 거야. 이 자리에 함께 있는 프랑스, 독일 외교관들을 보게. 여기에서는 우호적으로 보이겠지만, 국경만 벗어나면 외교적 미소가 곧바로 적의 어린 시선으로 바뀔지도 모르지.”\n\n“결국은 잠잠해질 거야. 지나가는 물결 같은 것이겠지. 우리가 이 세상에서 그들만 상대하는 것도 아니잖는가. 동쪽에도 친구들이 있다고. 하르빈과 바쿠 말야.”\n\n“…그리고 페트로그라드에 있는 거대한 적 하나도 있지.”\n\n“제국은 예전 같지 않아. 콜차크가 실제로 지배하는 땅은 옛날 이반 뇌제가 사망했을 때보다도 적어. 실제로 러시아 제국은 허수아비나 다름없고, 지역마다 총독들의 봉토처럼 되어 있지 않는가. 만약 그들이 공격해 온다면, 그때가 그들 최후가 될 거네.”\n\n“그 말이 맞을 수도 있겠군. 결국 우리와 원수님 덕분에, 폴란드와 인테르마리움은 성공만 거듭해 왔으니까…” 스와베크가 말을 더 잇고자 했을 때, 갑자기 연설이 끝나 버렸다는 것을 깨달았다. 그는 연단 쪽으로 시선을 돌렸고, 그곳에서 원수님이 뒤에 세워진 동상처럼 멈춰 선 채 있음을 보았다. 그러고는 눈 깜짝할 사이에 폴란드의 나첼니크가 바닥으로 쓰러져 버렸고, 주변 참모들과 수행원들이 서둘러 그에게 달려갔다. 스와베크는 쓰러진 원수님을 향해 다가가면서, 제대로 언급되지 않았던 그 불안감이 머릿속에서 한층 더 크게 울려 퍼지는 것을 느꼈다."
 POL_startup.2.a:0 "누가 장담하겠는가? 폴란드가 내일도 이와 같이 않으리라고."
 POL_startup.3.t:0 "피우수트스키가 후계자를 선정하다"
 POL_startup.3.desc:0 "트루이케, 트루이케 비비에시 파니에 (셋, 셋 골라요 아가씨들)"
 POL_startup.3.a:0 "건전 건전 사회주의"
 POL_startup.3.b:0 "이번엔 자살 안함 엌ㅋㅋ"
 POL_startup.3.c:0 "익어 진짜 휘연실 이에오?"
 POL_startup.4.t:0 "이는 내 뼈중의 뼈요"
 POL_startup.4.desc:0 "피우수트스키는 회의실에 들어서자, 주변이 조용해지는 데 걸리는 시간을 셌다. 사람들이 고개를 돌리고 목소리를 낮추며, 한 명씩 그의 손을 잡으려고 일어서는데, 정확히 4초. “이제 난 ‘4초짜리 대통령’이 되었군.” 하고 생각하며, 그가 앞에 있는 이들의 얼굴을 둘러보았다. 그는 오랜 동지인 리츠 시미그위에게 지친 미소를 건네고, 이그나치 다신스키에게는 마지못해 손을 내밀면서도 교묘한 웃음을 지어 보였다. 발레리 스와베크는 열렬히 차례를 기다렸다. 다음으로 인사하는 장관들은 피우수트스키가 알아보지 못했지만, 분명 어떤 파벌의 우두머리 격인 인물들이었으리라. “언제나 새로 교체되는 어릿광대들일 뿐이지. 이름뿐이라 해도 뭔가 하나씩 뜯어가려 하는 자들, 자기 동료들에게 잠시나마 물어뜯을 ‘뼈’를 던져주려는 놈들… 결국 모두가 삼켜지겠지.” 라는 생각이 스쳤지만, 이런 불편함이 그를 흔들지 못했다.\n\n피우수트스키는 자리에 앉고, 사나치아 지도부도 그에 따라 자리를 잡았다. 그는 군사 문제로 회의를 시작하면서, 두 개 사단을 추가 편성하자는 제안을 내놓았다. 그가 보기에 이는 모두가 환영할 만한 제안이었지만, 어김없이 다신스키가 우물쭈물 반대 의견을 펼쳐 대면서, 피우수트스키는 뼈가 무거워지는 듯한 고통을 느끼기 시작했다.\n“예산은 어떡하자는 겁니까? 돈을 어디서 끌어오죠? 보조금으로 배불리 먹고 있는 농민들에게서? 아니면 노조원들에게서 뺏을 건가요, 아니면 실패나 다름없는 자드루가 제도에서 빼낼 작정인가요? 결국 우리는 이미 가난을 겪는 국민들에게서 또다시 빼앗아야 할 텐데, 그들은 스스로 삶을 일궈가다 결국…”\n“말도 안 됩니다!” 다른 이가 끼어들었다. “자드루가로 이룩한 다년간의 성과를 뒤엎을 게 아니라, 오히려 더 확대해야 합니다. 군인 월급을 조금 더 준다고 해서 안보가 보장되는 건 아닙니다. 튼튼한 경제야말로 최선입니다!”\n\n피우수트스키는 혈압이 오르는 것을 느꼈습니다. 더 이상 대화를 경청하고 있지도 않았다. 생각은 어느새 ‘폴란드의 봄날’로 거슬러 올라갔다. 모든 것이 혼란스럽고 하찮게 느껴졌다. “이 모든 노력이 무너져가는 건가? 우리의 민족적 각성은 그저 꿈이었나?” 하는 회한이 들었다.\n\n“조용히 하시오!” 이번에는 즉시 정적이 흘렀습니다. 그는 천천히 자리에서 일어나면서, 방금 책상을 내리친 주먹에 몸을 지탱했습니다. “이 무슨 무례와 비겁이더냐? 만약 폴란드가 이 지경이라면, 차라리 내가 콜차크를 불러와 우리 전부를 체포하게 하는 게 낫겠군. 아름다운 나라이건만, 백성들은 매춘부 노릇이나 하고! 나는 이딴 반동의 하찮은 난쟁이들이 떠드는 소리를 들을 생각이 없다네! 나라가 무너지도록 내버려 두지 않을 꺼요. 우리가 흔들린다면, 폴란드는 또다시 기억 속에나 남게 될 꺼야!”\n\n회의장은 숨죽인 채 얼어붙었고, 사람들은 불타오르는 그의 시선을 피하려 애썼다. 피우수트스키는 목을 가다듬고 다시 격한 말을 쏟아내려 했지만, 작은 헛기침으로 그칠 줄 알았던 기침이 끔찍하고 거친 소리로 변해버렸다. 그는 메스꺼운 금속 맛의 피가 입 안에 고이는 것을 느끼며 고개를 돌렸고, 에드바르트와 스와베크가 그를 부축해 간신히 서 있도록 붙잡았다. 피가 입술 아래로 뚝뚝 흘러내렸다."
 POL_startup.4.a:0 "무덤으로 향하는 비틀거리는 발걸음은…"
 POL_startup.5.t:0 "낭만적 목표, 실용적 수단"
 POL_startup.5.desc:0 "영영 이 침대에 누워 있고 싶었다. 편안하고 따뜻하니 그리 나쁜 자리도 아니었다. 피우수트스키 원수는 배 속이 뒤틀리는 느낌에 신음소리를 냈다. 분명히 어딘가 고장이 나고 있다는 걸 의사들도 알고 있었다. 그런데 누군가가 이야기하고 있었고, 그 목소리가 그의 주의를 배의 통증에서 잠시 떼어 놓았다.\n\n“어떻게 생각하십니까?” 베크가 물었다.\n\n“생각이라니?” 피우수트스키가 답했다. 시선은 이미 외무부 장관에게 옛날만 못해도 특유의 날카로움으로 곧장 향했다.\n\n“미흐노브스키에 대해 말입니다.”\n\n“뭐, 솔직히 말하면 그 놈은 에미가 시발 창년인 새끼일 뿐이야.” \n\n베크는 다시 본론으로 돌아갔다. “지금 상황에서 리비우에 대한 요구를 멈추게 하는 것도 어렵지만, 인테르마리움에서 빠지겠다는 그의 소동을 진정시키는 건 더더욱 쉽지 않을 겁니다.”\n\n“대단하군.” 원수는 투덜거리며 시선을 돌렸다. 뭔가 다른 게 필요했다. 그래, 담배 한 대 피우면 좋을 텐데.\n\n“내가 여기서 담배를 한 대 피우려면 어떻게 해야 하지?” 원수가 침대 옆 탁자를 가리켰다. 거기에는 서류 몇 장과 물이 담긴 유리잔이 있었다. 맞아, 보고서 아래에…\n\n“제가 해 드리죠.” 노조총연합의 수장 모라체프스키가 나섰다. 그가 작은 깡통을 꺼내 뚜껑을 열자 시가는 그 안에 들어 있었다.\n\n피우수트스키는 미소를 지었다.“고맙네. 빌뉴스 쪽은 뭐 새 소식 없나?”\n\n“가게 몇 곳이 또 공격당했습니다. 이번에는 유대인들이 리투아니아인들을 공격했다고 하더군요. 유리창이 이미 몇 번이고 부서져서 화가 났던 모양입니다.”\n\n원수는 한숨을 쉬며 주머니에서 성냥을 꺼내 그었다. “좋은 소식은 없나?”\n\n병동 반대편에서 불길이 번쩍이는 것을 본 간호사가 깜짝 놀라 소리쳤다. “안 돼요, 피우수트스키 씨! 담배 피지 않겠다고 약속하셨잖아요!” 그녀는 급히 달려와 남성들 틈을 비집고 들어가 시가를 뺏으려 했다. 하지만 원수는 그녀를 노려보며 시가에 불을 붙였다. 경제부 장관인 크비아트코프스키는 간호사를 제지하며 말했다. “그나저나, 그디니아에서는 사상 최대 수출량을 기록했답니다. SOP와 L-LOP 관련해서도 순조로워 보입니다. 르비우의 공업 생산량을 생각해 보면, 왜 우크라이나 측이 그 지역을 탐내는지 알 만하지요.”\n\n피우수트스키는 시가를 빨며 미소를 지었다. 시커먼 담배 잎이 서서히 잿불로 바뀌었다. 좋았다. 그는 한 모금 크게 빨아들이며, 그토록 원하던 니코틴이 몸을 진정시키는 것을 느꼈다. 다시 한 모금. 매트리스가 몸을 폭 껴안는 듯한 기분이었다. 어지럽고 메스꺼웠지만, 또 한 모금 깊게 들이마셨다."
 POL_startup.5.a:0 "\"이거지\""
 POL_startup.6.t:0 "꼭지를 돌게 하는군..."
 POL_startup.6.desc:0 "피우수트스키는 혼자 자리에 앉아 있었다. 자신이 누군가에게 불려 온 건지, 아니면 이제 완전히 잊히고 쌓여 있는 건지도 잊어버린 채 말이다. “안녕하십니까, 원수님.” 익숙하지 않은 목소리가 문 뒤편에서 들려왔다. 동시에 비트카치는 초상화 작업을 시작했다. 뜻밖에도, 이 예술가와 원수는 모두 ‘위대한 비전을 지닌 사람’이라는 점에서 공감대를 찾았다.\n\n“은행들은 어떻게 보십니까? 반동의 요새라는 말도 있던데요?” 하고 비트카치가 물었다.\n\n“뭣들 하겠다는 건가? 우리 행정부의 강력 규제가 효과가 없었다고 주장이라도 하는 건가? 폴란드가 예전 지주나 지대 수입에 기댔던 시절처럼 쇠사슬에 매여 있다고?” 피우수트스키가 비꼬듯 웃으며 대답했다. “설마 그럴 리가 있겠나.”\n\n비트카치는 무표정하게 맞받았다. “모든 일이 군사적 기적을 일으키는 것처럼 쉽기만 하다면 좋겠습니다.” 피우수트스키는 코웃음을 쳤다. 그러고 나서 시선을 다시 비트카치에게 돌리자, 그는 이젤을 돌려 작품을 보여주었다. 비트카치는 원수의 짙은 눈썹이 번쩍 올라가는 모습을 보며 웃었다. 그림 속 얼굴은 어딘가 제왕처럼 위엄 있고, 실제 모습 그대로 오만해 보이기도 했다.\n\n“내… 이거 마음에 드는군.” 피우수트스키가 잠시 말문을 잇고 나서야 겨우 말했다. “그래, 자네가 속한 무슨 파든 운동이든, 뭐라고 부르나?” 비트카치는 어깨를 으쓱했다. 피우수트스키는 다시 자신이 그려진 모습을 살피며 생각에 잠겼다. 그러다 프랑스나 캅카스근황 보고를 떠올렸고, 이 기회에 전문가 의견을 물어보고 싶어졌다. “그럼 말이네,” 피우수트스키가 낮은 음성으로 물었다. “그 초현실주의자들이나 흘레브니코프의 사상은 대체 뭘 노리는 겐가?”\n\n“브르통과 그 일당은 어둡지만 진실을 담고 있는 악몽 같은 이미지를 잡아내려 애쓰죠.” 하고 비트카치가 답했다. “흘레브니코프는 러시아어 뿌리에서 의미를 뽑아내고, 새로운 말을 만들어내어 더 강렬한 이미지를 구현하려고 합니다. 하지만 어찌 됐든, 초현실주의자들은 당신을 과거에 바쳐진 신전을 박살 낼 위대한 곡(Gog) 정도로 본단 말입니다.”\n\n피우수트스키가 비웃듯 콧소리를 냈다. “나도 남들과 똑같이 먹고 싸고 누는 인간일 뿐야. 대단한 일을 해왔어도, 그들이 바라는 구세주나 반신 같은 존재는 아니지.”\n\n“스타니스와프 수칼스키는 아마 그렇게 생각하지 않을 겁니다만.” 하고 비트카치가 되받았다.\n\n두 사람은 작별 인사를 나눴고, 피우수트스키는 방 안에 남아 다시금 여러 잡다한 생각에 잠겼다. 그는 이 기묘한 사람들과 그들의 아이디어를 머릿속에서 굴려 보았지만, 지금은 집중할 여력이 없었다. 이런저런 생각이 하나씩 흩어지던 차에, 마치 타이밍을 맞춘 듯 펠릭스 지에르진스키가 방으로 들어와 두 팔을 벌려 인사했다.\n\n“원수님, 현재 치안 유지는 ‘후사쥐 쉬미에르치(죽음 후사르)’ 부대에 맡겨두고 있습니다만, 전반적인 정책 방향은 제가 계속 관리하고 있습니다. 사냥 철이 열렸다고 할 수 있겠습니다.”\n\n“좋군. 전쟁에서 정치로 넘어오는 과정이 좀 뒤죽박죽이긴 했지만, 적어도 기병대는 함께 끌어올 수 있으니 말이야.”\n\n지에르진스키는 방 한쪽에 놓인 그림을 보고는 미소를 지은 뒤, 피우수트스키를 돌아보며 말했다. “비트카치가 잘 그려놨네요. 저 헤진 콧수염과 핼쑥한 얼굴선은, 1킬로미터 밖에서도 알아볼 수 있겠습니다.” 그러거나 말거나 원수는 이미 문 쪽으로 몸을 돌리고 있었다."
 POL_startup.6.a:0 "\"그럼, 안녕하게나, 펠릭스. 난 오흐라나쪽에 전화 좀 해야겠네.\""
 POL_startup.7.t:0 "모든 것의 정상에서"
 POL_startup.7.desc:0 "올리브 램프에서 튀는 밝은 불빛이, 오래된 참나무 책상 앞에 조용히 앉아 있는 늙은 원수에게 유일한 벗이었다. 아직 그에게 상황이 절망적이지는 않았지만, 그는 머지않아 자신에게 죽음이 닥쳐올 것을 직감하고 있었다. 마치 늙은 개나 들소가 무리에게 짐이 되지 않으려고 스스로 외딴 구석으로 물러나는 기분이었다. 결코 유쾌한 감정은 아니었지만, 그는 이것이 순리라는 사실을 알고 있었다. 그는 곧 유언장을 쓰기로 마음먹었다. 엄격하고 형식적인 글을 쓰는 데는 자신이 있었지만, 이번만큼은 조금 덜 전통적인 방식으로 써 보고자 했다.\n\n“나, 유제프 피우수트스키는 1867년에 태어나, 이 빌어먹을 행성에서 거의 80년을 살아 왔소. 폴란드를 위해 80년간 헌신했지만, 여전히 부족하다는 생각이 드는군. 나는 ‘싸울 의지’를 가진 단 하나의 정당에 합류했지만, 결국 그 당을 갈라놓고 쓸모 있는 사람들을 데리고 나올 수밖에 없었소. 나는 독립을 위해 대전쟁에서 폴란드 군단을 이끌었고, 당당히 말하건대 나는 성공했소. 그렇게 나는 이 나라를 창녀 같은 놈들의 손아귀에서 빼앗아 왔소. 셰임에서 날뛰던 창녀들, 가장 큰 위협 세력과 함께 일하던 창녀들, 내가 사랑하는 폴란드를 분해하려 들었던 창녀들 말이오. 나는 미신의 구름을 꿰뚫고 정신의 피라미드 꼭대기에 서서, 모두에게 ‘가능한 것’을 보여 주었소. 그리고 나는 가장 위대한 인물이 되었지. 그런데 이제는 ‘삶’이라는 것마저도 나를 대적하려 드는군. 삶이 또 다른 창녀가 되겠다면, 그렇게 하라지! 나는 공화국을 위한 나의 계획을 반드시 실현해야 하고, 그건 내 목숨이 허락하든 말든 관여할 바가 아니오. 하지만 만약 시간이 충분치 않다면 어쩌지? 이미 늙었고, 건강은 나날이 악화되는데… 아, 신이시여, 내가 떠난 뒤 폴란드는 어떻게 되겠소? 내가 국가를 이끌 능력을 잃어버리면 어쩌나? 폴란드가 또다시 죽어버리면? 내 유산은? 누가 기억해 줄 것이며, 혹여 나에 대해 거짓말을 퍼뜨리는 일이 생기면 어쩌지? 나는 많은 걸 해 왔소, 할 수 있는 건 다 했소, 오직 내 조국 그녀를 위해서 말이오. 그걸로 충분할까?\n\n설령 죽음이 곧 날 데려간다 해도, 폴란드가 선택할 수 있는 길은 남아 있소. 아마 ‘내가 죽으면 발레리 스와베크가 내 뒤를 잇길 바란다’라고 쓰면 될 것 같기도 하오. 그는 내 비전과 가장 가까운 인물이자 내 오랜 친구이니 말이오. 또 이그나치 다신스키도 있긴 하오만, 멍청한 짓을 좀 벌이긴 해도, 그와 그 수하들이 대중적 지지를 통해 내 유산을 지켜 줄지도 모르지. 그리고 내 옛 동창이자 피에 굶주린 맹견 같기도 한 펠릭스 지에르진스키,, 제 손에 제가 목졸라 죽진 않을까 걱정이긴 하지만 말이오... 마지막으로 에드바르트 리츠-시미그위가 있소만, 그가 어떤 정치적 견해를 갖고 있는지는 나도 잘 모르겠소. 그래도 믿을 만한 사람이고, 그가 이끌어 간다면 내 유산이 잊히지는 않을 거라 생각하오.\n\n수칼스키, 공화개혁총련, 비트카치, 미래주의자들, 그리고 고양이 같은 부류에 대해서는 아예 생각조차 하고 싶지 않소. 내가 후계자로 삼고 싶은 이는, 점령 세력에 맞서 함께 싸웠고, 믿을 만한 사람이어야 하오. 물론 그들 역시 새로운 폴란드를 건설하는 데 도움을 주긴 했지만, 내가 진정으로 바라는 바를 그들은 알지 못하니..."
 POL_startup.7.a:0 "\"나는 이그나치 다신스키가 내 뒤를 잇기 바라오\""
 POL_startup.7.b:0 "\"나는 발레리 스와베크가 내 뒤를 잇기 바라오\""
 POL_startup.7.c:0 "\"나는 에드바르트 리츠-시미그위가 내 뒤를 잇기 바라오\""
 POL_startup.7.d:0 "\"나는 펠릭스 지에르진스키가 내 뒤를 잇기 바라오\""
 POL_startup.8.t:0 "심지어 아르카디아에서도, 그곳에 내가 있나니"
 POL_startup.8.desc:0 "요제프 피우수트스키는 잠에서 깨어나, 자신의 피가 턱에서 흘러내려 이불 속 부드러운 천에 고여 있는 모습을 보았다. 그는 한숨을 쉬며, 피로 물든 입 주변을 잠옷 소매로 닦고는 마구 뛰는 지친 심장을 달래며 간신히 침대에서 일어섰다. 그 외에는 방 안이 조용했다. 구석에서 자고 있던 아내는, 고른 숨소리 외에는 움직임이 없었다. 그는 침대에서 벗어나 대통령궁 발코니로 비척거리며 걸어가면서, 아내와 아이들에게 미안한 마음이 스쳤다. 그리고 벽에 몸을 지탱한 채 떨리는 손을 진정시키며 조용히 해가 떠오르는 모습을 지켜보았다.\n\n피우수트스키는 또다시 자신이 떠난 후의 모습을 상상했다. 곧 있을 어느 날, 그는 평온히 잠든 채로 발견될 것이고, 그의 아내는 의사를 부를 것이며, 의사는 그를 공식적으로 사망 선고하고 조문객들에게 알릴 것이다. 그리고 딱딱하게 식은 그의 손 옆에는 언제나처럼 무표정한 표정의 리츠-시미그위가 서서, 애국적이고 영웅적인 삶을 시적으로 추억하겠지. 그는 무덤으로 내려가고, 그가 이루어 놓은 업적을 갈가리 찢으려 드는 수많은 걱정과 싸움, 그리고 혼란은 이제 더 이상 들리지 않게 되겠지.\n\n이런 생각에 잠겨 있던 찰나, 갑작스럽게 몸이 메스꺼워지며 살을 에는 듯한 한기가 엄습했다. 피우수트스키는 앞으로 휘청거리면서, 입 가장자리로 침과 피, 그리고 가래가 뒤섞인 액체를 흘렸다. 바로 서려고 애썼지만, 마치 열병식의 북소리처럼 울리던 심장은 거의 소리가 나지 않았다. 맥박도 점점 멀어지는 듯했다. 그는 침실로 이어지는 열린 문을 향해, 사랑하는 아내가 있는 그곳으로 기어가려 애썼다. 반쯤 감긴 눈 너머로, 발코니 문을 통해 불어오는 서늘한 바람에 몸을 떨며 뒤척이는 아내의 모습이 보였습니다. 그는 쉰 소리가 섞인 울부짖음으로 아내를 불렀다.\n알렉산드라 피우수트스카는 순간적으로 벌떡 일어나, 물에 빠져 허우적거리는 듯한 남편에게 달려갔습니다. 울먹이며 그의 이름을 부르자,\n\n“의사 말고, 신부를… 신부를 불러줘… 의사는 안 돼…”\n\n피우수트스키는 온몸이 경련을 일으키며, 흐릿해진 눈으로 하늘의 구름을 응시했습니다. 아내가 전화를 걸기 위해 움직이려 하자, 그는 남은 힘을 다해 아내 팔을 붙잡았습니다.\n\n“알렉산드라, 스와베크에게 전해 줘… 검은 관을 원한다고… 이제 깨끗이 떠날 수 있게 해 줘…”"
 POL_startup.8.a:0 "원수께서는 폴란드 하늘 아래에서 서거하셨습니다."
 POL_startup.9.t:0 "맹세가 주어졌으니, 그 맹세를 지켰도다"
 POL_startup.9.desc:0 "혹자는 인민의 원수 유제프 피우수트스키의 장례식만큼이나 이 세상에서 장엄했던 의식이 과연 있었을까라고 말할지도 모른다. 공식 의식이 시작되기도 전에, 바르샤바 거리를 덮은 것은 애도에 잠긴 정적이었다. 국기와 함께 검은 기가 걸린 정부 청사와 민간 건물들, 그리고 길을 따라 모여든 수만의 문상객들이 저마다 온몸 혹은 일부에 검은색 옷차림을 갖추고 있었다. 이들은 성 요한 대성당으로 몰려들었는데, 그곳에 안치된 원수의 유해에 마지막 인사를 드리고자 몰려든 이들의 표정은 때론 눈물에 젖어 있었고, 때론 침묵 속에서 경건했으며, 어떤 이들은 중지와 집게손가락만 펴고 드는 노바폴스카식 경례를 표하기도 했다. 군이 의식을 관리하고 경계를 섰기에, 단 한 건의 소란도 일어나지 않았다. 그로부터 하루 뒤, 알렉산데르 카코프스키 추기경이 직접 장례 미사를 집전했다. 마찬가지로 그 사이에도 어떠한 소란도 벌어지지 않았다. 마치 온 나라가 분열과 투쟁을 잠시 잊은 듯, 원수님을 애도하기 위해 한마음 한뜻이 된 모습이었다. 그가 맞서야 했던 온갖 위기에도 불구하고, 폴란드는 적어도 이 순간만큼은 단합된 듯 보였다. 어떤 이들은, 비록 잠시일지라도 폴란드가 진정 ‘하나가 되었다’고 말했다. 미사가 끝난 뒤, 피우수트스키의 유해는 명예 근위대가 호위하는 열차편으로 옮겨져, 크라쿠프의 바벨 언덕에 있는 성 레오나르트 지하 묘소로 옮겨졌다. 그곳이 그가 영면할 최종 안식처였다.\n\n하지만 그 지극히 엄숙했던 분위기는, 바로 다음 날 충격적인 사태로 인해 분노로 바뀌었다. 사피헤아 추기경이 정부 측이나 다른 어느 누구와도 상의 없이, 피우수트스키의 시신을 ‘은종 지하묘’로 옮기라고 명령한 사실이 알려진 것이다. 원수님을 이렇게 함부로 이리저리 옮기는 행태에 대해, 국민들은 분노를 금치 못했다. 정부와 교회 지도부가 즉시 사태를 진정시키려 했으나, 이미 터져 나온 분노의 불길을 막기에는 역부족이었다. 수도 곳곳의 가톨릭 본당들에는 분노에 찬 청년 학생들과 옛 폴란드 군단 출신 노병들이 몰려들어, 방금 세상을 떠난 원수를 모독한 이들로 여겨지는 자들을 공격하려 할 기세였다. 이에 대응하여, 성직자들을 지키려는 이들과 원수의 존엄을 지키려는 이들 사이에 거리 곳곳에서 충돌이 벌어졌다.공공질서가 무너질 위험이 커지자, 폴란드 제치포스폴리타 연합회복권은 최후통첩을 내렸다. 추기경이 물러서지 않으면 대성당을 국유화하고, 추기경에게서 모든 영향력을 박탈하겠다고 경고한 것이었다. 이에 겁을 먹은 사피헤아 추기경이 결국 한발 물러섰고, 원상 복구를 약속했다. 전국 각지에선 피우수트스키를 향한 예우를 되찾았다는 승리감에 환호가 터져 나왔고, 밤낮을 가리지 않고 지속된 환호 속에 그를 기리는 목소리가 울려 퍼졌다."
 POL_startup.9.a:0 "이제 부디 편히 쉬소서. 그 누구도 원수님을 다시는 방해하지 못하리이다."
 POL_startup.10.t:0 "황금 마귀할멈이 다스리는 곳"
 POL_startup.10.desc:0 "유제프 로키에테크의 아침은 최악으로 시작되었다. ‘죽음 후사르’ 부대 사령관인 그가 받은 새로운 지시란, 시베리아와 카자흐 평원을 ‘안정화’하라는 것이었다. 러시아에 맞선 전쟁에서 자신과 부대가 헌신한 것에 비해 돌아온 보상이라고는 끝없는 황야를 감시하는 임무뿐이라는 사실에 실망감을 떨칠 수가 없었다. 전선에서 함께 싸워준 협력자들은 길 가다 보이는 이들조차도 넓은 땅을 몽땅 받아 막대한 부를 쌓아 가는데, 정작 폴란드의 정예부대는 무한히 펼쳐진 황야의 관리인으로 전락해 버렸으니까.\n\n그가 이 상황을 상의할 만한 사람은 역시 오랜 친구, 우카시 시에미옹트코프스키밖에 없었다. 알고 지내던 폴란드인 중에서 제대로 된 조언을 해 줄 사람은 그뿐이라 믿었다. 로키에테크는 시에미옹트코프스키의 저택을 찾았다. 경비들에게 가볍게 고개를 끄덕인 뒤, 안내를 받아 그의 사무실로 향했다. 그를 본 우카슈는 친구의 표정을 읽고는 곧바로 달래기 시작했다.\n\n“이건 말도 안 돼!” 요제프는 울분을 토했습니다. “셴지엘라시랑 라이스에게 새로운 배치 명령에 대해 말했더니, 둘 다 나만큼이나 분개하고 있었어. 대체 어떻게 우리한테 이럴 수 있지?”\n\n우카시 는 차분하게 답했다. “유제프, 너는 아직 전체 그림을 보지 못하고 있어. 자네가 ‘황야’라고 부르는 그곳은, 어디를 어떻게 살펴보느냐에 따라 막대한 부를 품고 있을 수 있지.” 이에 로키에테크는 귀를 쫑긋 세웠다. “그곳에는 온갖 자원이 있어. 석유, 강철, 크롬… 그리고 우라늄까지. 수익과 영향력의 원천이 될 수 있지. 몇 년 뒤면 모두가 핵발전소에 쓸 우라늄을 원하게 될 텐데, 자네가 그 우라늄의 ‘왕’이 될 수 있는 거라네! 러시아 애들이 이미 구축해 놓은 시설을 확장만 하면 되잖아?”\n\n“맞아, 그래… 내가 바보였어. 이 선물을 거절하려 들다니! 그렇지, 드디어 우리만의 땅을 갖게 되었군. 수년 전부터 동료들에게 말해 왔다네. 언젠가 우리 조상 사르마티아의 기사들처럼 중앙아시아 평원을 누비게 될 거라고. 우리를 간섭할 권위도 없고, 이래라저래라 간섭할 규칙도 없고… 진정한 황금 시대가 열릴 거야!”\n\n유제프는 순식간에 의욕을 되찾았다. 조금 전까지만 해도 분노와 절망을 왔다 갔다 했던 기분이 말끔히 사라졌다. 이제 그는 눈앞에 꿈이 펼쳐지는 듯했다. 광활한 대지, 철마를 탄 채로 초원을 누비는 ‘자신의 사르마티아인들’, 그리고 불복종하는 자들을 처단하면서 그 땅을 다스릴 미래 말이다. 바로 이것이 자신과 동료들이 그토록 바라던 일이었다.\n\n그리고는 다시 한 번 가치를 증명해 준 친구를 돌아보았다. “우카시, 너는 늘 내 곁에 있어 줬어. 후사르 부대에도 마찬가지로 힘을 보태 줬지. 이번에 얻을 부에서 자네 몫을 챙겨 주는 것이 당연하네. 우랄 너머에서 우리가 거둘 모든 수익을 자네도 함께 누리게 될 거야.”\n\n우카시는 얼굴에 너털웃음을 띠며 친구의 제안을 받아들였다. 우정을 향한 감사와 앞날의 기회를 향한 기대가 동시에 드러나는 표정이었다. 하지만 유제프 로키에테크는 전혀 불편해하지 않았다. 그는 인사를 건네고 나서, 반가운 소식을 후사르 부대원들과 나누기 위해 서둘러 차로 달려갔다."
 POL_startup.10.a:0 "용기와 의무의 기사들이었다."
 POL_startup.11.t:0 "심지어 아르카디아에서도, 그곳에 내가 있나니"
 POL_startup.11.desc:0 "요제프 피우수트스키는 잠에서 깨어나, 자신의 피가 턱에서 흘러내려 이불 속 부드러운 천에 고여 있는 모습을 보았다. 그는 한숨을 쉬며, 피로 물든 입 주변을 잠옷 소매로 닦고는 마구 뛰는 지친 심장을 달래며 간신히 침대에서 일어섰다. 그 외에는 방 안이 조용했다. 구석에서 자고 있던 아내는, 고른 숨소리 외에는 움직임이 없었다. 그는 침대에서 벗어나 대통령궁 발코니로 비척거리며 걸어가면서, 아내와 아이들에게 미안한 마음이 스쳤다. 그리고 벽에 몸을 지탱한 채 떨리는 손을 진정시키며 조용히 해가 떠오르는 모습을 지켜보았다.\n\n피우수트스키는 또다시 자신이 떠난 후의 모습을 상상했다. 곧 있을 어느 날, 그는 평온히 잠든 채로 발견될 것이고, 그의 아내는 의사를 부를 것이며, 의사는 그를 공식적으로 사망 선고하고 조문객들에게 알릴 것이다. 그리고 딱딱하게 식은 그의 손 옆에는 언제나처럼 무표정한 표정의 리츠-시미그위가 서서, 애국적이고 영웅적인 삶을 시적으로 추억하겠지. 그는 무덤으로 내려가고, 그가 이루어 놓은 업적을 갈가리 찢으려 드는 수많은 걱정과 싸움, 그리고 혼란은 이제 더 이상 들리지 않게 되겠지.\n\n이런 생각에 잠겨 있던 찰나, 갑작스럽게 몸이 메스꺼워지며 살을 에는 듯한 한기가 엄습했다. 피우수트스키는 앞으로 휘청거리면서, 입 가장자리로 침과 피, 그리고 가래가 뒤섞인 액체를 흘렸다. 바로 서려고 애썼지만, 마치 열병식의 북소리처럼 울리던 심장은 거의 소리가 나지 않았다. 맥박도 점점 멀어지는 듯했다. 그는 침실로 이어지는 열린 문을 향해, 사랑하는 아내가 있는 그곳으로 기어가려 애썼다. 반쯤 감긴 눈 너머로, 발코니 문을 통해 불어오는 서늘한 바람에 몸을 떨며 뒤척이는 아내의 모습이 보였습니다. 그는 쉰 소리가 섞인 울부짖음으로 아내를 불렀다.\n알렉산드라 피우수트스카는 순간적으로 벌떡 일어나, 물에 빠져 허우적거리는 듯한 남편에게 달려갔습니다. 울먹이며 그의 이름을 부르자,\n\n“의사 말고, 신부를… 신부를 불러줘… 의사는 안 돼…”\n\n피우수트스키는 온몸이 경련을 일으키며, 흐릿해진 눈으로 하늘의 구름을 응시했습니다. 아내가 전화를 걸기 위해 움직이려 하자, 그는 남은 힘을 다해 아내 팔을 붙잡았습니다.\n\n“알렉산드라, 스와베크에게 전해 줘… 검은 관을 원한다고… 이제 깨끗이 떠날 수 있게 해 줘…”"
