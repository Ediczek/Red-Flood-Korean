 DON_letter:0 "사랑과 모스크바"
 DON_letter_desc:0 "“바라바보다도 더 사악하고, 악의 천사들처럼 뿔이 달렸으니, 더러운 진창에 길러진 그대는 대체 어느 베엘제붑인가?” – 기욤 아폴리네르\n\n코자키 민족주의는 독특합니다. 인종이나 언어가 아닌, 형제애와 계급으로 정의되기 때문입니다. 콜차크의 무능함 아래서, 카자크들은 상당한 자치를 누리는 동시에 카자흐스탄이나 극동 지역을 식민화하기도 했습니다. 표트르 크라스노프같은 많은 지휘관들은 차르 체제의 러시아에 충성을 이어갔지만, 상당수는 황러시아로 도피하거나 페트로그라드에 대한 충성을 버리고 안넨코프군벌 처럼 독자적인 길을 걷기도 했습니다.\n\n이 중 비교적 덜 폭력적인 분파는, 이반 폴타베츠-오스트랴니차가 주도한 코자키 민족 해방 운동이었습니다. 크이우의 지원을 받아, 그는 강력한 군사주의 전통을 기반으로 한 새로운 코자키국가를 세우고 군사 독재 체제를 수립할 수 있었습니다. 대부분의 코자키들은 폴타베츠-오스트랴니차가 군주제 성향을 가지고 있으며, 여건만 된다면 기꺼이 헤트만의 자리에 오르려 한다는 사실을 잘 알고 있습니다. 하지만 보리스 사빈코프의 옛 동료인 이그나트 벨리처럼, 반동적 거짓 없이 진정한 코자키 국가가 존속할 수만 있다면 테러 행위도 불사하겠다고 선언하며 그의 성향을 좋게 보지 않는 이도 있습니다.\n\n폴타베츠-오스트랴니차와 벨리 모두 강조하듯, 코자키아는 우크라이나 없이는 살아남기 어렵습니다. 동시에, 둘 모두 우크라이나를 기회이자 위협으로 여기고 있습니다. 폴타베츠-오스트랴니차는 크이우의 사회주의 정책에 대해 회의적인 입장을 취하는 반면, 벨리는 코자키아를 우크라이나로 편입시키려는 구호를 외치는 우크라이나 민족주의자들과 거리를 두려 합니다. 그러나 크이우의 도움이 없다면, 이 갓 탄생한 코자키국가는 내부로부터 무너져 굶주린 군중들에게 삼켜지고 말 위험이 큽니다."