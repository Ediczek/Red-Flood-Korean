 IRE_new_high_king:0 "새 고왕"
 IRE_new_high_king_desc:0 "“곧 때가 오리라, 그리고 머지않아 모든 이가 확신하게 되리라. 왕은 공화국 없이는 존재할 수 없으며, 공화국은 왕 없이는 존재할 수 없다는 사실을, 두 존재가 몸과 영혼처럼 뗄 수 없는 것임을, 왕 없는 공화국과 공화국 없는 왕은 그저 의미 없는 말에 불과하다는 것을.”\n- 노발리스\n\n아일랜드가 가장 암울한 시절, 모든 이가 영국의 굴레에 영원히 복종할 운명이라 믿고 공화국의 꿈조차 꾸지 못하던 때, 한 사람이 일어섰고, 그를 따르는 민족이 있었습니다. 부활절 봉기를 이끈 목자이자 공화국의 대통령인 파릭 막 피어라스께서 아일랜드 정치의 중심에 서 계십니다. 비록 1916년에 왕위에 오르지는 못하셨으나, 그분의 정신은 1929년 정당한 승천의 순간까지 아일랜드 전역을 경계하셨습니다. 당파는 흘러가고 동맹은 들어오거나 떠날지라도, 공화국의 아버지는 늘 함께 계십니다. 그분이 이 땅에 계시는 한, 그리고 더블린이 자유로운 한, 저희는 언제나 아이트 파릭를 따르며 그분께서 저희를 자유로 이끌어 주실 것입니다."
 IRE_banner_for_all_none:0 "모두를 위한 기치, 누구도 위하지 않는 기치"
 IRE_banner_for_all_none_desc:0 "신페인 당은 아일랜드 집권당으로서 단 한 가지, 오직 한 가지만을 위해 통일되어 있습니다: 바로 아일랜드에서 영국 지배를 철폐하는 것입니다. 이 단일 목표는 국민 통합에 도움이 되긴 하나, 몇 가지 문제점을 내포하고 있습니다. 그 중 가장 큰 문제는 당이 단 하나의 목표만을 가지고 있는 반면, 당원들은 그렇지 않다는 점입니다. 각 당원들은 영국 없는 아일랜드가 어떠해야 하는지에 대해 서로 다른 비전을 가지고 있습니다. 가장 명백한 예로, 현재의 아일랜드 공화국 국기 타협안에 이르기까지 상징으로 사용할 영구적인 배너조차 합의하지 못하고 있습니다. 당 내부는 벨파스트로부터의 임박한 침공 위협 때문에 일시적으로 결속을 유지하고 있지만, 당 정책의 끊임없는 변동은 국내외에서 아일랜드의 이미지를 약화시키고 있습니다."
