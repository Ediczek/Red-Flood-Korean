 news.309.t:0 "중국청년당의 중국 통일"
 news.309.desc:0 "동방에 새벽이 밝아오자, 노란 물결이 타이완 해변과 티베트의 광활한 고원을 뒤덮습니다. 수천 명의 인파가 천안문 광장에 모여, 중국의 영수 쩡치가 “굴욕의 세기”가 끝났음을 선언하고 새로운 세계 질서가 세워졌음을 지켜봅니다.\n\n원래 르 솔레유에서 결성된 해외 반군주주의 단체 중 하나에 지나지 않던 중국청년당은 사천을 근거지로 세력을 잡은 뒤, 이제 중국은 물론 전 세계적인 주목을 받는 이름이 되었습니다. 젊은 중국당은 “민족 구원”을 외치며 유럽 열강의 식민지 개척으로 빼앗긴 땅을 되찾고, 중국을 다시금 세계 강대국으로 재건하겠다고 다짐합니다. 오랜 내전 끝에 마침내 전중국을 통일하며, 북극곰과 서양 세력에게 도전장을 내밀어 세계 정세를 뒤흔들고 있습니다.\n\n수천 년간 동방의 용은 번영해 왔으나, 서양의 도적들에게 빼앗기고 기만당해 명예를 잃은 적도 있었습니다. 그러나 이제 다시금 일어난 용은 어느 때보다 강력합니다. 영수 쩡치가 이끄는 이 고독하고도 단단한 중국 민족은 미래를 향해 매진합니다."
 news.309.a:0 "세계가 기다린다."
 news.310.t:0 "명조부흥"
 news.310.desc:0 "3세기 전, 북방에서 침입한 만주족에게 명 왕조가 패배함으로써 오랜 자주 왕조의 시대가 끝나고, 외세가 중국을 지배하는 시대가 열렸습니다. 북양 정부에 대한 21개조 요구안이 강제로 시행될 무렵, 대부분의 국제 관측통들은 중국이 결국 외세의 사슬에서 벗어날 수 없으리라고 예측했습니다.\n\n그러나 일본이 중국을 완전히 장악하지 못하면서, 예상치 못한 새로운 세력이 등장했습니다. ‘황사회’라 불린 이들은 처음에는 북양 정부의 세금 징수원에 저항하는 농민 군세와, 과거의 이상화된 중국 황금시대로 되돌아가자는 광신적 천년왕국신도들로 구성된 지방 농촌 반란 세력에 불과하다고 여겨졌습니다. 그러나 뜻밖의 승리를 거듭하면서, 황사는 북중국 평원을 휩쓸었고, 국민당에 염증을 느끼던 농민과 여러 중국 민족주의 분파의 지지를 얻었습니다. 그리고 과거 숱한 제국과 침략자를 막아냈던 남중국의 험준한 계곡과 험준한 산악지대에서 벌어진 힘겨운 전투 끝에, 황사회는 중원에 대한 정통성을 자처하던 군벌과 공화 세력을 상대로 기적적인 승리를 거머쥐었습니다.\n\n북경 자금성 안에서, 대명은 300년 만의 잠에서 깨어난 중국이 이제 다시금 세계를 움직일 것이라고 선포했습니다. 그들은 중국 땅 구석구석에 남아 있는 모든 외세 지배를 끝장내고, 오래전 중국을 세계의 중심으로 만들었던 과거의 길을 되찾겠다고 호언장담합니다. 이 같은 주장은 국내에서는 큰 지지를 받지만, 국제사회에서는 우려의 시선을 불러일으키고 있습니다. 그러나 남방의 일부 세력들이 미미하게 저항하고 있을 뿐, 한 번 천명을 얻은 이상, 이 기세가 쉽게 사그라들 것 같지는 않습니다."
 news.310.a:0 "용은 더 이상 자고 있지 않다. "
