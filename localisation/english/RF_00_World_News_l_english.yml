 news.311.a:0 ""
 news.312.t:0 "북보르네오 연방 선포"
 news.312.desc:0 "말라야가 반란 세력 손에 넘어간 뒤, 영국이 동남아시아에서 완전히 퇴출당하는 건 시간문제라는 견해가 많았습니다. 하지만 이 예측은 지금 불확실해졌습니다. 제국을 위한 새로운 힘이 등장했기 때문입니다.\n\n역사적으로 북보르네오 지역의 보호령들은 종주국으로부터 소외되어 왔습니다. 사라왁, 브루나이, 북보르네오 이 세 지역은 현재까지 절대주의와 회사 통치가 동시에 살아남은, 시대착오적이고도 고립된 주들입니다. 이들을 연방으로 통합하려는 시도는 근대화와 제도 통합을 목표로 한 것이었고, 독립적인 존속은 불가능해 보였습니다. 그러나 지금은 이상주의와 절박함이 뒤섞여, 북보르네오 지역의 영국 보호령들이 하나로 뭉쳐 연방을 결성해 독립을 선언했습니다.\n\n새 나라는 연방 입헌군주제를 채택했으며, 새로 즉위한 사라왁의 화이트 라자 가문 출신 안토니 라자가 이를 이끕니다. 그는 최근 숙부의 뒤를 이어 즉위했으며, 영연방 국가들 가운데 모범을 보이는 나라가 되겠다는 야심 찬 포부를 밝혔습니다. 다만 이 어린 연방이 앞으로 겪을 시련을 이겨 낼 수 있을지, 아니면 그 전신처럼 역사의 물결에 휩쓸리고 말지는 아직 미지수입니다."
 news.312.a:0 "그렇지만 또 다른 식민지 실험일 뿐. "
 news.313.t:0 "클레만탄의 백술탄"
 news.313.desc:0 "말라야 연방이 해체되면서, 동남아시아에서 힘이 급격히 약해진 영국은 어떻게든 자신의 지위를 지켜 줄 존재를 찾으려 애써 왔습니다. 고난이 때로는 기묘한 동반자를 만든다지만, 이번 경우는 특히나 이색적입니다. 영국 보호령으로 묶여 있던 북보르네오 지역에서 새로운 술탄국이 탄생했는데, 바로 스코틀랜드 출신의 제라드 맥브라이언, 혹은 그가 통치하는 백성들에게는 압둘 라흐만으로 알려진 인물이 이끄는 국가입니다.\n\n맥브라이언은 한때 사라왁의 라자 바이너를 보좌하던 인물로, 연방이 출범하던 시기에 이슬람으로 개종했습니다. 그는 자신이 이슬람의 위대한 부흥과 재통합에 기여할 인물이라 믿었고, 어디든 찾아가 설교하면서 원주민의 충성심을 얻었습니다. 결국 그가 이룬 업적은 아스타나를 접수하고 라자 가문을 몰아내는 것으로 절정에 달했으며, 이로써 100여 년에 걸친 브룩 가문의 사라왁 통치가 막을 내렸습니다.\n\n영국 역시 이 ‘새로운 예언자’가 브룩 가문보다 백성을 더 잘 다스릴 수 있으리라고 확신했는지, 그를 승인하고 나머지 보호령들도 넘겨주며 대신 충성을 요구했습니다. 이제 지위를 확고히 한 백인 술탄은 자신의 영지를 전 세계 이슬람 신자들에게 등불이 될 ‘다루살람’으로 바꿔 나가겠다고 선언합니다."
 news.313.a:0 "역사상 가장 기묘한 무자디드 구만."
 news.314.t:0 "오스트리아와 영국의 동맹"
 news.314.desc:0 "영국과 대오스트리아는 대전쟁 종전 이후 경제적으로 협력해 왔지만, 군사적 협력은 역사 속에나 존재할 뿐, 조간신문의 헤드라인을 장식한 적은 없었습니다. 그러나 이제, 수 세기 동안 지속된 제국들을 과거의 유물로 돌려보내려는 세계적 흐름 속에서, 오영 동맹의 필요성은 다른 모든 고려 사항을 압도하고 있습니다. 적대 세력에 둘러싸여 위기에 봉착한 오스트리아의 상황은 그 누구의 눈에도 분명해졌습니다.\n\n오스트리아의 카이저 겸 국왕, 루트비히 폰 미제스, 그리고 [ENG.GetLeader] 간의 수차례 회담 끝에, 양국은 혁명의 물결을 저지하고 유럽 열강 간의 균형을 회복하기 위한 상호방위조약을 체결하기에 이르렀습니다. 대전쟁 당시 서로에게 총부리를 겨누었던 적대감은 이제 완전히 사라졌으며, 양국은 이제 같은 전선에서 나란히 싸우게 될 것입니다. 하지만 이들의 연합된 힘이 과연 오래된 왕국을 지켜낼 수 있을지는 또 다른 문제입니다."
 news.314.a:0 "오스트리아의 한 줄기 희망인가? "
 news.314.b:0 "이제 그들의 제국도 함께 몰락하겠군. "
 news.315.t:0 "인도네시아 공화국을 향하여"
 news.315.desc:0 "미래는 이를 움켜쥘 의지가 있는 자의 것입니다. 탄 말라카는 이를 원했고, 손에 쥐었습니다. 한낱 사상누각처럼 보였던, 새로 해방된 말라야를 통치하는 인도네시아 권력은 지도자의 기대에 부응하듯 결국 살아남았습니다.\n\n한동안 비판자들은, 전시체제가 만들어 낸 민족 구성의 불균형 때문에 이 혁명이 실패로 끝날 거라고 예상했습니다. 즉, ‘통합’이라는 말만으로는 말레이인들이 자신들을 다스리는 중국인 집권 세력에 만족하지 않을 것이라는 견해였습니다. 그래서 남양 공산당은 한때 탄 말라카의 중요한 동맹이었음에도, 결국 멜라유 청년연맹에게 자리를 내주었고, 이로 인해 국가적으로 큰 혼란이 일어났습니다. 그러나 탄 말라카는 먼저 행동에 나서, 불충이 의심되는 관리들과 선동자들을 사전에 체포함으로써 상황이 악화되는 것을 막았습니다. 수도에서 벌어진 군대와 중국인 노동자 민병대 간 대치가 극적으로 막을 내리면서, 나라 안의 내부 갈등도 종결되었습니다.\n\n이제 드디어 터를 굳건히 다진 혁명 정부는 그 궁극적 목표를 향해 나아가려 합니다. 수마트라에서 뉴기니까지, 루손에서 로테까지, 인도네시아는 제국주의와 자본주의에 의해 분단되고 유린되어 왔습니다. ‘어머니 대지’가 고통에 울부짖고 있으며, 말라야에 있는 그녀의 충성스러운 아들들이 이에 답하려 합니다."
 news.315.a:0 "국민 통합을 위하여."
 news.316.t:0 "인민당 정권의 종말"
 news.316.desc:0 "시암 왕당파가 왕자 보원뎃이 이끄는 역정변에 성공하면서, 왕정 세력이 다시 권력을 장악했습니다. 1935년에 프라야 마노빠꼰이 일으켰던 정변 시도와 달리, 이번에는 왕당파가 루앙 피분송크람을 암살함으로써 인민당을 지지하던 군대를 무력화하는 데 성공했습니다. 정부군은 내부 지휘 체계가 무너졌고, 보워라뎃의 군대는 거의 저항을 받지 않고 방콕으로 진군하여 구체제로 복귀하게 되었습니다.\n\n현재 새 대관식을 준비 중인데, 누가 왕위를 이어받을지에 대해 여러 추측이 오가고 있습니다. 어떤 이들은 라마 7세가 복귀해, 인민당 정변 이전부터 추진하던 개혁을 이어갈 거라 생각합니다. 반면, 이전 재위 기간 동안 보여준 그의 미온적이고 불안정한 통치에 대한 기억 때문에, 본인이 퇴위하고 다른 적법한 계승자에게 왕위를 넘길 거라는 주장도 있습니다. 다만 의식이 거행될 즈음이면 누가 왕권을 물려받게 될지 확실히 알 수 있을 것입니다. 그리고 적어도, 인민당 정부가 과연 효율적이었냐는 물음에는 이미 답이 내려진 셈입니다."
 news.316.a:0 "구질서가 돌아오다니, 이례적인 일이군."
 news.317.t:0 "시암 혁명 지지"
 news.317.desc:0 "새로 수립된 시암 인민당 정부가 왕자 보원뎃이 이끈 왕당파 반란을 진압하는 데 성공했습니다. 반군은 초기에 여러 주에서 승세를 잡았으나, 정부 측 떠오르는 별 루앙 피분송크람의 노련한 지휘에 발이 묶였습니다. 방콕을 공격하려던 반군의 시도가 좌절된 이후, 정부군은 반군의 근거지인 나콘라차시마를 점령했습니다. 사기가 꺾인 왕당파 부대들은 잇달아 투항했고, 이로써 반란은 완전히 붕괴되었습니다.\n\n승리 후, 프라야 파혼 총리는 자리에서 물러났습니다. 많은 이가 루앙 피분송크람이 후임이 될 거라고 예상했으나, 인민당 민간파를 대표하는 쁘리디 파놈용은 프라야 파혼과의 친분과 대중적 지지를 발판 삼아 총리직을 노리고 있습니다. 시암의 미래는 아직 불투명하지만, 혁명 이전 시대로 돌아갈 수 없다는 사실만은 확실합니다."
 news.317.a:0 "호헌주의적 시암의 실험은 계속된다."
 news.318.t:0 "타이 문화대혁명 선포"
 news.318.desc:0 "예상대로 루앙 피분송크람이 프라야 파혼의 사임 후 새 총리가 되었습니다. 그는 인민당 군부 계파의 지도자로, 올해 일어난 왕당파 반란을 진압해 혁명의 영웅이 되었습니다. 민간파 지도자 프리디 파놈용과 협력하겠다고 공언한 피분송크람은 사실상 큰 반대 없이 권력을 거머쥐었고, 프라야 송수라뎃을 비롯한 왕당파 용의자들을 이미 퇴진시키고 있습니다.\n\n새 총리의 발언에서 알 수 있듯, 그는 근대주의자이자 민족주의자이며, 영토 회복에 적극적입니다. 시암이 한때 잃었던 영토를 되찾아야 하며, 이 땅은 위대한 ‘타이 민족’의 것이라는 것이 그의 소신입니다. 동시에, 그는 ‘범타이주의’를 지지한다고 밝혔는데, 이는 시암을 이 지역의 강대국으로 만들고자 하는 신사조입니다. 피분의 집권이 지역 안정에 위협이 될 수 있으나, 주변국들은 그가 어떤 길을 걸을지 주시하고 있습니다."
 news.318.a:0 "동남아시아가 안정적인 채로 남아있을 수 있을까? "
 news.319.t:0 "사회주의로 들어선 시암"
 news.319.desc:0 "시암의 전 총리 프라야 파혼이 물러난 뒤, 후임이 결정되었습니다. 많은 이는 보원뎃 반란을 진압한 루앙 피분송크람이 후임이 될 것으로 예상했지만, 인민당 민간파가 승리하여 결국 프리디 보원뎃 이 차기 총리에 오르게 되었습니다. 이는 아마도 피분송크람의 영토 확장 노선이 부담스럽다는 인식이 작용한 결과로 보입니다.\n\n프리디의 정책에 대해선, 그가 1935년에 발표한 ‘황색표지 소책자’의 내용을 구현하려 할 것이라는 관측이 많습니다. 여기에는 농업 기계화, 집단 농업 제도, 그리고 시암식 복지 국가를 수립하기 위한 제안들이 담겨 있습니다. 이 책이 야기한 논란이 1935년 프라야 마노빠꼰의 정변 시도, 1936년 보원뎃 반란으로 이어졌다는 평가도 있지만, 결국 프리디 파놈용은 모든 풍파를 이겨 내고 국가의 수장 자리에 올랐습니다."
 news.319.a:0 "오랜 봉건 왕국에게 급진적 변화가 찾아왔군. "
 news.320.t:0 "보수주의자들의 시암 정권 장악"
 news.320.desc:0 "시암에서 새로운 총리가 선출되었지만, 그의 이름은 많은 사람들에게 놀라움을 안겨주었습니다. 프라야 송수라데트는 1934년 혁명의 주요 인물들 중 한 명이며 정부의 중요한 구성원이었지만, 다른 개혁적인 보수주의자들처럼 그는 뒤따른 군주제의 권력제한에 강하게 반대했습니다. 1935년에 실패했던 프라야 마노파콘 쿠데타 이후 송수라데트와 그 측근들이 정부에서 배제되는 동안, 그 흐름이 바뀐 것으로 보입니다.\n\n당국 사람들 사이에는 프라야 송수라데트가 프라야 파혼 전 총리를 배신했다는 소문이 돌고 있습니다. 먼저 파혼 전 총리가 1936년 반란 진압에 도움을 줌으로써 처음에는 카나 라사돈 정부의 신뢰를 되찾았으나, 그 다음에는 파혼이 공개적으로 후계자를 지명하지 못하도록 대표들을 매수했다는 소문이 있습니다. 현재 사실상 의회에 의해 선출된 그의 총리로서의 다음 행보는 명확합니다: 개혁과 전통 사이의 균형, 그리고 시암 보수주의자들과의 화해입니다."
 news.320.a:0 "이런 쿠데타 이후에 균형을 이룰 수가 있다고? "
 news.321.t:0 "라마 7세의 왕위 사수"
 news.321.desc:0 "시암에서 열린 복위 의식을 통해, 라마 7세가 왕위를 지켜냈습니다. 많은 이들은 그가 인민당에 의해 실각해 개혁 작업이 무산될 것으로 보았지만, 비슈누의 자비와 브라흐마의 축복, 시바의 보호, 그리고 정법의 위엄 덕분인지, 보워라뎃의 역정변이 성공을 거두었습니다. 라마 7세는 돌아와, 과거에 추진하던 개혁과 함께 시암을 현대 국가로 변화시키는 과업을 계속 이어가겠다고 선언했습니다.\n\n정변 전, 라마 7세가 계획한 개혁에는 자문 위원회 설립, 새로운 각료직 신설, 새로운 테사반 지방 행정체제 등이 포함되어 있었습니다. 아마 그는 이 방향성을 계속 추구하면서 지방 귀족 세력의 권력을 약화시키려 할 것입니다. 이번 대관식은 고대 데바라자(신왕) 체제의 부활로 평가되는데, 이전까지 라마 7세는 국가적 문제를 해결하지 못해 무능하다는 평을 들었지만, 이제는 더 나이 들고 지혜로워져 이 신왕 이상에 부합할 수 있을지 주목됩니다."
 news.321.a:0 "국왕 폐하 만세!"
 news.322.t:0 "라마 8세의 대관식"
 news.322.desc:0 "시암에서 열린 복위 의식을 통해 라마 7세가 퇴위하고, 나콘사완 왕자 파리바타 수쿰반두를 후계자로 지명했습니다. 이 왕자는 1920년대에 영향력 있는 군사 지도자로 활약했으며, 시암인들 사이에서 유능한 군 개혁가로 인정받고 있었습니다. 그는 보워라뎃 역정변 시기에 거둔 공적을 바탕으로 라마 8세에 오르게 된 것으로 보입니다.\n\n새 국왕은 라마 5세와 6세의 전례에 따라, 전제군주제를 통한 국가 근대화를 이어갈 것으로 예상됩니다. 또한 카나 라짜돈 혁명으로 인해 불거진 충성심 문제를 감안해, 군 체제를 근본적으로 재정비하려 할 가능성도 큽니다. 이미 민간 정치 세력은 망명당했으며, 그의 지위와 경험, 시암 데바디라지의 가호와 하늘의 축복을 등에 업은 라마 8세는 시암을 새로운 시대로 이끌 것이라는 평가가 나옵니다."
 news.322.a:0 "천 년 넘게 군림하소서!"
 news.323.t:0 "황러시아에서의 쿠데타"
 news.323.desc:0 "황러시아의 하르빈 최고 소볘트에서 케렌스키가 사임한 뒤, 좌파와 우파가 권력과 영향력을 두고 다투는 혼란이 황러시아 전역을 뒤덮었습니다. 대부분의 평론가들은 이 공화국의 미래를 놓고 치열한 장기 투쟁이 벌어질 것으로 예상했지만, 오늘 예상치 못한 결말이 찾아왔습니다. 군대가 스스로를 지지하며 개입했기 때문입니다.\n\n수뇌부 장군들은 ‘곧 있을 백군의 침략’이라는 명분을 내세워 ‘임시 군사정권’을 세우며 안정을 도모하겠다고 선언했습니다. 하지만 얼마나 ‘임시’일지는 불투명합니다. 이미 여러 장군들이 정치적 야심을 감추지 않고 있기 때문입니다.\n\n남아 있는 민간 정부 잔당은 이 권력 장악을 “뻔뻔스러운 보나파르트주의”이라고 비난하며, 결코 모스크바의 독재보다 덜 억압적이지 않을 것이라고 주장합니다. 또 무력으로 세워진 정권은 무력에 의해 쉽게 무너질 수 있다는 우려도 나옵니다. 그럼에도 불구하고, 군부는 당분간 물러설 기색이 보이지 않습니다."
 news.323.a:0 "우리는 영원할 것이다."
 news.324.t:0 "안휘군벌의 중국 통일"
 news.324.desc:0 "베이징의 정치 투쟁 끝에 몽골 지역으로 추방되었던 안휘파는, 모두가 놀랄 정도로 재기해 세력의 정점을 되찾았습니다. 공산주의자, 민족주의자, 분리주의자 등 온갖 세력들이 안휘파의 군대에 밀려 퇴각했고, 부흥한 중화민국군의 깃발 아래 그들의 영토가 다시 복속되었습니다.\n\n처음에는 돤치루이가, 그가 사망한 뒤에는 쉬수정이 이끈 안휘파는 몽골을 평정한 뒤, 사분오열되었던 중국 각 지역을 소규모 군벌들의 간섭 없이 통일하겠다는 구호를 내걸었습니다. 오족의 깃발은 지난 20년간의 내전으로 얼룩진 때를 씻고, 이제 북경에서 곤명, 우루무치까지 높이 휘날리고 있습니다. 오랜 혼란 끝에 하나로 재편된 중국은, 마침내 ‘굴욕의 세기’를 끝낸 채 국민적 회복과 대대적인 근대화의 길에 들어섰습니다."
 news.324.a:0 "용이 깨어났군. "
 news.325.t:0 "자아-미래주의파의 러시아 통일"
 news.325.desc:0 "러시아에 황금기가 찾아왔습니다. 이고리 세베랴닌이 러시아 무정부 상태에서 권력을 놓고 다투던 다른 경쟁자들을 누르고, 오랜 전통에 눌려 있던 대지에 빛과 영광을 가져올 것이라고 선언했습니다. 그의 승리에 러시아인들은 거리에서 환호하며, 러시아 미래주의 연맹홀에서는 성대한 연회가 열렸습니다.\n\n1936년 캅카스에서 예상치 못하게 선거에서 승리한 세베랴닌과 그를 지지하는 ‘자아-미래주의파’들은, 곧 볼셰비키와 그 추종 세력을 몰아내고 무역과 상업을 개방하며 사회주의 국가를 자신들의 이상에 맞게 재편하기 시작했습니다. 부가 흘러들어오고, 이에 힘입어 러시아에서 내전을 종식시키려는 담대한 이들이 앞다투어 일어섰습니다.\n\n새 러시아는 이미 르 솔레유 진영, 혹은 다른 미래주의 세력들과 교섭을 시작했으며, 유럽을 넘어 전 세계로 퍼져 나가는 미래를 위한 투쟁에 앞장서겠다는 의지를 표명했습니다. 한편 세베랴닌과 미래주의 연맹은 러시아 재건 사업에 착수했고, 자신들의 영지에서 대중에게 미래를 선사하겠다는 의지를 굳게 다지고 있습니다."
 news.325.a:0 "북방의 빛이로군."
 news.326.t:0 "스탈린의 러시아 통일!"
 news.326.desc:0 "강철 같은 결단으로 무장한 채, 이오시프 스탈린이 이끄는 캅카스회는 러시아를 통일했습니다. 수십 년간 부패와 혼돈에 시달려 온 이 땅에 새 시대가 도래하자, 국민은 경외심 가득한 시선으로 이를 지켜보고 있습니다. 거대한 산업화와 근대화가 한창 진행되는 동시에, 문화혁명까지 다각도로 추진되고 있는데, 이 모든 것은 바로 ‘강철의 사나이’가 제시한 원대한 노선에 따라 진행되고 있습니다.\n\n스탈린은 마야콥스키와 함께 캅카스회를 세워, 이고르 세베랴닌이라는 반동 세력이 혁명을 뒤엎으려 하자 직접 무장 투쟁에 나섰습니다. 티플리스에서 벌어진 전투 중 마야콥스키가 전사했고, 스탈린은 그의 유지를 이어가겠노라 맹세했습니다.\n\n결국 제국과 각종 군벌 세력들은 패배했고, 스탈린은 새로운 시대와 새로운 인간을 탄생시키겠다고 선언했습니다. 자연과 반동에 맞서는 위대한 투쟁을 통해 만들어낼 ‘무신론적 초인’이 다가오고 있다는 말에, 이에 반대하는 이들은 급속도로 배척당하고 있습니다."
 news.326.a:0 "러시아를 이끄는 조지아인이라고?"
 news.327.t:0 "드로즈돕스키파 쿠데타의 성공"
 news.327.desc:0 "1936년 7월, 드로즈돕스키와 노보로시야 총독부의 드로즈돕스키파가 러시아 섭정 콜차크 제독에 맞서 쿠데타를 감행했습니다. 이들은 모스크바 수비대를 포섭하는 데 성공했으나, 콜차크와 충성파 군대의 강력한 저항에 부딪히며 격렬한 전투가 벌어졌습니다.\n\n몇 달간의 교전 끝에 결국 페트로그라드 정부가 항복을 선언했습니다. 콜차크의 통치에 반기를 들고 시작된 쿠데타는 오히려 그의 권력을 더욱 공고히 만드는 결과를 낳았으며, 현재 정부는 여름 정변으로 말미암은 피해를 복구한 뒤, 러시아 전역에서 만연하고 있는 불법 행위를 종식하기 위해 움직이고 있습니다. 드로즈돕스키를 지지해 온 왕당파들은 러시아를 혼란에 빠뜨린 콜차크 섭정의 실정을 되돌리는 조치에 착수했습니다.\n\n국제 사회는 신정부를 빠르게 승인했으며, 국내에서는 드로즈돕스키가 러시아의 통일과 재건을 준비하고 있습니다. 그의 궁극적인 목표는 러시아의 영토를 하얼빈까지 회복하는 것입니다."
 news.327.a:0 "새로워진 러시아로! "
 news.328.t:0 "콜차크의 드로즈돕스키파 쿠데타 저지 성공"
 news.328.desc:0 "1936년 7월, 드로즈돕스키와 그의 동맹 세력인 노보로시야 총독부가 섭정 제독 콜차크에 대항해 정변을 일으켰습니다. 이들은 모스크바 주둔군을 포섭하는 데 성공했으나, 콜차크와 충성 세력의 맹렬한 저항에 부딪혔습니다.\n\n수개월간의 전투 끝에 드로즈돕스키와 그의 군대는 마침내 항복했습니다. 모스크바에서 몰려나고 보급마저 끊긴 채 퇴각에 내몰린 그들은 승산이 없음을 깨닫고 조건 없이 콜차크에게 무기를 내려놓았습니다. 이 ‘하계 정변 전쟁’은 중부 러시아를 황폐하게 만들었으나, 이제 재건의 움직임이 시작되고 있습니다.\n\n전쟁이 발발한 이래, 이미 분열이 심각했던 러시아 전역은 더 큰 혼돈에 빠졌고, 콜차크는 이를 쉽게 놓아주지 않을 태세입니다. 자국 내 재건을 마치는 대로, 콜차크 러시아는 각기 분열되어 서로 싸우는 세력들로 나뉜 나머지 러시아 영토를 되찾으려 할 것이라는 전망이 많습니다.\n\n"
 news.328.a:0 "곰이 다시 포효한다."
 news.329.t:0 "청년 러시아 연합의 러시아 제국 정권 탈취!"
 news.329.desc:0 "‘하계 정변 전쟁’이 끝나면서 표면적 충돌은 잦아들었지만, 제국의 골칫거리가 완전히 해소된 것은 아니었습니다. 승리한 군대는 잔존 세력을 숙청하기 위해 급진 세력의 힘을 빌렸고, 이들에게 필요 이상으로 권력을 부여했습니다.\n\n그리고 숙청이 마무리되자, ‘청년 러시아 연합’이라는 조직이 페트로그라드를 상대로 또 다른 정변을 일으켰고, 이번에는 성공을 거두었습니다. 국가 기관을 대대적으로 새로이 정비하는 작업이 시작되면서, 동쪽에서 벌어진 끝없는 배신의 고리는 마침내 끊긴 듯합니다.\n\n“차르와 소볘트”라는 기치를 내건 청년 러시아 세력은, 노령의 관료와 귀족에게 숨이 막히던 러시아에 새로운 공기를 불어넣고 있습니다. 이미 낡은 국가체제를 개혁하는 작업에 착수했으며, 이 젊은 민족정신을 러시아 전역에 퍼뜨리겠다는 포부를 천명했습니다."
 news.329.a:0 "러시아가 스스로 소생했도다."
 news.330.t:0 "러시아 제국에서의 준위단 정변!"
 news.330.desc:0 "‘여름 정변 전쟁’이 끝나면서 겉으로 드러난 교전은 중단되었지만, 제국 내 문제가 완전히 해결된 것은 아니었습니다. 승리한 쪽은 군대와 정부 내의 적대 세력을 숙청하기 위해 급진 세력에게 힘을 실었고, 그들에게 과도한 권한을 쥐여 주었습니다.\n\n숙청이 끝난 뒤, 이번에는 ‘준위단’이라 불리는 장교단이 페트로그라드를 상대로 정변을 일으켜 성공을 거두었습니다. 국가 기구가 대대적으로 재편되는 가운데, 동쪽에서 이어지던 끔찍한 배신과 반란의 사슬은 드디어 끊긴 듯합니다.\n\n미하일 디테리흐스 가 이끄는 준위단들은 오랫동안 ‘신성 러시아’에 스며든 근대화 흐름을 거부하고, 종교와 농촌 가치를 복원하겠다고 선언했습니다. 이제 제국은 충성스러운 주들을 넘어, 시베리아와 튀르케스탄 등 본국에서 멀어져 간 지역을 다시 황제의 관 아래 되찾아오려는 야심을 드러내고 있습니다."
 news.330.a:0 "러시아가 회개했다."
 news.331.t:0 "러시아의 자작나무 서약 가입"
 news.331.desc:0 "광활한 러시아를 재정비하고, 하얼빈에서 대치하던 경쟁 정부와의 투쟁을 마침내 종결한 새 제국 정부는 다시금 국제 무대에서 영향력을 발휘하기 시작했습니다.\n\n이 통일 러시아의 재등장은 폴란드와 그 동맹들에게 큰 충격을 주고 있는데, 러시아 곰이 러시아 내전 이후 잃었던 영토를 되찾으려 하는 움직임을 보이고 있기 때문입니다. 이미 긴장은 고조되고 있고, 전쟁 가능성은 날로 커져가는 상황에서, 러시아는 ‘자작나무 서약 동맹’과 손을 맞잡으려 하고 있습니다.\n\n1936년 하계 정변 이전부터 프로이센과 긴밀한 관계였던 러시아가 자작나무 서약 측과 보조를 맞추는 것은, 유럽을 소용돌이로 몰아넣은 ‘근대성의 광기’를 퍼뜨리는 프랑스와 독일에 대한 공동 대응에서 비롯된 것입니다. 대륙의 판도가 크게 변화하는 가운데, 이 반 혁명 동맹은 유럽 전역을 뒤덮은 혼돈을 종식하고 자국 영토를 지키겠다는 강한 의지를 드러내고 있습니다."
 news.331.a:0 "기사들의 춤사위라."
 news.332.t:0 "이제조약"
 news.332.desc:0 "러시아 전역의 질서를 회복하고 하얼빈의 경쟁 정부와의 투쟁에서 승리한 후 다시 태어난 러시아 제국은 국제 정치에서 러시아의 입지를 되찾기 위한 행보를 시작했습니다.\n\n그리하여 오스트리아와 러시아의 황제들은 카를스바트의 휴양지에서 동맹 조약을 체결하기 위해 한자리에 모였습니다. 프로이센 정부의 반러시아적 태도와, 러시아 황실과 합스부르크 가문 간의 유서 깊은 유대는 대전쟁 당시의 대립에도 불구하고 두 제국의 쌍두독수리를 다시금 하나로 묶어놓았습니다.\n\n양국이 과거의 실패를 바로잡고 유럽 전역에 퍼진 혁명의 물결을 종식하기 위해 본격적으로 움직이기 시작하자, 폴란드와 헝가리에서는 1849년의 악몽이 다시금 되풀이될지도 모른다는 두려움이 점차 현실화되고 있습니다. 이미 총동원령의 소문이 유럽 전역을 휘감고 있는 가운데, 과연 곰과 독수리가 다시 한 번 영광스러운 행진을 펼칠 것인지, 아니면 붉은 물결이 유럽 전역을 집어삼켜 버릴 것인지는 오직 전장에서의 승부만이 결정할 것입니다."
 news.332.a:0 "화룡점정이로군."
 news.333.t:0 "신성동맹의 부활"
 news.333.desc:0 "광활한 러시아를 재정비하고, 하얼빈에서 경쟁 정부와의 투쟁을 마침내 끝낸 새 제국 정부는 다시금 세계무대에 영향력을 행사하기 시작했습니다.\n\n이 새롭게 부활한 러시아의 기세는 대단합니다. 오스트리아 제국, 자작나무 서약, 그리고 포르투갈이 러시아와 함께 ‘신성동맹’의 부활을 선언한 것입니다. 프랑스, 폴란드, 헝가리 등지에서는, 1848년 혁명 세력을 진압해 낸 그 옛 기억이 다시금 되살아나고 있습니다. 신성동맹은 제1차 세계대전 이후부터 유럽을 휩쓴 광기를 완전히 종결하고, 대륙에 질서를 복원하겠다고 천명하고 있습니다.\n\n이제 많은 이들은 ‘혁명’과 ‘반동’ 사이의 최후 대결이 임박했다고 봅니다. 각국은 군대를 증강하고, 경제를 전쟁에 맞춰 총동원하고 있으며, 유럽의 미래를 결정할 전쟁이 다가오고 있습니다."
 news.333.a:0 "앙시앵 레짐이 단합했군."
 news.334.t:0 "야쿠티아에서의 체코슬로바키아계 정변"
 news.334.desc:0 "여름 정변의 여파는 러시아 전역에 파문처럼 번졌습니다. 극동 총독부가 있는 지역에서는, 시베리아나 페트로그라드에서 지원 병력이 도착하지 못하자 마침내 황제의 권위가 무너졌습니다.\n\n야쿠트 민족주의자들이 이 지역을 점령하려 했으나, 라돌라 가이다와 체코슬로바키아 군단의 손에 패배를 맞았습니다. 그리고 가이다는 스타크 총독에게 압력을 가해, 극동 지역의 통치권을 스스로에게 이양하도록 했습니다.\n\n야쿠티아는 가이다가 구상한 대규모 계획에서 첫 단추에 불과합니다. 그는 러시아, 나아가 전 슬라브권 전체를 기독교 공화국으로 통합하겠다는 야심찬 구상을 내비쳤습니다. 하지만 그 앞길에는 아직 수많은 장애물이 남아 있습니다. 그럼에도 군단원들은 승리를 향해 전진할 각오를 다지고 있습니다."
 news.334.a:0 "슬라브족 혁명이라고?"
 news.335.t:0 "자유 야쿠티아"
 news.335.desc:0 "차르 제국이 균열을 보이기 시작합니다. 극동지방의 러시아 통치는 최근 모국에서 일어난 혼란을 피해 달아난 일본 군함들이 안전한 항구를 찾기 위해 침공했을 때 치명적인 타격을 입었습니다. 이 혼란은 분리주의자들이 독립할 완벽한 기회를 만들었고, 동부로부터 충원할 수 없는 상황에서 러시아 정부는 그들을 막을 힘이 없었습니다.\n\n파벨 크세노폰토프는 수도 야쿠츠크에서 러시아 지배로부터 극동의 독립을 선언했습니다. 마침내 자유의 바람이 외딴 침엽수림에서 새로운 생명을 불어넣게 되었고, 곧 그렇게 될 것입니다. 페트로그라드에서 야쿠츠크까지 전선이 그려지고 지역 군대가 전투에 참여하며 앞으로도 계속 확대될 것입니다.\n\n자유 야쿠티아의 미래는 아직 결정되지 않았습니다. 자유 야쿠티아 지도부 사이에서 두 가지 방향이 대두되고 있기 때문입니다. 즉, 북아시아 민족들을 단독으로 해방하거나, 러시아 전체를 차르 주의자들의 압제로부터 해방시키기 위한 투쟁에 남쪽의 공화국과 합류하는 것입니다. 일본과 하르빈 모두 새로운 국가가 내린 선택에 매우 신중을 기하고 있기 때문에, 이러한 선택은 결코 가볍게 이루어지지 않고 있습니다."
 news.335.a:0 "야쿠티아의 봄이로군."
 news.336.t:0 "몽골 해방"
 news.336.desc:0 "몽골에선 좀처럼 소식이 전해지지 않았습니다. 지난 20년 넘게 수많은 세력이 이 지역 패권을 두고 다투어 온 탓입니다. 그런데 뜻밖에도, 오랫동안 분쟁으로 황폐해진 땅에 몽골 공산주의자들과 오이로트 민족주의자들의 혁명 동맹이 평화를 가져왔다는 소식이 들려왔습니다.\n\n경쟁하던 러시아 군벌, 몽골을 되찾으려 베이징 정부가 보낸 중국군, 그리고 복드 칸의 군대마저도 그들 앞에서는 실패했습니다. ‘범몽골 연방’이라는 이름으로 출범한 이 동맹은 지금까지 전쟁이 휩쓸던 땅에 평화와 번영을 가져오겠다고 약속합니다.\n\n그러나 주변에선 아직 러시아와 중국이 혼돈에 빠져 있어, 몽골과 오이로트 세력은 이에 대비해 스스로를 지킬 준비를 갖추고 있습니다. 이미 황러시아 정부와 접촉해 군사 동맹을 맺고 무역 통로도 열었습니다. 지금은 스텝 지역이 잠시 평온해졌지만, 이웃국의 전투가 어떻게 결론 날지 아무도 확신할 수 없으며, 상황에 따라 언제 다시 무기를 들게 될지 모르는 일입니다."
 news.336.a:0 "아무르사나가 귀환했다."
 news.337.t:0 "몽골 혁명"
 news.337.desc:0 "울랄라에서 후레까지 붉은 깃발이 휘날리고, 북소리와 징소리가 울리며, ‘통합 노동 형제단’과 몽골 혁명의 승리를 찬양하는 노랫소리가 퍼집니다.\n\n알타이에서 그리고리 구르킨을 몰아낸 정변으로 집권한 이 형제단은 현지 공산 세력을 흡수해, 중국·몽골·러시아 세력에 맞서 혁명을 방해하는 이들을 모조리 제거해 왔습니다.\n\n이들은 볼셰비즘과 동방 신비주의가 융합된 사상을 표방하는데, 학계에서는 이를 미신적 혼합이라 치부하지만, 지역에서는 꽤 독특한 세력으로 주목받고 있습니다. 실제로 이들이 내부에서 어떤 기이한 실험을 하는지 알기는 쉽지 않습니다만, 그들이 아직 혁명을 멈출 생각이 없다는 점은 분명해 보입니다. 북쪽 러시아로도 이 혁명을 확산하고, ‘신성한 진리’를 펼치겠다는 포부를 공개적으로 밝히고 있기 때문입니다."
 news.337.a:0 "붉은 샴발라?"
 news.338.t:0 "아타만 세묘노프의 몽골 통일"
 news.338.desc:0 "몽골의 황량한 스텝지대에서는 소식이 잘 들려오지 않습니다. 지난 20여 년 동안 온갖 세력이 이 지역 패권을 두고 분쟁을 벌여 왔기 때문입니다. 그런데 이제, 예기치 못한 인물이 두각을 나타냈습니다. 바로 코사크 출신 그리고리 세묘노프가 이끄는 세력입니다.\n\n러시아 대전쟁 참전 경험이 있는 세묘노프는, 러시아 내전 시기 자국 고향인 트란스바이칼을 점령해 이를 약탈과 혼란에서 지키겠다고 선언했습니다. 충성스러운 병력과 일본의 지원 덕분에, 그는 적들을 물리치며 자리를 굳혔습니다.\n\n북경 정부가 몽골을 되찾으려 보낸 중국군부터 시작해, 현지 공산주의자들과 라이벌인 슈테른베르크 남작까지 그를 무너뜨리려 했으나 모두 실패했고, 결과적으로 그들의 영토는 세묘노프의 영지로 편입되었습니다. 그는 이제 자신이 몽골의 절대적 통치자임을 선언했습니다. 한때 미친 남작등으로 불렸던 인물들이 사라진 몽골을, 트란스바이칼을 안정의 등대로 만들었던 것처럼 평화의 땅으로 만들겠다는 포부를 내비치고 있습니다. 주변 러시아와 중국을 집어삼킨 갈등도, 몽골에는 발붙이지 못하게 하겠다는 것입니다."
 news.338.a:0 "초원에서의 평화로군."
 news.339.t:0 "로만 폰 웅게른-슈테른베르크 남작의 귀환"
 news.339.desc:0 "러시아 내전 당시 웅게른-슈테른베르크 남작은 병력을 이끌고 몽골에 입성해, 본토를 되찾겠다며 파견된 중국 공화정부의 군대와 맞서 싸웠습니다. 그 공으로 복드 칸의 신임을 한때 얻었으나, 자 라마에게 후레에서 쫓겨나 결국 북쪽으로 후퇴해 자신의 근거지를 마련했습니다.\n\n그리고 오랜 준비 끝에, 이번에는 강력한 기세로 몽골 전역을 휩쓸었습니다. 한때 그를 “미친 남작”이라 부르던 적들은 이제 모두 몰락했고, 웅게른 폰 슈테른베르크가 후레에 입성함으로써 몽골 역사의 새로운 장이 쓰이게 되었습니다.\n\n하지만 몽골은 그의 야망의 시작에 불과합니다. 러시아 귀족 출신인 그는 동방의 몰락한 왕조들을 재건하고, 다수의 적들로부터 신성 러시아를 지키겠다고 맹세했습니다. 언제든 공격이 닥칠 수 있지만, 그는 이를 불사하겠다는 의지를 불태우고 있습니다."
 news.339.a:0 "진정 불길 같은 설교다."
 news.340.t:0 "안휘군벌의 외몽골 질서 회복"
 news.340.desc:0 "몽골의 무정부 상태는 결국 안휘 군벌의 돤치루이 휘하 세력이 분리주의 지역을 다시 중국의 통치권 아래로 되돌리면서 막을 내렸습니다. 공산주의 게릴라, 러시아 세력 등 다양한 적들을 상대한 끝에 오랜 무질서는 드디어 종결되었습니다.\n\n신해혁명 직후 선포된 독립으로부터 시작된 25년 넘는 혼란 끝에, 중화민국은 마침내 이 반란지의 지배권을 확립했습니다. 반군 잔당이 여전히 몽골의 광활하고 외딴 땅을 떠돌고 있지만, 돤치루이 군대는 조직화된 적들을 제압했던 것과 같은 방식으로 이들 역시 처단할 것이라고 선언했습니다.\n\n몽골 독립의 꿈은 이제 산산이 부서졌고, 이미 외딴 이 지역은 전쟁의 상흔으로 더더욱 황폐해졌습니다. 전투가 끝났으니, 파괴된 지역사회를 재건할 계획이 마련되고 있습니다. 몽골은 오족공화의 기치 아래 새로운 시대를 맞이하게 될 것입니다."
 news.340.a:0 "안복이여."
 news.341.t:0 "제2차 빈켈리에트 전쟁"
 news.341.desc:0 "동쪽에서 전쟁이 시작되었고, 수 세기 동안의 오랜 적이 다시 한 번 서로의 목을 노리고 있습니다. 옛 러시아 제국 영토의 국가들로 구성된 광범위한 연합은 모스크바의 옛 영주들에게 대항하여 마침내 이 모스크바인들의 괴물을 종식시키고 러시아인과 다른 민족을 낡은 사슬에서 해방시키기 위해 노력했습니다. 다른 한편으로 러시아인들은 오랫동안 그들을 괴롭혀온 이 사소한 반란을 마침내 끝내고 인테르마리움의 군대에 대항하여 군대를 움직이기를 원하고 있습니다. 천둥은 참으로 동쪽에서 배회합니다.\n\n모든 열정을 다한 남자와 여자가 고국의 이름으로 서로를 죽이기 시작하고 시체 더미가 포로 하늘로 올라가 하나님의 보좌로 올라갈 것입니다. 갈등이 시작되었고 그 끝은 어디에도 보이지 않습니다. 양쪽의 빈켈리트와 메시아는 오랫동안 죽고 죽일 것이며, 마지막 한 방울의 귀중한 인간 피가 더러운 바위에 쏟아지고 동쪽에 새로운 질서를 만들 새로운 승자가 나타날 것입니다."
 news.341.a:0 "젬스타, 젬스타 나 브로가! (복수, 적에 대한 복수!)"
 news.342.t:0 "드네프르 강을 넘어 맞잡은 악수"
 news.342.desc:0 "드니프르 강은 우크라이나인과 러시아인에게 러시아 내전으로 인한 반란 이후 분열의 상징과도 같은 곳입니다. 우크라이나와 그 동맹국들이 내부 갈등을 겪고 있던 러시아 제국과의 최후의 전쟁을 준비하면서 분쟁은 수년 동안 동결된 채로 남아있었습니다. 많은 사람들은 러시아 통일이 마침내 동유럽의 운명을 건 전쟁을 가져올 것으로 믿었습니다.\n\n예상치 못한 투표율로 우크라이나와 러시아 모두에서 사회주의자들이 다른 모든 파벌을 물리치고 평화로운 통일이 이루어지면서 평화가 우세해졌습니다. 양국 정부는 이 지역을 집어삼킬 수도 있었던 전쟁과 무의미한 유혈 사태를 피할 수 있게 된 것을 축하합니다.\n\n하지만 긴장은 아직 끝나지 않았습니다. 우크라이나의 최대 동맹국인 폴란드는 프로메테우스적 대의에 대한 배신에 충격을 받았습니다. 폴란드 정부와 군은 러시아 제국주의를 완전히 종식시키려는 폴란드의 목표를 위협할 최근의 외교적 상황에 대한 적절한 대응을 결정하기 위해 긴급 회의를 시작했습니다. 전쟁의 망령이 사라지자마자 동유럽에 다시 한 번 전쟁이 다시 나타납니다."
 news.342.a:0 "붉은 강 위의 독수리"
 news.343.t:0 "자작나무 서약은 행진한다!"
 news.343.desc:0 "대전쟁이 끝난 뒤, 동맹국 출신 망명 세력들은 국제 사회가 ‘구 유럽’의 마지막 발악이라고 여길 만한 동맹을 형성했습니다. 그러나 오늘 그 예상은 보기 좋게 빗나갔습니다. 과거 회귀적인 그 협정은 역사의 쓰레기통으로 사라지기는커녕, 오히려 더욱 강력해진 모습으로 돌아왔기 때문입니다.\n\n제2차 대전쟁이 발발하자, 스톡홀름은 이를 틈타 동맹에 속한 여러 점령지를 되찾고자 행동에 나섰습니다. 반면 베얼린의 선전 매체들은 이내 르 솔레유 정권이 반 스파르타키스트 전쟁에서 낡은 구체제들과 손잡는 것을 위선이라고 비난했습니다. 하지만 쾨니히스베르크가 프랑스 내 어떤 독일 조직도 정당하다고 인정하지 않겠다는 의지를 보이면서, 상황은 예상과 다른 국면으로 흘러가는 듯합니다.\n\n유럽에 또 다른 전선이 열릴 수 있다는 우려를 표현하는 목소리가 있었지만, 경쟁하는 양 정부 모두 이를 묵살했습니다. 독일계 동맹국들에게 이 전쟁은 단순한 국경 문제를 넘어, 영혼을 건 투쟁이 된 것입니다. 피로 맺어진 자작나무 서약 형제들에게 이 싸움은 그들의 정체성 그 자체를 지키기 위한 전쟁입니다."
 news.343.a:0 "가장 강한 자"
 news.344.t:0 "하지 전쟁"
 news.344.desc:0 "하지(성지순례)의 또 한 해가 성공적으로 끝날 것이라 여겨졌으나, 다시금 전쟁이 발발하고 말았습니다. 이번에는 사우디가 이끄는 네지드 술탄국과 하심가가 이끄는 헤자즈 왕국이 충돌한 것입니다. 두 세력 간 긴장은 수십 년간 이어졌고, 이미 1924년에도 분쟁이 일어난 바 있었습니다.\n\n결정타가 된 사건은, 헤자즈 출신 깡패들이 메카로 향하던 순례자들을 태운 이집트 비행기를 납치하려다 실패한 것이었습니다. 소식을 들은 이븐 사우드는 헤자즈의 성스러운 수도의 수호 자격이 박탈되었다고 선언하고, 이크완을 동원하여 헤자즈 왕국에 대해 지하드를 선포했습니다. 이에 맞서 압둘라 국왕은 병력을 결집해 아라비아에서 사우디 세력을 영영 몰아내겠다고 다짐합니다. 이 모든 상황을 영국은 조용히 지켜보고 있으며, 이집트인들에게 벌어진 일에 대한 보복을 준비하고 있다는 관측도 있습니다.\n\n초승달 모양 칼들이 모래언덕에서 부딪히자, 국제 사회의 냉소적 시선이 쏟아지고 있습니다. 일부는 이븐 사우드가 최근 예멘·오만 등을 공격한 사실을 들어, 이번 서부 원정 역시 종교적 명분이 아니라 단지 아라비아 반도를 본인 지배하에 통일하려는 야심 때문이라고 비판합니다. 하지만 사람들의 추측과 상관없이, 아랍인의 피는 계속 흐르고 있습니다. 최후에 남는 승자는 단 하나뿐일 것입니다."
 news.344.a:0 "진정한 무슬림이 승리하길."
 news.345.t:0 "유고슬라비아 차르국 선포"
 news.345.desc:0 "5세기가 넘는 세월 동안, 비잔틴 제국의 멸망 이후 러시아가 정교회의 수호자로 여겨져 왔습니다. 그러나 최근 ‘큰 곰’인 러시아가 힘을 잃어가면서, 발칸 지역은 이교와 근대의 ‘악마’에게 그대로 노출되고 말았습니다. 그렇다면 남슬라브인들이 스스로를 지킬 권리를 갖는 것이 정당하지 않겠습니까?\n\n투르크에 대한 대규모 군사 작전 이후, 카라조르제비치 왕가가 이끄는 통합 발칸 세력은 지역 강국으로 발돋움했습니다. 새롭게 떠오른 이 ‘유고슬라브’ 세력은 공산주의와 미래주의 사상을 모두 억제하려 하면서 주변 지역 정치에 깊숙이 개입하기 시작했습니다.\n\n유고슬라브인들은 이미 기정사실이 된 명분을 공식화하기만 하면 되었습니다. 파블레 카라조르제비치는 가족과 드미트리 료티치총리를 대동하고 ‘차르그라드’에 개선했습니다. 열광적인 환호가 이어진 뒤, 콘스탄티노플의 세계 총대주교 벤야민 1세는 파블레 카라조르제비치를 ‘유고슬라브 차르’로, 그의 부인을 ‘차리차’로 즉위시켰습니다. 이 고대 도시를 그리스와 터키 양측 모두에게서 빼앗아온 이번 조치로 그들은 한 번에 두 국가를 굴욕에 빠뜨렸습니다. 한편, 러시아는 발칸에서 벌어지는 이번 사태를 흥미롭게 지켜보고 있습니다. 세르비아-크로아티안 제국의 선포는 발칸의 질서를 크게 뒤흔들 것입니다."
 news.345.a:0 "쌍두독수리가 다시 날아오른다."
 news.346.t:0 "네지드의 남쪽으로의 진군"
 news.346.desc:0 "오스만 제국이 분할된 이후, 아라비아반도는 끊임없이 타오르는 부족 전쟁의 화약고였습니다. 네지드의 이크완 기수들은 사우드 왕가의 녹색 깃발 아래 사막을 약탈했습니다. 지난 수십 년간은 라시디족을 학살하고, 이븐 사우드가 무찌른 수많은 씨족을 굴복시킨 것으로 정의되었습니다. 오늘날, 술탄의 확고한 눈은 남쪽으로 향하고 있습니다.\n\n페르시아만의 쌍둥이 자매인 무스카트와 오만은 오랫동안 영국 외무부의 사실상 소유였습니다. 하지만, 사구 아래 석유가 발견되면서, 이들은 정복자가 될 사람들에게 유혹적인 표적이 되었습니다. 외부의 군사 개입이 필요했던 두 국가의 긴장을 거론하며, 사우드 군대는 이제 술탄과 이맘을 무릎 꿇게 하고, 왕실의 벨트 아래에서 또 한 번의 빛나는 승리를 가져오려고 움직이고 있습니다.\n\n아랍에서의 전쟁은 잔인하고 신속하게 전개되었으며, 이 남부 전역에서의 전쟁의 진행은 아마도 매우 신속할 것입니다. 도전은, 만일 있다면, 정복된 정부와 통제되지 않는 국민들, 역사적으로 그 이름에 걸맞은 야심 찬 제국의 고르디우스의 매듭과도 같은 행정이 될 것입니다."
 news.346.a:0 "제국과 제국이 싸우는군."
 news.347.t:0 "사우디의 정복 활동 계속"
 news.347.desc:0 "무스카트와 오만은 이븐 사우드에게 무릎을 꿇었고, 아라비아 동쪽 끝까지 네지드의 깃발이 나부낍니다. 그러나 그는 눈물을 흘리지 않습니다. 아직 정복할 세계가 많기 때문입니다. 새로 획득한 지역을 다스리는 과정에서 이븐 사우드는 동맹과 철권통치를 겸해 자신의 권세를 확립한 뒤, 이제 남서쪽 예멘 왕국으로 눈을 돌렸습니다.\n\n아덴만 식민지화로 인해 힘을 잃은 이 무타와킬 예멘은 자이디파 시아를 신봉하는데, 이는 영적 자립심을 높이는 동시에, 네지드 술탄국이 표방하는 와하비즘과 정면으로 충돌합니다. 이븐 사우드가 이 분파를 ‘이단’이라 선언한 상황에서, 술탄국의 군대는 이슬람 세계의 성지이자 아라비아 전역을 자신들 세력권에 두려는 대망을 실현하고자 군사 행동을 개시했습니다. “유럽 영토를 공격할 의사는 없다”라는 리야드의 확언에도 불구하고, 반 유럽적 수사가 점차 강해지자 아덴에 있는 영국인들은 또 다른 전쟁이 코앞에 닥친 것에 우려를 금치 못하고 있습니다."
 news.347.a:0 "사라왓에 울리는 전쟁 나팔소리."
 news.3471.t:0 "사우디의 정복 활동 계속"
 news.3471.desc:0 "무스카트 세력은 사우디군과 혈전을 벌이며 점령을 늦추는 데 성공했지만, 사막은 상처를 오래 지니지 않는다는 말처럼, 이븐 사우드의 군대는 곧 재편되어 힘을 되찾았습니다. 이제 그들은 아라비아 반도에 남은 또 하나의 왕국, 예멘을 정복하러 남서쪽을 향해 진군합니다.\n\n아덴만을 식민화하는 과정에서 세력이 약해진 무타와킬 예멘은 자이디파 시아라는 독특한 종교적 정체성을 갖고 있으며, 이는 네지드가 내세우는 수니파 극단주의 와하비즘과 양립하기 어렵습니다. 이븐 사우드는 이 ‘이단’에 대한 성전을 선언하며, 반도를 완전히 지배하려는 확장주의 야심을 실현하고자 준비 중입니다. “유럽 영토에는 무력을 사용하지 않겠다”라는 리야드의 약속에도 불구하고, 반유럽적 선동이 점차 거세지자, 아덴에 주둔한 영국 세력은 또다시 문턱까지 다가온 전쟁에 긴장하고 있습니다."
 news.3471.a:0 "사라왓에 울리는 전쟁 나팔소리."
 news.348.t:0 "사우디, 아라비아 지배권 주장"
 news.348.desc:0 "헤자즈를 지배하던 하심가가 사우디의 파상공세에 끝내 무너질 것이라 예상한 이는 거의 없었으나, 실제로 사우디가 승리하자 국제 사회는 이 지역 소식에 촉각을 곤두세우고 있습니다. 이븐 사우드는 헤자즈와 네지드 양쪽에서 왕위를 획득해, 자신의 권위 아래 두 지역을 합병했습니다. 이미 아라비아의 울라마들은 그에게 ‘성스러운 도시의 수호자’라는 칭호를 부여했고, 아나톨리아에서 붕괴해가던 칼리파 체제가 사라지는 국면에서 전 세계 무슬림들은 새로운 현실에 적응해야 하는 처지입니다.\n\n압바스 왕조가 몰락한 이후 처음으로, 아라비아 전역이 한 지도자의 비전 아래 통일되었습니다. 리야드에서 오는 명령과 밀서를 실은 관리와 군인들이 모래언덕을 가로지르며, 이슬람의 발상지에 큰 사회·정치 개혁의 시작을 알리고 있습니다. 하지만 모두가 이를 환영하는 것은 아닙니다. 열광적으로 싸운 이크완은 와하비즘의 ‘순수한 정신’을 반드시 실현하라며 이븐 사우드를 압박하고 있고, 동시에 새로운 왕은 이웃 각국이 지켜보는 가운데 모든 이슬람 분파의 순례객을 받아들여야 하는 상황에 놓였습니다."
 news.348.a:0 "이슬람의 문호 개방인가, 아니면 폐쇄인가?"
 news.349.t:0 "압둘라 앞에 무릎 꿇은 아라비아"
 news.349.desc:0 "영국은 좀체 지는 말에 베팅하지 않는 나라입니다. 그리고 네지드와의 두 차례 전쟁에서 압둘라 국왕을 지지했던 영국의 선택은 결국 옳았습니다. 하심가문은 원래 대전쟁 당시 영국이 아랍 공략을 위해 내세운 동맹 세력이었으나, 이후 영국의 눈엣가시 같은 존재가 되기도 했습니다. 그럼에도 1920년대에 시리아와 헤자즈를 통치하면서 영향력을 키울 수 있었습니다. 전쟁 초기 영국이 아랍인들에게 했던 약속이 제대로 지켜지지 않았지만, 파이살은 잊어도 그의 형제 압둘라는 결코 잊지 않았습니다.\n\n중동에서 기존 질서가 붕괴하자, 새로 탄생한 ‘아라비아 왕국’은 영국의 조심스러운 지원과 압둘라의 노련한 책략을 바탕으로, 반도 곳곳에서 사우디가 거둔 영토들을 재빠르게 흡수했습니다. 거대한 반도의 모든 영토를 완전히 통합하려면 시간이 걸리겠지만, 이미 일각에서는 그가 다른 곳을 넘보며 더욱 거대한 정복을 꿈꾼다고 말합니다. 이는 ‘아랍인의 아라비아 시대’의 시작이 될 수도 있고, 혹은 무슬림들이 새로운 야심가에게 굴복하는 시대로 기록될지도 모릅니다."
 news.349.a:0 "하심 가문의 갈증은 꺾일 줄 모른다!"
 news.350.t:0 "시리아 왕, 반군 격파"
 news.350.desc:0 "동맹국들에게 버림받고, 장군들에게 배신당하고, 수많은 역경에도 불구하고, ‘통일 시리아 왕국’은 공화주의 반군을 물리치고 자국을 유일한 합법 정부로 재통합하는 데 성공했습니다. 그러나 시리아의 문제가 완전히 해결된 것은 아닙니다. 아직 서부 지역의 소수민족 자치지들이 남아 있기 때문입니다. 이들은 왕국이 붕괴할 때 독립을 선언한 소국들입니다.\n\n가지 국왕은 아버지 파이살로부터 무너져가던 국가를 물려받았습니다. 파이살이 바라던 ‘자유롭고 다문화적인 통일 시리아’라는 이상은 그 자체로 무거운 짐이었고, 스스로 붕괴할 위기에 처해 있었습니다. 하지만 샤반다르가 이끄는 국민블록 연합과 남부 드루즈부족의 지지를 등에 업은 가지는 산산조각 난 조국을 다시 모아 새로운 출발을 기약했습니다. 이미 영국과의 관계 회복을 위해 T.E. 로렌스가 파견되어, 과거처럼 협력 체계를 되살리려는 움직임이 감지됩니다. 영국이 전쟁 중 별다른 지원을 해 주지 않았음에도 말입니다."
 news.350.a:0 "주여, 국왕 폐하를 지켜 주소서! 분명 쉽지 않을 것이기에!"
 news.351.t:0 "시리아 공화정 수립"
 news.351.desc:0 "안툰 사데는 시리아 남부를 지켜오던 왕정을 마침내 몰아내고, 1년 가까이 지속되던 공화 진영과 국왕 가지 세력이 나뉘어 서로를 견제하던 교착 상태를 깨뜨렸습니다. 하지만 전쟁이 완전히 끝난 것은 아닙니다. 해안 지역의 ‘민족 공화국들’ 역시 왕국에서 떨어져 나온 뒤 살아남은 세력들이며, 이제 막 탄생한 젊은 시리아 공화국에게 새로운 도전 과제가 될 것입니다.\n\n프랑스의 후원을 받은 ‘시리아 사회민족당’을 내세워 부상한 사아다는, 동포 지식인 칼릴 지브란이나 왕국 소속의 장교 세력에게 ‘메소포타미아와 레반트를 아우르는 국가’를 꿈꾸게 했습니다. 이제 시리아는 하심가와 영국의 굴레에서 벗어났고, 새로운 문명과 국가를 건설하기에 더없이 비옥한 땅이 되었습니다. 하지만 주변국들과 열강은 여전히 시리아를 그저 르 솔레유 진영과 미국 자본이 벌이는 ‘대결장’의 말로만 여기고 있습니다."
 news.351.a:0 "폐허 위에 우리는 찬란한 영광을 세우리라!"
 news.352.t:0 "유대 휴전 협정 타결"
 news.352.desc:0 "시리아 내전의 화염 속에서, 아랍 바다 한가운데 새로운 유대인의 국가가 자리를 잡았습니다.\n\n오스만 제국이 영국 무력 앞에 굴복했을 때, 많은 이들은 성지가 어떤 운명을 맞을지 궁금해했습니다. 세계 유대인 공동체에 대한 영국의 우호적 태도를 알던 사람들에게, 오스만령 시리아 전역이 아랍 왕에게 통째로 넘어간 것은 충격이었습니다. 파이살이 다마스쿠스에서 즉위하고 난 뒤, 팔레스타인 내 유대인과 아랍인 사이의 긴장은 서서히 수면 위로 드러나기 시작했습니다.\n\n그러던 끝에, 오랜 망명 생활을 이어온 유대인들은 진정 자신들의 고향이라 부를 수 있는 나라를 얻어냈습니다. 민족군사기구의 지도자 제브 야보틴스키가 ‘신약시대의 여호수아’로서 반란을 이끌었고, 새로운 국가는 이제 첫 헌법을 마련하고, 첫 선거를 치르며, 국명조차 무엇이라 해야 할지 고민하는 단계입니다. 휴전선 이북 지역에 남은 아랍인들은 민병대의 보복을 우려해 대규모 탈출을 감행하고 있습니다. 텅 빈 모스크에 바람만 스칠 뿐인 상황에서, 국제 사회는 이 신생국이 군사독재의 길을 걷게 될지, 아니면 민주 국가로 인정받게 될지 그마저도 생존할 수 있을지 주시하고 있습니다."
 news.352.a:0 "잔해 위에서, 한 그루의 올리브나무가 싹을 틔운다."
 news.353.t:0 "유대 반란 진압"
 news.353.desc:0 "레반트에서 새롭게 꿈을 펼치려던 유대인들의 희망은 세상에 피어나기도 전에 아랍의 무력 앞에 사그라졌습니다.\n\n오스만 제국이 영국군에 굴복했을 때, 많은 이들은 성지의 운명을 궁금해했습니다. 세계 유대인을 지지하는 영국의 성향을 익히 아는 이들에게, 오스만령 시리아가 고스란히 아랍 국왕에게 넘어간 일은 큰 충격이었습니다. 파이살이 다마스쿠스에서 왕위를 얻게 된 뒤, 팔레스타인에서 아랍인·유대인 갈등은 갈수록 깊어졌습니다.\n\n하지만 이제 팔레스타인 전역의 키부츠는 버려져 유령 마을이 되었고, 도망치지 못한 이들은 학살과 폭력에 시달리고 있습니다. 패배한 유대인 무장세력은 폭탄과 총격으로 저항하며, “나캄(복수)”만을 외칩니다. 전 세계 게토에서는 20여 년 전 탈출했던 유대인들이 다시금 밀려와 인구가 팽창하고, 바다를 건너는 배 안에는 또 한 번의 망명을 떠나는 이들이 가득 차 있습니다. 아랍권 곳곳에서 승리를 자축하는 가운데, 텔 아비브에선 슬픔의 눈물이 흐릅니다. 유대인은 다시 떠나야 합니다. 이번에는 영영 돌아오지 못할 수도 있습니다."
 news.353.a:0 "연기 속에 흐드러진 꿈은 어떻게 될까?"
 news.354.t:0 "생명우주론자들의 러시아 통일"
 news.354.desc:0 "지난 20년 동안 황러시아는 제정 러시아에서 망명당한 미래 예언자들의 요람이 되어 왔습니다. 러시아 공화국이 몰락하고, 반 차르 투쟁의 보루였던 이 땅이 폭력에 휩싸이면서 그들의 꿈도 막을 내리는 듯했습니다. 그런데 바로 그 혼란 속에서, 한때 전진주의자와 동맹이던 생명우주론자가 그들만의 길을 발견했습니다.\n\n블라디미르 무라비예프가 이끄는 ‘자유 창조구’은 먼저 황러시아를 집어삼킨 무정부 상태를 종식시키는 데 성공했고, 그 다음엔 러시아 전체로 눈길을 돌렸습니다. 수년간의 피비린내 나는 싸움 끝에, 이제 그들은 더 거대한 목표를 노리고 있습니다. 우주와 죽음이 ‘생명우주론자’의 도래를 두려워한다는 우스갯소리가 나올 정도입니다. 이들은 생명의 최대 적, 즉 ‘육체적 죽음’의 종말을 선포했습니다.\n\n새로운 ‘질서 연방’에서는 시간과 공간을 완전히 지배하겠다고 공언했고, 대규모 근대화 계획이 이미 착수되었습니다. 마천루, 공장, 인간이 하나의 조화를 이루어 자연을 넘어선 ‘문화의 승리’를 보여주겠다는 것입니다."
 news.354.a:0 "높이 올라, 하늘을 향해 뻗어나가라!"
 news.355.t:0 "생명우주론자들의 러시아 통일"
 news.355.desc:0 "지난 20여 년 동안 황러시아는 제국 곳곳에서 추방된 ‘미래의 설교자’들이 모여드는 중요한 보금자리로 자리 잡았습니다. 과거 제정 러시아에 맞선 자유의 보루였던 이 땅이 폭력으로 물들고, 러시아 공화국마저 몰락하자, 이들의 꿈도 끝나는 듯했습니다. 그러나 바로 그러한 무질서 속에서, 한때 전진주의자와 단순 동맹 관계였던 ‘생명우주론자’들은 승리로 가는 길을 발견했습니다.\n\n알렉산드르 야로슬랍스키가 이끄는 ‘자유 창조구’는 무기를 들고 먼저 이 지역을 뒤덮은 무정부 상태를 종식시키고, 이후에는 러시아 전체를 안정시키는 대업을 시작했습니다. 수년간의 유혈 사태가 지나간 지금, 그들은 다음 목표를 향해 나아갈 준비를 마쳤습니다. 생명우주주의자들의 등장에 우주와 죽음이 떨고 있습니다. 왜냐하면 그들은 생명에 있어 가장 거대한 적인 ‘육체적 죽음’의 시대를 끝내겠노라고 당당히 선언했기 때문입니다.\n\n이를 실현하기 위해, 새로운 ‘자유 창조 연방’ 전역에서는 대규모 사회·경제 개혁이 진행되고 있습니다. 모든 개인에게 완전한 자유가 선포되었고, 근대주의 양식의 건축물이 과거 분열되었던 러시아의 폐허 위에 들어서고 있습니다. 이제 죽음의 횡포를 종식시키겠다는 생명우주론 ‘창조구’의 위대한 계획이 구체화될 날이 머지않았습니다."
 news.355.a:0 "높이 올라, 하늘을 향해 뻗어나가라!"
 news.356.t:0 "볼디레프 장군의 러시아 통일"
 news.356.desc:0 "지난 20년 동안 황러시아는 제국에서 추방당한 자유 열망자들의 피난처 역할을 했습니다. 그러나 러시아 공화국이 붕괴하고, 차르주의의 반동에 맞서던 자유의 보루조차 폭력에 잠식되자, 이들의 꿈은 사라질 위기에 처했습니다. 바로 그 무질서 속에서, 공화군 내 유력 인사였던 바실리 볼디레프장군이 나서서 영영 잃어버렸다고 여겨졌던 가치를 되찾고자 했습니다.\n\n몽골과 인접한 변경지대에서 홍호자 세력을 진압하라는 임무를 받았던 볼디레프는, 중국 무장단을 공격하기 위해 군을 준비하던 도중 하르빈 중앙정부의 붕괴 소식을 접했습니다. 그는 질서와 기강을 유지한 채, 자신을 무너진 공화국의 유일한 합법적 권위자로 선언했고, 황러시아를 다시 세우기 전까지 맡은 임무를 완수했습니다.\n\n하지만 볼디레프의 길은 거기서 끝나지 않았습니다. 그는 곧 병력을 이끌고 러시아 전역의 폭력과 분열을 종식시키기 위한 해방 전쟁을 벌였습니다. 마침내 하얼빈에서 페트로그라드에 이르기까지 혁명의 붉은 깃발이 휘날리게 되었고, 볼디레프 장군은 비로소 오랜 전쟁의 안장에서 내려올 수 있게 되었습니다. 혹독한 시기는 지나가고, 이제 이 땅에 오랫동안 자리했던 고통과 슬픔을 씻어낼 재건과 평화의 시대가 찾아오고 있습니다."
 news.356.a:0 "앞으로! 앞으로! 앞으로!"
 news.357.t:0 "진보 블록의 러시아 개혁"
 news.357.desc:0 "2월 혁명 이래, 표트르 스톨리핀 같은 인물들이 꿈꾸었던 ‘입헌군주제 러시아’ 구상은 좌파의 사회민주주의와 우파의 군사독재 사이에서 완전히 사라진 것으로 여겨졌습니다. 그러나 오늘, 러시아의 최고 통치자 알렉산드르 콜차크가 국가의 반동적 몰락을 거부하고, 표트르 대제 이후로 걸어온 길을 되찾겠다고 선언함으로써, 그러한 추정이 잘못됐음이 드러났습니다.\n\n새롭게 등장한 ‘평화적 개혁당’의 지도 아래, 국가는 사회·경제적 개혁을 일제히 추진하여, 어떠한 대가를 치르더라도 러시아를 근대화의 영역으로 끌어들이려 하고 있습니다. 검은 백인대의 영향력이 크게 약화되었고, 콜차크 정권 시절 금지되었던 정당들이 다시 민주적 절차에 참여할 수 있게 되었습니다. 한편, 국가가 통제했던 경제 부문의 상당 부분이 민영화되었습니다.\n\n스톨리핀이 그리던 ‘서구적이면서도 자주적인 러시아’의 청사진이 어느 정도 실현되자, 신정부는 이제 세계 무대로 눈길을 돌리고 있습니다. 이미 오랫동안 폐기된 대영제국·쾨니히스베르크와의 조약 복원을 위한 협상이 시작되었는데, 이는 구체제 입장에선 안도할 소식이나, 신시대 세력들에겐 우려가 될 소지도 있습니다."
 news.357.a:0 "알렉시아드는 계속 된다."
 news.358.t:0 "전 러시아 인민성전의 승리"
 news.358.desc:0 "지난 20년 동안 황러시아는 제국 정부에 반대하다 추방된 이들이 모여드는 피난처였습니다. 그러나 러시아 공화국이 무너지고, 그 공화주의 보루가 폭력에 잠식되자, 이들의 꿈은 끝나는 듯했습니다. 바로 이 혼돈 속에서 콘스탄틴 로자옙스키가 이끄는 ‘전 러시아 인민 성전’이 무장을 일으켜, 오랜 세월 러시아를 괴롭혀 온 ‘붉은 위협’을 종식하고 질서를 회복하겠다고 나섰습니다.\n\n성전 세력은 자신들에게 맞서는 모든 이들을 꺾고, 옛 러시아 공화국을 통합한 뒤, 적이 붉은 진영이든 아니든 러시아 민족의 단결과 안위를 해치는 세력을 근절하겠다고 선포했습니다. 수년간의 투쟁 끝에, 한때 서로의 피로 물들었던 대지에는 이제 곡식이 자라고 꽃이 피어납니다. 러시아는 대내외의 적으로부터 안전해지며, 햇빛 아래 당당히 설 자리를 되찾았습니다.\n\n교회와 민족, 노동의 단결은 유대-볼셰비키, 공화주의자, 그리고 미래주의 ‘악마들’마저 누르고 승리를 쟁취했습니다. 미래는 이를 움켜쥘 의지를 지닌 자의 것이라고 합니다. 그리고 하나님의 축복 덕분에, 이 십자군과 콘스탄틴 로자예프스키는 러시아가 가장 암울했던 시기에 힘과 결의를 발휘해 나라를 구해낼 수 있었습니다."
 news.358.a:0 "보가티르들은 또다시 질주한다!"
 news.359.t:0 "협상국, 이탈리아 포기"
 news.359.desc:0 "피우메는 그동안 유럽에 작은 먹구름처럼 남아 있으면서도, 대륙에 떠오른 각종 급진주의의 기반을 닦아 온 기묘한 지역이었습니다. 명목상 이탈리아의 총독령이지만, 단눈치오의 영지가 실제로는 마음대로 행동해 왔고, 이탈리아 본국 정책과 정면으로 충돌하는 일이 잦았습니다. 이는 곧 그들을 르 솔레유와의 동맹으로 이끌었습니다. 단눈치오 사망 후, 프랑스 측의 지원을 등에 업은 이 국가의 독립 성향은 더욱 강해졌고, 이제는 공공연히 로마 정부에 대한 혁명적 정변을 준비하고 있습니다.\n\n다가오는 위협을 감지한 이탈리아 정부는 영국에 도움을 호소했지만, 아무 소용이 없었습니다. 영국 수상 [ENG.GetLeader]가 “이탈리아 내부 문제에 영국이 개입하지 않을 것”임을 분명히 밝혔기 때문입니다. 런던은 평온하고, 피우메는 환호하며, 로마는 비통해합니다. 결국 이 왕국은 내버려진 셈입니다."
 news.359.a:0 "왜 베네치아를 위해 죽어야 하는가?"
 news.359.b:0 "깨진 약속 위에 묶인 동맹이라니."
 news.359.c:0 "등신같은 영국을 위해 만세삼창!"
 news.360.t:0 "시리아에서의 아랍주의 물결"
 news.360.desc:0 "몇 해 전, 몇몇 지식인과 활동가들이 알렉산드레타에서 영국 세력을 몰아냈을 때, 많은 이는 그 도시가 시리아 내전으로 탄생한 레반트 지역의 다른 소국들처럼 결국 승자에게 흡수될 것이라고 보았습니다. 그러나 이제 다마스쿠스와 알레포에는 아랍의 깃발이 높이 휘날리며, 가즈지와 사아다 세력 모두에게 굴욕을 안기고 있습니다.\n\n제 2 인터내셔널의 대사들은 지금 다마스쿠스에서 여유로운 미소를 짓고 있습니다. 이들은 ‘교수’ 자키 알-아르수지의 지도 아래 신생 국가 재건을 돕고 있습니다. 중동 지역 범아랍 사회주의의 거장이라 할 수 있는 알-아르수지는 알렉산드레타를 원래 주인에게 돌려주기 위해 끈질기게 노력해 왔으며, 그 의지를 바탕으로 거대한 아랍주의 물결이 일어났습니다. 이조차도 하심가문이 상상하지 못할 정도의 영향력입니다. 이제 그는 자신의 ‘아랍주의 클럽’과 함께 아랍 ‘국가들의 봄’을 밝히는 등불을 지펴 올렸습니다.\n\n‘통일 아랍 전선’은 경쟁하던 시리아 내 다른 세력들을 제압하면서 힘을 입증했고, 새로운 ‘샴 아랍국’의 미래는 밝고도 야심차게 열려 있습니다. 그러나 나라는 꿈만으로 이루어지지 않습니다. 정책이 뒷받침되어야 합니다. 알-아르수지와 그 동지들은 논문 쓰기에 머무르지 않고, 진정한 정치인이 될 수 있음을 세계에 증명해야만 합니다. 그렇지 않으면 그들은 중동 사막에 떠도는 또 하나의 신기루로 전락하고 말 것입니다."
 news.360.a:0 "책벌레와 정치는 폭발적인 조합이지."
 news.360.b:0 "오랜만이군, 나의 무기여."
 news.361.t:0 "피우수트스키의 후계자로 공표된 다신스키"
 news.361.desc:0 "원수 피우수트스키가 세상을 떠나고 장례식의 타종이 여전히 울려 퍼지는 가운데, 그의 오랜 전우이자 정치적 동지인 이그나치 다신스키가 폴란드 공화국의 지도권을 잡았습니다. 다신스키는 오늘 완전히 소집된 세임(의회) 앞에서 연설을 하면서, 피우수트스키가 추진했던 “혁명”의 노선을 이어받아 경제·사회 정책을 유지하고, 원수께서 계획하셨으나 연합회복권 내부 권력투쟁에 막혀 미처 마무리하지 못했던 여러 개혁을 완수하겠다고 주장했습니다.\n\n폴란드 내에서 다신스키는 사람마다 다른 의미를 지닙니다. 좌파에게 그는 ‘세례 요한’과도 같은 존재로, 마지막 남은 부르주아·봉건 질서에서 완전히 돌아서려는 혁명적 길을 보여주는 상징입니다. 반면 자유주의자나 소수의 보수주의자들에게는, 나라를 민주화하겠다는 그의 공약이 침체된 정치를 되살릴 절호의 기회라고 여겨집니다. 물론, 교회와 민족주의 세력에게 그는 적대자입니다. 그들은 다신스키의 반성직주의적 태도와 다원주의적 주장을 보며, 기존 세속주의 정책과 반 폴란드화 정책이 이어질 것이라고 여기고 있습니다.\n\n국외의 관찰자들은 마치 ‘판도라의 상자’를 연 것 같다고 경고합니다. 폴란드는 아직 피우수트스키의 죽음에 제대로 적응하지 못했고, 검열이 해제되면 지금껏 억눌려 있던 다양한 정치 세력이 본격적으로 표출되어, 연합회복권과 사나치아가 지금껏 이뤄온 모든 것을 근본적으로 위협할 수도 있다는 것입니다."
 news.361.a:0 "사나치아는 자신이 맡았던 소임을 다한 것같군."
 news.362.t:0 "피우수트스키 후계자로 공표된 스와베크"
 news.362.desc:0 "원수 피우수트스키가 서거한 뒤, 폴란드는 이제 새로운 지도자를 맞이하고 있습니다. 발레리 스와베크는 오늘 바르샤바에 운집한 대중 앞에서 취임식을 치렀습니다. 고인이 된 피우수트스키가 살아생전 지명한 인물로서, 그의 선정을 보면 전 나첼니크가 사나치아 독재 정권 동안 펼쳤던 정책들을 계속 이어가고자 했음을 알 수 있습니다.\n\n폴란드는 이제 낯설면서도 익숙한 미래를 바라보고 있습니다. 피우수트스키 시대에 닦인 토대를 바탕으로, 스와베크는 재건된 폴란드 민족이라는 대역사를 완수하겠다고 다짐합니다. 정부는 이미 국가 전역을 기술관료정과 사회주의적 색채로 재편하겠다는 구상을 언급하고 있습니다.\n\n물론 폴란드가 20세기의 위대한 국가로 도약하기까지는 많은 난관이 가로놓여 있습니다. 내부 파벌을 통합해야 하고, 동맹체인 인테르마리움의 회원국들도 각자 내부 갈등에 시달리고 있습니다. 또 러시아 동쪽에서 콜차크가 질서 회복을 선언하며 위협을 키우는 점도 간과할 수 없습니다. 유럽이 누려온 평화도 점차 흔들리는 상황입니다. 이러한 도전 속에서, 폴란드의 새 지도자는 다가올 폭풍을 헤쳐나갈 ‘키잡이’가 될 수 있을지 주목됩니다."
 news.362.a:0 "피우수트스키는 살아있다!"
 news.363.t:0 "폴란드 권력을 장악한 자드루가"
 news.363.desc:0 "급진적이면서도 예측 불가능한 전개가 펼쳐졌습니다. 이교주의 성향을 갖춘 자드루가 운동이 바르샤바를 기습해 폴란드 정권을 장악한 것입니다! 서거 직전 피우수트스키가 직접 지명한 후계자와 그에 의해 출범한 정부가 있었지만, 이들은 거리 곳곳에서 끓어오르던 불만을 잠재우지 못했습니다. 결국 자드루가가 설파하던 혁명적 민족주의 사상이 구원의 밧줄이 되었습니다.\n\n자드루가 운동은 새 정부가 피우수트스키의 목표와 성과를 제대로 기리지 않는다고 주장하며, 이 불만을 발판 삼아 폭발적인 지지를 끌어냈습니다. 권력을 잡은 뒤, 그들은 매우 혼합적인 이념을 내세워 폴란드를 근본적으로 재편하겠다는 야심 찬 계획을 선언했고, 거기에 피우수트스키의 유산을 결합했습니다.\n\n처음에는 혼돈의 폴란드가 다른 지역들처럼 증오와 갈등의 길을 걸을 것이라 예상되었지만, 현실은 정반대로 전개되고 있습니다. 새 정권은 과거보다 더 대담하게 미래를 향해 나아가고 있으며, 구체제가 무너져 가는 지금, 폴란드의 불꽃은 당분간 더욱 밝게 타오를 모양새입니다."
 news.363.a:0 "일어나라, 폴란드여!"
 news.364.t:0 "피우수트스키의 후계자로 공표된 시미그위-리츠"
 news.364.desc:0 "원수 피우수트스키의 죽음 이후, 폴란드는 새로운 지도자를 맞이했습니다. 뛰어난 전쟁 영웅이자 장군이었던 에드바르트 리츠-시미그위는 돌아가신 나첼니크가 세상을 떠나기 전 직접 지목한 인물입니다. 새 직위를 수락한 시미그위는 피우수트스키를 기리며, 수년간 두 사람이 함께 구축해 온 군대의 정신을 계승해 나가겠다고 밝혔습니다.\n\n폴란드는 이제 새로운 길을 향해 나아갑니다. 집권 사나치아의 영향력은 서서히 막을 내리는 듯 보이며, 새 지도자는 완전히 새로운 정부 구성을 추진 중입니다. 아직 새 정권의 주요 인사들은 결정되지 않았지만, 시미그위가 총애하는 아담 코츠가 총리로 지명될 가능성이 크다는 관측이 많습니다. 그렇지만 일부에서는 이 결정 뒤에 ‘보수혁명가들’로 불리는 예지 게드로이츠 세력이 있다고 의심하기도 합니다. 코츠 본인이 대중적 매력이 부족하다는 점이 그러한 주장을 뒷받침한다는 것이지요.\n\n현대 세계 정세 속에서, 원수 시미그위 같은 ‘강인한 지도자’는 폴란드가 절실히 필요로 하는 존재입니다. 내부적으로는 피우수트스키의 죽음 이후 파벌 간 분열이 심해졌고, 이를 조속히 수습해야 합니다. 외부적으로도, 폴란드의 우방과 적대국 간 긴장이 높아지고 있습니다. 독일과 프랑스는 날로 적대적으로 변하고, 러시아의 콜차크는 자국 영토 내 질서 회복에 나섰으며, 인테르마리움 회원국들은 서로 민족 문제로 갈등을 빚고 있습니다. 폴란드가 희망을 걸 수 있는 대상은 오직 한 사람뿐이라는 얘기입니다."
 news.364.a:0 "수장이시여, 우리를 세계로 이끄소서!"
 news.365.t:0 "빌뉴스 위기"
 news.365.desc:0 "인테르마리움 동맹이 2년도 채 되지 않아 또다시 새로운 위기에 직면했습니다. 리투아니아에서 새로 제정된 일련의 법률이 자국 내 폴란드계 주민의 반발을 불러일으켰고, 이들은 “반폴란드” 정서에 기초한 정책이라며 모국 폴란드에 도움을 청했습니다.\n\n이로 인해 리투아니아의 수도 빌뉴스 지역을 둘러싼 오래된 문제가 재점화되었습니다. 빌뉴스는 리투아니아의 수도이지만, 정작 그 지역 주민 대부분은 폴란드계입니다. 오랜 세월 이어져 온 라이벌 의식은 피우수트스키 사망 이후 어느 정도 가라앉는 듯 보였으나, 이번 사태로 완전히 노출되고 말았습니다.\n\n폴란드 정부로서는 복잡한 상황입니다. 인테르마리움 동맹의 지도국인 폴란드는, 회원국마다 각기 다른 민족 분쟁을 안고 있는 현실에서 이번 사태에 어떻게 대응하느냐가 앞으로 모든 분쟁의 전례가 될 수 있기 때문입니다.\n\n이전의 ‘미흐노브스키 사건’을 뛰어넘는 분쟁으로 번질 수 있다는 우려 속에, 바르샤바는 신중한 길을 택했습니다. 분쟁을 리투아니아 영내로 한정해 두려 노력하고 있으며, 많은 이들은 빌뉴스 위기가 평화롭게 해결되길 바라고 있습니다."
 news.365.a:0 "과연 인테르마리움은 무사할까?"
 news.366.t:0 "빌뉴스 위기 종결"
 news.366.desc:0 "빌뉴스 위기가 평화적으로 마무리되었습니다. 동원령에 응해 결집했던 리투아니아 내 폴란드인들은 사실상 대승을 거두었는데, 리투아니아 정부가 폴란드 소수민족에게 광범위한 권리를 보장하는 개혁안을 대거 발표했기 때문입니다.\n\n한숨 돌린 것도 잠시, 이번 협상 결과가 가져올 또 다른 걱정거리가 대두되고 있습니다. 리투아니아 민족주의 세력을 대표하는 전직 대통령 안타나스 스메토나가 민족주의 성향 리투아니아인들 사이에서 다시 영향력을 키워 가고 있는 것입니다.\n\n정부가 폴란드 측에 지나치게 많은 양보를 했다는 불만이 커지면서, 이에 반발하는 리투아니아인들이 점점 늘어나고 있습니다. 시계추가 한쪽으로 과도하게 기울었으니 이제 반대쪽으로 되돌아갈 수 있다는 경고가 나오는데, 리투아니아 정부가 과연 이를 견뎌낼 수 있을지 불투명합니다."
 news.366.a:0 "그만한 가치가 있었을까?"
 news.367.t:0 "빌뉴스 위기 종결"
 news.367.desc:0 "빌뉴스 위기가 평화적으로 종결되었습니다. 협상과 상호 이해가 민족 간 갈등을 누르고 승리한 것이며, 리투아니아 정부는 폴란드 소수민족에게 여러 새로운 권리를 부여하기로 했습니다.\n\n리투아니아 정부는 폴란드인의 요구를 받아들이면서도, 자국 내 리투아니아 민족주의 세력이 과도하게 반발하지 않도록 균형점을 잡았습니다. 예상을 뒤엎고 가장 안정적인 결과가 도출되었으며, 정부는 오히려 전보다 더 견고한 기반을 갖추게 되었습니다. 모든 계층이 이번 합의에 만족감을 표하고 있기 때문입니다.\n\n이 같은 모범적 대응은 국내외적으로도 호평을 받고 있습니다. 앞으로 비슷한 분쟁이 일어날 때 참고할 선례가 될 것이며, 인테르마리움 내에서 고조되던 민족 간 경쟁이 잦아들 수 있으리라는 희망이 커졌습니다."
 news.367.a:0 "리투아니아에 안정이 돌아왔다."
 news.368.t:0 "빌뉴스 위기 종결"
 news.368.desc:0 "빌뉴스 위기는 인테르마리움 내 긴장을 더 고조시키는 결과로 종결되었습니다. 폴란드 측 요구가 거세게 나오자 리투아니아 정부는 이를 강경하게 거부했고, 결국 몇 가지 형식적인 양보만 한 채 폴란드계 주민들의 반발을 재점화시켰습니다.\n\n내부 분쟁이 격화되면서, 폴란드가 자국 동포 보호를 명분으로 군사 개입에 나설 수 있다는 공포가 확산되었습니다. 이를 두려워한 빌뉴스 정부는 사회주의 계파에게 비상 권한을 부여하여 정권을 교체했고, 새 정부는 리투아니아인과 폴란드인을 아우르기 위해 각종 조치를 취하며 분쟁 종식을 시도하고 있습니다.\n\n어찌 되었든 해결책이 보이는 듯하지만, 이번 사태로 인해 동맹의 미래 안정성이 흔들리고 있습니다. 인테르마리움 회원국들은 피로 얼룩진 갈등이 재발할까 우려를 금치 못하고 있습니다."
 news.368.a:0 "총소리와 함께 오는 안정일까?"
 news.369.t:0 "연방의 귀환"
 news.369.desc:0 "빌뉴스 위기는 가장 예기치 못한 방식으로 막을 내렸습니다. 리투아니아인과 폴란드인 간의 대립으로 시작된 갈등이, 과거 몇 세기 전 사라졌던 양국 간의 연방을 부활시키는 결과를 낳았습니다.\n\n두 나라는 상호 간의 차이를 뒤로하고, 18세기 말에 해체되었던 연방을 다시 세우기로 합의했습니다. 양국은 새 연방에서 동등한 권리를 보장받으며, 최근까지도 남아 있던 적대적 관계를 극복하고 있습니다.\n\n연합 지지자들은 이를 인테르마리움 전체가 훗날 하나의 ‘평등한 연방’으로 통합되는 첫걸음이라 환영합니다. 오늘 이뤄진 연대가 새로운 시대의 신호탄이라 믿고 있으며, 최근 몇 해 동안 동맹을 흔들어 온 수많은 분쟁을 종결할 결정적 계기가 될 수 있다는 시각도 늘어나고 있습니다."
 news.369.a:0 "갈라질 수도 없고 분리될 수도 없다"
 news.370.t:0 "흐로드나 동맹"
 news.370.desc:0 "빌뉴스 위기가 매우 예기치 못한 방식으로 평화롭게 종결되었습니다. 리투아니아와 폴란드 간의 분쟁은 벨라루스 정부의 중재를 통해 해결되었는데, 벨라루스 정부는 이 지역의 민족 갈등을 해소하기 위한 해법으로 ‘현대판 리투아니아 대공국’을 세우자는 구상을 밀고 나갔고, 리투아니아를 설득해 두 나라의 통합을 받아들이게 했습니다.\n\n이는 이 지역의 많은 이들에게 놀라운 일이지만, 동시에 반가운 소식이기도 합니다. 새 통합 국가는 다민족으로 유명한 이 지역의 ‘현지 정체성’을 보존하는 데 전념하고 있습니다. 덕분에 인테르마리움은 또 한 번의 정치적 위기를 뒤로할 수 있게 되었습니다.\n\n벨라루스가 제시한 이 해법은 이제 지역 문제를 해결할 유일한 방법으로 평가되고 있습니다. 민족주의적 열망이 지역을 분열시키는 상황에서, 현재의 상태를 지키는 것이 오히려 해결책일 수 있다는 견해입니다. 결과가 어찌 될지는 시간이 말해 줄 것입니다."
 news.370.a:0 "한 깃발 아래의 세 민족이라!"
 news.371.t:0 "자유롭고 위대한 벨라루스"
 news.371.desc:0 "벨라루스의 기존 질서가 흔들리고 있습니다. 집권당 흐라마다내에서 ‘크라요프치’ 파벌이 당 장악에 성공했습니다. 지주 계층과 국내 우익 세력을 지지 기반으로 삼고 있는 크라요프치는, 흐라마다의 사회주의 노선에 비해 자유화된 대안을 제시하고 있습니다.\n\n이들은 스스로를 “지역 문화를 지키는 수호자”로 내세우며, 언젠가 ‘현대판 리투아니아 대공국’을 재건하겠다는 과감한 계획을 발표했습니다. 최근 ‘미흐노브스키 사태’로 표면화된 민족 갈등을 해결할 수 있는 방법이라 주장하면서, 인테르마리움 내부의 여러 문제를 치유할 대안이 될 수 있다고 강조하고 있습니다."
 news.371.a:0 "옛 연방의 귀환인가?"
 news.372.t:0 "인민의 벨라루스"
 news.372.desc:0 "벨라루스 정계에 충격적인 소식이 전해졌습니다. 라다의 대통령이었던 안톤 루츠케비치가 오늘 사임했는데, 이는 야당이나 군사 정변 세력에 자리를 넘긴 것이 아니라, 같은 당 소속의 바츨라우 라스토우스키에게 대통령직을 물려주기 위함이었습니다. 이 소식은 민스크의 거리뿐 아니라, 라스토우스키 지지층이 많은 시골 지역에서도 대대적인 환영을 받았습니다.\n\n한편, 바르샤바에서는 반응이 사뭇 냉담합니다. 새 대통령이 전임자의 농업·사회주의적 노선을 계승하거나 더 강화할 것이라는 데 의문은 없지만, 라스토우스키가 내놓은 ‘극단적 민족주의·낭만주의·외국인 혐오적’ 노선에 대해 폴란드 정부는 마치 ‘또 하나의 미흐노브스키 사태’가 일어날까 우려하고 있습니다. 이 걱정이 현실화될지 아닐지는 아직 알 수 없습니다."
 news.372.a:0 "반동인가, 혁명인가, 혹은 단순 농민주의인가?"
 news.373.t:0 "흐라마다, 권력 유지"
 news.373.desc:0 "벨라루스에서 한동안 변화의 움직임이 있었지만, 결국 기존 질서가 또다시 승리했습니다. 집권당 흐라마다는 자리를 위협하려던 모든 시도를 성공적으로 물리쳤습니다.\n\n광범위한 사회주의 연합체인 흐라마다는 독립 후 계속해서 벨라루스를 통치해 왔으며, 앞으로도 수년간 이 기조를 이어갈 전망입니다. 곧 치러질 선거에서 흐라마다가 어떤 노선을 취할지가 결정될 것입니다.\n\n현재 당 내부에는 크게 세 갈래 노선이 부상했습니다. 루츠케비치 대통령이 이끄는 주류 ‘농업 노선’에 맞서, 기독교 민주 세력과 벨라루스식 이교 근대주의자들이 반대파를 형성하는 모습입니다. 어떠한 결과가 나오더라도, 벨라루스가 신시대로 가는 길은 ‘안정과 질서’일 것이라는 관측이 지배적입니다."
 news.373.a:0 "벨라루스는 오늘도 평소와 같다네."
