 NUK_brotherhood_desc:0 "크이우는 서우크라이나에 우호적인 정부를 조직할 인물을 찾으려 했으나, 실망스럽게도 적절한 인물을 발견하지 못했습니다. 대부분의 우크라이나인들은 비록 젊은 시절을 하르키우나 돈바스에서 보냈을지라도, 차르의 하인으로 살아가는 운명을 이미 오래전에 받아들였습니다. 그 지역의 사회주의 세력 또한 안정적인 정부를 수립할 만큼 강하지 못했고요.\n\n소중한 영토를 카자흐인들에게 빼앗길지도 모른다는 절박함 속에서, 우크라이나는 오래된 먼지 쌓인 카드 한 장을 꺼내 들었습니다. 바로 니키포르 흐리호리예우였습니다. 그는 처음에는 러시아 공화주의자들과 손을 잡았고, 이후 우크라이나 민족주의자들과 연합했으며, 한때는 네스토르 마흐노와도 함께한 인물이었습니다. 이 오타만은 마흐노의 흑군 잔존 세력과 옛 동지들을 규합하여 우크라이나와 캅카스에서 시베리아의 톰스크까지 이르는 여정 끝에 마침내 새로운 정부를 세웠습니다. 그가 세운 정부는 권력을 우크라이나 노동자 및 농민 평의회에 맡겼으며 그 결과, 과거 그의 동지들이 이 평의회들에서 권력을 장악했습니다. 그러나 평의회에서 유대인들이란 개념은 결국 포그롬으로 귀결되었고, 오랫동안 식민 정착지에서 안락한 삶을 누리던 부르주아 계급은 약탈에 굶주린 아나키스트 무리들에게 철저히 약탈 당했습니다. 니키포르의 선동에 따라, 우크라이나인들은 오랜 세월 러시아인들의 ‘노예’로 살아온 것에 대한 복수를 가차 없이 실행했습니다.\n\n이러한 아나키즘 속의 혼란에도 불구하고, 일종의 질서가 존재하고 있었습니다. 사회주의혁명당, 우크라이나 민족단의 카자흐 지부 출신 일부 인사, 그리고 과거의 아나키스트들이 민족주의적 열망으로 하나가 되어 우크라이나 공동체를 단단히 결속시키고 있었습니다. 그리고 놀랍게도, 니키포르는 마침내 자신이 충성을 바칠 대의를 찾은 듯했습니다. 그는 우크라이나인들에 대한 식량과 보급품을 제공하는 등의 적극적인 지원을 아끼지 않았으며, 우크라이나 고아들에게 해를 가한 병사들을 가차 없이 질책했습니다. 그러나 이 자비는 오직 우크라이나인들에게만 적용될 뿐, 우크라이나의 적들에게는 결코 베풀어지지 않았습니다."
 NUK_nykyfor_hryhoriv:0 "니키포르 흐리호리우"