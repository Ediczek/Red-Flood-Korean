 RUS_our_duty_to_order:0 "질서를 향한 우리의 의무"
 RUS_our_duty_to_order_desc:0 "이제 모든 반란을 일으킨 우리의 신민들을 하나로 통합하는 작업을 마쳤으니 신성한 질서를 다시 세우고 서쪽으로 눈을 돌릴 때입니다. 1798년 이래로 우리는 모든 경솔한 혁명을 종식시키겠다는 사명을 다짐해왔으며 그리스도가 다시 오실 때까지 이 임무를 지속할 것입니다. 그러니 유럽의 상황을 살펴보고 그리스도를 모독하는 자들을 끝장내기 위해 누가 필요한지 확인합시다."
 RUS_renew_pact:0 "자작나무 서약 갱신"
 RUS_renew_pact_desc:0 "우리가 싸우는 이유는 오로지 질서와 연속성을 위해서입니다. 그렇다면 우리가 알고 있는 것으로 돌아가는 것이 어찌 잘못이겠습니까? 자작나무 서약은 질서의 보루로 남아 있으며, 최근의 어려움 이후로 자유주의적 거짓을 무너뜨리는 대의에 더욱 헌신하고 있습니다. 우리의 북유럽 혈족들과 연합하여 북쪽에서 남쪽 유럽으로 내려가 스스로를 계몽되었다고 믿는 이 거짓되고 타락한 현대인을 쓸어버릴 것입니다. 그가 말하는 계몽은 우리의 고대 기독교 전통이라는 산불 앞에 놓인 촛불에 불과하기 때문입니다."
 RUS_a_road_we_walk_alone:0 "홀로 걷는 길"
 RUS_a_road_we_walk_alone_desc:0 "다시 한 번 우리는 모든 동맹국들로부터 버림받아 완전히 홀로 서게 되었습니다. 유럽 전체가 혁명의 물결에 휩쓸렸지만, 그것은 우리에게 아무런 문제가 되지 않습니다. 우리는 유럽 전체를 홀로 완전히 무너뜨릴 만큼 강력합니다. 1812년에도 우리가 해냈고 이번에도 분명히 해낼 수 있습니다. 사실 우리는 이를 환영합니다. 우리의 불가피한 승리 속에서 아무것도 나누거나 타협할 필요가 없기 때문입니다. 순수한 질서가 지배할 것이며 그것은 영원히 지속될 것입니다."
 RUS_holy_alliance:0 "새로운 신성동맹"
 RUS_holy_alliance_desc:0 "자작나무 서약은 1918년 혁명들에 대한 유용한 임시 방편이었지만, 우리는 더 공세적으로 나아가기 위해 보다 영구적인 것을 필요로 합니다. 우리의 과거를 돌아보며, 적들이 비웃으며 반동이라 부르는 세 가지 보루를 결집하여 자유주의의 물결을 끝내야 할 것입니다. 그러니 1815년으로 돌아가, 헌법과 공화국이라는 거짓된 즉위된 사상에 맞서 왕들의 신성한 권리를 수호할 새로운 신성동맹을 위해 건배합시다."
 RUS_treaty_two_emperors:0 "이제조약"
 RUS_treaty_two_emperors_desc:0 "안타깝게도, 우리의 프로이센 동맹국은 1805년과 마찬가지로 자유주의의 유혹에 넘어갔습니다. 그러나 한 친구를 잃으면서, 우리는 단지 또 다른 친구를 얻을 기회를 얻게 되었을 뿐입니다. 오스트리아가 잠에서 깨어났고 혁명을 철저히 무너뜨릴 자격을 갖춘 새로운 황제가 등장했습니다. 이제 우리는 혁명을 뿌리부터 흔들고 유럽의 고대 전통을 되살릴 우정의 조약을 만들어야 할 때입니다."
 RUS_war_russia:0 "신성한 삼위의 러시아를 위한 전쟁"
 RUS_war_russia_desc:0 "벨라루스와 우크라이나가 국경 밖에 있는 한 러시아가 통일되었다고 말하는 것은 잘못된 표현입니다. 우리의 첫 번째이자 가장 시급한 과제는 러시아의 통일을 완성하고 그 분열의 원천인 바르샤바를 진압하는 것입니다. 우리는 레흐놈들의 대지에서 나오는 사악한 \"프로메테우스의 불꽃\"을 끄고 1913년의 비극적인 전쟁 이전의 올바른 영토로 돌아갈 것입니다."
 RUS_anti_spartakist_crusade:0 "반스파르타쿠스주의 성전"
 RUS_anti_spartakist_crusade_desc:0 "인테르마리움이 신성하고 삼위일체적인 러시아를 점령한 것에 대해 우리를 분노하게 했다면, 독일은 우리를 공포에 빠뜨립니다. 독일은 세상의 모든 선하고 진실한 것을 공개적으로 반대하며 가장 끔찍한 지옥의 묘사보다도 더 무시무시한 유토피아를 희망합니다. 우리는 이 유대-스파르타쿠스주의자들의 실험을 즉각 끝내야 합니다. 그것이 존재를 허락받는 모든 순간은 신에 대한 범죄입니다."
 RUS_most_unholy_beast:0 "가장 불경한 짐승"
 RUS_most_unholy_beast_desc:0 "아마도 우리는 독일에 대해 너무 가혹했을지도 모릅니다. 베얼린의 공산주의자들이 타락한 유대인들이었다면, 파리의 볼셰비키들은 마치 지옥의 아홉 번째 원에서 직접 온 악마들처럼 보입니다. 그것은 지난 150년간의 모든 혁명의 가장 타락한 요소들이 한데 모아져 더욱 악화된 형태입니다. 그들을 관찰하는 것만으로도 역겨움을 느끼게 만듭니다.\n\n그러나 우리의 십자군이 그들로 끝난다는 사실은 소름 끼치도록 적절합니다. 그들은 혁명의 순수한 본질, 허무주의의 가장 어두운 요소들이 전면에 드러난 모습입니다. 그들이 \"르 솔레유\"라고 잘못 명명한 그곳에 우리가 들어설 때, 우리는 그것을 불태우고 그 땅에 소금을 뿌릴 것입니다. 왜냐하면 이 모든 부패한 근대성의 실험은 파리에서 시작되었고 이제 그것은 파리에서 한 번 그리고 영원히 끝날 것이기 때문입니다."
 RUS_new_kind_revolution:0 "신종 혁명"
 RUS_new_kind_revolution_dea:0 "새로운 혁명이 다가오고 있습니다. 우리는 현대의 전위대이자 구시대의 종말을 알리는 첫 번째 신호탄입니다."
 RUS_new_path:0 "인류 신로 "
 RUS_new_path_desc:0 "우리는 현재 세상에 존재하는 모든 것들로부터 대안이자, 진정한 운동을 제공합니다. 우리의 방식은 미래와 진보의 길입니다."
 RUS_solar_upheaval:0 "태양 격변"
 RUS_solar_upheaval_desc:0 "라틴인들의 방식이 곧 미래의 방식입니다. 태양연맹이 죽어가는 구세계에 맞서 싸울 때, 우리는 그들의 대의를 도울 것입니다!"
 RUS_denounce_spartakism:0 "스파르타쿠스주의 부정"
 RUS_denounce_spartakism_desc:0 "스파르타쿠스주의는 공산주의를 향한 유일한 길인 것처럼 보이지만, 진정한 혁명가들을 속이고 그들을 비루한 노예 의식에 묶어두기 위해 만들어진 또 다른 추상화에 지나지 않습니다. 우리는 그것으로부터 혁명가들을 해방시켜야 합니다."
 RUS_our_arditi:0 "우리만의 아르디티"
 RUS_our_arditi_desc:0 "이탈리아 미래주의의 아르디티는 대담하고 무모하며 대담합니다. 우리 자신의 혁명이 살아남으려면 대담하고, 무모하며, 두려움을 부수며 나아가는 사람들이 필요합니다. 그들의 끈기와 정신을 본받으면서도 우리에게 내재된 러시아적 색채를 입혀야 합니다."
 RUS_proletarian_struggle:0 "무산계급 투쟁"
 RUS_proletarian_struggle_desc:0 "우리의 차이에도 불구하고 우리는 여전히 사회주의에 전념하고 있습니다. 독일보다 사회주의의 보편적 원칙을 더 잘 구현하는 국가는 없습니다. 우리의 미래와 프롤레타리아 세계의 미래는 독일의 손에 달려 있습니다. 우리는 그들을 도와야 합니다."
 RUS_vanguard_vanguard:0 "전위대 중의 전위대"
 RUS_vanguard_vanguard_desc:0 "러시아는 다른 모든 국가보다 우뚝 서 있는 무한한 육체를 가진 레비아탄입니다. 황폐와 폐허에도 불구하고 우리는 재건하고 혁명을 절정으로 이끌 것입니다."
 RUS_forged_steel:0 "독일 강철 단조"
 RUS_forged_steel_desc:0 "독일인은 세계에서 드물게 사상가이자 행동가인 두 가지 모습을 동시에 지닌 민족입니다. 우리는 그들의 성공적인 혁명을 통해 배울 점이 많으며 동시에 무한해 보이는 그들의 산업력을 활용할 수 있습니다."
 RUS_toward_3i:0 "제3인터네셔널을 향해"
 RUS_toward_3i_desc:0 "독일의 스파르타쿠스주의자들이 현실에 안주하기로 결정한 지금, 새로운 동맹이 그들을 대신해 공산주의의 황금빛 미래를 가져와야 합니다. 우리는 아무도 가보지 않은 곳으로 갈 것입니다. 우리는 더 나은 미래를 가져올 것입니다!"
 RUS_mankind_beacon:0 "인류의 진보 등대"
 RUS_mankind_beacon_desc:0 "우리는 발명가이자 탐험가로서 인간의 발이 감히 엄두도 내지 못했던 길을 걸어왔습니다. 우리의 혁명은 인류의 진보를 의미하는 모든 것입니다."
 RUS_socialist_community:0 "사회주의 경제 공동체"
 RUS_socialist_community_desc:0 "사회주의가 전 세계로 점점 더 확산되는 가운데, 왜 제2 인터내셔널이 다양한 파트너들의 경제를 통합하기 위해 더 많은 노력을 기울이지 않는지 궁금할 것입니다. 우리는 군대가 나란히 싸우는 것처럼 경제도 나란히 싸워야 합니다."
 RUS_war_liberation:0 "해방 전쟁!"
 RUS_war_liberation_desc:0 "전 세계가 우리 문 앞에 있습니다. 세상이 우리를 기다리게 하지 맙시다."
 RUS_free_russia:0 "자유 러시아와 세계"
 RUS_free_russia_desc:0 "러시아는 해방되었다만 세계는 그렇지 못합니다. 쇠퇴하는 차르 정권과 달리 우리는 무례하고 퇴폐적이며 반동적인 허울뿐인 장벽에 갇혀 살수는 없습니다. 러시아는 전쟁에서 승리했고 이제 평화도 승리해야 합니다."
 RUS_rebirth_entente:0 "협상국의 소생"
 RUS_rebirth_entente_desc:0 "한때 세계 주요 강대국들은 자유, 존엄, 박애라는 하나의 기치 아래 단결했습니다. 저주받은 오늘날의 지상은 그 어느 때보다 이러한 움직임이 필요합니다."
 RUS_land_doors:0 "개방된 땅"
 RUS_land_doors_desc:0 "우리는 억압과 폭력으로부터 자유롭습니다. 번영을 위해 필요한 일을 할 준비가 되어 있다면 모든 신념을 가진 사람들을 국경 안에서 환영합니다."
 RUS_eastern_flank:0 "민주주의의 동부"
 RUS_eastern_flank_desc:0 "우리의 동맹국들이 서방 세계를 보호하는 동안 우리는 동양이 스스로 일어설 수 있도록 가르칩니다. 우리의 임무는 막중한 것입니다."
 RUS_united_freedom:0 "자유로 연합된"
 RUS_united_freedom_desc:0 "민주주의 세계는 자유 러시아와 함께하고 자유 러시아는 민주주의 세계와 함께합니다. 함께라면 우리는 멈출 수 없습니다."
 RUS_international_duty:0 "국제적 의무"
 RUS_international_duty_desc:0 "우리는 적색전선으로 대표되는 인류의 자유와 대의에 대한 헌신과 도덕적 의무를 가지고 있습니다. 우리는 사슬에서 벗어나기 위해 고군분투하는 형제들과 모든 억압받는 사람들과 함께합니다."
 RUS_building_socialism:0 "다같이 사회주의 건설"
 RUS_building_socialism_desc:0 "혼자서 하는 척해서는 안 됩니다. 사회주의는 국제적인 협력이 필요한 국제적인 프로젝트입니다. 모두가 힘을 합쳐야 하며 결국에는 모두가 보상을 받게 될 것입니다."
 RUS_marching_front:0 "적색전선과의 행진"
 RUS_marching_front_desc:0 "우리는 전쟁을 하지만 부르주아들이 전쟁을 하는 방식은 아닙니다. 우리의 투쟁은 더 이상 가난과 전쟁이 없는 자유의 이름으로 영광스러운 투쟁입니다."
 RUS_eurasian_space:0 "유라시아 사회주의 공역"
 RUS_eurasian_space_desc:0 "우리의 선조들은 유럽과 아시아의 억압받는 사람들이 함께 모여 완벽한 형제애를 꿈꾸는 날을 꿈꿨습니다. 완전한 유럽도 아니고 아시아도 아닌 자유 사회주의 러시아가 등장하면서 이 꿈은 현실이 될 수 있습니다."
 invade_central_asia_eurasianists:0 "중앙아시아 수복"
 organize_finland:0 "핀란드 정부구성"
 integrate_finland:0 "핀란드 흡수"
 integrate_turkestan:0 "튀르케스탄 통합"
 organize_romania:0 "우호적인 루마니아 정부 수립."
 integrate_central_asia:0 "중앙아시아 흡수"
 Russian_unification_decisions_nationalist:0 "러시아의 재통일"
 Russian_unification_decisions_nationalist_desc:0 "우리는 인근 지역의 통제권을 완전히 확보했습니다. 이제 우리 세력의 기지는 전 러시아를 통일하고 모든 적을 제거할 수 있습니다.\n\n조국을 확장하고 해방함에 따라 통제권이 확보되면 최근에 정복한 영토를 우리 정권 하에 온전히 통합 할 수있을 것입니다. 모든 적들이 소멸되면 우리는 우리 자신을 통일 러시아의 통치자로 선포 할 수 있으며 이에 대해 그 누구도 이의를 제기 할 수 없을 것입니다."
 Unification_unify_russia_nationalist:0 "러시아 통일 완수"
 Unification_core_territory_nationalist:0 "러시아 지대 통합"
 Unification_invade_armenia_nationalist:0 "아르메니아 침공"
